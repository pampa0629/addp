host: localhost:8193
info:
  contact: {}
  title: ADDP Workbench API
  version: "1.0"
paths:
  /catalog-resources/changes:
    get:
      description: 按不透明游标返回已首次发布 Data Application 的最小检索摘要变化，仅供 Catalog 服务消费 | Return
        minimal-search-summary changes for Data Applications that have been published
        at least once, for the Catalog service only
      parameters:
      - description: 上次成功提交的不透明游标，空值从历史起点开始 | Opaque cursor committed by the consumer;
          empty starts from the beginning
        in: query
        name: after_cursor
        type: string
      - description: 批大小，默认 200，最大 500 | Batch size, default 200 and maximum 500
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.CatalogResourceChangesResponse'
        "400":
          description: 无效游标或批大小 | Invalid cursor or batch size
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 需要认证 | Authentication required
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 非 Catalog 服务或权限不足 | Catalog service or permission required
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 读取失败 | Read failed
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 拉取数据应用目录资源变化 | Pull Data Application catalog resource changes
      tags:
      - Catalog Integration
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.catalog.read
  /data_applications:
    get:
      description: 只返回当前 Tenant 和当前 User 拥有的数据应用草稿摘要 | Return only data application
        draft summaries owned by the current User in the current Tenant
      parameters:
      - description: 页码，默认 1 | Page number, default 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20，最大 100 | Page size, default 20 and maximum 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 数据应用分页结果 | Paginated data applications
          schema:
            $ref: '#/definitions/api.PaginatedResponse'
        "400":
          description: 请求参数无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出数据应用 | List data applications
      tags:
      - Workbench Data Applications
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.data_application.read
    post:
      consumes:
      - application/json
      description: 重新校验来源 View 的 Service 契约并复制为 Component 快照；不保存 source_view_ids |
        Revalidate source View Service contracts and copy them into Component snapshots;
        source_view_ids are not persisted
      parameters:
      - description: 数据应用名称和来源 View | Data application name and source Views
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 新建数据应用 | Created data application
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationResponse'
        "400":
          description: 配置无效 | Invalid configuration
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Workbench 或 Service 权限不足 | Insufficient Workbench or Service
            permission
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 来源 View 不存在 | Source View not found
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service 不可用 | Service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建数据应用 | Create a data application
      tags:
      - Workbench Data Applications
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.data_application.create
  /data_applications/{id}:
    delete:
      consumes:
      - application/json
      description: 只有从未产生 Application Revision 的应用可删除；请求必须携带当前 version | Only applications
        that never produced an Application Revision can be deleted; the current version
        is required
      parameters:
      - description: Data Application UUID
        in: path
        name: id
        required: true
        type: string
      - description: 当前 version | Current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationVersionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功 | Deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 数据应用不存在 | Data application not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 版本冲突或应用已发布 | Version conflict or application already published
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除未发布数据应用 | Delete an unpublished data application
      tags:
      - Workbench Data Applications
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.data_application.delete
    get:
      parameters:
      - description: Data Application UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 数据应用草稿 | Data application draft
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationResponse'
        "400":
          description: ID 无效 | Invalid ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 数据应用不存在 | Data application not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取数据应用 | Get a data application
      tags:
      - Workbench Data Applications
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.data_application.read
    put:
      consumes:
      - application/json
      description: Component ID 和 ServiceReference 不可改变；使用正整数 version 乐观并发并重新校验所有
        Service 契约 | Component IDs and ServiceReferences are immutable; use positive
        version optimistic concurrency and revalidate every Service contract
      parameters:
      - description: Data Application UUID
        in: path
        name: id
        required: true
        type: string
      - description: 完整草稿和当前 version | Complete draft and current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的数据应用 | Updated data application
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationResponse'
        "400":
          description: 配置无效 | Invalid configuration
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Workbench 或 Service 权限不足 | Insufficient Workbench or Service
            permission
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 数据应用不存在 | Data application not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 版本冲突 | Version conflict
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service 不可用 | Service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新数据应用草稿 | Update a data application draft
      tags:
      - Workbench Data Applications
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.data_application.update
  /data_applications/{id}/offline:
    post:
      consumes:
      - application/json
      parameters:
      - description: Data Application UUID
        in: path
        name: id
        required: true
        type: string
      - description: 当前 version | Current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationVersionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已下线数据应用 | Offline data application
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationResponse'
        "400":
          description: 请求无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 数据应用不存在 | Data application not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 版本冲突或尚未发布 | Version conflict or unpublished application
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 下线数据应用 | Take a data application offline
      tags:
      - Workbench Data Applications
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.data_application.publish
  /data_applications/{id}/publish:
    post:
      consumes:
      - application/json
      parameters:
      - description: Data Application UUID
        in: path
        name: id
        required: true
        type: string
      - description: 当前 version | Current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationVersionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已发布数据应用 | Published data application
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationResponse'
        "400":
          description: 请求无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Workbench 或 Service 权限不足 | Insufficient Workbench or Service
            permission
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 数据应用不存在 | Data application not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 版本冲突 | Version conflict
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service 不可用 | Service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 发布数据应用 | Publish a data application
      tags:
      - Workbench Data Applications
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.data_application.publish
  /data_applications/{id}/runtime:
    get:
      description: 创建者或持有生效 Resource Grant 的 User 可读取当前 published Revision；真实数据仍由浏览器以当前
        User Bearer 调用各 Service | The owner or a User with an effective Resource Grant
        may read the current published Revision; the browser still calls every Service
        with the current User Bearer
      parameters:
      - description: Data Application UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 不可变运行快照 | Immutable runtime snapshot
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.DataApplicationRuntimeResponse'
        "400":
          description: ID 无效 | Invalid ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 尚未发布或已下线 | Unpublished or offline
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取数据应用运行快照 | Get a data application runtime snapshot
      tags:
      - Workbench Data Applications
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.data_application.execute
  /runtime/catalog-references/resolve:
    post:
      consumes:
      - application/json
      description: 按请求顺序动态解析 1 到 200 个已首次发布的数据应用引用；跨 Tenant、不存在和从未发布统一 found=false，仅供
        Catalog 服务消费 | Dynamically resolve 1 to 200 Data Application references that
        have been published at least once; cross-tenant, missing, and never-published
        references all return found=false; Catalog service only
      parameters:
      - description: 数据应用目录引用 | Data Application catalog references
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_workbench_internal_models.ResolveCatalogReferencesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.ResolveCatalogReferencesResponse'
        "400":
          description: 请求无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 需要认证 | Authentication required
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 非 Catalog 服务或权限不足 | Catalog service or permission required
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 解析失败 | Resolution failed
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 解析数据应用目录引用 | Resolve Data Application catalog references
      tags:
      - Catalog Integration
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.catalog.read
  /runtime/resource-grants/{source_identity}:
    delete:
      consumes:
      - application/json
      description: 使用完整授权目标写入可重放撤销墓碑，阻止延迟的旧履约重新放开访问；只允许 addp-asset | Persist a replayable
        revocation tombstone from the complete target so delayed fulfillment cannot
        reopen access; restricted to addp-asset
      parameters:
      - description: Asset Authorization ID
        in: path
        name: source_identity
        required: true
        type: string
      - description: 完整授权目标 | Complete grant target
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_workbench_internal_models.AssetResourceGrantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已撤销授权 | Revoked grant
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.AssetResourceGrantResponse'
        "400":
          description: 请求无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 非 addp-asset 或权限不足 | Wrong client or insufficient permission
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 来源身份冲突 | Source identity conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 撤销 Asset 资源授权 | Revoke an Asset resource grant
      tags:
      - Workbench Resource Grants
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.resource_grant.revoke
    put:
      consumes:
      - application/json
      description: 使用 Asset Authorization ID 作为幂等来源，为指定 User 建立 Data Application execute
        Allow Rule；只允许 addp-asset | Use the Asset Authorization ID as the idempotent
        source and create a Data Application execute Allow Rule for one User; restricted
        to addp-asset
      parameters:
      - description: Asset Authorization ID
        in: path
        name: source_identity
        required: true
        type: string
      - description: 完整授权目标 | Complete grant target
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_workbench_internal_models.AssetResourceGrantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已生效授权 | Effective grant
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.AssetResourceGrantResponse'
        "400":
          description: 请求无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 非 addp-asset 或权限不足 | Wrong client or insufficient permission
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 来源身份冲突或已撤销 | Source identity conflict or already revoked
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 履约 Asset 资源授权 | Fulfill an Asset resource grant
      tags:
      - Workbench Resource Grants
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.resource_grant.create
  /views:
    get:
      description: 只返回当前 Tenant 和当前 User 拥有的工作台视图；不访问 Service | Return only Workbench
        views owned by the current User in the current Tenant; Service is not accessed
      parameters:
      - description: 页码，默认 1 | Page number, default 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20，最大 100 | Page size, default 20 and maximum 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 工作台视图分页结果 | Paginated Workbench views
          schema:
            $ref: '#/definitions/api.PaginatedResponse'
        "400":
          description: 请求参数无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出工作台视图 | List Workbench views
      tags:
      - Workbench Views
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.view.read
    post:
      consumes:
      - application/json
      description: 转发当前已验证的 User Bearer 读取 Service Consumer Descriptor，校验完整配置并保存当前契约指纹；请求不得提交
        Tenant、owner、指纹或 Token | Forward the validated User Bearer to read the Service
        Consumer Descriptor, validate the complete configuration, and save the current
        contract fingerprint; Tenant, owner, fingerprint, and tokens are not accepted
      parameters:
      - description: 工作台视图配置 | Workbench view configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_workbench_internal_models.ViewWriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 新建工作台视图 | Created Workbench view
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.ViewResponse'
        "400":
          description: 视图配置无效 | Invalid view configuration
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Workbench 或 Service 权限不足 | Insufficient Workbench or Service
            permission
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service 不可用 | Service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建工作台视图 | Create a Workbench view
      tags:
      - Workbench Views
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.view.create
  /views/{id}:
    delete:
      description: 删除只匹配当前 Tenant 与当前 User 的视图，不访问 Service | Delete a view only when
        it matches the current Tenant and User, without accessing Service
      parameters:
      - description: Workbench View UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功 | Deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ID 无效 | Invalid ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 视图不存在 | View not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除工作台视图 | Delete a Workbench view
      tags:
      - Workbench Views
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.view.delete
    get:
      description: 只读取 Workbench 自身保存的配置，不访问 Service；其他用户的视图按不存在处理 | Read only the
        configuration stored by Workbench without accessing Service; views owned by
        another user are treated as not found
      parameters:
      - description: Workbench View UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 工作台视图 | Workbench view
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.ViewResponse'
        "400":
          description: ID 无效 | Invalid ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 视图不存在 | View not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取工作台视图 | Get a Workbench view
      tags:
      - Workbench Views
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.view.read
    put:
      consumes:
      - application/json
      description: service_ref 不可改变；使用正整数 version 乐观并发并重新读取 Descriptor 校验配置和契约指纹 |
        service_ref is immutable; use a positive version for optimistic concurrency
        and re-read the Descriptor to validate configuration and contract fingerprint
      parameters:
      - description: Workbench View UUID
        in: path
        name: id
        required: true
        type: string
      - description: 完整工作台视图配置和当前 version | Complete Workbench view configuration
          and current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_workbench_internal_models.ViewWriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的工作台视图 | Updated Workbench view
          schema:
            $ref: '#/definitions/github_com_addp_workbench_internal_models.ViewResponse'
        "400":
          description: 视图配置无效 | Invalid view configuration
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Workbench 或 Service 权限不足 | Insufficient Workbench or Service
            permission
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 视图不存在 | View not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 版本冲突 | Version conflict
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service 不可用 | Service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新工作台视图 | Update a Workbench view
      tags:
      - Workbench Views
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - workbench.view.update
securityDefinitions:
  BearerAuth:
