# =============================================================================
# ADDP Production Nginx Configuration
# =============================================================================
# Description: Unified entry point for all ADDP services via port 8000
# Features:
#   - Portal frontend as main entry
#   - Backend API routing
#   - WebSocket support
#   - Gzip compression
#   - Security headers
# =============================================================================

# Upstream definitions
upstream portal {
    server portal-frontend:80;
}

upstream system-backend {
    server system-backend:8080;
}

upstream manager-backend {
    server manager-backend:8081;
}

upstream meta-backend {
    server meta-backend:8082;
}

upstream gateway {
    server gateway:8000;
}

# Main server block
server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # =========================================================================
    # Portal Frontend - Main Entry Point
    # =========================================================================
    location / {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # API Routes via Gateway
    # =========================================================================
    # All /api/* requests are routed through Gateway service
    # Gateway then forwards to appropriate backend services

    location /api/ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # Direct Backend Access (Optional for debugging)
    # =========================================================================
    # These can be disabled in production if all access goes through Gateway

    location /direct/system/ {
        rewrite ^/direct/system/(.*) /$1 break;
        proxy_pass http://system-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /direct/manager/ {
        rewrite ^/direct/manager/(.*) /$1 break;
        proxy_pass http://manager-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /direct/meta/ {
        rewrite ^/direct/meta/(.*) /$1 break;
        proxy_pass http://meta-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================================
    # Health Check Endpoint
    # =========================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # Error Pages
    # =========================================================================
    error_page 404 /404.html;
    location = /404.html {
        internal;
        return 404 '{"error": "Not Found"}';
        add_header Content-Type application/json;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        return 500 '{"error": "Internal Server Error"}';
        add_header Content-Type application/json;
    }
}

