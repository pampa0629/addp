basePath: /api/v1/inference
definitions:
  github_com_addp_inference_internal_service.CredentialStatus:
    properties:
      configured:
        type: boolean
      version:
        type: integer
    type: object
  github_com_addp_inference_internal_service.DeploymentInput:
    properties:
      dimension:
        type: integer
      modalities:
        items:
          type: string
        type: array
      name:
        type: string
      operations:
        items:
          type: string
        type: array
      provider_connection_id:
        type: string
      status:
        type: string
      upstream_model:
        type: string
    required:
    - modalities
    - name
    - operations
    - provider_connection_id
    - upstream_model
    type: object
  github_com_addp_inference_internal_service.ProbeResponse:
    properties:
      adapter_type:
        type: string
      model_deployment_id:
        type: string
      provider_connection_id:
        type: string
      reachable:
        type: boolean
      status_code:
        type: integer
    type: object
  github_com_addp_inference_internal_service.ProfileInput:
    properties:
      code:
        type: string
      model_deployment_id:
        type: string
      name:
        type: string
      scope_type:
        type: string
      status:
        type: string
    required:
    - code
    - model_deployment_id
    - name
    - scope_type
    type: object
  github_com_addp_inference_internal_service.ProviderInput:
    properties:
      adapter_type:
        type: string
      allow_all_tenants:
        type: boolean
      allowed_tenant_ids:
        items:
          type: integer
        type: array
      endpoint:
        type: string
      name:
        type: string
      scope_type:
        type: string
      status:
        type: string
    required:
    - adapter_type
    - endpoint
    - name
    - scope_type
    type: object
  github_com_addp_inference_internal_service.ProviderView:
    properties:
      adapter_type:
        type: string
      allow_all_tenants:
        type: boolean
      allowed_tenant_ids:
        items:
          type: integer
        type: array
      created_at:
        type: string
      created_by:
        type: integer
      credential:
        $ref: '#/definitions/github_com_addp_inference_internal_service.CredentialStatus'
      endpoint:
        type: string
      id:
        type: string
      name:
        type: string
      scope_type:
        type: string
      status:
        type: string
      tenant_id:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: integer
    type: object
  inference.ChatRequest:
    properties:
      max_output_tokens:
        type: integer
      messages:
        items:
          $ref: '#/definitions/inference.Message'
        type: array
      model_profile_id:
        type: string
      response_schema:
        $ref: '#/definitions/inference.ResponseSchema'
      schema_version:
        type: string
      temperature:
        type: number
      tenant_id:
        type: integer
      tool_choice:
        type: string
      tools:
        items:
          $ref: '#/definitions/inference.ToolDefinition'
        type: array
    type: object
  inference.ChatResponse:
    properties:
      deployment_id:
        type: string
      message:
        $ref: '#/definitions/inference.Message'
      profile_version:
        type: integer
      schema_version:
        type: string
      usage:
        $ref: '#/definitions/inference.Usage'
    type: object
  inference.EmbeddingInput:
    properties:
      data:
        type: string
      mime_type:
        type: string
      modality:
        type: string
      text:
        type: string
    type: object
  inference.EmbeddingRequest:
    properties:
      inputs:
        items:
          $ref: '#/definitions/inference.EmbeddingInput'
        type: array
      model_profile_id:
        type: string
      schema_version:
        type: string
      tenant_id:
        type: integer
    type: object
  inference.EmbeddingResponse:
    properties:
      deployment_id:
        type: string
      dimension:
        type: integer
      profile_version:
        type: integer
      schema_version:
        type: string
      usage:
        $ref: '#/definitions/inference.Usage'
      vectors:
        items:
          items:
            format: float32
            type: number
          type: array
        type: array
    type: object
  inference.ErrorResponse:
    properties:
      error:
        type: string
      error_code:
        type: string
    type: object
  inference.Message:
    properties:
      content:
        type: string
      role:
        type: string
      tool_call_id:
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/inference.ToolCall'
        type: array
    type: object
  inference.RerankDocument:
    properties:
      id:
        type: string
      text:
        type: string
    type: object
  inference.RerankRequest:
    properties:
      documents:
        items:
          $ref: '#/definitions/inference.RerankDocument'
        type: array
      model_profile_id:
        type: string
      query:
        type: string
      schema_version:
        type: string
      tenant_id:
        type: integer
      top_n:
        type: integer
    type: object
  inference.RerankResponse:
    properties:
      deployment_id:
        type: string
      profile_version:
        type: integer
      results:
        items:
          $ref: '#/definitions/inference.RerankResult'
        type: array
      schema_version:
        type: string
      usage:
        $ref: '#/definitions/inference.Usage'
    type: object
  inference.RerankResult:
    properties:
      document_id:
        type: string
      index:
        type: integer
      score:
        type: number
    type: object
  inference.ResolveProfileRequest:
    properties:
      modality:
        type: string
      model_profile_id:
        type: string
      operation:
        type: string
      schema_version:
        type: string
      tenant_id:
        type: integer
    type: object
  inference.ResolveProfileResponse:
    properties:
      deployment_id:
        type: string
      dimension:
        type: integer
      model_profile_id:
        type: string
      profile_version:
        type: integer
      schema_version:
        type: string
    type: object
  inference.ResponseSchema:
    properties:
      description:
        type: string
      name:
        type: string
      schema:
        items:
          type: integer
        type: array
      strict:
        type: boolean
    type: object
  inference.ToolCall:
    properties:
      arguments:
        items:
          type: integer
        type: array
      id:
        type: string
      name:
        type: string
    type: object
  inference.ToolDefinition:
    properties:
      description:
        type: string
      name:
        type: string
      parameters:
        items:
          type: integer
        type: array
    type: object
  inference.Usage:
    properties:
      input_tokens:
        type: integer
      output_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
host: localhost:8191
info:
  contact: {}
  description: ADDP 统一 AI 推理控制面 API | ADDP unified AI inference control-plane API
  title: ADDP Inference API
  version: "1.0"
paths:
  /capabilities:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 查询推理能力 | Get inference capabilities
      tags:
      - Inference
      x-addp-auth-mode: public
  /internal/chat:
    post:
      consumes:
      - application/json
      parameters:
      - description: Chat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inference.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inference.ChatResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 执行对话推理 | Execute chat inference
      tags:
      - Inference Runtime
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.runtime.execute
  /internal/embeddings:
    post:
      consumes:
      - application/json
      parameters:
      - description: Embedding request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inference.EmbeddingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inference.EmbeddingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 执行向量推理 | Execute embedding inference
      tags:
      - Inference Runtime
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.runtime.execute
  /internal/profiles/resolve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Profile resolution request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inference.ResolveProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inference.ResolveProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 解析模型 Profile 执行快照 | Resolve model profile execution snapshot
      tags:
      - Inference Runtime
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.runtime.execute
  /internal/rerank:
    post:
      consumes:
      - application/json
      parameters:
      - description: Rerank request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/inference.RerankRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/inference.RerankResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 执行重排推理 | Execute rerank inference
      tags:
      - Inference Runtime
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.runtime.execute
  /model-deployments:
    get:
      parameters:
      - default: 1
        description: 页码 | Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询 Model Deployment | List model deployments
      tags:
      - Inference Deployment
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.deployment.read
    post:
      consumes:
      - application/json
      parameters:
      - description: Deployment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_inference_internal_service.DeploymentInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建 Model Deployment | Create model deployment
      tags:
      - Inference Deployment
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.deployment.create
  /model-deployments/{id}:
    delete:
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除 Model Deployment | Delete model deployment
      tags:
      - Inference Deployment
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.deployment.delete
    get:
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 读取 Model Deployment | Get model deployment
      tags:
      - Inference Deployment
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.deployment.read
    put:
      consumes:
      - application/json
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      - description: Deployment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_inference_internal_service.DeploymentInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新 Model Deployment | Update model deployment
      tags:
      - Inference Deployment
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.deployment.update
  /model-deployments/{id}/probe:
    post:
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_inference_internal_service.ProbeResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 探测 Model Deployment | Probe model deployment
      tags:
      - Inference Deployment
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.deployment.execute
  /model-profiles:
    get:
      parameters:
      - default: 1
        description: 页码 | Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询 Model Profile | List model profiles
      tags:
      - Inference Profile
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.profile.read
    post:
      consumes:
      - application/json
      parameters:
      - description: Profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_inference_internal_service.ProfileInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建 Model Profile | Create model profile
      tags:
      - Inference Profile
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.profile.create
  /model-profiles/{id}:
    get:
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 读取 Model Profile | Get model profile
      tags:
      - Inference Profile
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.profile.read
    put:
      consumes:
      - application/json
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      - description: Profile
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_inference_internal_service.ProfileInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新 Model Profile | Update model profile
      tags:
      - Inference Profile
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.profile.update
  /provider-connections:
    get:
      parameters:
      - default: 1
        description: 页码 | Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/github_com_addp_inference_internal_service.ProviderView'
                type: array
              page:
                type: integer
              page_size:
                type: integer
              total:
                format: int64
                type: integer
              total_pages:
                type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询 Provider Connection | List provider connections
      tags:
      - Inference Provider
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.provider.read
    post:
      consumes:
      - application/json
      parameters:
      - description: Provider
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_inference_internal_service.ProviderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_addp_inference_internal_service.ProviderView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建 Provider Connection | Create provider connection
      tags:
      - Inference Provider
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.provider.create
  /provider-connections/{id}:
    delete:
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除 Provider Connection | Delete provider connection
      tags:
      - Inference Provider
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.provider.delete
    get:
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_inference_internal_service.ProviderView'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 读取 Provider Connection | Get provider connection
      tags:
      - Inference Provider
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.provider.read
    put:
      consumes:
      - application/json
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Provider
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_inference_internal_service.ProviderInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_inference_internal_service.ProviderView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/inference.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新 Provider Connection | Update provider connection
      tags:
      - Inference Provider
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.provider.update
  /provider-connections/{id}/credential:
    delete:
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_inference_internal_service.CredentialStatus'
      security:
      - BearerAuth: []
      summary: 删除 Provider 凭据 | Delete provider credential
      tags:
      - Inference Provider
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.provider_credential.update
    put:
      consumes:
      - application/json
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Credential
        in: body
        name: request
        required: true
        schema:
          properties:
            credential:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_inference_internal_service.CredentialStatus'
      security:
      - BearerAuth: []
      summary: 设置或轮换 Provider 凭据 | Set or rotate provider credential
      tags:
      - Inference Provider
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - inference.provider_credential.update
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
