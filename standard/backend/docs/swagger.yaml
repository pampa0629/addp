host: localhost:8110
info:
  contact: {}
  title: ADDP Standard API
  version: "1.0"
paths:
  /assets/discoverable:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/client.DiscoverableAsset'
            type: array
        "401":
          description: 需要登录 | Authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 无权访问 | Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 可发现资产列表 | List discoverable assets
      tags:
      - AssetDiscoverable
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - standard.metric.read
  /classifications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_addp_standard_internal_models.Classification'
            type: array
        "401":
          description: 需要登录 | Authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 无权访问 | Access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取数据分类列表 | List data classifications
      tags:
      - Standard
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - standard.classification.read
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_addp_standard_internal_models.Classification'
        "401":
          description: 需要登录 | Authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 无权访问 | Access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建数据分类 | Create data classification
      tags:
      - Standard
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - standard.classification.create
  /classifications/{id}:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 需要登录 | Authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 无权访问 | Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除数据分类 | Delete data classification
      tags:
      - Standard
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - standard.classification.delete
    put:
      parameters:
      - description: 更新数据分类 | Update data classification
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_standard_internal_models.UpdateClassificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 需要登录 | Authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 无权访问 | Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 资源版本冲突 | Resource version conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新数据分类 | Update data classification
      tags:
      - Standard
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - standard.classification.update
  /code-sets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_standard_internal_models.PaginatedCodeSetResponse'
        "401":
          description: 需要登录 | Authentication required
