          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取码值集列表 | List code sets
      tags:
      - Standard
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - standard.code_set.read
    post:
