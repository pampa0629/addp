host: localhost:8110
info:
  contact: {}
  title: ADDP Standard API
  version: "1.0"
paths:
  /catalog-resources/changes:
    get:
      description: 按不透明游标返回 Metric 的最小摘要变化，仅供 Catalog 服务消费 | Return Metric minimal-summary
        changes by opaque cursor for the Catalog service only
      parameters:
      - description: 上次成功提交的不透明游标，空值从历史起点开始 | Opaque cursor committed by the consumer;
          empty starts from the beginning
        in: query
        name: after_cursor
        type: string
      - description: 批大小，默认 200，最大 500 | Batch size, default 200 and maximum 500
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_standard_internal_models.CatalogResourceChangesResponse'
        "400":
          description: 无效游标或批大小 | Invalid cursor or batch size
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 需要认证 | Authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 非 Catalog 服务或权限不足 | Catalog service or permission required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 解析失败 | Resolution failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 拉取 Standard Metric 目录资源变化 | Pull Standard Metric catalog resource changes
      tags:
      - Catalog Integration
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - standard.catalog.read
  /code-sets:
    get:
      parameters:
      - description: 适用范围 | Scope
        enum:
        - platform
        - tenant_common
        - domain
        in: query
        name: scope_type
        type: string
      - description: 归属业务域 ID，仅 domain 范围适用 | Owning domain ID, only for domain scope
        in: query
        name: owner_domain_id
        type: integer
      - description: 修订状态 | Revision status
        enum:
        - draft
        - in_review
        - published
        - withdrawn
        in: query
        name: status
        type: string
      - description: 关键字 | Keyword
        in: query
        name: keyword
        type: string
      - description: 生效时点（RFC3339，默认服务端当前时间） | Effective point in time (RFC3339, defaults
          to server time)
        in: query
        name: as_of
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_standard_internal_models.PaginatedCodeSetResponse'
      security:
      - BearerAuth: []
      summary: 获取码值集列表 | List code sets
      tags:
      - Standard
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - standard.code_set.read
    post:
      consumes:
      - application/json
      parameters:
      - description: 码值集和首个草稿 | Code set and initial draft
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_standard_internal_models.CreateCodeSetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_addp_standard_internal_models.CodeSetAggregate'
      security:
      - BearerAuth: []
      summary: 创建码值集及首个草稿修订 | Create code set with initial draft revision
      tags:
      - Standard
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - standard.code_set.create
  /code-sets/{id}:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除码值集稳定身份 | Delete code set identity
      tags:
      - Standard
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - standard.code_set.delete
    get:
      parameters:
      - description: 生效时点（RFC3339，默认服务端当前时间） | Effective point in time (RFC3339, defaults
          to server time)
        in: query
        name: as_of
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_standard_internal_models.CodeSetAggregate'
      security:
      - BearerAuth: []
      summary: 获取码值集聚合 | Get code set aggregate
      tags:
