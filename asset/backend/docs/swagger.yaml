basePath: /api/v1/asset
definitions:
  github_com_addp_asset_internal_service.ApproveApplicationReq:
    properties:
      note:
        description: 可选备注
        type: string
    type: object
  github_com_addp_asset_internal_service.AssetCategoryTreeNode:
    properties:
      children:
        items:
          $ref: '#/definitions/github_com_addp_asset_internal_service.AssetCategoryTreeNode'
        type: array
      count:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      sort_order:
        type: integer
      tenant_id:
        type: integer
      updated_at:
        type: string
      version:
        type: integer
    type: object
  github_com_addp_asset_internal_service.AssetComponentInput:
    properties:
      catalog_entry_id:
        type: string
      role:
        type: string
      sort_order:
        type: integer
    type: object
  github_com_addp_asset_internal_service.BatchCategoryRequest:
    properties:
      category_id:
        description: null 表示清除分类
        type: integer
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  github_com_addp_asset_internal_service.BatchIDsReq:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  github_com_addp_asset_internal_service.ConsumerAccessStatus:
    properties:
      open_path:
        type: string
      status:
        enum:
        - none
        - pending
        - fulfilling
        - effective
        - revoking
        type: string
    type: object
  github_com_addp_asset_internal_service.CreateAssetCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      sort_order:
        type: integer
    required:
    - name
    type: object
  github_com_addp_asset_internal_service.CreateAssetReq:
    properties:
      category_id:
        type: integer
      components:
        items:
          $ref: '#/definitions/github_com_addp_asset_internal_service.AssetComponentInput'
        minItems: 1
        type: array
      description:
        type: string
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      type_id:
        type: integer
    required:
    - components
    - name
    - type_id
    type: object
  github_com_addp_asset_internal_service.DailyCount:
    properties:
      count:
        type: integer
      date:
        type: string
    type: object
  github_com_addp_asset_internal_service.DashboardStats:
    properties:
      application_approved:
        type: integer
      application_pending:
        type: integer
      application_rejected:
        type: integer
      application_total:
        description: 申请结果与当前有效授权用户汇总
        type: integer
      application_trend:
        items:
          $ref: '#/definitions/github_com_addp_asset_internal_service.DailyCount'
        type: array
      asset_draft:
        type: integer
      asset_offline:
        type: integer
      asset_published:
        type: integer
      asset_total:
        description: 资产状态汇总
        type: integer
      effective_authorized_users:
        type: integer
      publish_trend:
        description: 时间趋势（近 30 天，按天汇总）
        items:
          $ref: '#/definitions/github_com_addp_asset_internal_service.DailyCount'
        type: array
      rating_avg_score:
        type: number
      rating_count:
        description: 评价汇总
        type: integer
    type: object
  github_com_addp_asset_internal_service.DeleteAssetCategoryRequest:
    properties:
      version:
        minimum: 1
        type: integer
    required:
    - version
    type: object
  github_com_addp_asset_internal_service.RejectApplicationReq:
    properties:
      reason:
        description: 必填驳回原因
        type: string
    required:
    - reason
    type: object
  github_com_addp_asset_internal_service.UpdateAssetCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
      sort_order:
        type: integer
      version:
        minimum: 1
        type: integer
    required:
    - version
    type: object
  github_com_addp_asset_internal_service.UpdateAssetReq:
    properties:
      category_id:
        type: integer
      components:
        items:
          $ref: '#/definitions/github_com_addp_asset_internal_service.AssetComponentInput'
        minItems: 1
        type: array
      description:
        type: string
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      type_id:
        type: integer
      version:
        minimum: 1
        type: integer
    required:
    - components
    - name
    - type_id
    - version
    type: object
  internal_api.consumerApplicationRequest:
    properties:
      duration_day:
        type: integer
      reason:
        type: string
    required:
    - reason
    type: object
  internal_api.consumerRatingRequest:
    properties:
      comment:
        type: string
      score:
        maximum: 5
        minimum: 1
        type: number
      tags:
        items:
          type: string
        type: array
    required:
    - score
    type: object
  internal_api.ratingHandledRequest:
    properties:
      is_handled:
        type: boolean
    type: object
info:
  contact: {}
  description: ADDP 资产目录、发布、申请、授权和评价 API | ADDP asset catalog, publishing, application,
    authorization and rating API
  title: ADDP Asset API
  version: "1.0"
paths:
  /applications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产申请 | List asset applications
      tags:
      - Asset Application
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.application.read
  /applications/{id}:
    get:
      parameters:
      - description: 申请 ID | Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产申请详情 | Get asset application
      tags:
      - Asset Application
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.application.read
  /applications/{id}/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: 申请 ID | Application ID
        in: path
        name: id
        required: true
        type: integer
      - description: 审批 | Review
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_asset_internal_service.ApproveApplicationReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批准资产申请 | Approve asset application
      tags:
      - Asset Application
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.application.approve
  /applications/{id}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: 申请 ID | Application ID
        in: path
        name: id
        required: true
        type: integer
      - description: 审批 | Review
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_asset_internal_service.RejectApplicationReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 驳回资产申请 | Reject asset application
      tags:
      - Asset Application
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.application.reject
  /applications/{id}/revoke:
    post:
      parameters:
      - description: 申请 ID | Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 撤销申请授权 | Revoke application authorization
      tags:
      - Asset Application
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.application.revoke
  /assets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产列表 | List assets
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.read
    post:
      consumes:
      - application/json
      description: 选择一个或多个 CatalogEntry 原子创建资产草稿 | Atomically create an asset draft
        by selecting one or more CatalogEntry references
      parameters:
      - description: 完整资产聚合 | Complete asset aggregate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_asset_internal_service.CreateAssetReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建资产 | Create asset
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.update
  /assets/{id}:
    delete:
      description: 已发布资产必须先下架再删除 | Published assets must be offlined before deletion
      parameters:
      - description: 资产 ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除草稿或已下架资产 | Delete draft or offline asset
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.delete
    get:
      parameters:
      - description: 资产 ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产详情 | Get asset
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.read
    put:
      consumes:
      - application/json
      parameters:
      - description: 资产 ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      - description: 资产 | Asset
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_asset_internal_service.UpdateAssetReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新资产 | Update asset
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.update
  /assets/{id}/offline:
    post:
      parameters:
      - description: 资产 ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 下架资产 | Offline asset
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.offline
  /assets/{id}/publish:
    post:
      parameters:
      - description: 资产 ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 上架资产 | Publish asset
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.publish
  /assets/batch-category:
    post:
      consumes:
      - application/json
      parameters:
      - description: 资产分类变更 | Asset category change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_asset_internal_service.BatchCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批量设置资产分类 | Batch categorize assets
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.update
  /assets/batch-offline:
    post:
      consumes:
      - application/json
      parameters:
      - description: 资产 ID | Asset IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_asset_internal_service.BatchIDsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批量下架资产 | Batch offline assets
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.offline
  /assets/batch-publish:
    post:
      consumes:
      - application/json
      parameters:
      - description: 资产 ID | Asset IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_asset_internal_service.BatchIDsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批量上架资产 | Batch publish assets
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.publish
  /assets/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产统计 | Get asset statistics
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.read
  /assets/stats/dashboard:
    get:
      description: 按资产类型或具体资产统计 Asset 自有的状态、申请结果、有效授权用户、评价和近 30 天趋势 | Aggregate Asset-owned
        status, application results, effective authorized users, ratings, and 30-day
        trends by asset type or a specific asset
      parameters:
      - description: 资产类型代码 | Asset type code
        in: query
        name: type_code
        type: string
      - description: 资产 ID；与 type_code 同时存在时取交集 | Asset ID; intersects with type_code
          when both are present
        in: query
        name: asset_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 资产运营统计 | Asset dashboard statistics
          schema:
            $ref: '#/definitions/github_com_addp_asset_internal_service.DashboardStats'
        "400":
          description: 参数无效 | Invalid parameter
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 资产不存在或不属于统计范围 | Asset not found or outside the requested scope
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 统计失败 | Statistics query failed
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产运营统计 | Get asset dashboard statistics
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.read
      - asset.application.read
      - asset.authorization.read
      - asset.rating.read
  /assets/type-fields/{type_id}:
    get:
      parameters:
      - description: 类型 ID | Type ID
        in: path
        name: type_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产类型字段 | Get asset type fields
      tags:
      - Asset
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.entry.read
  /authorizations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产授权 | List asset authorizations
      tags:
      - Asset Authorization
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.authorization.read
  /authorizations/{id}:
    get:
      parameters:
      - description: 授权 ID | Authorization ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产授权详情 | Get asset authorization
      tags:
      - Asset Authorization
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.authorization.read
  /authorizations/{id}/revoke:
    post:
      parameters:
      - description: 授权 ID | Authorization ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 撤销资产授权 | Revoke asset authorization
      tags:
      - Asset Authorization
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.authorization.revoke
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产分类 | List asset categories
      tags:
      - Asset Category
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.category.read
    post:
      consumes:
      - application/json
      parameters:
      - description: 资产分类 | Asset category
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_asset_internal_service.CreateAssetCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建资产分类 | Create asset category
      tags:
      - Asset Category
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.category.create
  /categories/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 资产分类 ID | Asset category ID
        in: path
        name: id
        required: true
        type: integer
      - description: 并发版本 | Concurrency version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_asset_internal_service.DeleteAssetCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除资产分类 | Delete asset category
      tags:
      - Asset Category
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.category.delete
    get:
      parameters:
      - description: 资产分类 ID | Asset category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产分类详情 | Get asset category
      tags:
      - Asset Category
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.category.read
    put:
      consumes:
      - application/json
      parameters:
      - description: 资产分类 ID | Asset category ID
        in: path
        name: id
        required: true
        type: integer
      - description: 资产分类 | Asset category
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_asset_internal_service.UpdateAssetCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新资产分类 | Update asset category
      tags:
      - Asset Category
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.management.read
      - asset.category.update
  /categories/tree:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
