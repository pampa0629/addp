basePath: /api/v1/asset
definitions:
  github_com_addp_asset_internal_service.ApproveApplicationReq:
    properties:
      note:
        description: 可选备注
        type: string
    type: object
  github_com_addp_asset_internal_service.BatchCatalogReq:
    properties:
      catalog_id:
        description: null 表示清除目录
        type: integer
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  github_com_addp_asset_internal_service.BatchIDsReq:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  github_com_addp_asset_internal_service.CatalogEntry:
    properties:
      children:
        items:
          $ref: '#/definitions/github_com_addp_asset_internal_service.CatalogEntry'
        type: array
      count:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      sort_order:
        type: integer
      tenant_id:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_addp_asset_internal_service.CreateCatalogReq:
    properties:
      description:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      sort_order:
        type: integer
    required:
    - name
    type: object
  github_com_addp_asset_internal_service.RejectApplicationReq:
    properties:
      reason:
        description: 必填驳回原因
        type: string
    required:
    - reason
    type: object
  github_com_addp_asset_internal_service.UpdateAssetReq:
    properties:
      catalog_id:
        type: integer
      description:
        type: string
      name:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  github_com_addp_asset_internal_service.UpdateCatalogReq:
    properties:
      description:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    type: object
  internal_api.consumerApplicationRequest:
    properties:
      duration_day:
        type: integer
      reason:
        type: string
    required:
    - reason
    type: object
  internal_api.consumerRatingRequest:
    properties:
      comment:
        type: string
      score:
        maximum: 5
        minimum: 1
        type: number
      tags:
        items:
          type: string
        type: array
    required:
    - score
    type: object
  internal_api.ratingHandledRequest:
    properties:
      is_handled:
        type: boolean
    type: object
info:
  contact: {}
  description: ADDP 资产目录、发布、申请、授权和评价 API | ADDP asset catalog, publishing, application,
    authorization and rating API
  title: ADDP Asset API
  version: "1.0"
