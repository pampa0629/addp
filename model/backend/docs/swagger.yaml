      - application/json
      responses:
        "200":
          description: Model 目录资源变化批次 | Model catalog resource change batch
          schema:
            $ref: '#/definitions/github_com_addp_model_internal_models.CatalogResourceChangesResponse'
        "400":
          description: 无效游标或批大小 | Invalid cursor or batch size
