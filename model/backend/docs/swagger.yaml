      - description: 上次成功提交的不透明游标，空值从历史起点开始 | Opaque cursor committed by the consumer;
          empty starts from the beginning
        in: query
        name: after_cursor
        type: string
      - description: 批大小，默认 200，最大 500 | Batch size, default 200 and maximum 500
        in: query
