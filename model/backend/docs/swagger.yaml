        type: integer
      hierarchy_level:
        type: integer
      is_partition:
        type: boolean
      is_pk:
        type: boolean
      length:
        type: integer
      name:
        type: string
      nullable:
        type: boolean
      sort_order:
        type: integer
    type: object
  github_com_addp_model_internal_models.UpdateLogicalTableRequest:
