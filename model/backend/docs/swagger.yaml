basePath: /api/v1/model
definitions:
  github_com_addp_model_internal_models.CreateDWLayerRequest:
    properties:
      description:
        type: string
      layer_code:
        type: string
      layer_name:
        type: string
      naming_rule:
        type: string
      quality_sla:
        additionalProperties: true
        type: object
      sort_order:
        type: integer
    required:
    - layer_code
    - layer_name
    type: object
  github_com_addp_model_internal_models.CreateEntityAttributeRequest:
    properties:
      description:
        type: string
      element_id:
        type: integer
      is_pk:
        type: boolean
      name:
        type: string
      nullable:
        type: boolean
      sort_order:
        type: integer
    required:
    - name
    type: object
  github_com_addp_model_internal_models.CreateEntityRelationRequest:
    properties:
      description:
        type: string
      name:
        type: string
      relation_type:
        enum:
        - one_to_one
        - one_to_many
        - many_to_many
        type: string
      source_entity:
        type: integer
      target_entity:
        type: integer
    required:
    - relation_type
    - source_entity
    - target_entity
    type: object
  github_com_addp_model_internal_models.CreateEntityRequest:
    properties:
      code:
        type: string
      description:
        type: string
      domain_id:
        type: integer
      name:
        type: string
    required:
    - code
    - name
    type: object
  github_com_addp_model_internal_models.CreateFactMetricMappingRequest:
    properties:
      field_id:
        type: integer
      metric_id:
        type: integer
      note:
        type: string
    required:
    - metric_id
    type: object
  github_com_addp_model_internal_models.CreateLogicalFieldRequest:
    properties:
      column_name:
        type: string
      data_type:
        type: string
      default_value:
        type: string
      description:
        type: string
      element_id:
        type: integer
      field_role:
        type: string
      hierarchy_id:
        type: integer
      hierarchy_level:
        type: integer
      is_partition:
        type: boolean
      is_pk:
        type: boolean
      length:
        type: integer
      name:
        type: string
      nullable:
        type: boolean
      sort_order:
        type: integer
    required:
    - column_name
    - data_type
    - name
    type: object
  github_com_addp_model_internal_models.CreateLogicalTableRequest:
    properties:
      code:
        type: string
      description:
        type: string
      domain_id:
        type: integer
      entity_id:
        type: integer
      grain_description:
        type: string
      layer:
        type: string
      materialization:
        additionalProperties: true
        type: object
      name:
        type: string
      scd_type:
        type: integer
      table_type:
        type: string
    required:
    - code
    - name
    - table_type
    type: object
  github_com_addp_model_internal_models.CreateTableRelationRequest:
    properties:
      relation_type:
        description: fk/join，默认 fk
        type: string
      source_field:
        type: integer
      target_field:
        type: integer
      target_table:
        type: integer
    required:
    - source_field
    - target_field
    - target_table
    type: object
  github_com_addp_model_internal_models.MermaidImportRequest:
    properties:
      mermaid_code:
        type: string
      mode:
        type: string
    required:
    - mermaid_code
    type: object
  github_com_addp_model_internal_models.UpdateDWLayerRequest:
    properties:
