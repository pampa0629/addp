    allowed_scope_types: [tenant, department, project_group]
    risk_level: medium
    tenant_customizable: true
    delegable: false
    status: active
    name_i18n_key: permissions.model.logical_model.create.name
    description_i18n_key: permissions.model.logical_model.create.description
  - key: model.logical_model.delete
    allowed_scope_types: [tenant, department, project_group]
