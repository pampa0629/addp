        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询责任治理队列 | List responsibility governance tasks
