      x-addp-required-permissions:
      - catalog.source.rebind
  /entries/batch_governance:
    post:
      consumes:
      - application/json
      description: 对 1 到 200 个显式选择且分别携带 version 的 CatalogEntry 原子分配同一个主业务域或责任部门；按稳定顺序锁定全部条目，任一失败整批回滚；不接受筛选结果全选；Model
        业务实体/逻辑模型和 Standard 指标的主业务域仍由专业模块维护 | Atomically assign one primary domain
        or accountable department to 1–200 explicitly selected CatalogEntries, each
        with its own version; all entries are locked in stable order and any failure
        rolls back the entire batch; filter-wide selection is not accepted; primary
        domains of Model business entities/logical models and Standard metrics remain
        owner-managed
      parameters:
      - description: 显式成员批量治理请求；跨模块 BIGINT ID 使用规范十进制字符串 | Explicit-member batch governance
          request; cross-module BIGINT IDs use canonical decimal strings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.batchGovernanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 批次 ID 与按请求顺序返回的新版本 | Batch ID and new versions in request order
          schema:
            $ref: '#/definitions/github_com_addp_catalog_internal_service.BatchGovernanceResult'
        "400":
          description: 请求无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 缺少资源盘点或目录维护权限 | Missing inventory or catalog update permission
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 任一条目不存在或不属于当前租户 | Any entry is missing or outside the current
            tenant
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 版本、状态、引用或专业 owner 边界冲突 | Version, state, reference, or professional-owner
            boundary conflict
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Standard 或 System 引用校验不可达 | Standard or System reference validation
            unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批量治理企业目录条目 | Batch-govern enterprise catalog entries
      tags:
      - Catalog
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - catalog.inventory.read
      - catalog.entry.update
  /entries/facets:
    get:
      description: Catalog 计算当前调用方可见条目中的引用集，Standard / System 动态解析显示信息；分面解析不影响目录列表和
        Ready | Catalog computes references from entries visible to the caller while
        Standard and System dynamically resolve display facts; facet resolution does
        not affect entry listing or readiness
