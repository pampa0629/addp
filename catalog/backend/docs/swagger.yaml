            $ref: '#/definitions/github_com_addp_catalog_internal_service.EntryDetail'
        "400":
          description: 请求无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 目录条目不存在 | Catalog entry not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 版本或重绑前置条件冲突 | Version or rebind precondition conflict
          schema:
            additionalProperties: true
