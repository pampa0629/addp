        required: true
        type: string
      - description: 名称或编码，最多 100 字符 | Name or code, maximum 100 characters
        in: query
        name: search
        type: string
      - description: 页码，默认 1 | Page number, default 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20，最大 50 | Page size, default 20 and maximum 50
