        type: string
      - description: 已选主业务域稳定 ID；约束责任部门、资源类型和来源引擎统计 | Selected primary Domain stable
          ID; constrains Department, entry type, and source Engine counts
        in: query
        name: primary_domain_id
        type: string
      - description: 已选责任部门稳定 ID；约束资源类型和来源引擎统计 | Selected accountable Department stable
          ID; constrains entry type and source Engine counts
        in: query
        name: accountable_department_id
        type: string
      - description: 已选资源类型；约束来源引擎统计 | Selected entry type; constrains source Engine
          counts
        enum:
        - data_item
        - business_entity
        - logical_model
        - metric
        - data_service
        - development_artifact
        - data_application
        in: query
        name: entry_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 权限感知引用分面 | Permission-aware reference facets
          schema:
            $ref: '#/definitions/github_com_addp_catalog_internal_service.EntryFacets'
        "400":
          description: 请求参数无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 缺少盘点权限 | Inventory permission required
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出企业目录引用分面 | List enterprise catalog reference facets
      tags:
      - Catalog
      x-addp-auth-mode: permission
      x-addp-conditional-permissions:
      - catalog.inventory.read
      x-addp-required-permissions:
      - catalog.entry.read
  /entries/resolve-sources:
