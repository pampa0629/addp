        "400":
          description: 来源引用无效 | Invalid source reference
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 解析专业来源对应的目录条目 | Resolve professional sources to catalog entries
      tags:
      - Catalog
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - catalog.entry.read
  /governance/coverage:
    get:
      description: 直接聚合 Catalog 当前权威事实并按适用对象计算分母，不读取持久化覆盖率投影 | Aggregate current authoritative
