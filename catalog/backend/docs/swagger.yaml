host: localhost:8192
info:
  contact: {}
  title: ADDP Catalog API
  version: "1.0"
paths:
  /collections:
    get:
      parameters:
      - description: Project Group 稳定 ID | Project Group stable ID
        in: query
        name: project_group_id
        type: string
      - description: 页码，默认 1 | Page number, default 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20，最大 200 | Page size, default 20 and maximum 200
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 目录集合分页结果 | Paginated catalog collections
          schema:
            $ref: '#/definitions/github_com_addp_catalog_internal_service.CollectionListResult'
        "400":
          description: 请求参数无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询项目组目录集合 | List project group catalog collections
      tags:
      - Catalog Collections
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - catalog.entry.read
      - catalog.collection.read
    post:
      consumes:
      - application/json
      parameters:
      - description: 集合完整内容 | Complete collection content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.createCollectionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 目录集合 | Catalog collection
          schema:
            $ref: '#/definitions/github_com_addp_catalog_internal_service.CollectionDetail'
        "400":
          description: 请求参数无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 集合名称冲突 | Collection name conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建项目组目录集合 | Create a project group catalog collection
      tags:
      - Catalog Collections
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - catalog.entry.read
      - catalog.collection.read
      - catalog.collection.update
  /collections/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Collection UUID
        in: path
        name: id
        required: true
        type: string
      - description: 当前集合版本 | Current collection version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.deleteCollectionRequest'
      responses:
        "204":
          description: 删除成功 | Deleted
        "400":
          description: 请求参数无效 | Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 集合不存在或不可访问 | Collection not found or inaccessible
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 版本冲突 | Version conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除项目组目录集合 | Delete a project group catalog collection
      tags:
      - Catalog Collections
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - catalog.entry.read
      - catalog.collection.read
      - catalog.collection.update
    get:
      parameters:
      - description: Collection UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 目录集合与当前可见条目 | Collection and currently visible entries
          schema:
            $ref: '#/definitions/github_com_addp_catalog_internal_service.CollectionDetail'
        "401":
          description: 未认证 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 | Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 集合不存在或不可访问 | Collection not found or inaccessible
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 读取项目组目录集合 | Get a project group catalog collection
      tags:
      - Catalog Collections
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - catalog.entry.read
      - catalog.collection.read
    put:
      consumes:
      - application/json
      parameters:
      - description: Collection UUID
        in: path
        name: id
        required: true
        type: string
      - description: 集合版本与完整内容 | Collection version and complete content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.updateCollectionRequest'
