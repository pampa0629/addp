        required: true
        schema:
          $ref: '#/definitions/github_com_addp_service_internal_models.AggregationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 聚合结果 | Aggregation result
          schema:
            $ref: '#/definitions/github_com_addp_service_internal_models.AggregationResponse'
      summary: 聚合查询 | Aggregate query
      tags:
      - DataService
  /data/query:
    post:
      consumes:
      - application/json
      parameters:
      - description: 查询请求 | Query request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_service_internal_models.DataQueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 查询结果 | Query result
          schema:
            $ref: '#/definitions/github_com_addp_service_internal_models.DataQueryResponse'
      summary: 查询数据表 | Query data table
      tags:
      - DataService
  /data/structure:
    get:
      consumes:
      - application/json
      parameters:
      - description: 引擎ID | Engine ID
        in: query
        name: engine_id
        required: true
        type: integer
      - description: Schema名称 | Schema name
        in: query
        name: schema
        required: true
        type: string
      - description: 表名 | Table name
        in: query
        name: table
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 表结构 | Table structure
          schema:
            items:
              $ref: '#/definitions/github_com_addp_service_internal_models.ColumnInfo'
            type: array
      summary: 获取表结构 | Get table structure
      tags:
      - DataService
  /engines:
