          description: 引擎列表 | Engine list
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: 获取可用于数据服务的 PostgreSQL 引擎列表 | List PostgreSQL engines available for
        data services
      tags:
      - Engines
