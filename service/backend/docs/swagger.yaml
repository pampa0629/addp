    - schema
    - table
    type: object
  github_com_addp_service_internal_models.AggregationResponse:
    properties:
      columns:
        items:
          $ref: '#/definitions/github_com_addp_service_internal_models.ColumnInfo'
        type: array
      count:
        type: integer
      rows:
        items:
          items: {}
          type: array
        type: array
    type: object
  github_com_addp_service_internal_models.ColumnInfo:
    properties:
      name:
        type: string
      nullable:
        type: boolean
      type:
        type: string
    type: object
  github_com_addp_service_internal_models.CreateTileLayerRequest:
    properties:
      description:
        type: string
      layer_config:
        additionalProperties: true
        type: object
      layer_name:
        type: string
      layer_type:
        description: '"dynamic" or "static"'
        type: string
      title:
        type: string
    required:
    - layer_config
    - layer_name
    - layer_type
    - title
    type: object
  github_com_addp_service_internal_models.CreateTileServiceRequest:
    properties:
      default_srid:
        description: 默认 3857
        type: integer
      description:
        type: string
      first_layer:
        allOf:
        - $ref: '#/definitions/github_com_addp_service_internal_models.CreateTileLayerRequest'
        description: 第一个图层（必需）
      keywords:
        items:
          type: string
        type: array
      protocols:
        additionalProperties: true
        type: object
      public_access:
        type: boolean
      service_name:
        type: string
      title:
        type: string
    required:
    - first_layer
    - service_name
    - title
    type: object
  github_com_addp_service_internal_models.DataQueryRequest:
    properties:
      columns:
        description: 指定列，为空表示全部列
        items:
          type: string
        type: array
      engine_id:
        type: integer
      filter:
        description: WHERE 条件（需要防 SQL 注入）
        type: string
      geometry:
        description: 是否包含几何字段
        type: boolean
      geometry_type:
        description: '几何输出格式: ''geojson'', ''wkt'', ''wkb'''
        type: string
      order_by:
        description: 排序字段
        type: string
      page:
        description: 页码（从 1 开始）
        type: integer
      page_size:
        description: 每页大小
        type: integer
      schema:
        type: string
      table:
        type: string
    required:
    - engine_id
    - schema
    - table
    type: object
  github_com_addp_service_internal_models.DataQueryResponse:
    properties:
      columns:
        items:
          $ref: '#/definitions/github_com_addp_service_internal_models.ColumnInfo'
        type: array
      has_more:
        type: boolean
      page:
        type: integer
      page_size:
        type: integer
      rows:
        items:
          items: {}
          type: array
        type: array
      total_count:
        type: integer
    type: object
  github_com_addp_service_internal_models.TileServiceDTO:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      default_srid:
        type: integer
      description:
        type: string
      endpoints:
        additionalProperties:
          type: string
        description: 服务端点 URL
        type: object
      error_message:
        type: string
      extent: {}
      id:
        type: integer
      keywords:
        items:
          type: string
        type: array
      layers:
        items:
          $ref: '#/definitions/github_com_addp_service_internal_models.TileServiceLayerDTO'
        type: array
      protocols: {}
      public_access:
        type: boolean
      service_name:
        type: string
      status:
        type: string
      tenant_id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
