  github_com_addp_service_internal_models.TileServiceLayerDTO:
    properties:
      created_at:
        type: string
      description:
        type: string
      display_order:
        type: integer
      enabled:
        type: boolean
      id:
        type: integer
      layer_config: {}
      layer_name:
        type: string
      layer_type:
        type: string
      service_id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  github_com_addp_service_internal_models.UpdateTileLayerRequest:
    properties:
      description:
        type: string
      display_order:
        type: integer
      enabled:
        type: boolean
      layer_config:
        additionalProperties: true
        type: object
      title:
        type: string
    type: object
  github_com_addp_service_internal_models.UpdateTileServiceRequest:
    properties:
      description:
        type: string
      keywords:
        items:
          type: string
        type: array
      protocols:
        additionalProperties: true
        type: object
      public_access:
        type: boolean
      status:
        type: string
      title:
        type: string
    type: object
  internal_api.Capabilities:
    properties:
      contents:
        $ref: '#/definitions/internal_api.Contents'
      operationsMetadata:
        $ref: '#/definitions/internal_api.OperationsMetadata'
      ows:
