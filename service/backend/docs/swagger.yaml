      - description: 图层名称 | Layer name
        in: path
        name: layer
        required: true
        type: string
      - description: 瓦片矩阵集 ID | Tile Matrix Set ID
        in: path
        name: tileMatrixSetId
        required: true
        type: string
      - description: 瓦片矩阵（缩放级别）| Tile matrix (zoom level)
