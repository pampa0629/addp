basePath: /api/v1/service
definitions:
  encoding_xml.Name:
    properties:
      local:
        type: string
      space:
        type: string
    type: object
  github_com_addp_service_internal_models.AggregateColumn:
    properties:
      alias:
        description: 别名
        type: string
      column:
        description: 列名
        type: string
      function:
        description: 聚合函数
        enum:
        - count
        - sum
        - avg
        - min
        - max
        type: string
    required:
    - column
    - function
    type: object
  github_com_addp_service_internal_models.AggregationRequest:
    properties:
      aggregates:
        description: 聚合列
        items:
          $ref: '#/definitions/github_com_addp_service_internal_models.AggregateColumn'
        type: array
      engine_id:
        type: integer
      filter:
        description: WHERE 条件
        type: string
      group_by:
        description: 分组字段
        items:
          type: string
        type: array
      having:
        description: HAVING 条件
        type: string
      limit:
        description: 限制结果数
        type: integer
      order_by:
        description: 排序
        type: string
      schema:
        type: string
      table:
        type: string
    required:
