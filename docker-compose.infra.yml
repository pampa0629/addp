# ADDP 基础设施层配置
# Infrastructure Layer: PostgreSQL, Redis, MinIO, Meilisearch, Kafka, Kafka Connect
#
# 使用方法:
#   启动: docker compose -f docker-compose.infra.yml up -d
#   停止: docker compose -f docker-compose.infra.yml down
#   日志: docker compose -f docker-compose.infra.yml logs -f

name: addp-infra

services:
  # ==================== 基础设施服务 ====================

  postgres:
    # 使用预构建镜像，无需每次构建（节省启动时间）
    # 默认使用 Docker Hub 远程镜像，新环境自动拉取，无需配置
    # 如需使用本地镜像，设置环境变量: POSTGRES_IMAGE=addp-postgres-pgvector:latest
    image: ${POSTGRES_IMAGE:-pampa0629/addp-postgres:15-arm64}
    container_name: addp-postgres
    # 优化 PostgreSQL 内存配置，支持 MVT 瓦片生成
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - timezone=Asia/Shanghai
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: addp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: addp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: addp-meilisearch
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-17700}:7700"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: ${INFRA_KAFKA_IMAGE:-apache/kafka:4.3.0}
    container_name: addp-kafka
    hostname: kafka
    environment:
      CLUSTER_ID: ${INFRA_KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${INFRA_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${INFRA_KAFKA_ADMIN_PASSWORD:-addp_kafka_admin}"
        user_admin="${INFRA_KAFKA_ADMIN_PASSWORD:-addp_kafka_admin}"
        user_connect="${INFRA_KAFKA_CONNECT_PASSWORD:-addp_kafka_connect}"
        user_transfer="${INFRA_KAFKA_TRANSFER_PASSWORD:-addp_kafka_transfer}";
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${INFRA_KAFKA_ADMIN_PASSWORD:-addp_kafka_admin}"
        user_admin="${INFRA_KAFKA_ADMIN_PASSWORD:-addp_kafka_admin}"
        user_connect="${INFRA_KAFKA_CONNECT_PASSWORD:-addp_kafka_connect}"
        user_transfer="${INFRA_KAFKA_TRANSFER_PASSWORD:-addp_kafka_transfer}";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${INFRA_KAFKA_ADMIN_PASSWORD:-addp_kafka_admin}"
        user_admin="${INFRA_KAFKA_ADMIN_PASSWORD:-addp_kafka_admin}"
        user_connect="${INFRA_KAFKA_CONNECT_PASSWORD:-addp_kafka_connect}"
        user_transfer="${INFRA_KAFKA_TRANSFER_PASSWORD:-addp_kafka_transfer}";
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "${INFRA_KAFKA_PORT:-19092}:9092"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/29092'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: ${INFRA_KAFKA_IMAGE:-apache/kafka:4.3.0}
    container_name: addp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      INFRA_KAFKA_ADMIN_PASSWORD: ${INFRA_KAFKA_ADMIN_PASSWORD:-addp_kafka_admin}
      INFRA_KAFKA_CONNECT_PASSWORD: ${INFRA_KAFKA_CONNECT_PASSWORD:-addp_kafka_connect}
      INFRA_KAFKA_TRANSFER_PASSWORD: ${INFRA_KAFKA_TRANSFER_PASSWORD:-addp_kafka_transfer}
      KAFKA_CONNECT_GROUP_ID: ${KAFKA_CONNECT_GROUP_ID:-addp-connect-cluster}
      KAFKA_CONNECT_CONFIG_TOPIC: ${KAFKA_CONNECT_CONFIG_TOPIC:-__addp_connect_configs}
      KAFKA_CONNECT_OFFSET_TOPIC: ${KAFKA_CONNECT_OFFSET_TOPIC:-__addp_connect_offsets}
      KAFKA_CONNECT_STATUS_TOPIC: ${KAFKA_CONNECT_STATUS_TOPIC:-__addp_connect_status}
      INFRA_KAFKA_CDC_TOPIC_PREFIX: ${INFRA_KAFKA_CDC_TOPIC_PREFIX:-__addp_cdc.}
      INFRA_KAFKA_CDC_CONSUMER_GROUP_PREFIX: ${INFRA_KAFKA_CDC_CONSUMER_GROUP_PREFIX:-__addp_cdc_consumer.}
    volumes:
      - ./scripts/infra/init-kafka.sh:/opt/addp/init-kafka.sh:ro
    command: ["bash", "/opt/addp/init-kafka.sh"]
    networks:
      - addp-network
    restart: "no"

  kafka-connect:
    image: ${KAFKA_CONNECT_IMAGE:-quay.io/debezium/connect:3.6.0.Final}
    container_name: addp-kafka-connect
    hostname: kafka-connect
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: ${KAFKA_CONNECT_GROUP_ID:-addp-connect-cluster}
      CONFIG_STORAGE_TOPIC: ${KAFKA_CONNECT_CONFIG_TOPIC:-__addp_connect_configs}
      OFFSET_STORAGE_TOPIC: ${KAFKA_CONNECT_OFFSET_TOPIC:-__addp_connect_offsets}
      STATUS_STORAGE_TOPIC: ${KAFKA_CONNECT_STATUS_TOPIC:-__addp_connect_status}
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="connect" password="${INFRA_KAFKA_CONNECT_PASSWORD:-addp_kafka_connect}";
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_PRODUCER_SASL_MECHANISM: PLAIN
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="connect" password="${INFRA_KAFKA_CONNECT_PASSWORD:-addp_kafka_connect}";
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_CONSUMER_SASL_MECHANISM: PLAIN
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="connect" password="${INFRA_KAFKA_CONNECT_PASSWORD:-addp_kafka_connect}";
      HEAP_OPTS: ${KAFKA_CONNECT_HEAP_OPTS:--Xms512m -Xmx512m}
      REST_HOST_NAME: 0.0.0.0
      ADVERTISED_HOST_NAME: kafka-connect
      ADVERTISED_PORT: 8083
      ENABLE_APICURIO_CONVERTERS: "false"
      ENABLE_JOLOKIA: "false"
      ENABLE_OTEL: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${KAFKA_CONNECT_PORT:-18083}:8083"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  addp-network:
    name: addp-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meilisearch_data:
  kafka_data:
