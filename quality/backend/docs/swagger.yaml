host: localhost:8182
info:
  contact: {}
  title: ADDP Quality API
  version: "1.0"
paths:
  /check-tasks:
    get:
      parameters:
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        maximum: 100
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.qualityCheckTaskListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取检查任务列表 | List check tasks
      tags:
      - CheckTask
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.read
    post:
      consumes:
      - application/json
      description: 创建前校验目标 PostgreSQL Schema 和数据表属于当前租户引擎 | Validate the target PostgreSQL
        schema and table against the tenant engine before creation
      parameters:
      - description: 任务信息 | Task info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_quality_internal_service.CreateCheckTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api.qualityCheckTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建检查任务 | Create check task
      tags:
      - CheckTask
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.create
  /check-tasks/{id}:
    delete:
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.qualityMessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除检查任务 | Delete check task
      tags:
      - CheckTask
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.delete
    get:
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.qualityCheckTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取检查任务详情 | Get check task detail
      tags:
      - CheckTask
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.read
    put:
      consumes:
      - application/json
      description: 更新前校验目标 PostgreSQL Schema 和数据表属于当前租户引擎 | Validate the target PostgreSQL
        schema and table against the tenant engine before update
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新信息 | Update info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_quality_internal_service.UpdateCheckTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.qualityCheckTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新检查任务 | Update check task
      tags:
      - CheckTask
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.update
  /check-tasks/{id}/run:
    post:
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_api.qualityTaskProviderExecuteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "409":
          description: 任务已有活动 execution | Task already has an active execution
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
      - BearerAuth: []
      summary: 执行检查任务 | Run check task
      tags:
      - CheckTask
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.execute
  /executions:
    get:
      parameters:
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        maximum: 100
        name: page_size
        type: integer
      - description: 执行状态：pending|running|success|failed|timeout|cancelled | Execution
          status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.qualityExecutionListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
