        type: integer
      attempt:
        type: integer
      authorization_effects:
        items:
          type: string
        type: array
      authorization_expires_at:
        type: string
      bytes_read:
        description: Transfer 读取字节数
        type: integer
      bytes_written:
        description: Transfer 写入字节数
        type: integer
      completed_at:
        type: string
      created_at:
        type: string
      current_step:
        description: 当前步骤（Orchestrator/Workflow）
        type: string
      error_details:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: 错误详情（仅失败时有值）
      execution_authorization_id:
        type: integer
      execution_boundary:
        description: ExecutionBoundary separates finite queue work from long-running
          runtime sessions.
        type: string
      execution_config:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: JSONB 字段
      execution_id:
        description: 执行标识
        type: string
      execution_time_ms:
        description: 性能指标
        type: integer
      id:
        type: integer
      issued_authorization_version:
        type: integer
      max_attempts:
        type: integer
      metadata:
