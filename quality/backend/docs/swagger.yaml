host: localhost:8182
info:
  contact: {}
  title: ADDP Quality API
  version: "1.0"
paths:
  /executions:
    get:
      parameters:
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        maximum: 100
        name: page_size
        type: integer
      - description: 执行状态：pending|running|success|failed|timeout|cancelled | Execution
          status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.qualityExecutionListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取执行记录列表 | List execution records
      tags:
      - Execution
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.execution.read
  /executions/{execution_id}:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: execution_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/taskprovider.ExecutionStatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取执行记录详情 | Get execution record detail
      tags:
      - Execution
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.execution.read
  /issues:
    get:
      parameters:
      - description: 状态 | Status
        enum:
        - open
        - resolved
        - ignored
        in: query
        name: status
        type: string
      - description: 引擎ID | Engine ID
        in: query
        name: engine_id
        type: integer
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        maximum: 100
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.qualityIssueListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取问题工单列表 | List quality issues
      tags:
      - Issue
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.issue.read
  /issues/{id}:
    get:
      parameters:
      - description: 工单ID | Issue ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.qualityIssueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.qualityErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取问题工单详情 | Get issue detail
      tags:
