basePath: /api/v1/quality
host: localhost:8182
info:
  contact: {}
  title: ADDP Quality API
  version: "1.0"
paths:
  /check-tasks:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 获取检查任务列表 | List check tasks
      tags:
      - CheckTask
    post:
      consumes:
      - application/json
      parameters:
      - description: 任务信息 | Task info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建检查任务 | Create check task
      tags:
      - CheckTask
  /check-tasks/{id}:
    delete:
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除检查任务 | Delete check task
      tags:
      - CheckTask
    get:
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取检查任务详情 | Get check task detail
      tags:
      - CheckTask
    put:
      consumes:
      - application/json
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新信息 | Update info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新检查任务 | Update check task
      tags:
      - CheckTask
  /check-tasks/{id}/run:
    post:
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 执行检查任务 | Run check task
      tags:
      - CheckTask
  /executions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行记录列表 | List execution records
      tags:
      - Execution
  /executions/{id}:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行记录详情 | Get execution record detail
      tags:
      - Execution
  /issues:
    get:
      parameters:
      - description: 状态 | Status
        in: query
        name: status
        type: string
      - description: 引擎ID | Engine ID
        in: query
        name: engine_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 获取问题工单列表 | List quality issues
      tags:
      - Issue
  /issues/{id}:
    get:
      parameters:
      - description: 工单ID | Issue ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取问题工单详情 | Get issue detail
      tags:
      - Issue
  /issues/{id}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: 工单ID | Issue ID
        in: path
        name: id
        required: true
        type: integer
      - description: 状态信息 | Status info
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新问题工单状态 | Update issue status
      tags:
      - Issue
  /rule-applications:
    get:
      parameters:
      - description: 引擎ID | Engine ID
        in: query
        name: engine_id
        type: integer
      - description: Schema名称 | Schema name
        in: query
        name: schema_name
        type: string
      - description: 表名 | Table name
        in: query
        name: table_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 获取规则应用列表 | List rule applications
      tags:
      - RuleApplication
    post:
      consumes:
      - application/json
      parameters:
      - description: 规则应用信息 | Rule application info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建规则应用 | Create rule application
      tags:
      - RuleApplication
  /rule-applications/{id}:
    delete:
      parameters:
      - description: 规则应用ID | Rule application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除规则应用 | Delete rule application
      tags:
      - RuleApplication
    get:
      parameters:
      - description: 规则应用ID | Rule application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取规则应用详情 | Get rule application detail
      tags:
      - RuleApplication
    put:
      consumes:
      - application/json
      parameters:
      - description: 规则应用ID | Rule application ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新信息 | Update info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新规则应用 | Update rule application
      tags:
      - RuleApplication
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
