    get:
      parameters:
      - description: 规则应用ID | Rule application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取规则应用详情 | Get rule application detail
      tags:
      - RuleApplication
