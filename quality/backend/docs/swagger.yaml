basePath: /api/v1/quality
definitions:
  internal_api.qualityTaskProviderExecuteRequest:
    properties:
      parameters:
        additionalProperties: true
        type: object
      parent_execution_id:
        type: string
      source:
        type: string
      trigger_type:
        type: string
    type: object
  internal_api.qualityTaskProviderExecuteResponse:
    properties:
      execution_id:
        type: string
      status:
        enum:
        - pending
        example: pending
        type: string
    type: object
  internal_api.taskProviderTaskListItem:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      execution_contract:
        $ref: '#/definitions/taskprovider.ExecutionContract'
      id:
        type: integer
      last_execution_id:
        type: string
      last_execution_status:
        type: string
      last_run_at:
        type: string
      name:
        type: string
      next_run_at:
        type: string
      task_type:
        type: string
      tenant_id:
        type: integer
    type: object
  internal_api.taskProviderTaskListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/internal_api.taskProviderTaskListItem'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  taskprovider.ExecutionContract:
    properties:
      input_defaults:
        additionalProperties: true
        type: object
      input_schema:
        additionalProperties: true
        type: object
      input_ui_schema:
        additionalProperties: true
        type: object
      output_schema:
        additionalProperties: true
        type: object
    type: object
host: localhost:8182
info:
  contact: {}
  title: ADDP Quality API
  version: "1.0"
