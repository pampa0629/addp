  /tasks:
    get:
      description: 按标准 TaskProvider 协议列出 Quality 检查任务；task_type 仅支持 check。| List Quality
        check tasks through the standard TaskProvider protocol; task_type only supports
        check.
      parameters:
      - description: 任务类型，固定为 check | Task type, fixed to check
        in: query
        name: task_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 任务列表 | Task list
          schema:
            $ref: '#/definitions/internal_api.taskProviderTaskListResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 任务已有活动 execution | Task already has an active execution
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出 TaskProvider 质量检查任务 | List TaskProvider quality check tasks
      tags:
      - CheckTask
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.read
  /tasks/{task_type}/{id}:
    get:
      description: 按标准 TaskProvider 协议获取 Quality 检查任务详情；task_type 仅支持 check。| Get
        Quality check task detail through the standard TaskProvider protocol; task_type
        only supports check.
      parameters:
      - description: 任务类型，固定为 check | Task type, fixed to check
        in: path
        name: task_type
        required: true
        type: string
      - description: 检查任务ID | Check task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 任务详情 | Task detail
          schema:
            $ref: '#/definitions/internal_api.taskProviderTaskListItem'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 任务不存在 | Task not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取 TaskProvider 质量检查任务详情 | Get TaskProvider quality check task detail
      tags:
      - CheckTask
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.read
  /tasks/{task_type}/{id}/execute:
    post:
      consumes:
      - application/json
      description: 按标准 TaskProvider 协议执行 Quality 检查任务；task_type 仅支持 check，parameters
        当前不支持覆盖。| Execute a Quality check task through the standard TaskProvider protocol;
        task_type only supports check and parameters overrides are not supported.
      parameters:
      - description: 任务类型，固定为 check | Task type, fixed to check
        in: path
        name: task_type
        required: true
        type: string
      - description: 检查任务ID | Check task ID
        in: path
        name: id
        required: true
        type: integer
      - description: TaskProvider 执行请求 | TaskProvider execution request
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_api.qualityTaskProviderExecuteRequest'
      produces:
      - application/json
      responses:
        "202":
          description: 执行ID | Execution ID
          schema:
            $ref: '#/definitions/internal_api.qualityTaskProviderExecuteResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 执行 TaskProvider 质量检查任务 | Execute TaskProvider quality check task
      tags:
      - CheckTask
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.execute
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
