basePath: /api/v1/quality
definitions:
  dataquality.Document:
    properties:
      rules:
        items:
          $ref: '#/definitions/dataquality.Rule'
        type: array
      schema_version:
        type: string
    type: object
  dataquality.Parameters:
    properties:
      max:
        type: string
      min:
        type: string
      pattern:
        type: string
      values:
        items:
          type: string
        type: array
    type: object
  dataquality.Rule:
