        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 获取问题工单列表 | List quality issues
      tags:
      - Issue
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.issue.read
  /issues/{id}:
    get:
      parameters:
      - description: 工单ID | Issue ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
