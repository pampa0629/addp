      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行记录详情 | Get execution record detail
      tags:
      - Execution
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.read
