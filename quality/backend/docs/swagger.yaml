      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新检查任务 | Update check task
      tags:
      - CheckTask
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - quality.check_task.update
  /check-tasks/{id}/run:
    post:
