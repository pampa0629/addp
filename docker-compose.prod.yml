# ADDP 生产环境应用服务配置
# 用于从私有 Registry 拉取镜像部署
#
# ⚠️ 重要: 需要先启动基础设施服务!
#
# 使用方法:
#   1. 启动基础设施: docker compose -f docker-compose.infra.yml up -d
#   2. 配置 Registry: export REGISTRY=192.168.1.100:5001
#   3. 启动应用服务: docker compose -f docker-compose.prod.yml --profile addp up -d
#
# 说明:
#   - 基础设施服务(PostgreSQL, Redis, MinIO, Meilisearch) 已在 docker-compose.infra.yml 中定义
#   - 本文件仅包含应用服务(System, Manager, Meta, Transfer, Orchestrator, Develop, Gateway, Portal, Nginx)
#   - 使用 --profile addp 启动所有应用服务

services:
  # ==================== System 模块 ====================

  system-backend:
    image: ${REGISTRY:-localhost:5001}/addp-system-backend:${IMAGE_TAG:-latest}
    container_name: addp-system-backend
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-SuperAdmin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-20251001#SuperAdmin}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@addp.com}
      - GIN_MODE=release
    ports:
      - "8080:8080"
    networks:
      - addp-network
    # 注意: 依赖的基础设施服务(postgres, redis)在 docker-compose.infra.yml 中
    # 请确保已先启动: docker compose -f docker-compose.infra.yml up -d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - addp

  system-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-system-frontend:${IMAGE_TAG:-latest}
    container_name: addp-system-frontend
    ports:
      - "8090:80"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped
    profiles:
      - addp

  # ==================== Manager 模块 ====================

  manager-backend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-backend:${IMAGE_TAG:-latest}
    container_name: addp-manager-backend
    environment:
      - PORT=8081
      - DB_SCHEMA=manager
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8081:8081"
    networks:
      - addp-network
    # 注意: 依赖的基础设施服务(postgres)在 docker-compose.infra.yml 中
    # 请确保已先启动: docker compose -f docker-compose.infra.yml up -d
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - addp

  manager-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-frontend:${IMAGE_TAG:-latest}
    container_name: addp-manager-frontend
    ports:
      - "8091:80"
    networks:
      - addp-network
    depends_on:
      - manager-backend
    restart: unless-stopped
    profiles:
      - addp

  # ==================== Manager Worker 服务 ====================

  manager-worker:
    image: ${REGISTRY:-localhost:5001}/addp-manager-worker:${IMAGE_TAG:-latest}
    # container_name removed for Swarm compatibility (allows multiple replicas)
    environment:
      - DB_SCHEMA=manager
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=10  # Each worker handles 10 concurrent quick view tasks
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=false
    networks:
      - addp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      manager-backend:
        condition: service_started
    restart: unless-stopped
    # Docker Swarm high availability configuration
    # NOTE: deploy config is commented out for docker-compose mode
    # Uncomment when using docker stack deploy (Swarm mode)
    # deploy:
    #   replicas: 1  # Single instance resident (changed from 2 to save 50% memory)
    #   restart_policy:
    #     condition: any  # Restart on any failure
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    #   update_config:
    #     parallelism: 1  # Update one container at a time
    #     delay: 10s
    #     failure_action: rollback
    #     order: start-first  # Start new container before stopping old one
    #   rollback_config:
    #     parallelism: 1
    #     delay: 5s
    #   resources:
    #     limits:
    #       cpus: '2'      # Max 2 CPU cores per worker
    #       memory: 2G     # Max 2GB memory per worker
    #     reservations:
    #       cpus: '0.5'    # Reserve at least 0.5 CPU core
    #       memory: 512M   # Reserve at least 512MB memory
    profiles:
      - addp

  # ==================== Meta 模块 ====================

  meta-backend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-backend:${IMAGE_TAG:-latest}
    container_name: addp-meta-backend
    environment:
      - PORT=8082
      - DB_SCHEMA=metadata
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8082:8082"
    networks:
      - addp-network
    # 注意: 依赖的基础设施服务(postgres)在 docker-compose.infra.yml 中
    # 请确保已先启动: docker compose -f docker-compose.infra.yml up -d
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - addp

  meta-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-frontend:${IMAGE_TAG:-latest}
    container_name: addp-meta-frontend
    ports:
      - "8092:80"
    networks:
      - addp-network
    depends_on:
      - meta-backend
    restart: unless-stopped
    profiles:
      - addp

  # ==================== Transfer 模块 ====================

  transfer-backend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-backend:${IMAGE_TAG:-latest}
    container_name: addp-transfer-backend
    environment:
      - PORT=8083
      - DB_SCHEMA=transfer
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8083:8083"
    networks:
      - addp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - addp

  transfer-worker:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-worker:${IMAGE_TAG:-latest}
    # container_name removed for Swarm compatibility (allows multiple replicas)
    environment:
      - DB_SCHEMA=transfer
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=15  # Each worker handles 15 concurrent tasks
    networks:
      - addp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      transfer-backend:
        condition: service_started
    restart: unless-stopped
    # Docker Swarm high availability configuration
    # NOTE: deploy config is commented out for docker-compose mode
    # Uncomment when using docker stack deploy (Swarm mode)
    # deploy:
    #   replicas: 1  # Single instance resident (changed from 2 to save 50% memory)
    #   restart_policy:
    #     condition: any  # Restart on any failure
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    #   update_config:
    #     parallelism: 1  # Update one container at a time
    #     delay: 10s
    #     failure_action: rollback
    #     order: start-first  # Start new container before stopping old one
    #   rollback_config:
    #     parallelism: 1
    #     delay: 5s
    #   resources:
    #     limits:
    #       cpus: '2'      # Max 2 CPU cores per worker
    #       memory: 2G     # Max 2GB memory per worker
    #     reservations:
    #       cpus: '0.5'    # Reserve at least 0.5 CPU core
    #       memory: 512M   # Reserve at least 512MB memory
    profiles:
      - addp

  # ==================== Meta Worker 服务 ====================

  meta-worker:
    image: ${REGISTRY:-localhost:5001}/addp-meta-worker:${IMAGE_TAG:-latest}
    # container_name removed for Swarm compatibility (allows multiple replicas)
    environment:
      - DB_SCHEMA=metadata
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=10  # Each worker handles 10 concurrent scan tasks
    networks:
      - addp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meta-backend:
        condition: service_started
    restart: unless-stopped
    # Docker Swarm high availability configuration
    # NOTE: deploy config is commented out for docker-compose mode
    # Uncomment when using docker stack deploy (Swarm mode)
    # deploy:
    #   replicas: 1  # Single instance resident (changed from 2 to save 50% memory)
    #   restart_policy:
    #     condition: any  # Restart on any failure
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    #   update_config:
    #     parallelism: 1  # Update one container at a time
    #     delay: 10s
    #     failure_action: rollback
    #     order: start-first  # Start new container before stopping old one
    #   rollback_config:
    #     parallelism: 1
    #     delay: 5s
    #   resources:
    #     limits:
    #       cpus: '2'      # Max 2 CPU cores per worker
    #       memory: 2G     # Max 2GB memory per worker
    #     reservations:
    #       cpus: '0.5'    # Reserve at least 0.5 CPU core
    #       memory: 512M   # Reserve at least 512MB memory
    profiles:
      - addp

  transfer-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-frontend:${IMAGE_TAG:-latest}
    container_name: addp-transfer-frontend
    ports:
      - "8093:80"
    networks:
      - addp-network
    depends_on:
      - transfer-backend
    restart: unless-stopped
    profiles:
      - addp

  # ==================== Orchestrator 模块 ====================

  orchestrator-backend:
    image: ${REGISTRY:-localhost:5001}/addp-orchestrator-backend:${IMAGE_TAG:-latest}
    container_name: addp-orchestrator-backend
    environment:
      - PORT=8084
      - DB_SCHEMA=orchestrator
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8084:8084"
    networks:
      - addp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - addp

  orchestrator-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-orchestrator-frontend:${IMAGE_TAG:-latest}
    container_name: addp-orchestrator-frontend
    ports:
      - "8094:80"
    networks:
      - addp-network
    depends_on:
      - orchestrator-backend
    restart: unless-stopped
    profiles:
      - addp

  # ==================== Develop 模块 (SQL 开发工作台) ====================

  develop-backend:
    image: ${REGISTRY:-localhost:5001}/addp-develop-backend:${IMAGE_TAG:-latest}
    container_name: addp-develop-backend
    environment:
      - PORT=8085
      - ENV=production
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - ENABLE_SERVICE_INTEGRATION=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=develop
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GIN_MODE=release
    ports:
      - "8085:8085"
    networks:
      - addp-network
    # 注意: 依赖的基础设施服务(postgres)在 docker-compose.infra.yml 中
    # 请确保已先启动: docker compose -f docker-compose.infra.yml up -d
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - addp

  develop-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-develop-frontend:${IMAGE_TAG:-latest}
    container_name: addp-develop-frontend
    ports:
      - "8095:80"
    networks:
      - addp-network
    depends_on:
      - develop-backend
    restart: unless-stopped
    profiles:
      - addp

  # ==================== Gateway 服务 ====================

  gateway:
    image: ${REGISTRY:-localhost:5001}/addp-gateway:${IMAGE_TAG:-latest}
    container_name: addp-gateway
    environment:
      - PORT=8000
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - MANAGER_SERVICE_URL=http://manager-backend:8081
      - META_SERVICE_URL=http://meta-backend:8082
      - TRANSFER_SERVICE_URL=http://transfer-backend:8083
      - ORCHESTRATOR_SERVICE_URL=http://orchestrator-backend:8084
      - DEVELOP_SERVICE_URL=http://develop-backend:8085
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GIN_MODE=release
    ports:
      - "8000:8000"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - addp

  # ==================== Portal 统一门户 ====================

  portal:
    image: ${REGISTRY:-localhost:5001}/addp-portal:${IMAGE_TAG:-latest}
    container_name: addp-portal
    networks:
      - addp-network
    depends_on:
      - gateway
    restart: unless-stopped
    profiles:
      - addp

  # ==================== Nginx 统一网关 ====================

  nginx:
    image: ${REGISTRY:-localhost:5001}/addp-nginx:${IMAGE_TAG:-latest}
    container_name: addp-nginx
    ports:
      - "8000:80"
    networks:
      - addp-network
    depends_on:
      - portal
      - gateway
      - system-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - addp

networks:
  addp-network:
    name: addp-network
    external: true  # 使用 docker-compose.infra.yml 创建的网络
