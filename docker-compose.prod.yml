# 生产环境 docker-compose 配置
# 用于从私有 Registry 拉取镜像部署
#
# 使用方法:
#   1. 复制到服务器: scp docker-compose.prod.yml server:/opt/addp/
#   2. 配置 Registry: export REGISTRY=192.168.1.100:5001
#   3. 启动服务: docker-compose -f docker-compose.prod.yml --profile full up -d

services:
  # ==================== 基础设施服务 ====================

  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: addp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-addp}
      POSTGRES_USER: ${POSTGRES_USER:-addp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-addp_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-addp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: addp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-addp_redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-system:
    image: minio/minio:latest
    container_name: addp-minio-system
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_system_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: localhost:5001/addp-infra-elasticsearch:8.11.0
    container_name: addp-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== System 模块 ====================

  system-backend:
    image: ${REGISTRY:-localhost:5001}/addp-system-backend:${IMAGE_TAG:-latest}
    container_name: addp-system-backend
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-SuperAdmin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-20251001#SuperAdmin}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@addp.com}
      - GIN_MODE=release
    ports:
      - "8080:8080"
    networks:
      - addp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  system-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-system-frontend:${IMAGE_TAG:-latest}
    container_name: addp-system-frontend
    ports:
      - "8090:80"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped

  # ==================== Manager 模块 ====================

  manager-backend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-backend:${IMAGE_TAG:-latest}
    container_name: addp-manager-backend
    environment:
      - PORT=8081
      - DB_SCHEMA=manager
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8081:8081"
    networks:
      - addp-network
    depends_on:
      postgres:
        condition: service_healthy
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - full

  manager-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-frontend:${IMAGE_TAG:-latest}
    container_name: addp-manager-frontend
    ports:
      - "8091:80"
    networks:
      - addp-network
    depends_on:
      - manager-backend
    restart: unless-stopped
    profiles:
      - full

  # ==================== Meta 模块 ====================

  meta-backend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-backend:${IMAGE_TAG:-latest}
    container_name: addp-meta-backend
    environment:
      - PORT=8082
      - DB_SCHEMA=metadata
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8082:8082"
    networks:
      - addp-network
    depends_on:
      postgres:
        condition: service_healthy
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - full

  meta-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-frontend:${IMAGE_TAG:-latest}
    container_name: addp-meta-frontend
    ports:
      - "8092:80"
    networks:
      - addp-network
    depends_on:
      - meta-backend
    restart: unless-stopped
    profiles:
      - full

  # ==================== Transfer 模块 ====================

  transfer-backend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-backend:${IMAGE_TAG:-latest}
    container_name: addp-transfer-backend
    environment:
      - PORT=8083
      - DB_SCHEMA=transfer
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8083:8083"
    networks:
      - addp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - full

  transfer-worker:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-worker:${IMAGE_TAG:-latest}
    container_name: addp-transfer-worker
    environment:
      - DB_SCHEMA=transfer
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
    networks:
      - addp-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      transfer-backend:
        condition: service_started
    restart: unless-stopped
    profiles:
      - full

  transfer-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-frontend:${IMAGE_TAG:-latest}
    container_name: addp-transfer-frontend
    ports:
      - "8093:80"
    networks:
      - addp-network
    depends_on:
      - transfer-backend
    restart: unless-stopped
    profiles:
      - full

  # ==================== Gateway 服务 ====================

  gateway:
    image: ${REGISTRY:-localhost:5001}/addp-gateway:${IMAGE_TAG:-latest}
    container_name: addp-gateway
    environment:
      - PORT=8000
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - MANAGER_SERVICE_URL=http://manager-backend:8081
      - META_SERVICE_URL=http://meta-backend:8082
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GIN_MODE=release
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    profiles:
      - full

  # ==================== Portal 统一门户 ====================

  portal:
    image: ${REGISTRY:-localhost:5001}/addp-portal:${IMAGE_TAG:-latest}
    container_name: addp-portal
    networks:
      - addp-network
    depends_on:
      - gateway
    restart: unless-stopped
    profiles:
      - full

  # ==================== Nginx 统一网关 ====================

  nginx:
    image: ${REGISTRY:-localhost:5001}/addp-nginx:${IMAGE_TAG:-latest}
    container_name: addp-nginx
    ports:
      - "8000:80"
    networks:
      - addp-network
    depends_on:
      - portal
      - gateway
      - system-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - full

networks:
  addp-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_system_data:
  elasticsearch_data:
