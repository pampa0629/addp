version: '3.8'

services:
  math-workflow-engine:
    build:
      context: ../..
      dockerfile: engines/math-workflow/Dockerfile
    container_name: math-workflow-engine
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  addp-network:
    external: true
