version: '3.8'

services:
  math-workflow-engine:
    build: .
    container_name: math-workflow-engine
    ports:
      - "8097:8097"
    environment:
      - SYSTEM_SERVICE_URL=${SYSTEM_SERVICE_URL:-http://system-backend:8080}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENGINE_URL=${ENGINE_URL:-http://math-workflow-engine:8097}
      - PORT=8097
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8097/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  addp-network:
    external: true
