worker_processes 1;
pid /tmp/notebook-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/nb-client;
    proxy_temp_path /tmp/nb-proxy;
    fastcgi_temp_path /tmp/nb-fastcgi;
    uwsgi_temp_path /tmp/nb-uwsgi;
    scgi_temp_path /tmp/nb-scgi;
    resolver 127.0.0.11 ipv6=off valid=1s;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8097;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        location ~ "^/api/v1/develop/notebook-sessions/(?<session>[0-9a-f][0-9a-f-]{0,59})/" {
            set $requested_session $session;
            auth_request /_notebook_authorize;
            auth_request_set $lab_auth $upstream_http_x_notebook_lab_authorization;
            proxy_set_header Authorization $lab_auth;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://nb-$requested_session:8888;
        }
        location = /_notebook_authorize {
            internal;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Notebook-Session $requested_session;
            proxy_pass http://unix:/tmp/notebook-api.sock;
        }
        location / {
            proxy_pass http://unix:/tmp/notebook-api.sock;
        }
    }
}
