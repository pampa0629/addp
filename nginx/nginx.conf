user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream definitions
    upstream console {
        server console:80;
    }

    upstream gateway {
        server gateway:8000;
    }

    upstream system-frontend {
        server system-frontend:80;
    }

    upstream manager-frontend {
        server manager-frontend:80;
    }

    upstream meta-frontend {
        server meta-frontend:80;
    }

    upstream transfer-frontend {
        server transfer-frontend:80;
    }

    upstream orchestrator-frontend {
        server orchestrator-frontend:80;
    }

    upstream develop-frontend {
        server develop-frontend:80;
    }

    upstream service-frontend {
        server service-frontend:80;
    }

    server {
        listen 80;
        server_name _;
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $monitor_frontend_upstream monitor-frontend:80;
        set $standard_frontend_upstream standard-frontend:80;
        set $agent_frontend_upstream agent-frontend:80;
        set $model_frontend_upstream model-frontend:80;
        set $quality_frontend_upstream quality-frontend:80;
        set $security_frontend_upstream security-frontend:80;
        set $catalog_frontend_upstream catalog-frontend:80;
        set $workbench_frontend_upstream workbench-frontend:80;
        set $asset_frontend_upstream asset-frontend:80;
        set $portal_frontend_upstream portal-frontend:80;
        set $graph_frontend_upstream graph-frontend:80;
        set $inference_frontend_upstream inference-frontend:80;

        # Root - Console (工作台统一入口)
        location / {
            proxy_pass http://console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway (后端 API 路由)
        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # System Frontend (独立访问)
        location /system/ {
            proxy_pass http://system-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # System Frontend assets (静态资源重写)
        location ^~ /system/assets/ {
            rewrite ^/system/(.*)$ /$1 break;
            proxy_pass http://system-frontend;
            proxy_set_header Host $host;
        }

        # Manager Frontend (独立访问)
        location /manager/ {
            proxy_pass http://manager-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Manager Frontend assets (静态资源重写)
        location ^~ /manager/assets/ {
            rewrite ^/manager/(.*)$ /$1 break;
            proxy_pass http://manager-frontend;
            proxy_set_header Host $host;
        }

        # Manager Frontend runtime preview plugins
        location ^~ /manager/plugins/ {
            rewrite ^/manager/(.*)$ /$1 break;
            proxy_pass http://manager-frontend;
            proxy_set_header Host $host;
        }

        # Meta Frontend (独立访问)
        location /meta/ {
            proxy_pass http://meta-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Meta Frontend assets (静态资源重写)
        location ^~ /meta/assets/ {
            rewrite ^/meta/(.*)$ /$1 break;
            proxy_pass http://meta-frontend;
            proxy_set_header Host $host;
        }

        # Transfer Frontend (独立访问)
        location /transfer/ {
            proxy_pass http://transfer-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Transfer Frontend assets (静态资源重写)
        location ^~ /transfer/assets/ {
            rewrite ^/transfer/(.*)$ /$1 break;
            proxy_pass http://transfer-frontend;
            proxy_set_header Host $host;
        }

        # Orchestrator Frontend (独立访问)
        location /orchestrator/ {
            proxy_pass http://orchestrator-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Orchestrator Frontend assets (静态资源重写)
        location ^~ /orchestrator/assets/ {
            rewrite ^/orchestrator/(.*)$ /$1 break;
            proxy_pass http://orchestrator-frontend;
            proxy_set_header Host $host;
        }

        # Develop Frontend (独立访问)
        location /develop/ {
            proxy_pass http://develop-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Develop Frontend assets (静态资源重写)
        location ^~ /develop/assets/ {
            rewrite ^/develop/(.*)$ /$1 break;
            proxy_pass http://develop-frontend;
            proxy_set_header Host $host;
        }

        # Service Frontend (独立访问)
        location /service/ {
            proxy_pass http://service-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service Frontend assets (静态资源重写)
        location ^~ /service/assets/ {
            rewrite ^/service/(.*)$ /$1 break;
            proxy_pass http://service-frontend;
            proxy_set_header Host $host;
        }

        # Monitor Frontend (Console iframe 嵌入)
        location /monitor/ {
            proxy_pass http://$monitor_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Monitor Frontend assets (静态资源重写)
        location ^~ /monitor/assets/ {
            rewrite ^/monitor/(.*)$ /$1 break;
            proxy_pass http://$monitor_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Standard Frontend (Console iframe 嵌入)
        location /standard/ {
            proxy_pass http://$standard_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Standard Frontend assets (静态资源重写)
        location ^~ /standard/assets/ {
            rewrite ^/standard/(.*)$ /$1 break;
            proxy_pass http://$standard_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Agent Frontend (Console iframe 嵌入)
        location = /agent {
            proxy_pass http://$agent_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /agent/ {
            proxy_pass http://$agent_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Agent Frontend assets (静态资源重写)
        location ^~ /agent/assets/ {
            rewrite ^/agent/(.*)$ /$1 break;
            proxy_pass http://$agent_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Model Frontend (Console iframe 嵌入)
        location /model/ {
            proxy_pass http://$model_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Model Frontend assets (静态资源重写)
        location ^~ /model/assets/ {
            rewrite ^/model/(.*)$ /$1 break;
            proxy_pass http://$model_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Quality Frontend (Console iframe 嵌入)
        location /quality/ {
            proxy_pass http://$quality_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Quality Frontend assets (静态资源重写)
        location ^~ /quality/assets/ {
            rewrite ^/quality/(.*)$ /$1 break;
            proxy_pass http://$quality_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Security Frontend (Console iframe 嵌入)
        location /security/ {
            proxy_pass http://$security_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /security/assets/ {
            rewrite ^/security/(.*)$ /$1 break;
            proxy_pass http://$security_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Catalog Frontend (Console iframe 嵌入)
        location /catalog/ {
            proxy_pass http://$catalog_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Catalog Frontend assets (静态资源重写)
        location ^~ /catalog/assets/ {
            rewrite ^/catalog/(.*)$ /$1 break;
            proxy_pass http://$catalog_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Workbench Frontend (Console iframe 嵌入)
        location /workbench/ {
            proxy_pass http://$workbench_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /workbench/assets/ {
            rewrite ^/workbench/(.*)$ /$1 break;
            proxy_pass http://$workbench_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Workbench Data Application 顶层运行入口（与 Console 同 origin）
        location /data-apps/ {
            proxy_pass http://$workbench_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Asset Frontend (Console iframe 嵌入)
        location /asset/ {
            proxy_pass http://$asset_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Asset Frontend assets (静态资源重写)
        location ^~ /asset/assets/ {
            rewrite ^/asset/(.*)$ /$1 break;
            proxy_pass http://$asset_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Portal Frontend (数据消费者独立门户)
        location /portal/ {
            proxy_pass http://$portal_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Portal Frontend assets (静态资源重写)
        location ^~ /portal/assets/ {
            rewrite ^/portal/(.*)$ /$1 break;
            proxy_pass http://$portal_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Graph Frontend (Console iframe 嵌入)
        location /graph/ {
            proxy_pass http://$graph_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Graph Frontend assets (静态资源重写)
        location ^~ /graph/assets/ {
            rewrite ^/graph/(.*)$ /$1 break;
            proxy_pass http://$graph_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Inference Frontend (Console iframe 嵌入)
        location /inference/ {
            proxy_pass http://$inference_frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /inference/assets/ {
            rewrite ^/inference/(.*)$ /$1 break;
            proxy_pass http://$inference_frontend_upstream;
            proxy_set_header Host $host;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
