user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream definitions
    upstream portal {
        server portal:80;
    }

    upstream gateway {
        server gateway:8000;
    }

    upstream system-frontend {
        server system-frontend:80;
    }

    upstream manager-frontend {
        server manager-frontend:80;
    }

    upstream meta-frontend {
        server meta-frontend:80;
    }

    upstream transfer-frontend {
        server transfer-frontend:80;
    }

    upstream orchestrator-frontend {
        server orchestrator-frontend:80;
    }

    upstream develop-frontend {
        server develop-frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Root - Portal (统一入口)
        location / {
            proxy_pass http://portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway (后端 API 路由)
        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # System Frontend (独立访问)
        location /system/ {
            proxy_pass http://system-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # System Frontend assets (静态资源重写)
        location ^~ /system/assets/ {
            rewrite ^/system/(.*)$ /$1 break;
            proxy_pass http://system-frontend;
            proxy_set_header Host $host;
        }

        # Manager Frontend (独立访问)
        location /manager/ {
            proxy_pass http://manager-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Manager Frontend assets (静态资源重写)
        location ^~ /manager/assets/ {
            rewrite ^/manager/(.*)$ /$1 break;
            proxy_pass http://manager-frontend;
            proxy_set_header Host $host;
        }

        # Meta Frontend (独立访问)
        location /meta/ {
            proxy_pass http://meta-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Meta Frontend assets (静态资源重写)
        location ^~ /meta/assets/ {
            rewrite ^/meta/(.*)$ /$1 break;
            proxy_pass http://meta-frontend;
            proxy_set_header Host $host;
        }

        # Transfer Frontend (独立访问)
        location /transfer/ {
            proxy_pass http://transfer-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Transfer Frontend assets (静态资源重写)
        location ^~ /transfer/assets/ {
            rewrite ^/transfer/(.*)$ /$1 break;
            proxy_pass http://transfer-frontend;
            proxy_set_header Host $host;
        }

        # Orchestrator Frontend (独立访问)
        location /orchestrator/ {
            proxy_pass http://orchestrator-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Orchestrator Frontend assets (静态资源重写)
        location ^~ /orchestrator/assets/ {
            rewrite ^/orchestrator/(.*)$ /$1 break;
            proxy_pass http://orchestrator-frontend;
            proxy_set_header Host $host;
        }

        # Develop Frontend (独立访问)
        location /develop/ {
            proxy_pass http://develop-frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Develop Frontend assets (静态资源重写)
        location ^~ /develop/assets/ {
            rewrite ^/develop/(.*)$ /$1 break;
            proxy_pass http://develop-frontend;
            proxy_set_header Host $host;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
