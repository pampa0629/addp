basePath: /api/v1/monitor
host: localhost:8100
info:
  contact: {}
  title: ADDP Monitor API
  version: "1.0"
paths:
  /checkallmodules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 检查所有模块健康状态 | Check all modules health
      tags:
      - Monitor
  /checkmodulehealth:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 检查模块健康状态 | Check module health
      tags:
      - Monitor
  /getexecution:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行记录详情 | Get execution record detail
      tags:
      - Monitor
  /getmodules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取模块列表 | Get module list
      tags:
      - Monitor
  /getstatistics:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取统计数据 | Get statistics
      tags:
      - Monitor
  /gettrenddata:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取趋势数据 | Get trend data
      tags:
      - Monitor
  /listexecutions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询执行记录列表 | List execution records
      tags:
      - Monitor
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
