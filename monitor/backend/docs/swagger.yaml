basePath: /api/v1/monitor
definitions:
  execution.TaskExecution:
    properties:
      bytes_read:
        description: Transfer 读取字节数
        type: integer
      bytes_written:
        description: Transfer 写入字节数
        type: integer
      completed_at:
        type: string
      created_at:
        type: string
      current_step:
        description: 当前步骤（Orchestrator/Workflow）
        type: string
      error_details:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: 错误详情（仅失败时有值）
      execution_config:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: JSONB 字段
      execution_id:
        description: 执行标识
        type: string
      execution_time_ms:
        description: 性能指标
        type: integer
      id:
        type: integer
      metadata:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: 模块特有扩展数据（结果、断点、步骤结果等）
      module:
        description: 模块标识
        type: string
      parent_execution_id:
        description: 父执行（Orchestrator 子步骤追踪父编排）
        type: string
      progress:
        description: 0-100
        type: integer
      records_read:
        description: Transfer 读取记录数
        type: integer
      records_written:
        description: Transfer 写入记录数
        type: integer
      rows_affected:
        description: SQL 影响行数
        type: integer
      source:
        description: 触发来源模块
        type: string
      source_task_id:
        description: 关联原始任务
        type: string
      source_task_name:
        description: 任务名称（冗余，便于查询）
        type: string
      started_at:
        description: 时间戳
        type: string
      status:
        description: 执行状态
        type: string
      task_type:
        description: provider 声明的稳定任务类型
        type: string
      tenant_id:
        type: integer
      trigger_type:
        description: 触发信息
        type: string
      triggered_by:
        description: 触发用户ID
        type: integer
      updated_at:
        type: string
    type: object
  github_com_addp_monitor_internal_service.ExecutionTreeNode:
    properties:
      children:
        items:
          $ref: '#/definitions/github_com_addp_monitor_internal_service.ExecutionTreeNode'
        type: array
      execution:
        $ref: '#/definitions/execution.TaskExecution'
    type: object
  github_com_addp_monitor_internal_service.HealthStatus:
    properties:
      latency:
        description: 毫秒
        type: integer
      message:
        type: string
      module:
        type: string
      status:
        description: '"up", "down", "unknown"'
        type: string
    type: object
  github_com_addp_monitor_internal_service.ProviderCapabilitiesStatus:
    properties:
      message:
        type: string
      schema_version:
        type: string
      status:
        type: string
      task_capabilities:
        items:
          $ref: '#/definitions/github_com_addp_monitor_internal_service.ProviderTaskCapabilityStatus'
        type: array
    type: object
  github_com_addp_monitor_internal_service.ProviderHealthStatus:
    properties:
      base_url:
        type: string
      capabilities:
        $ref: '#/definitions/github_com_addp_monitor_internal_service.ProviderCapabilitiesStatus'
      checked_at:
        type: string
      display_name:
        type: string
      message:
        type: string
      module:
        type: string
      module_health:
        $ref: '#/definitions/github_com_addp_monitor_internal_service.HealthStatus'
      status:
        type: string
      task_discovery:
        items:
          $ref: '#/definitions/github_com_addp_monitor_internal_service.ProviderTaskDiscoveryCheck'
        type: array
    type: object
  github_com_addp_monitor_internal_service.ProviderTaskCapabilityStatus:
    properties:
      deprecated:
        type: boolean
      type:
        type: string
    type: object
  github_com_addp_monitor_internal_service.ProviderTaskDiscoveryCheck:
    properties:
      endpoint:
        type: string
      latency:
        type: integer
      message:
        type: string
      status:
        type: string
      status_code:
        type: integer
      task_type:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      code:
        example: 400
        type: integer
      message:
        example: 请求参数错误
        type: string
    type: object
  models.JSONMap:
    additionalProperties: true
    type: object
  models.TaskProvider:
    properties:
      base_url:
        description: API 配置
        type: string
      capabilities:
        description: 能力描述（JSON 格式，含 task.capabilities/v1、task_capabilities 等）
        type: string
      created_at:
        type: string
      description:
        description: 描述
        type: string
      display_name:
        description: 显示名称
        type: string
      id:
        type: integer
      is_enabled:
        description: 状态
        type: boolean
      module_name:
        description: '''transfer'', ''meta'', ''develop'', ''manager'''
        type: string
      task_cancel_endpoint:
        description: 任务取消端点
        type: string
      task_detail_endpoint:
        description: 任务详情端点
        type: string
      task_execute_endpoint:
        description: 任务执行端点
        type: string
      task_list_endpoint:
        description: 任务列表端点
        type: string
      task_status_endpoint:
        description: 任务状态端点
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8100
info:
  contact: {}
  title: ADDP Monitor API
  version: "1.0"
paths:
  /executions:
    get:
      parameters:
      - description: 模块名 | Module
        in: query
        name: module
        type: string
      - description: 任务类型 | Task type
        in: query
        name: task_type
        type: string
      - description: 任务定义 ID，字符串软引用 | Source task ID as string soft reference
        in: query
        name: source_task_id
        type: string
      - description: 触发来源模块 | Source module
        in: query
        name: source
        type: string
      - description: 执行状态 | Status
        in: query
        name: status
        type: string
      - description: 触发类型 | Trigger type
        in: query
        name: trigger_type
        type: string
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询执行记录列表 | List execution records
      tags:
      - Monitor
  /executions/{id}:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行记录详情 | Get execution record detail
      tags:
      - Monitor
  /executions/{id}/tree:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_monitor_internal_service.ExecutionTreeNode'
      security:
      - BearerAuth: []
      summary: 获取执行记录树 | Get execution tree
      tags:
      - Monitor
  /executions/by-execution-id/{execution_id}:
    get:
      parameters:
      - description: 执行 UUID | Execution UUID
        in: path
        name: execution_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 按 execution_id 获取执行记录详情 | Get execution record detail by execution_id
      tags:
      - Monitor
  /executions/by-execution-id/{execution_id}/tree:
    get:
      parameters:
      - description: 执行 UUID | Execution UUID
        in: path
        name: execution_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_monitor_internal_service.ExecutionTreeNode'
      security:
      - BearerAuth: []
      summary: 按 execution_id 获取执行记录树 | Get execution tree by execution_id
      tags:
      - Monitor
  /executions/stats:
    get:
      parameters:
      - description: 模块名 | Module
        in: query
        name: module
        type: string
      - default: 24h
        description: 统计时长 | Duration
        in: query
        name: duration
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取统计数据 | Get statistics
      tags:
      - Monitor
  /executions/trend:
    get:
      parameters:
      - description: 模块名 | Module
        in: query
        name: module
        type: string
      - default: 7
        description: 天数 | Days
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取趋势数据 | Get trend data
      tags:
      - Monitor
  /modules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取模块列表 | Get module list
      tags:
      - Monitor
  /modules/{module}/health:
    get:
      parameters:
      - description: 模块名 | Module
        in: path
        name: module
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 检查模块健康状态 | Check module health
      tags:
      - Monitor
  /modules/health/all:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 检查所有模块健康状态 | Check all modules health
      tags:
      - Monitor
  /providers/{module}/health:
    get:
      description: 从 System 读取指定 TaskProvider，并探测模块 /health 与标准 GET /tasks?task_type=
        endpoint。| Read a TaskProvider from System and probe module /health plus standard
        GET /tasks?task_type= endpoints.
      parameters:
      - description: 模块名 | Module
        in: path
        name: module
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_monitor_internal_service.ProviderHealthStatus'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 检查单个任务提供者运行态健康状态 | Check task provider health
      tags:
      - Monitor
  /providers/health:
    get:
      description: 从 System 读取启用 TaskProvider，并探测模块 /health 与标准 GET /tasks?task_type=
        endpoint。| Read enabled TaskProviders from System and probe module /health
        plus standard GET /tasks?task_type= endpoints.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_addp_monitor_internal_service.ProviderHealthStatus'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 检查所有任务提供者运行态健康状态 | Check all task provider health
      tags:
      - Monitor
  /task-providers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TaskProvider'
            type: array
      security:
      - BearerAuth: []
      summary: 获取任务提供者列表 | Get task providers
      tags:
      - Monitor
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
