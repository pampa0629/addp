host: localhost:8100
info:
  contact: {}
  title: ADDP Monitor API
  version: "1.0"
paths:
  /alert-rule-targets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 任务列表 | Task list
          schema:
            items:
              $ref: '#/definitions/github_com_addp_monitor_internal_service.AlertRuleTarget'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询可配置告警的任务 | List alert rule targets
      tags:
      - Monitor Alert Rules
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.alert_rule.read
  /alert-rules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 告警规则列表 | Alert rule list
          schema:
            items:
              $ref: '#/definitions/internal_api.AlertRuleResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询告警规则 | List alert rules
      tags:
      - Monitor Alert Rules
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.alert_rule.read
    post:
      consumes:
      - application/json
      parameters:
      - description: 告警规则 | Alert rule
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateAlertRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 已创建规则 | Created rule
          schema:
            $ref: '#/definitions/internal_api.AlertRuleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建告警规则 | Create alert rule
      tags:
      - Monitor Alert Rules
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.alert_rule.create
  /alert-rules/{id}:
    delete:
      parameters:
      - description: 规则 ID | Rule ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.DeleteAlertRuleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除告警规则 | Delete alert rule
      tags:
      - Monitor Alert Rules
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.alert_rule.delete
    patch:
      consumes:
      - application/json
      parameters:
      - description: 规则 ID | Rule ID
        in: path
        name: id
        required: true
        type: integer
      - description: 规则变更 | Rule changes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.UpdateAlertRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已更新规则 | Updated rule
          schema:
            $ref: '#/definitions/internal_api.AlertRuleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新告警规则 | Update alert rule
      tags:
      - Monitor Alert Rules
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.alert_rule.update
  /alerts:
    get:
      parameters:
      - description: 告警状态 | Alert status
        in: query
        name: status
        type: string
      - description: 严重级别 | Severity
        in: query
        name: severity
        type: string
      - description: 模块 | Module
        in: query
        name: module
        type: string
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 告警列表 | Alert list
          schema:
            $ref: '#/definitions/github_com_addp_monitor_internal_service.ListAlertsResponse'
      security:
      - BearerAuth: []
      summary: 查询告警事件 | List alert incidents
      tags:
      - Monitor Alerts
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.alert_incident.read
  /alerts/{id}/acknowledge:
    post:
      parameters:
      - description: 告警 ID | Alert ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 已确认告警 | Acknowledged alert
          schema:
            $ref: '#/definitions/internal_api.AlertIncidentResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 确认告警 | Acknowledge alert
      tags:
      - Monitor Alerts
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.alert_incident.update
  /alerts/{id}/suppress:
    post:
      consumes:
      - application/json
      parameters:
      - description: 告警 ID | Alert ID
        in: path
        name: id
        required: true
        type: integer
      - description: 抑制截止时间 | Suppression deadline
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.SuppressAlertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 已抑制告警 | Suppressed alert
          schema:
            $ref: '#/definitions/internal_api.AlertIncidentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 抑制告警通知 | Suppress alert notifications
      tags:
      - Monitor Alerts
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.alert_incident.update
  /email-deliveries:
    get:
      description: 分页查询当前租户的邮件 outbox 和投递审计记录 | List email outbox and delivery audit
        records for the current tenant
      parameters:
      - description: 邮件目标 ID | Email destination ID
        in: query
        name: destination_id
        type: integer
      - description: 投递状态 | Delivery status
        in: query
        name: status
        type: string
      - description: 生命周期事件类型 | Lifecycle event type
        in: query
        name: event_type
        type: string
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 投递记录 | Delivery records
          schema:
            $ref: '#/definitions/github_com_addp_monitor_internal_service.ListEmailDeliveriesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询邮件投递 | List email deliveries
      tags:
      - Monitor Emails
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.notification_delivery.read
  /email-deliveries/{delivery_id}/retry:
    post:
      description: 只允许重投 dead delivery；复用原 delivery_id、主题和正文，并使用目标当前收件人开启新的尝试周期 |
        Retry only a dead delivery; reuse its delivery_id, subject, and body with
        the destination's current recipients in a new attempt cycle
      parameters:
      - description: 邮件投递 ID | Email delivery ID
        in: path
        name: delivery_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 已重新入队 | Requeued delivery
          schema:
            $ref: '#/definitions/internal_api.EmailDeliveryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 手动重投邮件 delivery | Manually retry email delivery
      tags:
      - Monitor Emails
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - monitor.notification_delivery.retry
  /email-destinations:
