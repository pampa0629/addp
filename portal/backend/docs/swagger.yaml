basePath: /api/v1/portal
host: localhost:8184
info:
  contact: {}
  title: ADDP Portal API
  version: "1.0"
paths:
  /assets:
    get:
      parameters:
      - description: 搜索关键词 | Search keyword
        in: query
        name: keyword
        type: string
      - description: 类型ID | Type ID
        in: query
        name: type_id
        type: integer
      - description: 目录ID | Catalog ID
        in: query
        name: catalog_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产列表 | Get asset list
      tags:
      - Portal
  /assets/{id}:
    get:
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产详情 | Get asset detail
      tags:
      - Portal
  /assets/{id}/apply:
    post:
      consumes:
      - application/json
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      - description: 申请信息 | Application info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 申请使用资产 | Apply for asset access
      tags:
      - Portal
  /assets/{id}/apply-status:
    get:
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产申请状态 | Get asset apply status
      tags:
      - Portal
  /assets/{id}/endpoints:
    get:
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产服务端点 | Get asset service endpoints
      tags:
      - Portal
  /assets/{id}/ratings:
    get:
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产评价列表 | Get asset ratings
      tags:
      - Portal
    post:
      consumes:
      - application/json
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评价信息 | Rating info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 提交资产评价 | Submit asset rating
      tags:
      - Portal
  /catalogs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 获取目录树 | Get catalog tree
      tags:
      - Portal
  /catalogs/{id}/assets:
    get:
      parameters:
      - description: 目录ID | Catalog ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取目录下的资产列表 | Get assets in catalog
      tags:
      - Portal
  /home:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取门户首页数据 | Get portal home data
      tags:
      - Portal
  /my/applications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 获取我的申请列表 | Get my applications
      tags:
      - Portal
  /search:
    get:
      parameters:
      - description: 搜索关键词 | Search keyword
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 搜索资产 | Search assets
      tags:
      - Portal
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
