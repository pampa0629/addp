basePath: /api/v1/portal
host: localhost:8184
info:
  contact: {}
  title: ADDP Portal API
  version: "1.0"
paths:
  /assets:
    get:
      parameters:
      - description: 搜索关键词 | Search keyword
        in: query
        name: keyword
        type: string
      - description: 类型ID | Type ID
        in: query
        name: type_id
        type: integer
      - description: 资产分类 ID | Asset category ID
        in: query
        name: category_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产列表 | Get asset list
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.entry.read
  /assets/{id}:
    get:
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产详情 | Get asset detail
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.entry.read
  /assets/{id}/apply:
    post:
      consumes:
      - application/json
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      - description: 申请信息 | Application info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 申请使用资产 | Apply for asset access
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.application.create
  /assets/{id}/apply-status:
    get:
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产申请状态 | Get asset apply status
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.application.read
      - asset.authorization.read
  /assets/{id}/ratings:
    get:
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产评价列表 | Get asset ratings
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.rating.read
    post:
      consumes:
      - application/json
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评价信息 | Rating info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 提交资产评价 | Submit asset rating
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.rating.create
      - asset.rating.update
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产分类树 | Get asset category tree
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.category.read
  /categories/{id}/assets:
    get:
      parameters:
      - description: 资产分类 ID | Asset category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取分类下的资产列表 | Get assets in category
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.category.read
      - asset.entry.read
  /home:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取门户首页数据 | Get portal home data
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.entry.read
  /my/applications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取我的申请列表 | Get my applications
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.application.read
  /search:
    get:
      parameters:
      - description: 搜索关键词 | Search keyword
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 搜索资产 | Search assets
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.entry.read
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
