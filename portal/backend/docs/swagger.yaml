basePath: /api/v1/portal
definitions:
  client.RatingItem:
    properties:
      asset_id:
        type: integer
      comment:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_handled:
        type: boolean
      score:
        type: number
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  internal_api.portalOwnRatingResponse:
    properties:
      rating:
        $ref: '#/definitions/client.RatingItem'
    type: object
  internal_api.portalRatingsResponse:
    properties:
      avg_score:
        type: number
      my_rating:
        $ref: '#/definitions/client.RatingItem'
      ratings:
        items:
          $ref: '#/definitions/client.RatingItem'
        type: array
      total:
        type: integer
    type: object
host: localhost:8184
info:
  contact: {}
  title: ADDP Portal API
  version: "1.0"
paths:
  /assets:
    get:
      parameters:
      - description: 搜索关键词 | Search keyword
        in: query
        name: keyword
        type: string
      - description: 类型ID | Type ID
        in: query
        name: type_id
        type: integer
      - description: 资产分类 ID | Asset category ID
        in: query
        name: category_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产列表 | Get asset list
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.entry.read
  /assets/{id}:
    get:
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产详情 | Get asset detail
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.entry.read
  /assets/{id}/apply:
    post:
      consumes:
      - application/json
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      - description: 申请信息 | Application info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 申请使用资产 | Apply for asset access
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.application.create
  /assets/{id}/apply-status:
    get:
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产申请状态 | Get asset apply status
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.application.read
      - asset.authorization.read
  /assets/{id}/my-rating:
    get:
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.portalOwnRatingResponse'
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取本人资产评价以修改 | Get own asset rating for editing
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.rating.update
  /assets/{id}/ratings:
    get:
      description: 当前用户评价与全量平均分来自 Asset，不依赖公开列表的当前分页 | Current user's rating and overall
        average come from Asset independently of the public page
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.portalRatingsResponse'
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产评价列表 | Get asset ratings
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.rating.read
    post:
      consumes:
      - application/json
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评价信息 | Rating info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建资产评价 | Create asset rating
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.rating.create
    put:
      consumes:
      - application/json
      parameters:
      - description: 资产ID | Asset ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评价信息 | Rating info
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 修改本人资产评价 | Update own asset rating
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.rating.update
  /categories:
    get:
      description: 仅包含有已上架资产的分支，count 为当前节点整棵子树的已上架资产数 | Contains only branches with
        published assets; count is the published asset total for the entire subtree
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产分类树 | Get asset category tree
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.category.read
  /categories/{id}/assets:
    get:
      parameters:
      - description: 资产目录节点 ID | Asset directory node ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取资产目录子树的资产列表 | Get assets in an asset directory subtree
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.category.read
      - asset.entry.read
  /home:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取门户首页数据 | Get portal home data
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.entry.read
  /my/applications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取我的申请列表 | Get my applications
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.application.read
  /search:
    get:
      parameters:
      - description: 搜索关键词 | Search keyword
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: 资产服务调用失败 | Asset service request failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 搜索资产 | Search assets
      tags:
      - Portal
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - asset.entry.read
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
