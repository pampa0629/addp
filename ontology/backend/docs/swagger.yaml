      description: 固定按 ontology_id 升序，仅接受 page/page_size；重复、未知参数或 OFFSET 超过 2147483647
        时拒绝 | Ordered by ontology_id ascending; only page/page_size are accepted;
        duplicate or unknown parameters and OFFSET above 2147483647 are rejected
      parameters:
      - default: 1
        description: 规范正整数页码 | Canonical positive page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 本体头列表，空页为数组 | Ontology heads; empty pages are arrays
          schema:
            allOf:
            - $ref: '#/definitions/api.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_api.HeadResponse'
                  type: array
              type: object
        "400":
          description: 请求无效 | Invalid request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: 未认证 | Unauthenticated
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: 禁止访问 | Forbidden
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: 操作失败 | Operation failed
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "503":
          description: 服务未就绪 | Module not ready
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 分页浏览本体 | List ontology heads
      tags:
      - Ontology
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - ontology.revision.read
  /ontologies/{ontology_id}:
