# Docker Compose for Develop Module
# 添加到主 docker-compose.yml 或单独部署

services:
  # ==================== Develop Module (SQL 开发) ====================

  develop-backend:
    build:
      context: ./develop/backend
      dockerfile: Dockerfile
    container_name: addp-develop-backend
    environment:
      PORT: 8085
      ENV: production
      SYSTEM_SERVICE_URL: http://system-backend:8080
      ENABLE_SERVICE_INTEGRATION: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: addp
      DB_PASSWORD: addp_password
      DB_NAME: addp
      DB_SCHEMA: develop
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      system-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addp-network
    restart: unless-stopped

  develop-frontend:
    build:
      context: ./develop/frontend
      dockerfile: Dockerfile
    container_name: addp-develop-frontend
    ports:
      - "8094:80"
    depends_on:
      - develop-backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - addp-network
    restart: unless-stopped

networks:
  addp-network:
    external: true
