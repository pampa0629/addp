      last_execution_status:
        type: string
      last_run_at:
        type: string
      name:
        type: string
      next_run_at:
        type: string
      schedule:
        description: Cron 表达式
        type: string
      status:
        description: 状态
        type: string
      tags:
        items:
          type: string
        type: array
      tenant_id:
        type: integer
      timeout:
        description: 超时时间（秒）
        type: integer
      updated_at:
        type: string
      updated_by:
        type: integer
    type: object
  github_com_addp_develop_backend_internal_models.DevTaskContent:
    additionalProperties: true
    type: object
  github_com_addp_develop_backend_internal_models.ExecutionStatistics:
    properties:
      avg_execution_time_ms:
        type: number
      failed_count:
        type: integer
      running_count:
        type: integer
      success_count:
        type: integer
      success_rate:
        type: number
      total_executions:
        type: integer
      total_rows_affected:
        type: integer
    type: object
  github_com_addp_develop_backend_internal_models.ExecutionWithDevItem:
    properties:
      bytes_read:
        description: Transfer 读取字节数
        type: integer
      bytes_written:
        description: Transfer 写入字节数
        type: integer
      completed_at:
        type: string
      created_at:
        type: string
      current_step:
        description: 当前步骤（Orchestrator/Workflow）
        type: string
      dev_item:
        $ref: '#/definitions/github_com_addp_develop_backend_internal_models.DevTask'
      error_details:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: 错误详情（仅失败时有值）
      execution_config:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: JSONB 字段
      execution_id:
        description: 执行标识
        type: string
      execution_time_ms:
        description: 性能指标
        type: integer
      id:
        type: integer
      metadata:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: 模块特有扩展数据（结果、断点、步骤结果等）
      module:
        description: 模块标识
        type: string
      parent_execution_id:
        description: 父执行（Orchestrator 子步骤追踪父编排）
        type: string
      progress:
        description: 0-100
        type: integer
      records_read:
        description: Transfer 读取记录数
        type: integer
      records_written:
        description: Transfer 写入记录数
        type: integer
      rows_affected:
        description: SQL 影响行数
        type: integer
      source_task_id:
        description: 关联原始任务
        type: integer
      source_task_name:
        description: 任务名称（冗余，便于查询）
        type: string
      started_at:
        description: 时间戳
        type: string
      status:
        description: 执行状态
        type: string
      task_type:
        description: '''import''/''export''/''sync''/''query''/''workflow''/''notebook''/''orchestration''/''mvt_generation''/''embedding'''
        type: string
      tenant_id:
        type: integer
      trigger_type:
        description: 触发信息
        type: string
      triggered_by:
        description: 触发用户ID
        type: integer
      updated_at:
        type: string
    type: object
  github_com_addp_develop_backend_internal_models.ListDevTasksResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_addp_develop_backend_internal_models.DevTask'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  github_com_addp_develop_backend_internal_models.ListExecutionsResponse:
    properties:
      executions:
        items:
          $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ExecutionWithDevItem'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  github_com_addp_develop_backend_internal_models.UpdateDevTaskRequest:
    properties:
      content:
        additionalProperties: true
        type: object
      description:
        type: string
      display_name:
        type: string
      execution_config:
        additionalProperties: true
        type: object
      name:
        type: string
      schedule:
        type: string
      status:
        enum:
        - active
        - inactive
        - archived
        type: string
      tags:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  github_com_addp_develop_backend_internal_service.JupyterInstance:
    properties:
      container_id:
        type: string
      container_name:
        type: string
      created_at:
        type: string
      jupyter_port:
        type: integer
      jupyter_url:
