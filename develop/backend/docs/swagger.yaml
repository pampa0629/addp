        type: string
    type: object
  internal_api.GetJupyterURLResponse:
    properties:
      jupyter_url:
        description: Jupyter Lab URL
        type: string
    type: object
  internal_api.ListKernelsResponse:
    properties:
      kernels:
        items:
          $ref: '#/definitions/github_com_addp_develop_backend_internal_service.KernelInfo'
        type: array
    type: object
  internal_api.SaveQueryTaskRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      engine_id:
        type: integer
      is_scheduled:
        description: 是否启用调度
        type: boolean
      name:
        type: string
      query:
        type: string
      query_type:
        description: sql, mql, dsl (从前端传递或自动推断)
        type: string
      schedule:
        description: Cron 表达式
        type: string
      tags:
        items:
          type: string
        type: array
      timeout:
        description: 超时时间（秒）
        type: integer
    required:
    - engine_id
    - name
    - query
    type: object
  models.ConnectionInfo:
    additionalProperties: true
    type: object
  models.Engine:
    properties:
      capabilities:
        description: 能力声明（JSONB）
        type: string
      check_message:
        description: 检测结果消息（错误信息等）
        type: string
      connection_info:
        $ref: '#/definitions/models.ConnectionInfo'
      connection_status:
        description: 连接状态缓存（优化扫描性能）
        type: string
      created_at:
        description: 时间戳字段
        type: string
      created_by:
        type: integer
      description:
        type: string
      engine_category:
        description: 引擎分类：standard（标准引擎）或 extension（扩展引擎）
        type: string
      engine_type:
        description: 引擎类型（postgresql, mysql, python_workflow等）
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_builtin:
        description: 扩展引擎字段
        type: boolean
      last_check_at:
        description: 上次检测时间
        type: string
      name:
        description: 显示名称（原 display_name）
        type: string
      scan_config:
        allOf:
        - $ref: '#/definitions/models.ScanConfig'
        description: 元数据扫描配置（可选）
      tenant_id:
        description: 租户ID，SuperAdmin创建的引擎为null
        type: integer
      updated_at:
        type: string
    type: object
  models.JSONMap:
    additionalProperties: true
    type: object
  models.MVTPreprocessConfig:
    properties:
      concurrency:
        description: 并发生成数 (1-20, 默认 10)
        type: integer
      max_zoom:
        description: 最大缩放级别 (0-18, 默认 18)
        type: integer
      stop_threshold_kb:
        description: 自适应停止阈值：平均瓦片大小（KB）< 该值则停止（默认 50.0）
        type: number
      stop_threshold_sec:
        description: 自适应停止阈值：平均生成时间（秒）< 该值则停止（默认 3.0）
        type: number
    type: object
  models.PreprocessingConfig:
    properties:
      auto_trigger:
        description: 扫描完成后自动触发预处理
        type: boolean
      enabled:
        description: 是否启用预处理
        type: boolean
      mvt_config:
        allOf:
        - $ref: '#/definitions/models.MVTPreprocessConfig'
        description: MVT 瓦片预处理配置
      types:
        description: 预处理类型列表 ["mvt_tiles", "vector_embedding"]
        items:
          type: string
        type: array
    type: object
  models.ScanConfig:
    properties:
      cron_expression:
        description: Cron 表达式（schedule_type=cron 时使用）
        type: string
      enabled:
        description: 是否启用扫描（总开关，兼容旧版）
        type: boolean
      immediate_depth:
        description: 立即扫描深度：basic（基础）或 deep（深度）
        type: string
      immediate_scan:
        description: 注册后立即扫描
        type: boolean
      preprocessing:
        allOf:
        - $ref: '#/definitions/models.PreprocessingConfig'
        description: 预处理配置（可选）
      scan_depth:
        description: 兼容旧版字段：shallow, deep
        type: string
      schedule_time:
        description: 执行时间 HH:mm（daily/weekly/monthly 时使用）
        type: string
      schedule_type:
        description: daily, weekly, monthly, cron（仅当scheduled_scan=true时有效）
        type: string
      schedule_value:
        description: 周几（0-6）或月几（1-31）
        items:
          type: integer
        type: array
      scheduled_scan:
        description: 启用定时扫描（深度固定为 deep）
        type: boolean
    type: object
  plugin.GraphData:
    properties:
      nodes:
        items:
          $ref: '#/definitions/plugin.GraphNode'
        type: array
      relationships:
        items:
          $ref: '#/definitions/plugin.GraphRelationship'
        type: array
    type: object
  plugin.GraphNode:
    properties:
      element_id:
        type: string
      labels:
        items:
          type: string
        type: array
      properties:
        additionalProperties: true
        type: object
    type: object
  plugin.GraphRelationship:
    properties:
      element_id:
        type: string
      end_node_id:
        type: string
      properties:
        additionalProperties: true
        type: object
      start_node_id:
        type: string
      type:
        type: string
    type: object
