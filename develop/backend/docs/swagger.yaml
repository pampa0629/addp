host: localhost:8185
info:
  contact: {}
  title: ADDP Develop API
  version: "1.0"
paths:
  /approvals/{id}:
    get:
      description: 仅原申请用户可读取审批状态和最小请求摘要，不返回完整 workflow payload。| Only the requesting
        user can read the approval status and minimal request summary; the full workflow
        payload is not returned.
      parameters:
      - description: 审批 ID | Approval ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 审批详情 | Approval details
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ToolApprovalResponse'
        "403":
          description: 无权访问审批 | Approval access denied
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ToolApprovalErrorResponse'
        "404":
          description: 审批不存在 | Approval not found
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ToolApprovalErrorResponse'
      summary: 查询 Tool 审批 | Get Tool approval
      tags:
      - Tool Approval
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - develop.task.read
  /approvals/{id}/decision:
    post:
      consumes:
      - application/json
      description: 仅原申请用户使用第一方或 OAuth User Access Token 提交 approved 或 rejected；委托令牌和内部身份不能作出决定。|
        Only the requesting user may submit approved or rejected with a first-party
        or OAuth user access token; delegated tokens and internal identities cannot
        decide.
      parameters:
      - description: 审批 ID | Approval ID
        in: path
        name: id
        required: true
        type: string
      - description: 审批决定 | Approval decision
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ToolApprovalDecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 审批详情 | Approval details
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ToolApprovalResponse'
        "400":
          description: 决定无效 | Invalid decision
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ToolApprovalErrorResponse'
        "403":
          description: 无权决定审批 | Approval decision denied
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ToolApprovalErrorResponse'
        "404":
          description: 审批不存在 | Approval not found
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ToolApprovalErrorResponse'
        "409":
          description: 审批已处理 | Approval already decided
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ToolApprovalErrorResponse'
        "410":
          description: 审批已过期 | Approval expired
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ToolApprovalErrorResponse'
      summary: 决定 Tool 审批 | Decide Tool approval
      tags:
      - Tool Approval
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - develop.task.execute
  /catalog-resources/changes:
    get:
      description: 按不透明游标返回 Query / Workflow DevTask 的最小检索摘要变化，仅供 Catalog 服务消费 | Return
        minimal search-summary changes for Query / Workflow DevTasks by opaque cursor
        for the Catalog service only
      parameters:
      - description: 上次成功提交的不透明游标，空值从历史起点开始 | Opaque cursor committed by the consumer;
          empty starts from the beginning
        in: query
        name: after_cursor
        type: string
      - description: 批大小，默认 200，最大 500 | Batch size, default 200 and maximum 500
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.CatalogResourceChangesResponse'
        "400":
          description: 无效游标或批大小 | Invalid cursor or batch size
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ErrorResponse'
        "401":
          description: 需要认证 | Authentication required
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ErrorResponse'
        "403":
          description: 非 Catalog 服务或权限不足 | Catalog service or permission required
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ErrorResponse'
        "500":
          description: 读取失败 | Read failed
          schema:
            $ref: '#/definitions/github_com_addp_develop_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 拉取 Develop 成果目录变化 | Pull Develop artifact catalog changes
      tags:
      - Catalog Integration
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - develop.catalog.read
  /engines:
    get:
      description: 返回 active 且声明 compute.query 能力的注册引擎；非 online 项由前端展示并禁选 | Return
        active registered engines declaring compute.query capability; clients must
        show but disable non-online options
      produces:
      - application/json
      responses:
        "200":
          description: 引擎运行时描述列表 | Engine runtime descriptor list
          schema:
            items:
              $ref: '#/definitions/models.EngineRuntimeDescriptor'
            type: array
      summary: 获取查询工作台引擎选择项 | List engine options for the query workbench
      tags:
      - Engines
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - develop.task.read
  /engines/{id}/sample-query:
    get:
      parameters:
      - description: 引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: 标准资源定位符，指定后生成该数据项的查询模板 | Standard resource locator; when provided,
          generate a query template for that data item
        in: query
        name: locator
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 需要登录 | Authentication required
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无执行或数据读取权限 | Execution or data-read permission denied
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 授权状态冲突 | Authorization conflict
          schema:
            additionalProperties: true
            type: object
        "422":
          description: 所选数据项为空或当前业务库没有可用真实样例 | The selected data item is empty or
            no real sample data is available
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 授权服务不可用 | Authorization service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取查询模板 | Get query template
      tags:
      - Query
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - develop.task.execute
      - develop.data_read.execute
  /executions:
    get:
      parameters:
      - description: 页码 | Page number
        in: query
        name: page
        type: integer
      - description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      - description: 任务定义 ID 过滤 | Filter by source task ID
        in: query
        name: source_task_id
        type: string
      - description: 'Develop 内部类型过滤：query/workflow/script | Develop internal type
          filter: query/workflow/script'
        in: query
        name: dev_type
        type: string
      - description: 状态过滤 | Filter by status
        in: query
        name: status
        type: string
      - description: 触发类型过滤 | Filter by trigger type
        in: query
        name: trigger_type
        type: string
      - description: 开始日期 YYYY-MM-DD | Start date YYYY-MM-DD
        in: query
        name: start_date
