basePath: /api/v1/develop
definitions:
  github_com_addp_develop_backend_internal_models.CreateDevTaskRequest:
    properties:
      content:
        additionalProperties: true
        type: object
      description:
        type: string
      dev_type:
        enum:
        - query
        - workflow
        - script
        - notebook
        type: string
      display_name:
        type: string
      execution_config:
        additionalProperties: true
        type: object
      name:
        type: string
      schedule:
        type: string
      tags:
        items:
          type: string
        type: array
      timeout:
        type: integer
    required:
    - content
    - dev_type
    - name
    type: object
  github_com_addp_develop_backend_internal_models.CreateExecutionRequest:
    properties:
      content:
        additionalProperties: true
        description: 执行内容（对于临时执行）
        type: object
      dev_item_id:
        type: integer
      dev_type:
        enum:
        - query
        - workflow
        - script
        - notebook
        type: string
      engine_id:
        type: integer
      trigger_type:
        enum:
        - manual
        - schedule
        - orchestrator
        - api
        type: string
    required:
    - dev_type
    - trigger_type
    type: object
  github_com_addp_develop_backend_internal_models.DevTask:
    properties:
      content:
        allOf:
        - $ref: '#/definitions/github_com_addp_develop_backend_internal_models.DevTaskContent'
        description: 内容存储（根据类型解析）
      created_at:
        description: 审计字段
        type: string
      created_by:
        type: integer
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        description: 元数据
        type: string
      dev_type:
        description: '''query'' | ''workflow'' | ''notebook'''
        type: string
      display_name:
        type: string
      enabled:
        description: 调度开关
        type: boolean
      execution_config:
        allOf:
        - $ref: '#/definitions/github_com_addp_develop_backend_internal_models.DevTaskContent'
        description: 执行配置（JSONB 字段，统一的执行配置）
      id:
        type: integer
      last_execution_id:
        description: UUID，软引用 common.task_executions.execution_id
