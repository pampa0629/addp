        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  internal_api.ExecuteNotebookRequest:
    properties:
      input_path:
        type: string
      output_path:
        type: string
      parameters:
        additionalProperties: true
        type: object
      timeout:
        description: 超时时间（秒）
        type: integer
    required:
    - input_path
    - output_path
    type: object
  internal_api.ExecuteNotebookResponse:
    properties:
      error_message:
        type: string
      execution_time_seconds:
        type: number
      message:
        type: string
      output_count:
        type: integer
      output_path:
        type: string
      outputs:
        items:
          additionalProperties: true
          type: object
        type: array
      status:
        type: string
    type: object
  internal_api.ExecuteQueryRequest:
    properties:
      engine_id:
        type: integer
      query:
        type: string
