<!doctype html>
<html lang="zh-CN" class="dark">
<head><meta charset="UTF-8"><title>GraphSchemaView theme fixture</title></head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createApp, h, ref, computed } from 'vue'
    import { createI18n } from 'vue-i18n'
    import ElementPlus from 'element-plus'
    import 'element-plus/dist/index.css'
    import 'element-plus/theme-chalk/dark/css-vars.css'
    import '../../../../common-frontend/basic/src/styles/theme.css'
    import { GraphSchemaView, GraphResultView, graphMessagesZhCn } from '@addp/common-frontend/graph'

    const schema = {
      nodes: [
        { label: 'Person', count: 32, properties: ['name', 'age'] },
        { label: 'Company', count: 4, properties: ['name'] }
      ],
      relationships: [{ type: 'WORKS_AT', count: 12, from_labels: ['Person'], to_labels: ['Company'] }]
    }
    const parameters = new URLSearchParams(location.search)
    const count = Number(parameters.get('count') || 2)
    schema.nodes = Array.from({ length: count }, (_, index) => schema.nodes[index] || {
      label: `Type${index}`, count: index + 1, properties: ['name']
    })
    schema.relationships = schema.nodes.slice(1).map((node, index) => ({
      type: 'WORKS_AT', count: 1, from_labels: [schema.nodes[index].label], to_labels: [node.label]
    }))
    if (parameters.has('self') && schema.nodes.length) schema.relationships.push({
      type: 'SELF_LINK', count: 1, from_labels: [schema.nodes[0].label], to_labels: [schema.nodes[0].label]
    })
    createApp({
      setup() {
        const visible = ref(true)
        const clicked = ref('')
        const theme = ref('dark')
        const currentSchema = ref(parameters.has('empty') ? { nodes: [], relationships: [] } : schema)
        const graphData = computed(() => ({
          nodes: currentSchema.value.nodes.map(node => ({ element_id: node.label, labels: [node.label], properties: { name: node.label } })),
          relationships: currentSchema.value.relationships.map((rel, index) => ({ element_id: `r${index}`, type: rel.type, start_node_id: rel.from_labels[0], end_node_id: rel.to_labels[0] }))
        }))
        return () => [
          h('header', [
            h('select', {
              'aria-label': '主题', value: theme.value,
              onChange: event => {
                theme.value = event.target.value
                document.documentElement.className = theme.value === 'light' ? '' : `dark ${theme.value === 'dark' ? '' : theme.value}`
              }
            }, ['dark', 'blue', 'purple', 'light'].map(theme => h('option', { value: theme }, theme))),
            h('button', { onClick: () => { visible.value = !visible.value } }, '显示或卸载图'),
            h('button', { onClick: () => { currentSchema.value = structuredClone(schema) } }, '加载数据'),
            h('button', { onClick: () => { currentSchema.value = { nodes: [], relationships: [] } } }, '清空数据'),
            h('button', { onClick: () => {
              currentSchema.value = {
                nodes: schema.nodes.map(node => ({ ...node, label: `${node.label}Next` })),
                relationships: schema.relationships.map(rel => ({ ...rel,
                  from_labels: rel.from_labels.map(label => `${label}Next`),
                  to_labels: rel.to_labels.map(label => `${label}Next`)
                }))
              }
            } }, '替换数据'),
            h('output', { 'aria-label': '选中节点' }, clicked.value)
          ]),
          h('main', visible.value ? parameters.get('view') === 'result'
            ? h(GraphResultView, { graphData: graphData.value })
            : h(GraphSchemaView, { schema: currentSchema.value, onNodeClick: label => { clicked.value = label } }) : null)
        ]
      }
    }).use(ElementPlus).use(createI18n({ legacy: false, locale: 'zh-cn', messages: { 'zh-cn': graphMessagesZhCn } })).mount('#app')
  </script>
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { background: var(--addp-bg-primary); color: var(--addp-text-primary); }
    #app { display: flex; flex-direction: column; font-family: var(--el-font-family); }
    header { display: flex; gap: 16px; padding: 12px; }
    main { flex: 1; min-height: 0; }
  </style>
</body>
</html>
