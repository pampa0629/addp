name: Manual line topology capacity

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Line overlap, chain merging, normalization, endpoint snapping or controlled observation
        type: choice
        default: matrix
        options:
          - matrix
          - observation
          - comparison
          - chains
          - normalize
          - normalize-chains
          - endpoint-snapping

      case:
        description: All profile cases or only the original failed composition grid tier
        type: choice
        default: all
        options:
          - all
          - compose-grid-512-normalize-chains

permissions:
  contents: read

jobs:
  topology-capacity:
    name: Line topology capacity (4 CPU, 2 GiB)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Validate capacity registration and deterministic runner
        run: make test-vector-topology-capacity-runner
      - name: Run manual line capacity gate
        env:
          TOPOLOGY_CAPACITY_PROFILE: ${{ inputs.profile }}
          TOPOLOGY_CAPACITY_CASE: ${{ inputs.case }}
        run: make test-vector-topology-capacity
      - name: Upload original capacity observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: line-topology-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/addp-topology-capacity-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
