name: Platform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-consistency:
    name: Platform consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: common/go.mod
          cache: false

      - name: Check changed commits for whitespace errors
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$ADDP_CI_EVENT" == "pull_request" ]]; then
            git diff --check "$ADDP_CI_PR_BASE...$ADDP_CI_HEAD"
          elif [[ "$ADDP_CI_EVENT" == "push" && \
                  -n "$ADDP_CI_BEFORE" && \
                  "$ADDP_CI_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$ADDP_CI_BEFORE...$ADDP_CI_HEAD"
          else
            git show --check --format= "$ADDP_CI_HEAD"
          fi

      - name: Run platform consistency gate
        run: make test-platform

  go-tests:
    name: Go workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: common/go.mod
          cache-dependency-path: |
            **/go.sum

      - name: Run all tracked Go module tests
        run: make test-go

  common-python-tests:
    name: Common Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Common Python gate
        id: selection
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/ci/select-gate-by-paths.sh "Common Python" \
            'common-python/*' \
            'scripts/ci/select-gate-by-paths.sh' \
            'Makefile' \
            '.github/workflows/platform-ci.yml'

      - name: Set up Python
        if: steps.selection.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: common-python/pyproject.toml

      - name: Prepare Common Python test environment
        if: steps.selection.outputs.run == 'true'
        run: |
          python -m venv common-python/.venv
          common-python/.venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          common-python/.venv/bin/python -m pip install --editable './common-python[dev]'

      - name: Run Common Python tests
        if: steps.selection.outputs.run == 'true'
        run: make test-common-python

      - name: Report skipped Common Python gate
        if: steps.selection.outputs.run != 'true'
        run: echo "Common Python gate did not run because no registered path changed."

  agent-offline-evaluation:
    name: Agent offline evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Agent offline evaluation gate
        id: selection
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/ci/select-gate-by-paths.sh "Agent offline evaluation" \
            'agent/*' \
            'common-python/*' \
            'common-frontend/*' \
            'evals/agent-scenarios/*' \
            'scripts/test/agent-evaluation-gate.sh' \
            'scripts/ci/select-gate-by-paths.sh' \
            'Makefile' \
            '.github/workflows/platform-ci.yml'

      - name: Set up Python
        if: steps.selection.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            agent/backend/requirements.txt
            common-python/pyproject.toml

      - name: Set up Node.js
        if: steps.selection.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/frontend/package-lock.json

      - name: Prepare Agent evaluation environments
        if: steps.selection.outputs.run == 'true'
        run: |
          python -m venv common-python/.venv
          common-python/.venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          common-python/.venv/bin/python -m pip install --editable './common-python[dev]'
          python -m venv agent/backend/venv
          agent/backend/venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          (cd agent/backend && venv/bin/python -m pip install --requirement requirements.txt)
          agent/backend/venv/bin/python -m pip install --editable './common-python[dev,inference-langchain]'
          npm ci --prefix agent/frontend

      - name: Run Agent offline evaluation
        if: steps.selection.outputs.run == 'true'
        run: make test-agent-eval

      - name: Report skipped Agent offline evaluation gate
        if: steps.selection.outputs.run != 'true'
        run: echo "Agent offline evaluation gate did not run because no registered path changed."

  model-frontend:
    name: Model frontend (unit, E2E, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Model frontend gate
        id: selection
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/ci/select-gate-by-paths.sh "Model frontend" \
            'model/frontend/*' \
            'common-frontend/*' \
            'scripts/ci/select-gate-by-paths.sh' \
            'Makefile' \
            '.github/workflows/platform-ci.yml'

      - name: Set up Node.js
        if: steps.selection.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: model/frontend/package-lock.json

      - name: Install Model frontend dependencies
        if: steps.selection.outputs.run == 'true'
        working-directory: model/frontend
        run: npm ci

      - name: Install Chromium for Playwright
        if: steps.selection.outputs.run == 'true'
        working-directory: model/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Model frontend gate
        if: steps.selection.outputs.run == 'true'
        run: make test-model-frontend

      - name: Report skipped Model frontend gate
        if: steps.selection.outputs.run != 'true'
        run: echo "Model frontend gate did not run because no registered path changed."
