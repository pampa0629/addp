name: Platform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-consistency:
    name: Platform consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: common/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Check changed commits for whitespace errors
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$ADDP_CI_EVENT" == "pull_request" ]]; then
            git diff --check "$ADDP_CI_PR_BASE...$ADDP_CI_HEAD"
          elif [[ "$ADDP_CI_EVENT" == "push" && \
                  -n "$ADDP_CI_BEFORE" && \
                  "$ADDP_CI_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$ADDP_CI_BEFORE...$ADDP_CI_HEAD"
          else
            git show --check --format= "$ADDP_CI_HEAD"
          fi

      - name: Run platform consistency gate
        run: make test-platform

      - name: Summarize platform consistency gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Platform consistency
          status: ${{ job.status }}

  go-tests:
    name: Go workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: common/go.mod
          cache-dependency-path: |
            **/go.sum

      - name: Run all tracked Go module tests
        env:
          ADDP_CI_SUMMARY_FILE: ${{ runner.temp }}/go-workspace-summary.md
        run: make test-go

      - name: Summarize Go workspace gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Go workspace tests
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/go-workspace-summary.md

  product-build:
    name: Product binary build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: common/go.mod
          cache-dependency-path: |
            **/go.sum

      - name: Reuse setup-go cache paths
        run: |
          echo "ADDP_BUILD_GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
          echo "ADDP_BUILD_GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
          echo "ADDP_BUILD_GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      - name: Compile all product binaries
        run: make build BUILD_ARGS=--force

      - name: Select baseline and affected product images
        id: image-selection
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: echo "services=$(make --no-print-directory select-image-services)" >> "$GITHUB_OUTPUT"

      - name: Start disposable image registry
        run: make registry-start

      - name: Verify baseline and affected product images
        env:
          IMAGE_SERVICES: ${{ steps.image-selection.outputs.services }}
          ADDP_CI_SUMMARY_FILE: ${{ runner.temp }}/product-images-summary.md
        run: make build-images IMAGE_BUILD_ARGS="--verify --services $IMAGE_SERVICES"

      - name: Summarize product build gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Product binary build
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/product-images-summary.md

  common-python-tests:
    name: Common Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Common Python gate
        id: selection
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module common-python

      - name: Prepare Common Python test environment
        if: steps.selection.outputs.run == 'true'
        uses: ./.github/actions/prepare-python-gate
        with:
          venv-path: common-python/.venv
          cache-dependency-path: common-python/pyproject.toml
          editable-install: ./common-python[dev]

      - name: Run Common Python tests
        if: steps.selection.outputs.run == 'true'
        run: make test-common-python

      - name: Report skipped Common Python gate
        if: steps.selection.outputs.run != 'true'
        run: echo "Common Python gate did not run because no registered path changed."

      - name: Summarize Common Python gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Common Python tests
          selected: ${{ steps.selection.outputs.run }}
          status: ${{ job.status }}

  document-workflow-tests:
    name: Document Workflow tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Document Workflow test environment
        uses: ./.github/actions/prepare-python-gate
        with:
          venv-path: engines/document-workflow/.venv
          cache-dependency-path: |
            engines/document-workflow/requirements-dev.txt
            engines/document-workflow/requirements.txt
            common-python/pyproject.toml
          requirements-file: engines/document-workflow/requirements-dev.txt
          editable-install: ./common-python

      - name: Run Document Workflow tests
        run: make test-document-workflow

      - name: Summarize Document Workflow gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Document Workflow tests
          status: ${{ job.status }}

  agent-offline-evaluation:
    name: Agent offline evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Agent offline evaluation gate
        id: selection
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module agent

      - name: Prepare Agent evaluation environment
        if: steps.selection.outputs.run == 'true'
        uses: ./.github/actions/prepare-python-gate
        with:
          venv-path: agent/backend/venv
          cache-dependency-path: |
            agent/backend/requirements.txt
            common-python/pyproject.toml
          requirements-file: agent/backend/requirements.txt

      - name: Run Agent offline evaluation
        if: steps.selection.outputs.run == 'true'
        run: make test-agent-eval

      - name: Report skipped Agent offline evaluation gate
        if: steps.selection.outputs.run != 'true'
        run: echo "Agent offline evaluation gate did not run because no registered path changed."

      - name: Summarize Agent offline evaluation gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Agent offline evaluation
          selected: ${{ steps.selection.outputs.run }}
          status: ${{ job.status }}

  copilot-tests:
    name: Copilot backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Copilot backend gate
        id: selection
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module copilot

      - name: Prepare Copilot test environment
        if: steps.selection.outputs.run == 'true'
        uses: ./.github/actions/prepare-python-gate
        with:
          venv-path: copilot/backend/venv
          cache-dependency-path: |
            copilot/backend/requirements.txt
            common-python/pyproject.toml
          requirements-file: copilot/backend/requirements.txt
          editable-install: ./common-python[dev,inference-langchain]

      - name: Run Copilot backend tests
        if: steps.selection.outputs.run == 'true'
        run: make test-copilot

      - name: Report skipped Copilot backend gate
        if: steps.selection.outputs.run != 'true'
        run: echo "Copilot backend gate did not run because no registered path changed."

      - name: Summarize Copilot backend gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Copilot backend tests
          selected: ${{ steps.selection.outputs.run }}
          status: ${{ job.status }}

  model-frontend:
    name: Model frontend (unit, E2E, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Model frontend gate
        id: selection
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module model

      - name: Prepare Model frontend environment
        if: steps.selection.outputs.run == 'true'
        uses: ./.github/actions/prepare-frontend-gate
        with:
          frontend-directory: model/frontend

      - name: Install Chromium for Playwright
        if: steps.selection.outputs.run == 'true'
        working-directory: model/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Model frontend gate
        if: steps.selection.outputs.run == 'true'
        run: make test-model-frontend

      - name: Report skipped Model frontend gate
        if: steps.selection.outputs.run != 'true'
        run: echo "Model frontend gate did not run because no registered path changed."

      - name: Summarize Model frontend gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Model frontend
          selected: ${{ steps.selection.outputs.run }}
          status: ${{ job.status }}

  frontend-deterministic:
    name: ${{ matrix.name }} frontend (test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: agent
            name: Agent
            target: test-agent-frontend
          - module: asset
            name: Asset
            target: test-asset-frontend
          - module: catalog
            name: Catalog
            target: test-catalog-frontend
          - module: console
            name: Console
            target: test-console-frontend
          - module: develop
            name: Develop
            target: test-develop-frontend
            playwright: true
          - module: graph
            name: Graph
            target: test-graph-frontend
          - module: inference
            name: Inference
            target: test-inference-frontend
          - module: manager
            name: Manager
            target: test-manager-frontend
            playwright: true
          - module: meta
            name: Meta
            target: test-meta-frontend
          - module: monitor
            name: Monitor
            target: test-monitor-frontend
          - module: orchestrator
            name: Orchestrator
            target: test-orchestrator-frontend
          - module: portal
            name: Portal
            target: test-portal-frontend
          - module: service
            name: Service
            target: test-service-frontend
          - module: standard
            name: Standard
            target: test-standard-frontend
          - module: security
            name: Security
            target: test-security-frontend
          - module: system
            name: System
            target: test-system-frontend
          - module: transfer
            name: Transfer
            target: test-transfer-frontend
          - module: workbench
            name: Workbench
            target: test-workbench-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select ${{ matrix.name }} frontend gate
        id: selection
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module '${{ matrix.module }}'

      - name: Prepare ${{ matrix.name }} frontend environment
        if: steps.selection.outputs.run == 'true'
        uses: ./.github/actions/prepare-frontend-gate
        with:
          frontend-directory: ${{ matrix.module }}/frontend

      - name: Install Chromium for ${{ matrix.name }} Playwright tests
        if: steps.selection.outputs.run == 'true' && matrix.playwright == true
        working-directory: ${{ matrix.module }}/frontend
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }} frontend gate
        if: steps.selection.outputs.run == 'true'
        run: make ${{ matrix.target }}

      - name: Report skipped ${{ matrix.name }} frontend gate
        if: steps.selection.outputs.run != 'true'
        run: echo "${{ matrix.name }} frontend gate did not run because no registered path changed."

      - name: Summarize ${{ matrix.name }} frontend gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: ${{ matrix.name }} frontend
          selected: ${{ steps.selection.outputs.run }}
          status: ${{ job.status }}
