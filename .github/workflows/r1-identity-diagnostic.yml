name: R1 isolated identity diagnosis
on: workflow_dispatch
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false
      - name: Diagnose only the first identity preparation
        run: python3 scripts/test/r1-identity-diagnostic/probe.py
      - name: Retain only the sanitized stage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: r1-first-identity
          path: ${{ runner.temp }}/r1-identity-report.json
          if-no-files-found: error
          retention-days: 14
