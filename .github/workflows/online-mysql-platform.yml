name: Online MySQL platform

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Isolated release scenario
        type: choice
        default: gateway
        options: [gateway, service-lineage, manager, develop-file, quality-worker, all-modules]

permissions:
  contents: read

jobs:
  mysql-platform:
    name: Online MySQL limited release (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Install NFS fixture dependencies
        if: inputs.suite == 'develop-file'
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server nfs-common

      - name: Run Hosted MySQL limited release
        env:
          ADDP_MYSQL_ONLINE_SUITE: ${{ inputs.suite }}
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-mysql-platform-evidence
        run: bash scripts/test/compose-mysql-platform-online.sh

      - name: Upload Hosted MySQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-mysql-platform-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/addp-mysql-platform-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize Hosted MySQL platform gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online MySQL limited release
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-mysql-platform-evidence/summary.txt
