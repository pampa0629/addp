name: IAM and CLI release gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iam-cli-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-product-macos:
    name: CLI product gate (macOS Keychain)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Run installed-wheel product gate
        env:
          ADDP_CLI_RELEASE_DIST: ${{ runner.temp }}/addp-cli-dist
        run: make test-common-python-cli-release

      - name: Upload verified wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: addp-cli-wheel
          path: ${{ runner.temp }}/addp-cli-dist/
          if-no-files-found: error
          retention-days: 14

  system-iam-postgres:
    name: System IAM gate (PostgreSQL 15)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_iam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_iam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit release workflow
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          inputs: .github/workflows/iam-cli-release-gates.yml
          advanced-security: false
          annotations: true
          min-severity: medium
          online-audits: false
          persona: auditor
          version: 1.28.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Run System IAM PostgreSQL gate
        env:
          ADDP_SYSTEM_POSTGRES_TEST_DSN: postgres://addp_ci:addp_ci_password@127.0.0.1:5432/addp_iam_test?sslmode=disable
        run: make test-system-iam-postgres

  release-cli:
    name: Publish ADDP CLI GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - cli-product-macos
      - system-iam-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: addp-cli-wheel
          path: ${{ runner.temp }}/addp-cli-release

      - name: Verify release assets
        env:
          ADDP_RELEASE_DIR: ${{ runner.temp }}/addp-cli-release
          ADDP_RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ADDP_RELEASE_DIR"
          shopt -s nullglob
          wheels=(addp_common-*.whl)
          checksums=(addp_common-*.whl.sha256)
          if [[ ${#wheels[@]} -ne 1 || ${#checksums[@]} -ne 1 ]]; then
            echo "expected exactly one addp-common wheel and one checksum" >&2
            exit 1
          fi
          sha256sum --check "${checksums[0]}"
          python3 - <<'PY'
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          release_dir = Path(os.environ["ADDP_RELEASE_DIR"])
          tag = os.environ["ADDP_RELEASE_TAG"]
          wheels = list(release_dir.glob("addp_common-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one addp-common wheel")
          if not tag.startswith("v") or len(tag) == 1:
              raise SystemExit(f"release tag must use v<version>: {tag!r}")

          with ZipFile(wheels[0]) as archive:
              metadata_files = [
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_files) != 1:
                  raise SystemExit("wheel must contain exactly one METADATA file")
              metadata = BytesParser().parsebytes(archive.read(metadata_files[0]))

          if metadata["Name"] != "addp-common":
              raise SystemExit(f"unexpected package name: {metadata['Name']!r}")
          expected_version = tag[1:]
          if metadata["Version"] != expected_version:
              raise SystemExit(
                  f"wheel version {metadata['Version']!r} does not match tag {tag!r}"
              )
          PY

      - name: Attest release wheel
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "${{ runner.temp }}/addp-cli-release/addp_common-*.whl"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ADDP_RELEASE_DIR: ${{ runner.temp }}/addp-cli-release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ADDP_RELEASE_DIR"/addp_common-*.whl \
            "$ADDP_RELEASE_DIR"/addp_common-*.whl.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "ADDP CLI $GITHUB_REF_NAME"
