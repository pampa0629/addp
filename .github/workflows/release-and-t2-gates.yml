name: Release and T2 gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-and-t2-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Release and T2 gate selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      asset: ${{ steps.asset.outputs.run }}
      catalog: ${{ steps.catalog.outputs.run }}
      cli: ${{ steps.cli.outputs.run }}
      common: ${{ steps.common.outputs.run }}
      develop: ${{ steps.develop.outputs.run }}
      manager: ${{ steps.manager.outputs.run }}
      meta: ${{ steps.meta.outputs.run }}
      model: ${{ steps.model.outputs.run }}
      quality: ${{ steps.quality.outputs.run }}
      security: ${{ steps.security.outputs.run }}
      service: ${{ steps.service.outputs.run }}
      standard: ${{ steps.standard.outputs.run }}
      system: ${{ steps.system.outputs.run }}
      transfer: ${{ steps.transfer.outputs.run }}
      workbench: ${{ steps.workbench.outputs.run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select CLI product gate
        id: cli
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_FORCE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/ci/select-gate-by-paths.sh "CLI product" \
            'common-python/*' \
            'scripts/test/common-python-cli-release-gate.sh' \
            'scripts/test/release-gate.py' \
            'scripts/ci/check-release-ci-registration.py' \
            'scripts/ci/select-gate-by-paths.sh' \
            'scripts/ci/report-selected-gate.sh' \
            '.github/actions/ci-gate-summary/*' \
            'Makefile' \
            '.github/workflows/release-and-t2-gates.yml'

      - name: Select Quality PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: quality
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module quality

      - name: Select Common PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: common
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module common

      - name: Select Manager MongoDB Security gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: manager
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module manager

      - name: Select Security PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: security
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module security

      - name: Select Asset PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: asset
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module asset

      - name: Select Service PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: service
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module service

      - name: Select Meta PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: meta
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module meta

      - name: Select Catalog PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: catalog
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module catalog

      - name: Select Develop PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: develop
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module develop

      - name: Select Workbench PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: workbench
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module workbench

      - name: Select Model PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: model
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module model

      - name: Select System IAM PostgreSQL gate
        id: system
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_FORCE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module system

      - name: Select Standard PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: standard
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module standard

      - name: Select Transfer PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: transfer
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module transfer

  cli-product-macos-verification:
    name: CLI product verification (macOS Keychain)
    needs: selection
    if: needs.selection.outputs.cli == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Run installed-wheel product gate
        env:
          ADDP_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/addp-cli-release-gate
        run: make test-release RELEASE_SUITE=common-python-cli

      - name: Upload verified wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: addp-cli-wheel
          path: ${{ runner.temp }}/addp-cli-release-gate/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize CLI product verification
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: CLI product verification (macOS Keychain)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-cli-release-gate/release-summary.md

  system-iam-postgres-verification:
    name: System IAM verification (PostgreSQL 15)
    needs: selection
    if: needs.selection.outputs.system == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_iam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_iam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit release workflow
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          inputs: .github/workflows/release-and-t2-gates.yml
          advanced-security: false
          annotations: true
          min-severity: medium
          online-audits: false
          persona: auditor
          version: 1.28.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Run System IAM PostgreSQL gate
        env:
          ADDP_SYSTEM_POSTGRES_TEST_DSN: postgres://addp_ci:addp_ci_password@127.0.0.1:5432/addp_iam_test?sslmode=disable
        run: make test-system-iam-postgres

      - name: Summarize System IAM PostgreSQL verification
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: System IAM verification (PostgreSQL 15)
          status: ${{ job.status }}

  meta-postgres:
    name: Meta integration (PostgreSQL 15)
    needs: selection
    if: needs.selection.outputs.meta == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_meta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_meta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: meta/backend/go.mod
          cache: false

      - name: Run Meta PostgreSQL gate
        env:
          META_POSTGRES_TEST_DSN: postgres://addp_ci:addp_ci_password@127.0.0.1:5432/addp_meta_test?sslmode=disable
        run: make test-meta-postgres

      - name: Summarize Meta PostgreSQL gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Meta integration (PostgreSQL 15)
          status: ${{ job.status }}

  catalog-postgres:
    name: Catalog integration (PostgreSQL 15)
    needs: selection
    if: needs.selection.outputs.catalog == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: catalog/backend/go.mod
          cache: false

      - name: Run Catalog PostgreSQL gate
        env:
          CATALOG_POSTGRES_TEST_DSN: postgres://addp_ci:addp_ci_password@127.0.0.1:5432/addp_catalog_test?sslmode=disable
        run: make test-catalog-postgres

      - name: Summarize Catalog PostgreSQL gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Catalog integration (PostgreSQL 15)
          status: ${{ job.status }}

  asset-postgres:
    name: Asset integration (PostgreSQL 15)
    needs: selection
    if: needs.selection.outputs.asset == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_asset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_asset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: asset/backend/go.mod
          cache: false

      - name: Run Asset PostgreSQL gate
        env:
          ASSET_POSTGRES_TEST_DSN: postgres://addp_ci:addp_ci_password@127.0.0.1:5432/addp_asset_test?sslmode=disable
        run: make test-asset-postgres

      - name: Summarize Asset PostgreSQL gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Asset integration (PostgreSQL 15)
          status: ${{ job.status }}

  workbench-postgres:
    name: Workbench integration (PostgreSQL 15)
    needs: selection
    if: needs.selection.outputs.workbench == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_workbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_workbench_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: workbench/backend/go.mod
          cache: false

      - name: Run Workbench PostgreSQL gate
        env:
          WORKBENCH_POSTGRES_TEST_DSN: postgres://addp_ci:addp_ci_password@127.0.0.1:5432/addp_workbench_test?sslmode=disable
        run: make test-workbench-postgres

      - name: Summarize Workbench PostgreSQL gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Workbench integration (PostgreSQL 15)
          status: ${{ job.status }}

  common-postgres:
    name: Common Engine Provider integration (PostgreSQL 15)
    needs: selection
    if: needs.selection.outputs.common == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_common_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_common_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: common/go.mod
          cache: false

      - name: Run Common PostgreSQL gate
        env:
          ADDP_TEST_POSTGRES_HOST: 127.0.0.1
          ADDP_TEST_POSTGRES_PORT: 5432
          ADDP_TEST_POSTGRES_USER: addp_ci
          ADDP_TEST_POSTGRES_PASSWORD: addp_ci_password
          ADDP_TEST_POSTGRES_DATABASE: addp_common_test
          ADDP_TEST_POSTGRES_SSLMODE: disable
        run: make test-common-postgres

      - name: Summarize Common PostgreSQL gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Common Engine Provider integration (PostgreSQL 15)
          status: ${{ job.status }}

  common-mysql-data-protection:
    name: Common and Owner data protection contracts (MySQL 8)
    needs: selection
    if: needs.selection.outputs.common == 'true' || needs.selection.outputs.manager == 'true' || needs.selection.outputs.develop == 'true' || needs.selection.outputs.service == 'true' || needs.selection.outputs.transfer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: addp_ci_password
          MYSQL_DATABASE: addp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -paddp_ci_password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: common/go.mod
          cache: false

      - name: Run MySQL data protection gate
        env:
          ADDP_TEST_MYSQL_HOST: 127.0.0.1
          ADDP_TEST_MYSQL_PORT: 3306
          ADDP_TEST_MYSQL_USER: root
          ADDP_TEST_MYSQL_PASSWORD: addp_ci_password
        run: make test-common-mysql-data-protection

      - name: Summarize MySQL data protection gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Common and Owner data protection contracts (MySQL 8)
          status: ${{ job.status }}

  manager-mongodb-security:
    name: Manager and Transfer data protection integration (MongoDB 7)
    needs: selection
    if: needs.selection.outputs.common == 'true' || needs.selection.outputs.manager == 'true' || needs.selection.outputs.transfer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7.0@sha256:32b5cbf6e1075ad0f5eb2b880ee61e985d5135519a7a34a7d81712af37f27913
        env:
          MONGO_INITDB_ROOT_USERNAME: addp_ci
          MONGO_INITDB_ROOT_PASSWORD: addp_ci_password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username addp_ci --password addp_ci_password --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: manager/backend/go.mod
          cache: false

      - name: Run Manager and Transfer MongoDB Security gate
        env:
          ADDP_TEST_MONGODB_HOST: 127.0.0.1
          ADDP_TEST_MONGODB_PORT: 27017
          ADDP_TEST_MONGODB_USER: addp_ci
          ADDP_TEST_MONGODB_PASSWORD: addp_ci_password
          ADDP_TEST_MONGODB_AUTH_SOURCE: admin
        run: make test-manager-mongodb-security

      - name: Summarize Manager MongoDB Security gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Manager and Transfer data protection integration (MongoDB 7)
          status: ${{ job.status }}

  quality-postgres:
    name: Quality integration (PostgreSQL 15)
    needs: selection
    if: needs.selection.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_quality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_quality_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
