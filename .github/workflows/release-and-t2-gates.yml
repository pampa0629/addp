    name: CLI release eligibility
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag ancestry and Platform CI result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci/check-release-eligibility.py
          --repository .
          --tag "$GITHUB_REF_NAME"
          --sha "$GITHUB_SHA"
          --github-repository "$GITHUB_REPOSITORY"

  release-cli:
    name: Publish ADDP CLI GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - selection
      - cli-product-macos-verification
      - cli-release-eligibility
      - system-iam-postgres-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: addp-cli-wheel
          path: ${{ runner.temp }}/addp-cli-release

      - name: Verify release assets
        env:
          ADDP_RELEASE_DIR: ${{ runner.temp }}/addp-cli-release
          ADDP_RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ADDP_RELEASE_DIR"
          shopt -s nullglob
          wheels=(addp_common-*.whl)
          checksums=(addp_common-*.whl.sha256)
          if [[ ${#wheels[@]} -ne 1 || ${#checksums[@]} -ne 1 ]]; then
            echo "expected exactly one addp-common wheel and one checksum" >&2
            exit 1
          fi
          sha256sum --check "${checksums[0]}"
          python3 - <<'PY'
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          release_dir = Path(os.environ["ADDP_RELEASE_DIR"])
          tag = os.environ["ADDP_RELEASE_TAG"]
          wheels = list(release_dir.glob("addp_common-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one addp-common wheel")
          if not tag.startswith("v") or len(tag) == 1:
              raise SystemExit(f"release tag must use v<version>: {tag!r}")

          with ZipFile(wheels[0]) as archive:
              metadata_files = [
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_files) != 1:
                  raise SystemExit("wheel must contain exactly one METADATA file")
              metadata = BytesParser().parsebytes(archive.read(metadata_files[0]))

          if metadata["Name"] != "addp-common":
              raise SystemExit(f"unexpected package name: {metadata['Name']!r}")
          expected_version = tag[1:]
          if metadata["Version"] != expected_version:
              raise SystemExit(
                  f"wheel version {metadata['Version']!r} does not match tag {tag!r}"
              )
          PY

      - name: Attest release wheel
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "${{ runner.temp }}/addp-cli-release/addp_common-*.whl"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ADDP_RELEASE_DIR: ${{ runner.temp }}/addp-cli-release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ADDP_RELEASE_DIR"/addp_common-*.whl \
            "$ADDP_RELEASE_DIR"/addp_common-*.whl.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "ADDP CLI $GITHUB_REF_NAME"
