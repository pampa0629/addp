name: Release and T2 gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-and-t2-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Release and T2 gate selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.cli.outputs.run }}
      quality: ${{ steps.quality.outputs.run }}
      standard: ${{ steps.standard.outputs.run }}
      system: ${{ steps.system.outputs.run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select CLI product gate
        id: cli
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_FORCE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/ci/select-gate-by-paths.sh "CLI product" \
            'common-python/*' \
            'scripts/test/common-python-cli-release-gate.sh' \
            'scripts/ci/select-gate-by-paths.sh' \
            'scripts/ci/report-selected-gate.sh' \
            '.github/actions/ci-gate-summary/*' \
            'Makefile' \
            '.github/workflows/release-and-t2-gates.yml'

      - name: Select Quality PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: quality
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/ci/select-gate-by-paths.sh "Quality PostgreSQL" \
            'quality/backend/*' \
            'common/*' \
            'scripts/test/quality-postgres-gate.sh' \
            'scripts/ci/select-gate-by-paths.sh' \
            '.github/actions/ci-gate-summary/*' \
            'Makefile' \
            '.github/workflows/release-and-t2-gates.yml'

      - name: Select System IAM PostgreSQL gate
        id: system
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_FORCE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/ci/select-gate-by-paths.sh "System IAM PostgreSQL" \
            'system/backend/*' \
            'common/*' \
            'scripts/test/system-iam-postgres-gate.sh' \
            'scripts/ci/select-gate-by-paths.sh' \
            'scripts/ci/report-selected-gate.sh' \
            '.github/actions/ci-gate-summary/*' \
            'Makefile' \
            '.github/workflows/release-and-t2-gates.yml'

      - name: Select Standard PostgreSQL gate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: standard
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/ci/select-gate-by-paths.sh "Standard PostgreSQL" \
            'standard/backend/*' \
            'common/*' \
            'scripts/test/standard-postgres-gate.sh' \
            'scripts/ci/select-gate-by-paths.sh' \
            '.github/actions/ci-gate-summary/*' \
            'Makefile' \
            '.github/workflows/release-and-t2-gates.yml'

  cli-product-macos-verification:
    name: CLI product verification (macOS Keychain)
    needs: selection
    if: needs.selection.outputs.cli == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Run installed-wheel product gate
        env:
          ADDP_CLI_RELEASE_DIST: ${{ runner.temp }}/addp-cli-dist
        run: make test-common-python-cli-release

      - name: Upload verified wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: addp-cli-wheel
          path: ${{ runner.temp }}/addp-cli-dist/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize CLI product verification
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: CLI product verification (macOS Keychain)
          status: ${{ job.status }}

  system-iam-postgres-verification:
    name: System IAM verification (PostgreSQL 15)
    needs: selection
    if: needs.selection.outputs.system == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_iam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_iam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit release workflow
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          inputs: .github/workflows/release-and-t2-gates.yml
          advanced-security: false
          annotations: true
          min-severity: medium
          online-audits: false
          persona: auditor
          version: 1.28.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Run System IAM PostgreSQL gate
        env:
          ADDP_SYSTEM_POSTGRES_TEST_DSN: postgres://addp_ci:addp_ci_password@127.0.0.1:5432/addp_iam_test?sslmode=disable
        run: make test-system-iam-postgres

      - name: Summarize System IAM PostgreSQL verification
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: System IAM verification (PostgreSQL 15)
          status: ${{ job.status }}

  quality-postgres:
    name: Quality integration (PostgreSQL 15)
    needs: selection
    if: needs.selection.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_quality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_quality_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: quality/backend/go.mod
          cache: false

      - name: Run Quality PostgreSQL gate
        env:
          ADDP_TEST_POSTGRES_HOST: 127.0.0.1
          ADDP_TEST_POSTGRES_PORT: 5432
          ADDP_TEST_POSTGRES_USER: addp_ci
          ADDP_TEST_POSTGRES_PASSWORD: addp_ci_password
          ADDP_TEST_POSTGRES_DATABASE: addp_quality_test
          ADDP_TEST_POSTGRES_SSLMODE: disable
        run: make test-quality-postgres

      - name: Summarize Quality PostgreSQL gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Quality integration (PostgreSQL 15)
          status: ${{ job.status }}

  standard-postgres:
    name: Standard integration (PostgreSQL 15)
    needs: selection
    if: needs.selection.outputs.standard == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
        env:
          POSTGRES_USER: addp_ci
          POSTGRES_PASSWORD: addp_ci_password
          POSTGRES_DB: addp_standard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U addp_ci -d addp_standard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: standard/backend/go.mod
          cache: false

      - name: Run Standard PostgreSQL gate
        env:
          STANDARD_POSTGRES_TEST_DSN: postgres://addp_ci:addp_ci_password@127.0.0.1:5432/addp_standard_test?sslmode=disable
        run: make test-standard-postgres

      - name: Summarize Standard PostgreSQL gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Standard integration (PostgreSQL 15)
          status: ${{ job.status }}

  cli-product-macos:
    name: CLI product gate (macOS Keychain)
    needs:
      - selection
      - cli-product-macos-verification
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Report CLI product gate
        env:
          ADDP_CI_SELECTED: ${{ needs.selection.outputs.cli }}
          ADDP_CI_SELECTION_RESULT: ${{ needs.selection.result }}
          ADDP_CI_VERIFICATION_RESULT: ${{ needs.cli-product-macos-verification.result }}
        run: |
          bash scripts/ci/report-selected-gate.sh \
            "CLI product" \
            "$ADDP_CI_SELECTED" \
            "$ADDP_CI_SELECTION_RESULT" \
            "$ADDP_CI_VERIFICATION_RESULT"

  system-iam-postgres:
    name: System IAM gate (PostgreSQL 15)
    needs:
      - selection
      - system-iam-postgres-verification
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Report System IAM PostgreSQL gate
        env:
          ADDP_CI_SELECTED: ${{ needs.selection.outputs.system }}
          ADDP_CI_SELECTION_RESULT: ${{ needs.selection.result }}
          ADDP_CI_VERIFICATION_RESULT: ${{ needs.system-iam-postgres-verification.result }}
        run: |
          bash scripts/ci/report-selected-gate.sh \
            "System IAM PostgreSQL" \
            "$ADDP_CI_SELECTED" \
            "$ADDP_CI_SELECTION_RESULT" \
            "$ADDP_CI_VERIFICATION_RESULT"

  release-cli:
    name: Publish ADDP CLI GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - selection
      - cli-product-macos-verification
      - system-iam-postgres-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: addp-cli-wheel
          path: ${{ runner.temp }}/addp-cli-release

      - name: Verify release assets
        env:
          ADDP_RELEASE_DIR: ${{ runner.temp }}/addp-cli-release
          ADDP_RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ADDP_RELEASE_DIR"
          shopt -s nullglob
          wheels=(addp_common-*.whl)
          checksums=(addp_common-*.whl.sha256)
          if [[ ${#wheels[@]} -ne 1 || ${#checksums[@]} -ne 1 ]]; then
            echo "expected exactly one addp-common wheel and one checksum" >&2
            exit 1
          fi
          sha256sum --check "${checksums[0]}"
          python3 - <<'PY'
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          release_dir = Path(os.environ["ADDP_RELEASE_DIR"])
          tag = os.environ["ADDP_RELEASE_TAG"]
          wheels = list(release_dir.glob("addp_common-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one addp-common wheel")
          if not tag.startswith("v") or len(tag) == 1:
              raise SystemExit(f"release tag must use v<version>: {tag!r}")

          with ZipFile(wheels[0]) as archive:
              metadata_files = [
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_files) != 1:
                  raise SystemExit("wheel must contain exactly one METADATA file")
              metadata = BytesParser().parsebytes(archive.read(metadata_files[0]))

          if metadata["Name"] != "addp-common":
              raise SystemExit(f"unexpected package name: {metadata['Name']!r}")
          expected_version = tag[1:]
          if metadata["Version"] != expected_version:
              raise SystemExit(
                  f"wheel version {metadata['Version']!r} does not match tag {tag!r}"
              )
          PY

      - name: Attest release wheel
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: "${{ runner.temp }}/addp-cli-release/addp_common-*.whl"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ADDP_RELEASE_DIR: ${{ runner.temp }}/addp-cli-release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ADDP_RELEASE_DIR"/addp_common-*.whl \
            "$ADDP_RELEASE_DIR"/addp_common-*.whl.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "ADDP CLI $GITHUB_REF_NAME"
