  topology-hosted-t4:
    name: Online T4 (vector-topology-persistence, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'vector-topology-persistence'
    concurrency:
      group: online-t4-vector-topology-persistence
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: vector-topology-persistence
      ADDP_ONLINE_TOPOLOGY_CASE: ${{ inputs.topology_case }}
    steps:
      - name: Validate requested topology source commit
        env:
          SOURCE_COMMIT: ${{ inputs.topology_source_commit }}
          TOPOLOGY_CASE: ${{ inputs.topology_case }}
        run: |
          if [[ "$TOPOLOGY_CASE" == geometry-difference ]]; then
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Geometry difference requires a full lowercase source SHA' >&2; exit 1; }
          else
            [[ -z "$SOURCE_COMMIT" || "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Topology source must be a full lowercase SHA' >&2; exit 1; }
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.topology_source_commit || github.sha }}

      - name: Verify topology source ancestry
        env:
          SOURCE_COMMIT: ${{ inputs.topology_source_commit || github.sha }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo 'Topology source checkout mismatch' >&2; exit 1; }
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$DISPATCH_COMMIT"
          printf 'Topology source commit=%s; dispatch commit=%s\n' "$SOURCE_COMMIT" "$DISPATCH_COMMIT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install disposable NFS dependencies
        run: sudo apt-get update && sudo apt-get install -y nfs-kernel-server nfs-common

      - name: Validate Hosted Vector Topology readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-topology-gate.sh --check-only

      - name: Run Hosted Vector Topology Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-topology-gate.sh

      - name: Upload Hosted Vector Topology evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-vector-topology-persistence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted Vector Topology T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (vector-topology-persistence, Linux x86_64)
