    steps:
      - name: Validate requested Security source commit
        env:
          SOURCE_COMMIT: ${{ inputs.security_source_commit }}
          SUITE: ${{ inputs.suite }}
        run: |
          [[ -z "$SOURCE_COMMIT" || "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -z "$SOURCE_COMMIT" || "$SUITE" == security-mysql-owner-protection ]] || exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.security_source_commit || github.sha }}
          persist-credentials: false

      - name: Verify Security source ancestry
        env:
          SOURCE_COMMIT: ${{ inputs.security_source_commit || github.sha }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || exit 1
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$DISPATCH_COMMIT" || exit 1
