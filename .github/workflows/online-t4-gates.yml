name: Online T4 gates

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Registered Online suite
        required: true
        type: choice
        options:
          - compose-public-origin
          - consumer-engine-recovery
          - enterprise-catalog-publishing
          - kingbase-consumer-flow
          - manager-internal-artifact-lineage
          - manager-hybrid-search
          - metric-service-revision-lifecycle
          - module-registry-recovery
          - oceanbase-consumer-flow
          - ontology-revision-lifecycle
          - opengauss-consumer-flow
          - quality-dynamic-binding
          - security-plaintext-access
          - security-mysql-owner-protection
          - security-transfer-protection
          - standard-model-reference-deletion
          - tidb-consumer-flow
          - transfer-insert-only-mysql
          - transfer-relational-sql-etl
          - workbench-service-consumption
      metric_engine:
        description: Business engine for metric-service-revision-lifecycle
        required: true
        type: choice
        default: postgresql
        options:
          - postgresql
          - tidb

permissions:
  contents: read

jobs:
  online-t4:
    name: Online T4 (${{ inputs.suite }})
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'opengauss-consumer-flow' && inputs.suite != 'kingbase-consumer-flow' && inputs.suite != 'metric-service-revision-lifecycle' && inputs.suite != 'ontology-revision-lifecycle' && inputs.suite != 'compose-public-origin'
    concurrency:
      group: online-t4-${{ inputs.suite }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - macOS
      - addp-online
    environment: addp-online
    timeout-minutes: 60
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_ENV_FILE: ${{ vars.ADDP_ONLINE_ENV_FILE }}
      ONLINE_SUITE: ${{ inputs.suite }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dedicated Online Runner readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
        run: bash scripts/test/online-host-gate.sh --check-only

      - name: Run dedicated Online deployment gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
        run: bash scripts/test/online-host-gate.sh

      - name: Upload Online evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Online T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (${{ inputs.suite }})
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  compose-public-origin-hosted-t4:
    name: Online T4 (compose-public-origin, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'compose-public-origin'
    concurrency:
      group: online-t4-compose-public-origin
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: compose-public-origin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate Hosted Compose readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-public-origin-gate.sh --check-only

      - name: Run Hosted Compose Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-public-origin-gate.sh

      - name: Upload Hosted Compose evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-compose-public-origin-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted Compose T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (compose-public-origin, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  ontology-hosted-t4:
    name: Online T4 (ontology-revision-lifecycle, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'ontology-revision-lifecycle'
    concurrency:
      group: online-t4-ontology-revision-lifecycle
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: ontology-revision-lifecycle
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate Hosted ontology readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-ontology-gate.sh --check-only

      - name: Run Hosted ontology Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-ontology-gate.sh

      - name: Upload Hosted ontology evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-ontology-revision-lifecycle-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted ontology T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (ontology-revision-lifecycle, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  metric-hosted-t4:
    name: Online T4 (metric-service-revision-lifecycle, ${{ matrix.metric_engine }}, Linux x86_64)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'metric-service-revision-lifecycle')
    strategy:
      fail-fast: false
      matrix:
        metric_engine: ${{ fromJSON(github.event_name == 'schedule' && '["postgresql","tidb"]' || format('["{0}"]', inputs.metric_engine)) }}
    concurrency:
      group: online-t4-metric-service-revision-lifecycle-${{ matrix.metric_engine }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: metric-service-revision-lifecycle
      ADDP_ONLINE_METRIC_ENGINE_TYPE: ${{ matrix.metric_engine }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate Hosted metric readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-metric-gate.sh --check-only

      - name: Run Hosted metric Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-metric-gate.sh

      - name: Upload Hosted metric evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-metric-service-revision-lifecycle-${{ matrix.metric_engine }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted metric T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (metric-service-revision-lifecycle, ${{ matrix.metric_engine }}, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt


  opengauss-hosted-t4:
    name: Online T4 (opengauss-consumer-flow, Linux x86_64)
    if: github.event_name == 'schedule' || inputs.suite == 'opengauss-consumer-flow'
    concurrency:
      group: online-t4-opengauss-consumer-flow
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: opengauss-consumer-flow
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate Hosted openGauss readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-opengauss-gate.sh --check-only

      - name: Run Hosted openGauss Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-opengauss-gate.sh

      - name: Upload Hosted openGauss evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-opengauss-consumer-flow-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted openGauss T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (opengauss-consumer-flow, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  kingbase-owner-managed-t4:
    name: Online T4 (kingbase-consumer-flow, owner-managed Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'kingbase-consumer-flow'
    concurrency:
      group: online-t4-kingbase-consumer-flow
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - Linux
      - X64
      - addp-kingbase
    environment: addp-kingbase
    timeout-minutes: 90
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_OWNER_MANAGED: "1"
      ADDP_KINGBASE_GATE_ENV_FILE: ${{ vars.ADDP_KINGBASE_GATE_ENV_FILE }}
      ONLINE_SUITE_INPUT: kingbase-consumer-flow
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate owner-managed KingbaseES readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-owner-managed-kingbase-gate.sh --check-only

      - name: Run owner-managed KingbaseES Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-owner-managed-kingbase-gate.sh

      - name: Upload owner-managed KingbaseES evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-kingbase-consumer-flow-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize owner-managed KingbaseES T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (kingbase-consumer-flow, owner-managed Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt
