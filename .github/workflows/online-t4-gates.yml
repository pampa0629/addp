name: Online T4 gates

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Registered Online suite
        required: true
        type: choice
        options:
          - compose-public-origin
          - consumer-engine-recovery
          - hdfs-spark-consumer-flow
          - elasticsearch-consumer-flow
          - enterprise-catalog-publishing
          - kingbase-consumer-flow
          - manager-internal-artifact-lineage
          - manager-hybrid-search
          - metric-service-revision-lifecycle
          - module-registry-recovery
          - oceanbase-consumer-flow
          - ontology-revision-lifecycle
          - orchestrator-execution
          - platform-node-metrics
          - opengauss-consumer-flow
          - redis-consumer-flow
          - quality-dynamic-binding
          - raster-workflow
          - security-plaintext-access
          - security-mysql-owner-protection
          - security-transfer-protection
          - standard-model-reference-deletion
          - tidb-consumer-flow
          - transfer-insert-only-mysql
          - transfer-relational-sql-etl
          - workbench-service-consumption
      metric_engine:
        description: Business engine for metric-service-revision-lifecycle
        required: true
        type: choice
        default: postgresql
        options:
          - postgresql
          - tidb

permissions:
  contents: read

jobs:
  online-t4:
    name: Online T4 (${{ inputs.suite }})
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'opengauss-consumer-flow' && inputs.suite != 'kingbase-consumer-flow' && inputs.suite != 'metric-service-revision-lifecycle' && inputs.suite != 'ontology-revision-lifecycle' && inputs.suite != 'compose-public-origin' && inputs.suite != 'orchestrator-execution' && inputs.suite != 'platform-node-metrics' && inputs.suite != 'manager-internal-artifact-lineage' && inputs.suite != 'transfer-relational-sql-etl' && inputs.suite != 'security-mysql-owner-protection' && inputs.suite != 'redis-consumer-flow' && inputs.suite != 'elasticsearch-consumer-flow' && inputs.suite != 'raster-workflow' && inputs.suite != 'hdfs-spark-consumer-flow'
    concurrency:
      group: online-t4-${{ inputs.suite }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - macOS
      - addp-online
    environment: addp-online
    timeout-minutes: 60
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_ENV_FILE: ${{ vars.ADDP_ONLINE_ENV_FILE }}
      ONLINE_SUITE: ${{ inputs.suite }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dedicated Online Runner readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
        run: bash scripts/test/online-host-gate.sh --check-only

      - name: Run dedicated Online deployment gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
        run: bash scripts/test/online-host-gate.sh

      - name: Upload Online evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Online T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (${{ inputs.suite }})
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  compose-public-origin-hosted-t4:
    name: Online T4 (compose-public-origin, Linux x86_64)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'compose-public-origin')
    concurrency:
      group: online-t4-compose-public-origin
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
