name: Online T4 gates

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Registered Online suite
        required: true
        type: choice
        options:
          - consumer-engine-recovery
          - enterprise-catalog-publishing
          - manager-internal-artifact-lineage
          - module-registry-recovery
          - oceanbase-consumer-flow
          - opengauss-consumer-flow
          - security-plaintext-access
          - security-mysql-owner-protection
          - security-transfer-protection
          - standard-model-reference-deletion
          - transfer-insert-only-mysql
          - workbench-service-consumption

permissions:
  contents: read

concurrency:
  group: online-t4-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  online-t4:
    name: Online T4 (${{ inputs.suite }})
    if: inputs.suite != 'opengauss-consumer-flow'
    runs-on:
      - self-hosted
      - macOS
      - addp-online
    environment: addp-online
    timeout-minutes: 60
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_ENV_FILE: ${{ vars.ADDP_ONLINE_ENV_FILE }}
      ONLINE_SUITE: ${{ inputs.suite }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dedicated Online Runner readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
        run: bash scripts/test/online-host-gate.sh --check-only

      - name: Run dedicated Online deployment gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
        run: bash scripts/test/online-host-gate.sh

      - name: Upload Online evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Online T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (${{ inputs.suite }})
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  opengauss-hosted-t4:
    name: Online T4 (opengauss-consumer-flow, Linux x86_64)
    if: inputs.suite == 'opengauss-consumer-flow'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: ${{ inputs.suite }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate Hosted openGauss readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-opengauss-gate.sh --check-only

      - name: Run Hosted openGauss Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-opengauss-gate.sh

      - name: Upload Hosted openGauss evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-opengauss-consumer-flow-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted openGauss T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (opengauss-consumer-flow, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt
