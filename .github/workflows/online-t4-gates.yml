name: Online T4 gates

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Registered Online suite
        required: true
        type: choice
        options:
          - compose-public-origin
          - consumer-engine-recovery
          - hdfs-spark-consumer-flow
          - elasticsearch-consumer-flow
          - catalog-domain-overview
          - enterprise-catalog-publishing
          - kingbase-consumer-flow
          - manager-internal-artifact-lineage
          - manager-hybrid-search
          - metric-service-revision-lifecycle
          - module-registry-recovery
          - workflow-runtime-health-recovery
          - oceanbase-consumer-flow
          - ontology-revision-lifecycle
          - orchestrator-execution
          - platform-administrator-governance
          - platform-node-metrics
          - pg-source-authorization
          - opengauss-consumer-flow
          - highgo-consumer-flow
          - gaussdb-consumer-flow
          - starrocks-consumer-flow
          - redis-consumer-flow
          - ftp-consumer-flow
          - quality-dynamic-binding
          - raster-workflow
          - raster-contour-persistence
          - raster-polygonize-persistence
          - vector-rasterize-persistence
          - vector-zonal-statistics-persistence
          - raster-proximity-persistence
          - raster-focal-mode-persistence
          - raster-boundary-clean-persistence
          - raster-thin-persistence
          - raster-fill-depressions-persistence
          - raster-flow-direction-d8-persistence
          - raster-flow-accumulation-d8-persistence
          - raster-drainage-basins-d8-persistence
          - raster-flow-length-d8-persistence
          - raster-flow-length-upstream-d8-persistence
          - raster-stream-order-d8-persistence
          - raster-stream-link-d8-persistence
          - raster-flow-accumulation-weighted-d8-persistence
          - raster-watershed-d8-persistence
          - raster-band-recommendation-workflow
          - raster-nibble-persistence
          - raster-disk-pressure
          - raster-nibble-capacity
          - raster-focal-statistics-persistence
          - raster-zonal-statistics-persistence
          - vector-pmtiles-workflow
          - vector-topology-persistence
          - raster-workflow-capacity
          - graph-protection
          - security-plaintext-access
          - security-mysql-owner-protection
          - security-transfer-protection
          - standard-model-reference-deletion
          - tidb-consumer-flow
          - transfer-insert-only-mysql
          - transfer-relational-sql-etl
          - transfer-continuous-events
          - workbench-service-consumption
      graph_engine:
        description: Native engine for graph-protection
        required: true
        type: choice
        default: falkordb
        options:
          - falkordb
          - neo4j
      metric_engine:
        description: Business engine for metric-service-revision-lifecycle
        required: true
        type: choice
        default: postgresql
        options:
          - postgresql
          - tidb
      node_metrics_case:
        description: Acceptance case for platform-node-metrics only
        required: true
        type: choice
        default: regression
        options:
          - regression
          - complete-comparison
          - cpu-pressure
          - host-admission
          - engine-admission
          - meta-workers
          - transfer-workers
          - quality-workers

permissions:
  contents: read

jobs:
  pg-authorization-hosted-t4:
    name: Online T4 (pg-source-authorization, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'pg-source-authorization'
    concurrency:
      group: online-t4-pg-source-authorization
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: pg-source-authorization
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate Hosted PG authorization readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-pg-authorization-gate.sh --check-only

      - name: Run Hosted PG authorization gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-pg-authorization-gate.sh

      - name: Upload Hosted PG authorization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-pg-source-authorization-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted PG authorization gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (pg-source-authorization, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  online-t4:
    name: Online T4 (${{ inputs.suite }})
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'catalog-domain-overview' && inputs.suite != 'workflow-runtime-health-recovery' && inputs.suite != 'platform-administrator-governance' && inputs.suite != 'pg-source-authorization' && inputs.suite != 'opengauss-consumer-flow' && inputs.suite != 'kingbase-consumer-flow' && inputs.suite != 'metric-service-revision-lifecycle' && inputs.suite != 'ontology-revision-lifecycle' && inputs.suite != 'compose-public-origin' && inputs.suite != 'orchestrator-execution' && inputs.suite != 'quality-dynamic-binding' && inputs.suite != 'platform-node-metrics' && inputs.suite != 'manager-internal-artifact-lineage' && inputs.suite != 'transfer-relational-sql-etl' && inputs.suite != 'transfer-continuous-events' && inputs.suite != 'security-mysql-owner-protection' && inputs.suite != 'security-plaintext-access' && inputs.suite != 'graph-protection' && inputs.suite != 'highgo-consumer-flow' && inputs.suite != 'gaussdb-consumer-flow' && inputs.suite != 'starrocks-consumer-flow' && inputs.suite != 'redis-consumer-flow' && inputs.suite != 'ftp-consumer-flow' && inputs.suite != 'elasticsearch-consumer-flow' && inputs.suite != 'vector-pmtiles-workflow' && inputs.suite != 'raster-workflow' && inputs.suite != 'vector-topology-persistence' && inputs.suite != 'raster-contour-persistence' && inputs.suite != 'raster-polygonize-persistence' && inputs.suite != 'vector-rasterize-persistence' && inputs.suite != 'vector-zonal-statistics-persistence' && inputs.suite != 'raster-proximity-persistence' && inputs.suite != 'raster-focal-mode-persistence' && inputs.suite != 'raster-boundary-clean-persistence' && inputs.suite != 'raster-thin-persistence' && inputs.suite != 'raster-fill-depressions-persistence' && inputs.suite != 'raster-flow-direction-d8-persistence' && inputs.suite != 'raster-flow-accumulation-d8-persistence' && inputs.suite != 'raster-drainage-basins-d8-persistence' && inputs.suite != 'raster-flow-length-d8-persistence' && inputs.suite != 'raster-flow-length-upstream-d8-persistence' && inputs.suite != 'raster-stream-order-d8-persistence' && inputs.suite != 'raster-stream-link-d8-persistence' && inputs.suite != 'raster-flow-accumulation-weighted-d8-persistence' && inputs.suite != 'raster-watershed-d8-persistence' && inputs.suite != 'raster-band-recommendation-workflow' && inputs.suite != 'raster-nibble-persistence' && inputs.suite != 'raster-disk-pressure' && inputs.suite != 'raster-nibble-capacity' && inputs.suite != 'raster-focal-statistics-persistence' && inputs.suite != 'raster-zonal-statistics-persistence' && inputs.suite != 'raster-workflow-capacity' && inputs.suite != 'hdfs-spark-consumer-flow'
    concurrency:
      group: online-t4-${{ inputs.suite }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - macOS
      - addp-online
    environment: addp-online
    timeout-minutes: 60
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_ENV_FILE: ${{ vars.ADDP_ONLINE_ENV_FILE }}
      ONLINE_SUITE: ${{ inputs.suite }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dedicated Online Runner readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
        run: bash scripts/test/online-host-gate.sh --check-only

      - name: Run dedicated Online deployment gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
        run: bash scripts/test/online-host-gate.sh

      - name: Upload Online evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Online T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (${{ inputs.suite }})
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  compose-public-origin-hosted-t4:
    name: Online T4 (compose-public-origin, Linux x86_64)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'compose-public-origin')
    concurrency:
      group: online-t4-compose-public-origin
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: compose-public-origin
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate Hosted Compose readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-public-origin-gate.sh --check-only

      - name: Run Hosted Compose Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-public-origin-gate.sh

      - name: Upload Hosted Compose evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-compose-public-origin-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted Compose T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (compose-public-origin, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  catalog-domain-hosted-t4:
    name: Online T4 (catalog-domain-overview, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'catalog-domain-overview'
    concurrency:
      group: online-t4-catalog-domain-overview
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: catalog-domain-overview
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate Hosted Catalog domain readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-catalog-domain-gate.sh --check-only

      - name: Run Hosted Catalog domain Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-catalog-domain-gate.sh

      - name: Upload Hosted Catalog domain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-catalog-domain-overview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted Catalog domain T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (catalog-domain-overview, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  ontology-hosted-t4:
    name: Online T4 (ontology-revision-lifecycle, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'ontology-revision-lifecycle'
    concurrency:
      group: online-t4-ontology-revision-lifecycle
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: ontology-revision-lifecycle
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate Hosted ontology readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-ontology-gate.sh --check-only

      - name: Run Hosted ontology Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-ontology-gate.sh

      - name: Upload Hosted ontology evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-ontology-revision-lifecycle-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted ontology T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (ontology-revision-lifecycle, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  security-hosted-t4:
    name: Online T4 (${{ inputs.suite }}, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'security-mysql-owner-protection' || inputs.suite == 'security-plaintext-access' || inputs.suite == 'graph-protection')
    concurrency:
      group: online-t4-${{ inputs.suite }}${{ inputs.suite == 'graph-protection' && format('-{0}', inputs.graph_engine) || '' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: ${{ inputs.suite }}
      ADDP_ONLINE_GRAPH_ENGINE: ${{ inputs.graph_engine }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Validate Hosted Security readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-security-gate.sh --check-only

      - name: Run Hosted Security Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-security-gate.sh

      - name: Upload Hosted Security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-${{ inputs.suite }}-${{ github.run_id }}
          path: |
