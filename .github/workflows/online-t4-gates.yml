  manager-hosted-t4:
    name: Online T4 (manager-internal-artifact-lineage, ${{ inputs.manager_case }}, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'manager-internal-artifact-lineage'
    concurrency:
      group: online-t4-manager-internal-artifact-lineage
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: manager-internal-artifact-lineage
      ADDP_ONLINE_MANAGER_CASE: ${{ inputs.manager_case }}
    steps:
      - name: Validate requested Manager source commit
        env:
          MANAGER_SOURCE_COMMIT: ${{ inputs.manager_source_commit }}
        run: |
          if [[ ! "$MANAGER_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Manager source commit must be a full lowercase SHA' >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.manager_source_commit }}

      - name: Verify Manager source ancestry
        env:
          MANAGER_SOURCE_COMMIT: ${{ inputs.manager_source_commit }}
          MANAGER_DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$MANAGER_SOURCE_COMMIT" ] || { echo 'Manager source checkout mismatch' >&2; exit 1; }
          git merge-base --is-ancestor "$MANAGER_SOURCE_COMMIT" "$MANAGER_DISPATCH_COMMIT"
          printf 'Manager source commit=%s; dispatch commit=%s\n' "$MANAGER_SOURCE_COMMIT" "$MANAGER_DISPATCH_COMMIT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install PointCloud native environment tool
        if: inputs.manager_case != 'nfs-upload-initial'
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          miniforge-version: "25.3.1-0"
          activate-environment: ""
          auto-activate-base: false

      - name: Install Document native system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libcairo2 libcups2t64 libdbus-1-3 libnspr4 libnss3 \
            libsm6 libx11-6 libxext6 libxinerama1 libxrender1 libxcb1 libxslt1.1 \
            libgpgme11t64 libgpgmepp6t64 nfs-kernel-server

      - name: Install isolated FileGDB verification tools
        if: inputs.manager_case == 'filegdb-authorization' || inputs.manager_case == 'filegdb-export' || inputs.manager_case == 'filegdb-mysql-export'
        run: sudo apt-get install -y --no-install-recommends nfs-common gdal-bin python3-gdal

      - name: Validate Hosted Manager readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-manager-gate.sh --check-only

      - name: Prepare fixed-source Infra MinIO build cache
        uses: ./.github/actions/prepare-minio-build-cache

      - name: Run Hosted Manager Online gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-manager-gate.sh

      - name: Upload Hosted Manager evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-manager-internal-artifact-lineage-${{ inputs.manager_case }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            ${{ runner.temp }}/addp-minio-cache-attempt.json
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted Manager T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (manager-internal-artifact-lineage, ${{ inputs.manager_case }}, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

