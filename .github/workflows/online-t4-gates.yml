permissions:
  contents: read

jobs:
  pg-authorization-hosted-t4:
    name: Online T4 (pg-source-authorization, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'pg-source-authorization'
    concurrency:
      group: online-t4-pg-source-authorization
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: pg-source-authorization
    steps:
      - name: Validate requested PG source commit
        env:
          PG_SOURCE_COMMIT: ${{ inputs.pg_source_commit }}
        run: |
          if [[ -n "$PG_SOURCE_COMMIT" && ! "$PG_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'PG source commit must be a full lowercase SHA' >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.pg_source_commit || github.sha }}

      - name: Verify PG source ancestry
        env:
          PG_SOURCE_COMMIT: ${{ inputs.pg_source_commit }}
          PG_DISPATCH_COMMIT: ${{ github.sha }}
          PG_CPU_COMPARISON: ${{ inputs.pg_cpu_comparison }}
        run: |
          selected="${PG_SOURCE_COMMIT:-$PG_DISPATCH_COMMIT}"
          [ "$(git rev-parse HEAD)" = "$selected" ] || { echo 'PG source checkout mismatch' >&2; exit 1; }
          git merge-base --is-ancestor "$selected" "$PG_DISPATCH_COMMIT"
          if [ "${PG_CPU_COMPARISON:-false}" = true ]; then
            if ! grep -Fxq 'def pg_load_cpu_window(arm):' scripts/test/pg-source-authorization-online.py; then
              echo 'Selected PG source does not support CPU switching within the sampling window' >&2
              exit 1
            fi
          fi
          printf 'PG source commit=%s; dispatch commit=%s\n' "$selected" "$PG_DISPATCH_COMMIT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Validate Hosted PG authorization readiness
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-pg-authorization-gate.sh --check-only

      - name: Run Hosted PG authorization gate
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
          ADDP_ONLINE_PG_CPU_ARM: ${{ inputs.pg_cpu_comparison && '4' || '' }}
        run: bash scripts/test/online-hosted-pg-authorization-gate.sh

      - name: Run paired Hosted PG authorization gate with three vCPUs
        if: inputs.pg_cpu_comparison
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}-cpu3
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}-cpu3
          ADDP_ONLINE_PG_CPU_ARM: '3'
          PG_CPU3_CHECKOUT: ${{ runner.temp }}/addp-pg-cpu3-${{ github.run_id }}
        run: |
          selected="$(git rev-parse HEAD)"
          git clone --shared --no-checkout -- "$GITHUB_WORKSPACE" "$PG_CPU3_CHECKOUT"
          cd "$PG_CPU3_CHECKOUT"
          git checkout --detach "$selected"
          bash scripts/test/online-hosted-pg-authorization-gate.sh --check-only
          bash scripts/test/online-hosted-pg-authorization-gate.sh

      - name: Upload Hosted PG authorization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-t4-pg-source-authorization-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/
            ${{ runner.temp }}/addp-online-${{ github.run_id }}-cpu3/
            ${{ runner.temp }}/addp-pg-cpu3-${{ github.run_id }}/logs/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted PG authorization gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (pg-source-authorization, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  meta-scan-claim-hosted:
    name: Online T4 (meta-scan-claim, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'meta-scan-claim'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: meta-scan-claim
      META_SCAN_SOURCE_COMMIT: ${{ inputs.pg_source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact product independently of the acceptance code
        run: |
          [[ "$META_SCAN_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$META_SCAN_SOURCE_COMMIT" "$GITHUB_SHA"
          git clone --shared --no-checkout . "$RUNNER_TEMP/meta-scan-product"
          git -C "$RUNNER_TEMP/meta-scan-product" checkout --detach "$META_SCAN_SOURCE_COMMIT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify isolated scan environment
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-meta-scan-gate.sh --check-only
      - name: Run a single scan on the selected product
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-meta-scan-gate.sh
      - name: Publish scan and cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: meta-scan-claim-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/*.json
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/readiness.txt
          retention-days: 14

  standard-document-storage-hosted:
    name: Online T4 (standard-document-storage, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'standard-document-storage'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: standard-document-storage
      STANDARD_HTTP_SOURCE_COMMIT: ${{ inputs.pg_source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact product independently of the acceptance code
        run: |
          [[ "$STANDARD_HTTP_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$STANDARD_HTTP_SOURCE_COMMIT" "$GITHUB_SHA"
          git clone --shared --no-checkout . "$RUNNER_TEMP/standard-http-product"
          git -C "$RUNNER_TEMP/standard-http-product" checkout --detach "$STANDARD_HTTP_SOURCE_COMMIT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: system/backend/go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify isolated document environment
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-standard-document-gate.sh --check-only
      - name: Run document HTTP storage on the selected product
        env:
          ADDP_ONLINE_ARTIFACT_DIR: ${{ runner.temp }}/addp-online-${{ github.run_id }}
          ADDP_ONLINE_SECRET_DIR: ${{ runner.temp }}/addp-online-secret-${{ github.run_id }}
        run: bash scripts/test/online-hosted-standard-document-gate.sh
      - name: Publish scan and cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standard-document-storage-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/*.json
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt
            ${{ runner.temp }}/addp-online-${{ github.run_id }}/readiness.txt
          retention-days: 14

  online-t4:
    name: Online T4 (${{ inputs.suite }})
