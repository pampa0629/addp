            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize Hosted Transfer T4 gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Online T4 (transfer-relational-sql-etl, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  continuous-hosted-t4:
    name: Online T4 (transfer-continuous-events, Linux x86_64)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'transfer-continuous-events'
    concurrency:
      group: online-t4-transfer-continuous-events
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: transfer-continuous-events
