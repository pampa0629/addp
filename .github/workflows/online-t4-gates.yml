        with:
          gate: Online T4 (${{ inputs.suite }}, Linux x86_64)
          status: ${{ job.status }}
          details-file: ${{ runner.temp }}/addp-online-${{ github.run_id }}/summary.txt

  transfer-hosted-t4:
