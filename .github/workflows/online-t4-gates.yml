    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ADDP_ONLINE_HOST: "1"
      ADDP_ONLINE_HOSTED: "1"
      ONLINE_SUITE_INPUT: raster-slope-orthogonal-persistence
    steps:
      - name: Validate requested orthogonal slope source commit
        env:
          SOURCE_COMMIT: ${{ inputs.slope_orthogonal_source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Orthogonal slope requires a full lowercase source SHA' >&2; exit 1; }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.slope_orthogonal_source_commit }}

      - name: Verify orthogonal slope source ancestry
        env:
          SOURCE_COMMIT: ${{ inputs.slope_orthogonal_source_commit }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo 'Orthogonal slope source checkout mismatch' >&2; exit 1; }
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$DISPATCH_COMMIT"
          printf 'Orthogonal slope source commit=%s; dispatch commit=%s\n' "$SOURCE_COMMIT" "$DISPATCH_COMMIT"

