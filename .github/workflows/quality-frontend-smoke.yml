name: Quality frontend smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-frontend-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-frontend:
    name: Quality frontend (route, E2E, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Quality frontend gate
        id: selection
        env:
          ADDP_CI_BEFORE: ${{ github.event.before }}
          ADDP_CI_EVENT: ${{ github.event_name }}
          ADDP_CI_HEAD: ${{ github.sha }}
          ADDP_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/select-module-gate.py --module quality

      - name: Prepare Quality frontend environment
        if: steps.selection.outputs.run == 'true'
        uses: ./.github/actions/prepare-frontend-gate
        with:
          frontend-directory: quality/frontend

      - name: Install Chromium for Playwright
        if: steps.selection.outputs.run == 'true'
        working-directory: quality/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Quality frontend gate
        if: steps.selection.outputs.run == 'true'
        run: make test-quality-frontend

      - name: Report skipped Quality frontend gate
        if: steps.selection.outputs.run != 'true'
        run: echo "Quality frontend gate did not run because no registered path changed."

      - name: Summarize Quality frontend gate
        if: always()
        uses: ./.github/actions/ci-gate-summary
        with:
          gate: Quality frontend
          selected: ${{ steps.selection.outputs.run }}
          status: ${{ job.status }}
