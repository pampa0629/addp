# ADDP 应用服务层配置
# Application Layer: All ADDP microservices (System, Manager, Meta, Transfer, Orchestrator, Develop, Gateway)
#
# 前置条件: 需要先启动基础设施层 (docker-compose.infra.yml)
#
# 使用方法:
#   启动: docker compose -f docker-compose.app.yml up -d
#   停止: docker compose -f docker-compose.app.yml down
#   日志: docker compose -f docker-compose.app.yml logs -f

name: addp-app

services:
  # ==================== System 模块 ====================

  system-backend:
    image: ${REGISTRY:-localhost:5001}/addp-system-backend:${IMAGE_TAG:-latest}
    container_name: system-backend
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-SuperAdmin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-20251001#SuperAdmin}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@addp.com}
      - GIN_MODE=release
    ports:
      - "8080:8080"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  system-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-system-frontend:${IMAGE_TAG:-latest}
    container_name: system-frontend
    ports:
      - "8090:80"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped

  # ==================== Manager 模块 ====================

  manager-backend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-backend:${IMAGE_TAG:-latest}
    container_name: manager-backend
    environment:
      - PORT=8081
      - DB_SCHEMA=manager
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8081:8081"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  manager-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-frontend:${IMAGE_TAG:-latest}
    container_name: manager-frontend
    ports:
      - "8091:80"
    networks:
      - addp-network
    depends_on:
      - manager-backend
    restart: unless-stopped

  manager-worker:
    image: ${REGISTRY:-localhost:5001}/addp-manager-worker:${IMAGE_TAG:-latest}
    environment:
      - DB_SCHEMA=manager
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=10
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=false
    networks:
      - addp-network
    depends_on:
      - manager-backend
    restart: unless-stopped

  # ==================== Meta 模块 ====================

  meta-backend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-backend:${IMAGE_TAG:-latest}
    container_name: meta-backend
    environment:
      - PORT=8082
      - DB_SCHEMA=metadata
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8082:8082"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  meta-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-frontend:${IMAGE_TAG:-latest}
    container_name: meta-frontend
    ports:
      - "8092:80"
    networks:
      - addp-network
    depends_on:
      - meta-backend
    restart: unless-stopped

  meta-worker:
    image: ${REGISTRY:-localhost:5001}/addp-meta-worker:${IMAGE_TAG:-latest}
    environment:
      - DB_SCHEMA=metadata
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=10
    networks:
      - addp-network
    depends_on:
      - meta-backend
    restart: unless-stopped

  # ==================== Transfer 模块 ====================

  transfer-backend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-backend:${IMAGE_TAG:-latest}
    container_name: transfer-backend
    environment:
      - PORT=8083
      - DB_SCHEMA=transfer
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8083:8083"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  transfer-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-frontend:${IMAGE_TAG:-latest}
    container_name: transfer-frontend
    ports:
      - "8093:80"
    networks:
      - addp-network
    depends_on:
      - transfer-backend
    restart: unless-stopped

  transfer-worker:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-worker:${IMAGE_TAG:-latest}
    environment:
      - DB_SCHEMA=transfer
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=15
    networks:
      - addp-network
    depends_on:
      - transfer-backend
    restart: unless-stopped

  # ==================== Orchestrator 模块 ====================

  orchestrator-backend:
    image: ${REGISTRY:-localhost:5001}/addp-orchestrator-backend:${IMAGE_TAG:-latest}
    container_name: orchestrator-backend
    environment:
      - PORT=8084
      - DB_SCHEMA=orchestrator
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8084:8084"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  orchestrator-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-orchestrator-frontend:${IMAGE_TAG:-latest}
    container_name: orchestrator-frontend
    ports:
      - "8094:80"
    networks:
      - addp-network
    depends_on:
      - orchestrator-backend
    restart: unless-stopped

  # ==================== Develop 模块 (SQL 开发工作台) ====================

  develop-backend:
    image: ${REGISTRY:-localhost:5001}/addp-develop-backend:${IMAGE_TAG:-latest}
    container_name: develop-backend
    environment:
      - PORT=8085
      - ENV=production
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - ENABLE_SERVICE_INTEGRATION=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=develop
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GIN_MODE=release
    ports:
      - "8085:8085"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  develop-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-develop-frontend:${IMAGE_TAG:-latest}
    container_name: develop-frontend
    ports:
      - "8095:80"
    networks:
      - addp-network
    depends_on:
      - develop-backend
    restart: unless-stopped

  # ==================== Gateway 服务 ====================

  gateway:
    image: ${REGISTRY:-localhost:5001}/addp-gateway:${IMAGE_TAG:-latest}
    container_name: gateway
    environment:
      - PORT=8000
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - MANAGER_SERVICE_URL=http://manager-backend:8081
      - META_SERVICE_URL=http://meta-backend:8082
      - TRANSFER_SERVICE_URL=http://transfer-backend:8083
      - ORCHESTRATOR_SERVICE_URL=http://orchestrator-backend:8084
      - DEVELOP_SERVICE_URL=http://develop-backend:8085
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GIN_MODE=release
    ports:
      - "8000:8000"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Portal 统一门户 ====================

  portal:
    image: ${REGISTRY:-localhost:5001}/addp-portal:${IMAGE_TAG:-latest}
    container_name: portal
    ports:
      - "5170:80"  # Portal 可独立访问（开发调试用）
    networks:
      - addp-network
    depends_on:
      - gateway
    restart: unless-stopped

  # ==================== Nginx 统一网关 ====================

  nginx:
    image: ${REGISTRY:-localhost:5001}/addp-nginx:${IMAGE_TAG:-latest}
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - addp-network
    depends_on:
      - portal
      - gateway
      - system-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  addp-network:
    external: true
    name: addp-network
