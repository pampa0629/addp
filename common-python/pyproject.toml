[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "addp-common"
dynamic = ["version"]
description = "ADDP 平台 Python 共享模块"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"filelock>=3.18.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
	"keyring>=25.6.0",
    "pydantic>=2.0.0",
]

[project.scripts]
addp = "addp_common.cli:main"

[project.optional-dependencies]
inference-langchain = [
    "langchain-core>=0.3.0,<0.4.0",
]
dev = [
	"pandas>=2.2.0",
	"pyarrow>=18.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["addp_common*"]

[tool.setuptools.package-data]
"addp_common.tools" = ["manifest.json"]

[tool.setuptools.dynamic]
version = {attr = "addp_common.__version__"}
