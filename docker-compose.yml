    image: ${REGISTRY:-localhost:5001}/addp-python-workflow-engine:${IMAGE_TAG:-latest}
    container_name: python-workflow-engine
    environment:
      - PORT=8099
      - SYSTEM_URL=http://system-backend:8180
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=develop
    ports:
      - "8099:8099"
    volumes:
      - ./logs:/app/logs
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8099/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Model3D Workflow Engine（三维模型转换工作流引擎） ====================

  model3d-workflow-engine:
    image: ${REGISTRY:-localhost:5001}/addp-model3d-workflow-engine:${IMAGE_TAG:-latest}
    container_name: model3d-workflow-engine
    environment:
      - PORT=8101
      - SYSTEM_URL=http://system-backend:8180
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MODEL3D_CONVERTER_BIN=/opt/addp/model3d-workflow/bin/_3dtile
      - MODEL3D_MESH_CONVERTER_BIN=/usr/bin/assimp
      - MODEL3D_GAUSSIAN_SPLAT_NODE_BIN=/usr/bin/node
      - GDAL_DATA=/opt/addp/model3d-workflow/bin/gdal
      - PROJ_DATA=/opt/addp/model3d-workflow/bin/proj
      - OSG_LIBRARY_PATH=/opt/addp/model3d-workflow/bin/osgPlugins-3.6.5
    ports:
      - "8101:8101"
    volumes:
      - ./logs:/app/logs
      - ${MODEL3D_DATA_HOST_PATH:-./business/nfs/data}:${MODEL3D_DATA_CONTAINER_PATH:-/Users/pampa/code/addp/business/nfs/data}:ro
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== PointCloud Workflow Engine（点云处理工作流引擎） ====================

  pointcloud-workflow-engine:
    build:
      context: .
      dockerfile: engines/pointcloud-workflow/Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-pointcloud-workflow-engine:${IMAGE_TAG:-latest}
    container_name: pointcloud-workflow-engine
    environment:
      - PORT=8102
      - SYSTEM_URL=http://system-backend:8180
