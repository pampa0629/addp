# ADDP 应用服务层配置
# Application Layer: All ADDP microservices (System, Manager, Meta, Transfer, Orchestrator, Develop, Gateway)
#
# 🎯 这是合并后的统一配置文件，适用于开发、测试和生产环境
#
# 前置条件: 需要先启动基础设施层
#   docker compose -f docker-compose.infra.yml up -d
#
# 基本使用:
#   启动所有服务: docker compose up -d
#   停止所有服务: docker compose down
#   查看日志:     docker compose logs -f
#   服务状态:     docker compose ps
#
# 环境变量配置（可选，支持不同部署场景）:
#   COMPOSE_PROJECT_NAME - 项目名称前缀，用于容器命名（默认: addp）
#   NGINX_PORT           - Nginx 统一网关端口（默认: 80）
#   CONSOLE_PORT         - Console 工作台独立访问端口（默认: 5170）
#   REGISTRY             - 镜像仓库地址（默认: localhost:5001）
#   IMAGE_TAG            - 镜像标签（默认: latest）
#
# Docker Swarm 高可用模式:
#   取消 Worker 服务中的 deploy 配置注释后，使用以下命令部署:
#   docker stack deploy -c docker-compose.yml addp

name: addp-app

services:
  # ==================== System 模块 ====================

  system-backend:
    image: ${REGISTRY:-localhost:5001}/addp-system-backend:${IMAGE_TAG:-latest}
    container_name: system-backend
    environment:
      - SERVICE_HOST=system-backend
      - SERVER_ADDR=:8180  # System Backend 端口
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-SuperAdmin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-20251001#SuperAdmin}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@addp.com}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      # 内置引擎服务 URL（Docker 环境使用服务名）
      - SYSTEM_URL=http://system-backend:8180
      - META_URL=http://meta-backend:8082
      - TRANSFER_URL=http://transfer-backend:8083
      - MANAGER_URL=http://manager-backend:8081
      - ORCHESTRATOR_URL=http://orchestrator-backend:8084
      - DEVELOP_URL=http://develop-backend:8185
      - PYTHON_WORKFLOW_URL=http://python-workflow-engine:8099
      - GIN_MODE=release
    ports:
      - "8180:8180"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8180'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  system-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-system-frontend:${IMAGE_TAG:-latest}
    container_name: system-frontend
    ports:
      - "8090:80"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped

  # ==================== Manager 模块 ====================

  manager-backend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-backend:${IMAGE_TAG:-latest}
    container_name: manager-backend
    environment:
      - SERVICE_HOST=manager-backend
      - PORT=8081
      - DB_SCHEMA=manager
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - SYSTEM_URL=http://system-backend:8180
      - META_URL=http://meta-backend:8082
      - TRANSFER_URL=http://transfer-backend:8083
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - ENABLE_META_INTEGRATION=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=false
      - GIN_MODE=release
    ports:
      - "8081:8081"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  manager-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-frontend:${IMAGE_TAG:-latest}
    container_name: manager-frontend
    ports:
      - "8091:80"
    networks:
      - addp-network
    depends_on:
      - manager-backend
    restart: unless-stopped

  # ==================== Meta 模块 ====================

  meta-backend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-backend:${IMAGE_TAG:-latest}
    container_name: meta-backend
    environment:
      - SERVICE_HOST=meta-backend
      - PORT=8082
      - DB_SCHEMA=metadata
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      - META_MINIO_ENDPOINT=minio:9000
      - META_MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - META_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - META_MINIO_USE_SSL=false
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-}
      - MEILISEARCH_ASSET_INDEX=${MEILISEARCH_ASSET_INDEX:-assets}
      - SYSTEM_URL=http://system-backend:8180
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8082:8082"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  meta-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-frontend:${IMAGE_TAG:-latest}
    container_name: meta-frontend
    ports:
      - "8092:80"
    networks:
      - addp-network
    depends_on:
      - meta-backend
    restart: unless-stopped

  meta-worker:
    image: ${REGISTRY:-localhost:5001}/addp-meta-worker:${IMAGE_TAG:-latest}
    # Note: No container_name for Swarm compatibility (allows multiple replicas)
    environment:
      - DB_SCHEMA=metadata
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_URL=http://system-backend:8180
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=10
    networks:
      - addp-network
    depends_on:
      - meta-backend
    restart: unless-stopped
    # Docker Swarm high availability configuration
    # NOTE: deploy config is commented out for docker-compose mode
    # Uncomment when using docker stack deploy (Swarm mode)
    # deploy:
    #   replicas: 1  # Single instance resident (changed from 2 to save 50% memory)
    #   restart_policy:
    #     condition: any  # Restart on any failure
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    #   update_config:
    #     parallelism: 1  # Update one container at a time
    #     delay: 10s
    #     failure_action: rollback
    #     order: start-first  # Start new container before stopping old one
    #   rollback_config:
    #     parallelism: 1
    #     delay: 5s
    #   resources:
    #     limits:
    #       cpus: '2'      # Max 2 CPU cores per worker
    #       memory: 2G     # Max 2GB memory per worker
    #     reservations:
    #       cpus: '0.5'    # Reserve at least 0.5 CPU core
    #       memory: 512M   # Reserve at least 512MB memory

  # ==================== Transfer 模块 ====================

  transfer-backend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-backend:${IMAGE_TAG:-latest}
    container_name: transfer-backend
    environment:
      - SERVICE_HOST=transfer-backend
      - PORT=8083
      - DB_SCHEMA=transfer
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_URL=http://system-backend:8180
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8083:8083"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  transfer-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-frontend:${IMAGE_TAG:-latest}
    container_name: transfer-frontend
    ports:
      - "8093:80"
    networks:
      - addp-network
    depends_on:
      - transfer-backend
    restart: unless-stopped

  transfer-worker:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-worker:${IMAGE_TAG:-latest}
    # Note: No container_name for Swarm compatibility (allows multiple replicas)
    environment:
      - DB_SCHEMA=transfer
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_URL=http://system-backend:8180
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=15
    networks:
      - addp-network
    depends_on:
      - transfer-backend
    restart: unless-stopped
    # Docker Swarm high availability configuration
    # NOTE: deploy config is commented out for docker-compose mode
    # Uncomment when using docker stack deploy (Swarm mode)
    # deploy:
    #   replicas: 1  # Single instance resident (changed from 2 to save 50% memory)
    #   restart_policy:
    #     condition: any  # Restart on any failure
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    #   update_config:
    #     parallelism: 1  # Update one container at a time
    #     delay: 10s
    #     failure_action: rollback
    #     order: start-first  # Start new container before stopping old one
    #   rollback_config:
    #     parallelism: 1
    #     delay: 5s
    #   resources:
    #     limits:
    #       cpus: '2'      # Max 2 CPU cores per worker
    #       memory: 2G     # Max 2GB memory per worker
    #     reservations:
    #       cpus: '0.5'    # Reserve at least 0.5 CPU core
    #       memory: 512M   # Reserve at least 512MB memory

  # ==================== Orchestrator 模块 ====================

  orchestrator-backend:
    image: ${REGISTRY:-localhost:5001}/addp-orchestrator-backend:${IMAGE_TAG:-latest}
    container_name: orchestrator-backend
    environment:
      - SERVICE_HOST=orchestrator-backend
      - PORT=8084
      - DB_SCHEMA=orchestrator
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SYSTEM_URL=http://system-backend:8180
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8084:8084"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8084'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  orchestrator-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-orchestrator-frontend:${IMAGE_TAG:-latest}
    container_name: orchestrator-frontend
    ports:
      - "8094:80"
    networks:
      - addp-network
    depends_on:
      - orchestrator-backend
    restart: unless-stopped

  # ==================== Develop 模块 (SQL 开发工作台) ====================

  develop-backend:
    image: ${REGISTRY:-localhost:5001}/addp-develop-backend:${IMAGE_TAG:-latest}
    container_name: develop-backend
    environment:
      - SERVICE_HOST=develop-backend
      - DEVELOP_BACKEND_PORT=8185
      - ENV=production
      - SYSTEM_URL=http://system-backend:8180
      - META_URL=http://meta-backend:8082
      - TRANSFER_URL=http://transfer-backend:8083
      - MANAGER_URL=http://manager-backend:8081
      - PYTHON_WORKFLOW_URL=http://python-workflow-engine:8099
      - JUPYTER_URL=http://jupyter-engine:8097
      - ENABLE_SERVICE_INTEGRATION=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=develop
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GIN_MODE=release
    ports:
      - "8185:8185"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8185'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  develop-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-develop-frontend:${IMAGE_TAG:-latest}
    container_name: develop-frontend
    ports:
      - "8095:80"
    networks:
      - addp-network
    depends_on:
      - develop-backend
    restart: unless-stopped

  # ==================== Service 模块 (数据服务和 OGC 标准) ====================

  service-backend:
    image: ${REGISTRY:-localhost:5001}/addp-service-backend:${IMAGE_TAG:-latest}
    container_name: service-backend
    environment:
      - SERVICE_HOST=service-backend
      - PORT=8086
      - ENV=production
      - SYSTEM_URL=http://system-backend:8180
      - MANAGER_URL=http://manager-backend:8081
      - META_URL=http://meta-backend:8082
      - ENABLE_SERVICE_INTEGRATION=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=service
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GIN_MODE=release
    ports:
      - "8086:8086"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8086'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  service-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-service-frontend:${IMAGE_TAG:-latest}
    container_name: service-frontend
    ports:
      - "8096:80"
    networks:
      - addp-network
    depends_on:
      - service-backend
    restart: unless-stopped

  # ==================== Monitor 模块 ====================

  monitor-backend:
    image: ${REGISTRY:-localhost:5001}/addp-monitor-backend:${IMAGE_TAG:-latest}
    container_name: monitor-backend
    environment:
      - SERVICE_HOST=monitor-backend
      - MONITOR_BACKEND_PORT=8100
      - SYSTEM_URL=http://system-backend:8180
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    ports:
      - "8100:8100"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8100'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  monitor-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-monitor-frontend:${IMAGE_TAG:-latest}
    container_name: monitor-frontend
    ports:
      - "8116:80"
    networks:
      - addp-network
    depends_on:
      - monitor-backend
    restart: unless-stopped

  # ==================== Standard 模块 ====================

  standard-backend:
    image: ${REGISTRY:-localhost:5001}/addp-standard-backend:${IMAGE_TAG:-latest}
    container_name: standard-backend
    environment:
      - SERVICE_HOST=standard-backend
      - STANDARD_BACKEND_PORT=8110
      - SYSTEM_URL=http://system-backend:8180
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=false
    ports:
      - "8110:8110"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8110'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  standard-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-standard-frontend:${IMAGE_TAG:-latest}
    container_name: standard-frontend
    ports:
      - "8112:80"
    networks:
      - addp-network
    depends_on:
      - standard-backend
    restart: unless-stopped

  # ==================== Copilot 模块 (AI 助手) ====================

  copilot-backend:
    build:
      context: ./copilot
      dockerfile: Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-copilot-backend:${IMAGE_TAG:-latest}
    container_name: copilot-backend
    environment:
      - SERVICE_HOST=copilot-backend
      - PORT=8087
      - SYSTEM_URL=http://system-backend:8180
      - MANAGER_URL=http://manager-backend:8081
      - META_URL=http://meta-backend:8082
      - DEVELOP_URL=http://develop-backend:8185
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=copilot
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # LLM 配置
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8087:8087"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8087'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Model 模块 (数据标准与建模) ====================

  model-backend:
    image: ${REGISTRY:-localhost:5001}/addp-model-backend:${IMAGE_TAG:-latest}
    container_name: model-backend
    environment:
      - SERVICE_HOST=model-backend
      - PORT=8181
      - SYSTEM_URL=http://system-backend:8180
      - STANDARD_URL=http://standard-backend:8110
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=model
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    ports:
