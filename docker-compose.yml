# ADDP 平台服务配置
# Platform Layer: System, business modules, Gateway, Console and Nginx
#
# 容器化平台模块配置；本机源码开发由 scripts/dev/ 管理。
#
# 前置条件: 需要先启动基础设施层
#   docker compose -f docker-compose.infra.yml up -d
#
# 基本使用:
#   启动平台服务: docker compose -f docker-compose.yml up -d
#   启动内置 Runtime: docker compose -f docker-compose.runtimes.yml up -d
#   停止平台服务: docker compose -f docker-compose.yml down
#   停止内置 Runtime: docker compose -f docker-compose.runtimes.yml down
#   查看日志:     docker compose logs -f
#   服务状态:     docker compose ps
#
# 环境变量配置（可选，支持不同部署场景）:
#   Compose project 为 addp-platform；内置 Runtime 由 docker-compose.runtimes.yml 管理
#   NGINX_PORT           - Nginx 统一网关端口（默认: 80）
#   NGINX_BIND_HOST      - Nginx 宿主机监听地址（默认: 0.0.0.0）
#   ADDP_PUBLIC_ORIGIN    - 浏览器与外部客户端访问的统一入口 origin（默认: http://localhost:${NGINX_PORT:-80}）
#   REGISTRY             - 镜像仓库地址（默认: localhost:5001）
#   IMAGE_TAG            - 镜像标签（默认: latest）
#
# Docker Swarm 高可用模式:
#   取消 Worker 服务中的 deploy 配置注释后，使用以下命令部署:
#   docker stack deploy -c docker-compose.yml -c docker-compose.runtimes.yml addp

name: addp-platform

services:
  # ==================== System 模块 ====================

  system-backend:
    image: ${REGISTRY:-localhost:5001}/addp-system-backend:${IMAGE_TAG:-latest}
    container_name: system-backend
    environment:
      - SERVICE_HOST=system-backend
      - ENV=${ENV:-development}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OAUTH_USER_CODE_PEPPER=${OAUTH_USER_CODE_PEPPER:-}
      - OAUTH_PREVIOUS_USER_CODE_PEPPER=${OAUTH_PREVIOUS_USER_CODE_PEPPER:-}
      - IAM_MFA_ENCRYPTION_KEY=${IAM_MFA_ENCRYPTION_KEY:-}
      - PUBLIC_API_URL=${ADDP_PUBLIC_ORIGIN:-http://localhost:${NGINX_PORT:-80}}
      - CONSOLE_URL=${ADDP_PUBLIC_ORIGIN:-http://localhost:${NGINX_PORT:-80}}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1,::1}
      - AGENT_SERVICE_CLIENT_SECRET=${AGENT_SERVICE_CLIENT_SECRET}
      - ASSET_SERVICE_CLIENT_SECRET=${ASSET_SERVICE_CLIENT_SECRET}
      - CATALOG_SERVICE_CLIENT_SECRET=${CATALOG_SERVICE_CLIENT_SECRET}
      - WORKBENCH_SERVICE_CLIENT_SECRET=${WORKBENCH_SERVICE_CLIENT_SECRET}
      - COPILOT_SERVICE_CLIENT_SECRET=${COPILOT_SERVICE_CLIENT_SECRET}
      - DEVELOP_SERVICE_CLIENT_SECRET=${DEVELOP_SERVICE_CLIENT_SECRET}
      - DOCUMENT_WORKFLOW_SERVICE_CLIENT_SECRET=${DOCUMENT_WORKFLOW_SERVICE_CLIENT_SECRET}
      - DUCKDB_SERVICE_CLIENT_SECRET=${DUCKDB_SERVICE_CLIENT_SECRET}
      - GATEWAY_SERVICE_CLIENT_SECRET=${GATEWAY_SERVICE_CLIENT_SECRET}
      - GRAPH_SERVICE_CLIENT_SECRET=${GRAPH_SERVICE_CLIENT_SECRET}
      - GEOPYTHON_WORKFLOW_SERVICE_CLIENT_SECRET=${GEOPYTHON_WORKFLOW_SERVICE_CLIENT_SECRET}
      - INFERENCE_SERVICE_CLIENT_SECRET=${INFERENCE_SERVICE_CLIENT_SECRET}
      - MANAGER_SERVICE_CLIENT_SECRET=${MANAGER_SERVICE_CLIENT_SECRET}
      - META_SERVICE_CLIENT_SECRET=${META_SERVICE_CLIENT_SECRET}
      - MODEL_SERVICE_CLIENT_SECRET=${MODEL_SERVICE_CLIENT_SECRET}
      - ONTOLOGY_SERVICE_CLIENT_SECRET=${ONTOLOGY_SERVICE_CLIENT_SECRET}
      - MODEL3D_WORKFLOW_SERVICE_CLIENT_SECRET=${MODEL3D_WORKFLOW_SERVICE_CLIENT_SECRET}
      - MONITOR_SERVICE_CLIENT_SECRET=${MONITOR_SERVICE_CLIENT_SECRET}
      - ORCHESTRATOR_SERVICE_CLIENT_SECRET=${ORCHESTRATOR_SERVICE_CLIENT_SECRET}
      - PORTAL_SERVICE_CLIENT_SECRET=${PORTAL_SERVICE_CLIENT_SECRET}
      - QUALITY_SERVICE_CLIENT_SECRET=${QUALITY_SERVICE_CLIENT_SECRET}
      - SECURITY_SERVICE_CLIENT_SECRET=${SECURITY_SERVICE_CLIENT_SECRET}
      - POINTCLOUD_WORKFLOW_SERVICE_CLIENT_SECRET=${POINTCLOUD_WORKFLOW_SERVICE_CLIENT_SECRET}
      - SERVICE_SERVICE_CLIENT_SECRET=${SERVICE_SERVICE_CLIENT_SECRET}
      - STANDARD_SERVICE_CLIENT_SECRET=${STANDARD_SERVICE_CLIENT_SECRET}
      - SPARK_WORKFLOW_SERVICE_CLIENT_SECRET=${SPARK_WORKFLOW_SERVICE_CLIENT_SECRET}
      - TRANSFER_SERVICE_CLIENT_SECRET=${TRANSFER_SERVICE_CLIENT_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-system}
      # 模块间服务 URL（Docker 环境使用服务名）
      - SYSTEM_URL=http://system-backend:8180
      - META_URL=http://meta-backend:8082
      - TRANSFER_URL=http://transfer-backend:8083
      - MANAGER_URL=http://manager-backend:8081
      - ORCHESTRATOR_URL=http://orchestrator-backend:8084
      - DEVELOP_URL=http://develop-backend:8185
      - GIN_MODE=release
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8180; echo -e \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  system-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-system-frontend:${IMAGE_TAG:-latest}
    container_name: system-frontend
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped

  # ==================== Manager 模块 ====================

  manager-backend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-backend:${IMAGE_TAG:-latest}
    container_name: manager-backend
    environment:
      - SERVICE_HOST=manager-backend
      - PORT=8081
      - DB_SCHEMA=manager
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - SYSTEM_URL=http://system-backend:8180
      - META_URL=http://meta-backend:8082
      - SECURITY_URL=http://security-backend:8194
      - MANAGER_SERVICE_CLIENT_SECRET=${MANAGER_SERVICE_CLIENT_SECRET}
      - TRANSFER_URL=http://transfer-backend:8083
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=false
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-}
      - MEILISEARCH_MANAGER_CONTENT_INDEX=${MEILISEARCH_MANAGER_CONTENT_INDEX:-manager_content_documents}
      - MANAGER_EXECUTION_CONCURRENCY=${MANAGER_EXECUTION_CONCURRENCY:-4}
      - MANAGER_EXECUTION_LEASE_DURATION=${MANAGER_EXECUTION_LEASE_DURATION:-2m}
      - MANAGER_EXECUTION_HEARTBEAT_INTERVAL=${MANAGER_EXECUTION_HEARTBEAT_INTERVAL:-30s}
      - MANAGER_EXECUTION_CLAIM_INTERVAL=${MANAGER_EXECUTION_CLAIM_INTERVAL:-1s}
      - GIN_MODE=release
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081; echo -e \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  manager-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-frontend:${IMAGE_TAG:-latest}
    container_name: manager-frontend
    networks:
      - addp-network
    depends_on:
      - manager-backend
    restart: unless-stopped

  # ==================== Meta 模块 ====================

  meta-backend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-backend:${IMAGE_TAG:-latest}
    container_name: meta-backend
    environment:
      - SERVICE_HOST=meta-backend
      - PORT=8082
      - DB_SCHEMA=meta
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      - META_MINIO_ENDPOINT=minio:9000
      - META_MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - META_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - META_MINIO_USE_SSL=false
      - MANAGER_URL=http://manager-backend:8081
      - SYSTEM_URL=http://system-backend:8180
      - META_SERVICE_CLIENT_SECRET=${META_SERVICE_CLIENT_SECRET}
      - GIN_MODE=release
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082; echo -e \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  meta-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-frontend:${IMAGE_TAG:-latest}
    container_name: meta-frontend
    networks:
      - addp-network
    depends_on:
      - meta-backend
    restart: unless-stopped

  meta-worker:
    image: ${REGISTRY:-localhost:5001}/addp-meta-worker:${IMAGE_TAG:-latest}
    # Note: No container_name for Swarm compatibility (allows multiple replicas)
    environment:
      - DB_SCHEMA=meta
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_URL=http://system-backend:8180
      - META_URL=http://meta-backend:8082
      - MANAGER_URL=http://manager-backend:8081
      - META_SERVICE_CLIENT_SECRET=${META_SERVICE_CLIENT_SECRET}
      - META_WORKER_CONCURRENCY=${META_WORKER_CONCURRENCY:-10}
      - META_BOUNDED_LEASE_DURATION=${META_BOUNDED_LEASE_DURATION:-2m}
      - META_BOUNDED_HEARTBEAT_INTERVAL=${META_BOUNDED_HEARTBEAT_INTERVAL:-30s}
      - META_BOUNDED_CLAIM_INTERVAL=${META_BOUNDED_CLAIM_INTERVAL:-1s}
    networks:
      - addp-network
    depends_on:
      meta-backend:
        condition: service_healthy
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    # Docker Swarm high availability configuration
    # NOTE: deploy config is commented out for docker-compose mode
    # Uncomment when using docker stack deploy (Swarm mode)
    # deploy:
    #   replicas: 1  # Single instance resident (changed from 2 to save 50% memory)
    #   restart_policy:
    #     condition: any  # Restart on any failure
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    #   update_config:
    #     parallelism: 1  # Update one container at a time
    #     delay: 10s
    #     failure_action: rollback
    #     order: start-first  # Start new container before stopping old one
    #   rollback_config:
    #     parallelism: 1
    #     delay: 5s
    #   resources:
    #     limits:
    #       cpus: '2'      # Max 2 CPU cores per worker
    #       memory: 2G     # Max 2GB memory per worker
    #     reservations:
    #       cpus: '0.5'    # Reserve at least 0.5 CPU core
    #       memory: 512M   # Reserve at least 512MB memory

  transfer-backend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-backend:${IMAGE_TAG:-latest}
    container_name: transfer-backend
    environment:
      - SERVICE_HOST=transfer-backend
      - PORT=8083
      - DB_SCHEMA=transfer
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_URL=http://system-backend:8180
      - META_URL=http://meta-backend:8082
      - TRANSFER_SERVICE_CLIENT_SECRET=${TRANSFER_SERVICE_CLIENT_SECRET}
      - INFRA_KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - INFRA_KAFKA_ADMIN_USERNAME=${INFRA_KAFKA_ADMIN_USERNAME:-admin}
      - INFRA_KAFKA_ADMIN_PASSWORD=${INFRA_KAFKA_ADMIN_PASSWORD}
      - INFRA_KAFKA_CONNECT_PASSWORD=${INFRA_KAFKA_CONNECT_PASSWORD}
      - INFRA_KAFKA_TRANSFER_PASSWORD=${INFRA_KAFKA_TRANSFER_PASSWORD}
      - INFRA_KAFKA_CDC_RETENTION=${INFRA_KAFKA_CDC_RETENTION:-168h}
      - INFRA_KAFKA_CDC_RETENTION_BYTES=${INFRA_KAFKA_CDC_RETENTION_BYTES:-}
      - INFRA_KAFKA_CDC_REPLICATION_FACTOR=${INFRA_KAFKA_CDC_REPLICATION_FACTOR:-1}
      - INFRA_KAFKA_DLQ_RETENTION=${INFRA_KAFKA_DLQ_RETENTION:-168h}
      - INFRA_KAFKA_DLQ_RETENTION_BYTES=${INFRA_KAFKA_DLQ_RETENTION_BYTES:-}
      - INFRA_KAFKA_DLQ_REPLICATION_FACTOR=${INFRA_KAFKA_DLQ_REPLICATION_FACTOR:-1}
      - INFRA_KAFKA_SECURITY_PROTOCOL=${INFRA_KAFKA_SECURITY_PROTOCOL:-sasl_plaintext}
      - INFRA_KAFKA_SASL_MECHANISM=${INFRA_KAFKA_SASL_MECHANISM:-scram-sha-256}
      - INFRA_KAFKA_TLS_CA_CERT_FILE=${INFRA_KAFKA_TLS_CA_CERT_FILE:-}
      - INFRA_KAFKA_TLS_INSECURE_SKIP_VERIFY=${INFRA_KAFKA_TLS_INSECURE_SKIP_VERIFY:-false}
      - KAFKA_CONNECT_URL=http://kafka-connect:8083
      - KAFKA_CONNECT_USERNAME=${KAFKA_CONNECT_USERNAME:-}
      - KAFKA_CONNECT_PASSWORD=${KAFKA_CONNECT_PASSWORD:-}
      - KAFKA_CONNECT_TIMEOUT=${KAFKA_CONNECT_TIMEOUT:-15s}
      - KAFKA_CONNECT_LOOPBACK_HOST=${KAFKA_CONNECT_LOOPBACK_HOST:-host.docker.internal}
      - KAFKA_CONNECT_BOOTSTRAP_SERVERS=redpanda:29092
      - KAFKA_CONNECT_KAFKA_USERNAME=${KAFKA_CONNECT_KAFKA_USERNAME:-connect}
      - KAFKA_CONNECT_KAFKA_SECURITY_PROTOCOL=${KAFKA_CONNECT_KAFKA_SECURITY_PROTOCOL:-sasl_plaintext}
      - KAFKA_CONNECT_KAFKA_TLS_CA_CERT_FILE=${KAFKA_CONNECT_KAFKA_TLS_CA_CERT_FILE:-}
      - TRANSFER_CAPTURE_PROVISIONING_TIMEOUT=${TRANSFER_CAPTURE_PROVISIONING_TIMEOUT:-60s}
      - TRANSFER_CAPTURE_STATUS_POLL_INTERVAL=${TRANSFER_CAPTURE_STATUS_POLL_INTERVAL:-1s}
      - TRANSFER_CAPTURE_MONITOR_INTERVAL=${TRANSFER_CAPTURE_MONITOR_INTERVAL:-15s}
      - TRANSFER_CONTINUOUS_RUNTIME_STOP_TIMEOUT=${TRANSFER_CONTINUOUS_RUNTIME_STOP_TIMEOUT:-45s}
      - TRANSFER_CONTINUOUS_RUNTIME_STOP_POLL_INTERVAL=${TRANSFER_CONTINUOUS_RUNTIME_STOP_POLL_INTERVAL:-250ms}
      - TRANSFER_META_SCAN_CLAIM_TTL=${TRANSFER_META_SCAN_CLAIM_TTL:-2m}
      - TRANSFER_DLQ_RECONCILE_INTERVAL=${TRANSFER_DLQ_RECONCILE_INTERVAL:-1m}
      - TRANSFER_DLQ_RECONCILE_BATCH_SIZE=${TRANSFER_DLQ_RECONCILE_BATCH_SIZE:-100}
      - TRANSFER_DLQ_RECONCILE_TIMEOUT=${TRANSFER_DLQ_RECONCILE_TIMEOUT:-10s}
      - TRANSFER_DLQ_RECONCILE_FETCH_MAX_BYTES=${TRANSFER_DLQ_RECONCILE_FETCH_MAX_BYTES:-10485760}
      - GIN_MODE=release
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083; echo -e \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  transfer-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-frontend:${IMAGE_TAG:-latest}
    container_name: transfer-frontend
    networks:
      - addp-network
    depends_on:
      - transfer-backend
    restart: unless-stopped

  transfer-bounded-worker: &transfer-bounded-worker
    image: ${REGISTRY:-localhost:5001}/addp-transfer-bounded-worker:${IMAGE_TAG:-latest}
    # Note: No container_name for Swarm compatibility (allows multiple replicas)
    environment:
      - DB_SCHEMA=transfer
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_URL=http://system-backend:8180
      - META_URL=http://meta-backend:8082
      - TRANSFER_SERVICE_CLIENT_SECRET=${TRANSFER_SERVICE_CLIENT_SECRET}
      - TRANSFER_BOUNDED_WORKER_CONCURRENCY=${TRANSFER_BOUNDED_WORKER_CONCURRENCY:-10}
      - TRANSFER_BOUNDED_LEASE_DURATION=${TRANSFER_BOUNDED_LEASE_DURATION:-2m}
      - TRANSFER_BOUNDED_HEARTBEAT_INTERVAL=${TRANSFER_BOUNDED_HEARTBEAT_INTERVAL:-30s}
      - TRANSFER_BOUNDED_CLAIM_INTERVAL=${TRANSFER_BOUNDED_CLAIM_INTERVAL:-1s}
      - INFRA_KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - INFRA_KAFKA_ADMIN_USERNAME=${INFRA_KAFKA_ADMIN_USERNAME:-admin}
      - INFRA_KAFKA_ADMIN_PASSWORD=${INFRA_KAFKA_ADMIN_PASSWORD}
      - INFRA_KAFKA_CONNECT_PASSWORD=${INFRA_KAFKA_CONNECT_PASSWORD}
      - INFRA_KAFKA_TRANSFER_PASSWORD=${INFRA_KAFKA_TRANSFER_PASSWORD}
      - INFRA_KAFKA_CDC_RETENTION=${INFRA_KAFKA_CDC_RETENTION:-168h}
      - INFRA_KAFKA_CDC_RETENTION_BYTES=${INFRA_KAFKA_CDC_RETENTION_BYTES:-}
      - INFRA_KAFKA_CDC_REPLICATION_FACTOR=${INFRA_KAFKA_CDC_REPLICATION_FACTOR:-1}
      - INFRA_KAFKA_DLQ_RETENTION=${INFRA_KAFKA_DLQ_RETENTION:-168h}
      - INFRA_KAFKA_DLQ_RETENTION_BYTES=${INFRA_KAFKA_DLQ_RETENTION_BYTES:-}
      - INFRA_KAFKA_DLQ_REPLICATION_FACTOR=${INFRA_KAFKA_DLQ_REPLICATION_FACTOR:-1}
      - INFRA_KAFKA_SECURITY_PROTOCOL=${INFRA_KAFKA_SECURITY_PROTOCOL:-sasl_plaintext}
      - INFRA_KAFKA_SASL_MECHANISM=${INFRA_KAFKA_SASL_MECHANISM:-scram-sha-256}
      - INFRA_KAFKA_TLS_CA_CERT_FILE=${INFRA_KAFKA_TLS_CA_CERT_FILE:-}
      - INFRA_KAFKA_TLS_INSECURE_SKIP_VERIFY=${INFRA_KAFKA_TLS_INSECURE_SKIP_VERIFY:-false}
      - KAFKA_CONNECT_URL=http://kafka-connect:8083
      - KAFKA_CONNECT_USERNAME=${KAFKA_CONNECT_USERNAME:-}
      - KAFKA_CONNECT_PASSWORD=${KAFKA_CONNECT_PASSWORD:-}
      - KAFKA_CONNECT_TIMEOUT=${KAFKA_CONNECT_TIMEOUT:-15s}
      - KAFKA_CONNECT_LOOPBACK_HOST=${KAFKA_CONNECT_LOOPBACK_HOST:-host.docker.internal}
      - KAFKA_CONNECT_BOOTSTRAP_SERVERS=redpanda:29092
      - KAFKA_CONNECT_KAFKA_USERNAME=${KAFKA_CONNECT_KAFKA_USERNAME:-connect}
      - KAFKA_CONNECT_KAFKA_SECURITY_PROTOCOL=${KAFKA_CONNECT_KAFKA_SECURITY_PROTOCOL:-sasl_plaintext}
      - KAFKA_CONNECT_KAFKA_TLS_CA_CERT_FILE=${KAFKA_CONNECT_KAFKA_TLS_CA_CERT_FILE:-}
      - TRANSFER_CAPTURE_PROVISIONING_TIMEOUT=${TRANSFER_CAPTURE_PROVISIONING_TIMEOUT:-60s}
      - TRANSFER_CAPTURE_STATUS_POLL_INTERVAL=${TRANSFER_CAPTURE_STATUS_POLL_INTERVAL:-1s}
      - TRANSFER_CAPTURE_MONITOR_INTERVAL=${TRANSFER_CAPTURE_MONITOR_INTERVAL:-15s}
      - TRANSFER_CONTINUOUS_RUNTIME_STOP_TIMEOUT=${TRANSFER_CONTINUOUS_RUNTIME_STOP_TIMEOUT:-45s}
      - TRANSFER_CONTINUOUS_RUNTIME_STOP_POLL_INTERVAL=${TRANSFER_CONTINUOUS_RUNTIME_STOP_POLL_INTERVAL:-250ms}
      - TRANSFER_META_SCAN_CLAIM_TTL=${TRANSFER_META_SCAN_CLAIM_TTL:-2m}
      - TRANSFER_DLQ_RECONCILE_INTERVAL=${TRANSFER_DLQ_RECONCILE_INTERVAL:-1m}
      - TRANSFER_DLQ_RECONCILE_BATCH_SIZE=${TRANSFER_DLQ_RECONCILE_BATCH_SIZE:-100}
      - TRANSFER_DLQ_RECONCILE_TIMEOUT=${TRANSFER_DLQ_RECONCILE_TIMEOUT:-10s}
      - TRANSFER_DLQ_RECONCILE_FETCH_MAX_BYTES=${TRANSFER_DLQ_RECONCILE_FETCH_MAX_BYTES:-10485760}
    networks:
      - addp-network
    depends_on:
