# ADDP 应用服务层配置
# Application Layer: All ADDP microservices (System, Manager, Meta, Transfer, Orchestrator, Develop, Gateway)
#
# 🎯 这是合并后的统一配置文件，适用于开发、测试和生产环境
#
# 前置条件: 需要先启动基础设施层
#   docker compose -f docker-compose.infra.yml up -d
#
# 基本使用:
#   启动所有服务: docker compose up -d
#   停止所有服务: docker compose down
#   查看日志:     docker compose logs -f
#   服务状态:     docker compose ps
#
# 环境变量配置（可选，支持不同部署场景）:
#   COMPOSE_PROJECT_NAME - 项目名称前缀，用于容器命名（默认: addp）
#   NGINX_PORT           - Nginx 统一网关端口（默认: 80）
#   PORTAL_PORT          - Portal 独立访问端口（默认: 5170）
#   REGISTRY             - 镜像仓库地址（默认: localhost:5001）
#   IMAGE_TAG            - 镜像标签（默认: latest）
#
# Docker Swarm 高可用模式:
#   取消 Worker 服务中的 deploy 配置注释后，使用以下命令部署:
#   docker stack deploy -c docker-compose.yml addp

name: addp-app

services:
  # ==================== System 模块 ====================

  system-backend:
    image: ${REGISTRY:-localhost:5001}/addp-system-backend:${IMAGE_TAG:-latest}
    container_name: system-backend
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-SuperAdmin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-20251001#SuperAdmin}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@addp.com}
      # 内置引擎服务 URL（Docker 环境使用服务名）
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - META_SERVICE_URL=http://meta-backend:8082
      - TRANSFER_SERVICE_URL=http://transfer-backend:8083
      - MANAGER_SERVICE_URL=http://manager-backend:8081
      - ORCHESTRATOR_SERVICE_URL=http://orchestrator-backend:8084
      - DEVELOP_SERVICE_URL=http://develop-backend:8085
      - GEOPANDAS_ENGINE_URL=http://geopandas-engine:8099
      - GIN_MODE=release
    ports:
      - "8080:8080"
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  system-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-system-frontend:${IMAGE_TAG:-latest}
    container_name: system-frontend
    ports:
      - "8090:80"
    networks:
      - addp-network
    depends_on:
      - system-backend
    restart: unless-stopped

  # ==================== Manager 模块 ====================

  manager-backend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-backend:${IMAGE_TAG:-latest}
    container_name: manager-backend
    environment:
      - PORT=8081
      - DB_SCHEMA=manager
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8081:8081"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  manager-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-manager-frontend:${IMAGE_TAG:-latest}
    container_name: manager-frontend
    ports:
      - "8091:80"
    networks:
      - addp-network
    depends_on:
      - manager-backend
    restart: unless-stopped

  manager-worker:
    image: ${REGISTRY:-localhost:5001}/addp-manager-worker:${IMAGE_TAG:-latest}
    # Note: No container_name for Swarm compatibility (allows multiple replicas)
    environment:
      - DB_SCHEMA=manager
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=10
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_USE_SSL=false
    networks:
      - addp-network
    depends_on:
      - manager-backend
    restart: unless-stopped
    # Docker Swarm high availability configuration
    # NOTE: deploy config is commented out for docker-compose mode
    # Uncomment when using docker stack deploy (Swarm mode)
    # deploy:
    #   replicas: 1  # Single instance resident (changed from 2 to save 50% memory)
    #   restart_policy:
    #     condition: any  # Restart on any failure
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    #   update_config:
    #     parallelism: 1  # Update one container at a time
    #     delay: 10s
    #     failure_action: rollback
    #     order: start-first  # Start new container before stopping old one
    #   rollback_config:
    #     parallelism: 1
    #     delay: 5s
    #   resources:
    #     limits:
    #       cpus: '2'      # Max 2 CPU cores per worker
    #       memory: 2G     # Max 2GB memory per worker
    #     reservations:
    #       cpus: '0.5'    # Reserve at least 0.5 CPU core
    #       memory: 512M   # Reserve at least 512MB memory

  # ==================== Meta 模块 ====================

  meta-backend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-backend:${IMAGE_TAG:-latest}
    container_name: meta-backend
    environment:
      - PORT=8082
      - DB_SCHEMA=metadata
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8082:8082"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  meta-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-meta-frontend:${IMAGE_TAG:-latest}
    container_name: meta-frontend
    ports:
      - "8092:80"
    networks:
      - addp-network
    depends_on:
      - meta-backend
    restart: unless-stopped

  meta-worker:
    image: ${REGISTRY:-localhost:5001}/addp-meta-worker:${IMAGE_TAG:-latest}
    # Note: No container_name for Swarm compatibility (allows multiple replicas)
    environment:
      - DB_SCHEMA=metadata
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=10
    networks:
      - addp-network
    depends_on:
      - meta-backend
    restart: unless-stopped
    # Docker Swarm high availability configuration
    # NOTE: deploy config is commented out for docker-compose mode
    # Uncomment when using docker stack deploy (Swarm mode)
    # deploy:
    #   replicas: 1  # Single instance resident (changed from 2 to save 50% memory)
    #   restart_policy:
    #     condition: any  # Restart on any failure
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    #   update_config:
    #     parallelism: 1  # Update one container at a time
    #     delay: 10s
    #     failure_action: rollback
    #     order: start-first  # Start new container before stopping old one
    #   rollback_config:
    #     parallelism: 1
    #     delay: 5s
    #   resources:
    #     limits:
    #       cpus: '2'      # Max 2 CPU cores per worker
    #       memory: 2G     # Max 2GB memory per worker
    #     reservations:
    #       cpus: '0.5'    # Reserve at least 0.5 CPU core
    #       memory: 512M   # Reserve at least 512MB memory

  # ==================== Transfer 模块 ====================

  transfer-backend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-backend:${IMAGE_TAG:-latest}
    container_name: transfer-backend
    environment:
      - PORT=8083
      - DB_SCHEMA=transfer
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8083:8083"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  transfer-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-frontend:${IMAGE_TAG:-latest}
    container_name: transfer-frontend
    ports:
      - "8093:80"
    networks:
      - addp-network
    depends_on:
      - transfer-backend
    restart: unless-stopped

  transfer-worker:
    image: ${REGISTRY:-localhost:5001}/addp-transfer-worker:${IMAGE_TAG:-latest}
    # Note: No container_name for Swarm compatibility (allows multiple replicas)
    environment:
      - DB_SCHEMA=transfer
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - CONCURRENT_TASKS=15
    networks:
      - addp-network
    depends_on:
      - transfer-backend
    restart: unless-stopped
    # Docker Swarm high availability configuration
    # NOTE: deploy config is commented out for docker-compose mode
    # Uncomment when using docker stack deploy (Swarm mode)
    # deploy:
    #   replicas: 1  # Single instance resident (changed from 2 to save 50% memory)
    #   restart_policy:
    #     condition: any  # Restart on any failure
    #     delay: 5s
    #     max_attempts: 3
    #     window: 120s
    #   update_config:
    #     parallelism: 1  # Update one container at a time
    #     delay: 10s
    #     failure_action: rollback
    #     order: start-first  # Start new container before stopping old one
    #   rollback_config:
    #     parallelism: 1
    #     delay: 5s
    #   resources:
    #     limits:
    #       cpus: '2'      # Max 2 CPU cores per worker
    #       memory: 2G     # Max 2GB memory per worker
    #     reservations:
    #       cpus: '0.5'    # Reserve at least 0.5 CPU core
    #       memory: 512M   # Reserve at least 512MB memory

  # ==================== Orchestrator 模块 ====================

  orchestrator-backend:
    image: ${REGISTRY:-localhost:5001}/addp-orchestrator-backend:${IMAGE_TAG:-latest}
    container_name: orchestrator-backend
    environment:
      - PORT=8084
      - DB_SCHEMA=orchestrator
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-addp}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENABLE_SERVICE_INTEGRATION=true
      - GIN_MODE=release
    ports:
      - "8084:8084"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  orchestrator-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-orchestrator-frontend:${IMAGE_TAG:-latest}
    container_name: orchestrator-frontend
    ports:
      - "8094:80"
    networks:
      - addp-network
    depends_on:
      - orchestrator-backend
    restart: unless-stopped

  # ==================== Develop 模块 (SQL 开发工作台) ====================

  develop-backend:
    image: ${REGISTRY:-localhost:5001}/addp-develop-backend:${IMAGE_TAG:-latest}
    container_name: develop-backend
    environment:
      - PORT=8085
      - ENV=production
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - GEOPANDAS_ENGINE_URL=http://geopandas-engine:8099
      - ENABLE_SERVICE_INTEGRATION=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=develop
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GIN_MODE=release
    ports:
      - "8085:8085"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  develop-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-develop-frontend:${IMAGE_TAG:-latest}
    container_name: develop-frontend
    ports:
      - "8095:80"
    networks:
      - addp-network
    depends_on:
      - develop-backend
    restart: unless-stopped

  # ==================== GeoPandas Engine (空间计算引擎) ====================

  geopandas-engine:
    build:
      context: ./geopandas-engine
      dockerfile: Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-geopandas-engine:${IMAGE_TAG:-latest}
    container_name: geopandas-engine
    environment:
      - PORT=8099
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=develop
    ports:
      - "8099:8099"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Gateway 服务 ====================

  gateway:
    image: ${REGISTRY:-localhost:5001}/addp-gateway:${IMAGE_TAG:-latest}
    container_name: gateway
    environment:
      - PORT=8000
      - SYSTEM_SERVICE_URL=http://system-backend:8080
      - MANAGER_SERVICE_URL=http://manager-backend:8081
      - META_SERVICE_URL=http://meta-backend:8082
      - TRANSFER_SERVICE_URL=http://transfer-backend:8083
      - ORCHESTRATOR_SERVICE_URL=http://orchestrator-backend:8084
      - DEVELOP_SERVICE_URL=http://develop-backend:8085
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - GIN_MODE=release
    ports:
      - "8000:8000"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Portal 统一门户 ====================

  portal:
    image: ${REGISTRY:-localhost:5001}/addp-portal:${IMAGE_TAG:-latest}
    container_name: portal
    ports:
      - "${PORTAL_PORT:-5170}:80"  # Portal 可独立访问（开发调试用）
    networks:
      - addp-network
    depends_on:
      - gateway
    restart: unless-stopped

  # ==================== Nginx 统一网关 ====================

  nginx:
    image: ${REGISTRY:-localhost:5001}/addp-nginx:${IMAGE_TAG:-latest}
    container_name: addp-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - addp-network
    depends_on:
      - portal
      - gateway
      - system-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  addp-network:
    external: true
    name: addp-network
