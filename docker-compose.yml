services:
  # ==================== 基础设施服务 ====================

  # PostgreSQL - ADDP系统数据库
  # ARM64 (Apple Silicon): 使用标准 PostgreSQL + PostGIS 扩展 (通过 infra-init-postgis.sh 安装)
  # AMD64: 可使用 POSTGRES_IMAGE=postgis/postgis:15-3.4 直接使用预装镜像
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15}
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}  # Auto-detect or default to ARM64
    container_name: addp-postgres
    environment:
      POSTGRES_USER: addp
      POSTGRES_PASSWORD: addp_password
      POSTGRES_DB: addp
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U addp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addp-network

  # Redis - 缓存和任务队列
  redis:
    image: redis:6.2.19-alpine
    container_name: addp-redis
    command: redis-server --requirepass addp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "addp_redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addp-network

  # MinIO - ADDP系统文件存储
  minio:
    image: minio/minio:latest
    container_name: addp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addp-network

  # Elasticsearch - 全文检索
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    container_name: addp-elasticsearch
    environment:
      - node.name=addp-elasticsearch
      - cluster.name=addp-es
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - addp-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  addp-network:
    driver: bridge
