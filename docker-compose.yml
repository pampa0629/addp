services:
  # ==================== 基础设施服务 ====================

  # PostgreSQL with PostGIS + pgvector - ADDP系统数据库
  # ARM64: imresamu/postgis-arm64:15-3.4 (PostGIS pre-installed, pgvector via script)
  # AMD64: postgis/postgis:15-3.4 (PostGIS pre-installed, pgvector via script)
  postgres:
    image: ${POSTGRES_IMAGE:-imresamu/postgis-arm64:15-3.4}
    container_name: addp-postgres
    environment:
      POSTGRES_USER: addp
      POSTGRES_PASSWORD: addp_password
      POSTGRES_DB: addp
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U addp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addp-network

  # Redis - 缓存和任务队列
  redis:
    image: redis:6.2.19-alpine
    container_name: addp-redis
    command: redis-server --requirepass addp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "addp_redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addp-network

  # MinIO - ADDP系统文件存储
  minio:
    image: minio/minio:latest
    container_name: addp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addp-network

  # Meilisearch - 全文检索
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: addp-meilisearch
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-your-master-key-change-in-production}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - addp-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  meilisearch_data:
    driver: local

networks:
  addp-network:
    driver: bridge
