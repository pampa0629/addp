  graph-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-graph-frontend:${IMAGE_TAG:-latest}
    container_name: graph-frontend
    ports:
      - "8118:80"
    networks:
      - addp-network
    depends_on:
      - graph-backend
    restart: unless-stopped

  # ==================== Agent 模块 ====================

  agent-backend:
    build:
      context: .
      dockerfile: agent/backend/Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-agent-backend:${IMAGE_TAG:-latest}
    container_name: agent-backend
    environment:
      - SERVICE_HOST=agent-backend
      - AGENT_BACKEND_PORT=8190
      - AGENT_DB_SCHEMA=agent
      - GATEWAY_URL=http://gateway:8000
      - SYSTEM_URL=http://system-backend:8180
      - MANAGER_URL=http://manager-backend:8081
      - META_URL=http://meta-backend:8082
      - DEVELOP_URL=http://develop-backend:8185
      - COPILOT_URL=http://copilot-backend:8087
      - GRAPH_URL=http://graph-backend:8186
      - AGENT_SERVICE_CLIENT_SECRET=${AGENT_SERVICE_CLIENT_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
    ports:
      - "8190:8190"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8190/health/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  agent-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-agent-frontend:${IMAGE_TAG:-latest}
    container_name: agent-frontend
    ports:
      - "8117:80"
    networks:
      - addp-network
    depends_on:
      - agent-backend
    restart: unless-stopped
  # ==================== Jupyter Engine (Notebook 开发引擎) ====================

  jupyter-engine:
    build:
      context: .
      dockerfile: engines/jupyter/Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-jupyter-engine:${IMAGE_TAG:-latest}
    container_name: jupyter-engine
    environment:
      - API_PORT=8097
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - SYSTEM_URL=http://system-backend:8180
      - LOG_LEVEL=${LOG_LEVEL:-info}
    expose:
      - "8097"
    volumes:
      - ./logs:/app/logs
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==================== GeoPython Workflow (Python 数据处理工作流引擎) ====================

  geopython-workflow-engine:
    build:
      context: .
      dockerfile: engines/geopython-workflow/Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-geopython-workflow-engine:${IMAGE_TAG:-latest}
    container_name: geopython-workflow-engine
    environment:
      - RUNTIME_HOST=geopython-workflow-engine
      - PORT=8099
      - SYSTEM_URL=http://system-backend:8180
      - GEOPYTHON_WORKFLOW_SERVICE_CLIENT_SECRET=${GEOPYTHON_WORKFLOW_SERVICE_CLIENT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GEOPYTHON_WORKFLOW_GUNICORN_TIMEOUT=${GEOPYTHON_WORKFLOW_GUNICORN_TIMEOUT:-7200}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=develop
    ports:
      - "8099:8099"
    volumes:
      - ./logs:/app/logs
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8099/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Model3D Workflow Engine（三维模型转换工作流引擎） ====================

  model3d-workflow-engine:
    image: ${REGISTRY:-localhost:5001}/addp-model3d-workflow-engine:${IMAGE_TAG:-latest}
    container_name: model3d-workflow-engine
    environment:
      - RUNTIME_HOST=model3d-workflow-engine
      - PORT=8101
      - SYSTEM_URL=http://system-backend:8180
      - MODEL3D_WORKFLOW_SERVICE_CLIENT_SECRET=${MODEL3D_WORKFLOW_SERVICE_CLIENT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MODEL3D_CONVERTER_BIN=/opt/addp/model3d-workflow/bin/_3dtile
      - MODEL3D_MESH_CONVERTER_BIN=/usr/bin/assimp
      - MODEL3D_GAUSSIAN_SPLAT_NODE_BIN=/usr/bin/node
      - GDAL_DATA=/opt/addp/model3d-workflow/bin/gdal
      - PROJ_DATA=/opt/addp/model3d-workflow/bin/proj
      - OSG_LIBRARY_PATH=/opt/addp/model3d-workflow/bin/osgPlugins-3.6.5
    ports:
      - "8101:8101"
    volumes:
      - ./logs:/app/logs
      - ${MODEL3D_DATA_HOST_PATH:-./business/nfs/data}:${MODEL3D_DATA_CONTAINER_PATH:-/Users/pampa/code/addp/business/nfs/data}:ro
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== PointCloud Workflow Engine（点云处理工作流引擎） ====================

  pointcloud-workflow-engine:
    build:
      context: .
      dockerfile: engines/pointcloud-workflow/Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-pointcloud-workflow-engine:${IMAGE_TAG:-latest}
    container_name: pointcloud-workflow-engine
    environment:
      - PORT=8102
      - SYSTEM_URL=http://system-backend:8180
      - POINTCLOUD_WORKFLOW_SERVICE_CLIENT_SECRET=${POINTCLOUD_WORKFLOW_SERVICE_CLIENT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - POINTCLOUD_PDAL_BIN=/opt/conda/bin/pdal
      - POINTCLOUD_WORK_DIR=/work/pointcloud
      - CPL_TMPDIR=/work/pointcloud
      - RUNTIME_HOST=pointcloud-workflow-engine
    ports:
      - "8102:8102"
    volumes:
      - ./logs:/app/logs
      - ${POINTCLOUD_WORK_HOST_PATH:-./data/pointcloud-work}:/work/pointcloud
      - ${POINTCLOUD_DATA_HOST_PATH:-./business/nfs/data}:${POINTCLOUD_DATA_CONTAINER_PATH:-/Users/pampa/code/addp/business/nfs/data}:ro
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Document Workflow Engine（文档静态预览转换引擎） ====================

  document-workflow-engine:
    build:
      context: .
      dockerfile: engines/document-workflow/Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-document-workflow-engine:${IMAGE_TAG:-latest}
    container_name: document-workflow-engine
    environment:
      - PORT=8105
      - SYSTEM_URL=http://system-backend:8180
      - DOCUMENT_WORKFLOW_SERVICE_CLIENT_SECRET=${DOCUMENT_WORKFLOW_SERVICE_CLIENT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DOCUMENT_LIBREOFFICE_BIN=/usr/bin/soffice
      - DOCUMENT_WORK_DIR=/work/document
      - DOCUMENT_CONVERSION_CONCURRENCY=${DOCUMENT_CONVERSION_CONCURRENCY:-1}
      - DOCUMENT_CONVERSION_TIMEOUT_SECONDS=${DOCUMENT_CONVERSION_TIMEOUT_SECONDS:-600}
      - DOCUMENT_OBJECT_STORE_LOOPBACK_HOST=${DOCUMENT_OBJECT_STORE_LOOPBACK_HOST:-host.docker.internal}
      - RUNTIME_HOST=document-workflow-engine
    ports:
      - "8105:8105"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=67108864
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ${DOCUMENT_WORK_HOST_PATH:-./data/document-work}:/work/document
      - ${DOCUMENT_DATA_HOST_PATH:-./business/nfs/data}:${DOCUMENT_DATA_CONTAINER_PATH:-/Users/pampa/code/addp/business/nfs/data}:ro
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8105/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== SuperMap Workflow Engine（超图工作流引擎） ====================

  supermap-workflow-engine:
    image: ${REGISTRY:-localhost:5001}/addp-supermap-workflow-engine:${IMAGE_TAG:-latest}
    container_name: supermap-workflow-engine
    platform: ${SUPERMAP_WORKFLOW_PLATFORM:-linux/arm64}
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    environment:
      - PORT=8103
      - SYSTEM_URL=http://system-backend:8180
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8103:8103"
    volumes:
      - ./logs:/app/logs
      - ${SUPERMAP_OUTPUT_HOST_PATH:-/tmp/supermap-out}:/tmp/supermap-out
      - ${SUPERMAP_DATA_HOST_PATH:-./business/nfs/data}:/mnt/supermap/data:ro
    networks:
      - addp-network
    restart: unless-stopped
    mem_limit: ${SUPERMAP_WORKFLOW_MEMORY_LIMIT:-8g}
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 2 -fsS http://127.0.0.1:8103/health | grep -q '\"status\":\"healthy\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  spark-workflow-engine:
    build:
      context: ./engines/spark-workflow
      dockerfile: Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-spark-workflow-engine:${IMAGE_TAG:-latest}
    container_name: spark-workflow-engine
    environment:
      - RUNTIME_HOST=spark-workflow-engine
      - PORT=8098
      - SYSTEM_URL=http://system-backend:8180
      - SPARK_WORKFLOW_SERVICE_CLIENT_SECRET=${SPARK_WORKFLOW_SERVICE_CLIENT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=develop
      - SPARK_MODE=local
    ports:
      - "8098:8098"
    volumes:
      - ./logs:/app/logs
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Gateway 服务 ====================

  gateway:
    image: ${REGISTRY:-localhost:5001}/addp-gateway:${IMAGE_TAG:-latest}
    container_name: gateway
    environment:
      - PORT=8000
      - SYSTEM_URL=http://system-backend:8180
      - MANAGER_URL=http://manager-backend:8081
      - META_URL=http://meta-backend:8082
      - TRANSFER_URL=http://transfer-backend:8083
      - ORCHESTRATOR_URL=http://orchestrator-backend:8084
      - DEVELOP_URL=http://develop-backend:8185
      - SERVICE_URL=http://service-backend:8086
      - COPILOT_URL=http://copilot-backend:8087
      - MONITOR_URL=http://monitor-backend:8100
      - STANDARD_URL=http://standard-backend:8110
      - MODEL_URL=http://model-backend:8181
      - QUALITY_URL=http://quality-backend:8182
      - ASSET_URL=http://asset-backend:8183
      - PORTAL_URL=http://portal-backend:8184
      - AGENT_URL=http://agent-backend:8190
      - GRAPH_URL=http://graph-backend:8186
      - GATEWAY_SERVICE_CLIENT_SECRET=${GATEWAY_SERVICE_CLIENT_SECRET}
      - GIN_MODE=release
    ports:
      - "8000:8000"
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000; echo -e \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Console 工作台 ====================

  console:
    image: ${REGISTRY:-localhost:5001}/addp-console:${IMAGE_TAG:-latest}
    container_name: console
    ports:
      - "${CONSOLE_PORT:-5170}:80"  # Console 可独立访问（开发调试用）
    networks:
      - addp-network
    depends_on:
      - gateway
    restart: unless-stopped

  # ==================== Nginx 统一网关 ====================

  nginx:
    image: ${REGISTRY:-localhost:5001}/addp-nginx:${IMAGE_TAG:-latest}
    container_name: addp-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - addp-network
    depends_on:
      - console
      - gateway
      - system-frontend
      - agent-frontend
      - graph-frontend
      - inference-frontend
      - workbench-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  addp-network:
    external: true
    name: addp-network
