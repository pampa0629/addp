  # ==================== Asset 模块 ====================

  asset-backend:
    image: ${REGISTRY:-localhost:5001}/addp-asset-backend:${IMAGE_TAG:-latest}
    container_name: asset-backend
    environment:
      - SERVICE_HOST=asset-backend
      - ASSET_BACKEND_PORT=8183
      - SYSTEM_URL=http://system-backend:8180
      - CATALOG_URL=http://catalog-backend:8192
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-}
      - ASSET_SERVICE_CLIENT_SECRET=${ASSET_SERVICE_CLIENT_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8183; echo -e \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  asset-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-asset-frontend:${IMAGE_TAG:-latest}
    container_name: asset-frontend
    networks:
      - addp-network
    depends_on:
      - asset-backend
    restart: unless-stopped

  # ==================== Portal 模块 ====================

  portal-backend:
    image: ${REGISTRY:-localhost:5001}/addp-portal-backend:${IMAGE_TAG:-latest}
    container_name: portal-backend
    environment:
      - PORTAL_BACKEND_PORT=8184
      - SYSTEM_URL=http://system-backend:8180
      - ASSET_URL=http://asset-backend:8183
      - PORTAL_SERVICE_CLIENT_SECRET=${PORTAL_SERVICE_CLIENT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8184; echo -e \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  portal-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-portal-frontend:${IMAGE_TAG:-latest}
    container_name: portal-frontend
    networks:
      - addp-network
    depends_on:
      - portal-backend
    restart: unless-stopped

  # ==================== Graph 模块 ====================

  graph-backend:
    image: ${REGISTRY:-localhost:5001}/addp-graph-backend:${IMAGE_TAG:-latest}
    container_name: graph-backend
    environment:
      - SERVICE_HOST=graph-backend
      - GRAPH_BACKEND_PORT=8186
      - SYSTEM_URL=http://system-backend:8180
      - MODEL_URL=http://model-backend:8181
      - COPILOT_URL=http://copilot-backend:8087
      - GRAPH_SERVICE_CLIENT_SECRET=${GRAPH_SERVICE_CLIENT_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=graph
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8186; echo -e \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Inference 模块 ====================

  inference-backend:
    image: ${REGISTRY:-localhost:5001}/addp-inference-backend:${IMAGE_TAG:-latest}
    container_name: inference-backend
    environment:
      - SERVICE_HOST=inference-backend
      - INFERENCE_BACKEND_PORT=8191
      - SYSTEM_URL=http://system-backend:8180
      - INFERENCE_SERVICE_CLIENT_SECRET=${INFERENCE_SERVICE_CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - DB_SCHEMA=inference
      - GIN_MODE=release
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8191; echo -e \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  inference-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-inference-frontend:${IMAGE_TAG:-latest}
    container_name: inference-frontend
    networks:
      - addp-network
    depends_on:
      - inference-backend
    restart: unless-stopped

  graph-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-graph-frontend:${IMAGE_TAG:-latest}
    container_name: graph-frontend
    networks:
      - addp-network
    depends_on:
      - graph-backend
    restart: unless-stopped

  # ==================== Agent 模块 ====================

  agent-backend:
    build:
      context: .
      dockerfile: agent/backend/Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-agent-backend:${IMAGE_TAG:-latest}
    container_name: agent-backend
    environment:
      - SERVICE_HOST=agent-backend
      - AGENT_BACKEND_PORT=8190
      - AGENT_DB_SCHEMA=agent
      - GATEWAY_URL=http://gateway:8000
      - SYSTEM_URL=http://system-backend:8180
      - MANAGER_URL=http://manager-backend:8081
      - META_URL=http://meta-backend:8082
      - DEVELOP_URL=http://develop-backend:8185
      - COPILOT_URL=http://copilot-backend:8087
      - GRAPH_URL=http://graph-backend:8186
      - AGENT_SERVICE_CLIENT_SECRET=${AGENT_SERVICE_CLIENT_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - REDIS_DB=0
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8190/health/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  agent-frontend:
    image: ${REGISTRY:-localhost:5001}/addp-agent-frontend:${IMAGE_TAG:-latest}
    container_name: agent-frontend
    networks:
      - addp-network
    depends_on:
      - agent-backend
    restart: unless-stopped
  gateway:
    image: ${REGISTRY:-localhost:5001}/addp-gateway:${IMAGE_TAG:-latest}
    container_name: gateway
    environment:
      - PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-addp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-addp_password}
      - POSTGRES_DB=${POSTGRES_DB:-addp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-addp_redis}
      - SYSTEM_URL=http://system-backend:8180
      - MANAGER_URL=http://manager-backend:8081
      - META_URL=http://meta-backend:8082
      - TRANSFER_URL=http://transfer-backend:8083
      - ORCHESTRATOR_URL=http://orchestrator-backend:8084
      - DEVELOP_URL=http://develop-backend:8185
      - SERVICE_URL=http://service-backend:8086
      - COPILOT_URL=http://copilot-backend:8087
      - MONITOR_URL=http://monitor-backend:8100
      - STANDARD_URL=http://standard-backend:8110
      - MODEL_URL=http://model-backend:8181
      - QUALITY_URL=http://quality-backend:8182
      - ASSET_URL=http://asset-backend:8183
      - PORTAL_URL=http://portal-backend:8184
      - AGENT_URL=http://agent-backend:8190
      - GRAPH_URL=http://graph-backend:8186
      - GATEWAY_SERVICE_CLIENT_SECRET=${GATEWAY_SERVICE_CLIENT_SECRET}
      - GIN_MODE=release
    networks:
      - addp-network
    depends_on:
      system-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000; echo -e \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==================== Console 工作台 ====================

  console:
    image: ${REGISTRY:-localhost:5001}/addp-console:${IMAGE_TAG:-latest}
    container_name: console
    networks:
      - addp-network
    depends_on:
      - gateway
    restart: unless-stopped

  # ==================== Nginx 统一网关 ====================

  nginx:
    image: ${REGISTRY:-localhost:5001}/addp-nginx:${IMAGE_TAG:-latest}
    container_name: addp-nginx
    ports:
      - "${NGINX_BIND_HOST:-0.0.0.0}:${NGINX_PORT:-80}:80"
    networks:
      - addp-network
    depends_on:
      - console
      - gateway
      - system-frontend
      - agent-frontend
      - graph-frontend
      - inference-frontend
      - workbench-frontend
      - ontology-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  addp-network:
    external: true
    name: addp-network
