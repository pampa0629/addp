    ports:
      - "8117:80"
    networks:
      - addp-network
    depends_on:
      - agent-backend
    restart: unless-stopped
  # ==================== Jupyter Engine (Notebook 开发引擎) ====================

  jupyter-engine:
    build:
      context: ./engines/jupyter
      dockerfile: Dockerfile
    image: ${REGISTRY:-localhost:5001}/addp-jupyter-engine:${IMAGE_TAG:-latest}
    container_name: jupyter-engine
    environment:
      - JUPYTER_PORT=8088
      - API_PORT=8097
      - JUPYTER_ENABLE_LAB=yes
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - SYSTEM_URL=http://system-backend:8180
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8088:8088"  # Jupyter Lab UI
      - "8097:8097"  # Flask API for notebook execution
    volumes:
      # 挂载到 MinIO 的 notebooks 目录（通过共享卷）
      - jupyter-notebooks:/workspace/notebooks
      - ./logs:/app/logs
    networks:
      - addp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==================== GeoPython Workflow Engine (Python 数据处理工作流引擎) ====================

  python-workflow-engine:
    build:
      context: ./engines/python-workflow
