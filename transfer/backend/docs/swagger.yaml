            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 取消执行 | Cancel execution
      tags:
      - 执行管理 | Execution Management
  /executions/{id}/logs:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: id
        required: true
        type: integer
      - description: 最多返回行数 | Line limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
