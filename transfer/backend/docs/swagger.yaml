        an eligible additive approval or be stopped.
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 启动成功，返回执行记录 | Started successfully, returns execution record
          schema:
            $ref: '#/definitions/github_com_addp_transfer_internal_models.TaskExecution'
        "400":
          description: 参数错误或任务已在运行 | Bad request or task already running
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: CDC 已永久停止或被结构变化阻塞 | CDC permanently stopped or blocked by schema
            change
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
