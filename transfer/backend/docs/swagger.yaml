host: localhost:8083
info:
  contact: {}
  title: ADDP Transfer API
  version: "1.0"
paths:
  /capabilities:
    get:
      description: 返回 Transfer 当前可用的格式能力、业务 Kafka continuous 能力和数据库 CDC 支持矩阵。| Returns
        available Transfer format capabilities, business Kafka continuous features,
        and the database CDC support matrix.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.TransferCapabilitiesResponse'
      security:
      - BearerAuth: []
      summary: 获取传输能力 | Get transfer capabilities
      tags:
      - 传输能力 | Capabilities
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - transfer.task.read
  /executions:
    get:
      parameters:
      - description: 任务ID | Task ID
        in: query
        name: task_id
        type: integer
      - description: 执行状态 | Status
        in: query
        name: status
        type: string
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行列表 | List executions
      tags:
      - 执行管理 | Execution Management
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - transfer.task.read
  /executions/{execution_id}:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: execution_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行详情 | Get execution detail
      tags:
      - 执行管理 | Execution Management
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - transfer.task.read
  /executions/{execution_id}/logs:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: execution_id
        required: true
        type: string
      - description: 最多返回行数 | Line limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行日志 | Get execution logs
      tags:
      - 执行管理 | Execution Management
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - transfer.task.read
  /executions/{execution_id}/progress:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: execution_id
        required: true
