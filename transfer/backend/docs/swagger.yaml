        description: 连接状态缓存（优化扫描性能）
        type: string
      created_at:
        description: 时间戳字段
        type: string
      created_by:
        type: integer
      description:
        type: string
      engine_origin:
        description: 引擎来源：general 或 extension
        type: string
      engine_type:
        description: 引擎类型（postgresql, mysql, python_workflow等）
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_builtin:
        description: 扩展引擎字段
        type: boolean
      last_check_at:
        description: 上次检测时间
        type: string
      name:
        description: 显示名称（原 display_name）
        type: string
      scan_config:
        allOf:
        - $ref: '#/definitions/models.ScanConfig'
        description: 元数据扫描配置（可选）
      tenant_id:
        description: 租户ID，SuperAdmin创建的引擎为null
        type: integer
      updated_at:
        type: string
    type: object
  models.MVTPreprocessConfig:
    properties:
      concurrency:
        description: 并发生成数 (1-20, 默认 10)
        type: integer
      max_zoom:
        description: 最大缩放级别 (0-18, 默认 18)
        type: integer
      stop_threshold_kb:
        description: 自适应停止阈值：平均瓦片大小（KB）< 该值则停止（默认 50.0）
        type: number
      stop_threshold_sec:
        description: 自适应停止阈值：平均生成时间（秒）< 该值则停止（默认 3.0）
        type: number
    type: object
  models.PreprocessingConfig:
    properties:
      auto_trigger:
        description: 扫描完成后自动触发预处理
        type: boolean
      enabled:
        description: 是否启用预处理
        type: boolean
      mvt_config:
        allOf:
        - $ref: '#/definitions/models.MVTPreprocessConfig'
        description: MVT 瓦片预处理配置
      types:
        description: 预处理类型列表 ["mvt_tiles", "vector_embedding"]
        items:
          type: string
        type: array
    type: object
  models.ScanConfig:
    properties:
      cron_expression:
        description: Cron 表达式（schedule_type=cron 时使用）
        type: string
      enabled:
        description: 是否启用扫描（总开关）
        type: boolean
      immediate_depth:
        description: 立即扫描深度：basic（基础）或 deep（深度）
        type: string
      immediate_scan:
        description: 注册后立即扫描
        type: boolean
      preprocessing:
        allOf:
        - $ref: '#/definitions/models.PreprocessingConfig'
        description: 预处理配置（可选）
      scan_depth:
        description: 默认扫描深度：basic 或 deep
        type: string
      schedule_time:
        description: 执行时间 HH:mm（daily/weekly/monthly 时使用）
        type: string
      schedule_type:
        description: daily, weekly, monthly, cron（仅当scheduled_scan=true时有效）
        type: string
      schedule_value:
        description: 周几（0-6）或月几（1-31）
        items:
          type: integer
        type: array
      scheduled_scan:
        description: 启用定时扫描
        type: boolean
    type: object
host: localhost:8083
info:
  contact: {}
  title: ADDP Transfer API
  version: "1.0"
paths:
  /capabilities:
    get:
      description: 返回 Transfer 当前可用于表格传输的格式能力，来源于 common format descriptor 与已加载 plugin
        的接口实现状态 | Returns table transfer format capabilities backed by common format
        descriptors and loaded plugin implementations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.TransferCapabilitiesResponse'
      security:
      - BearerAuth: []
      summary: 获取传输能力 | Get transfer capabilities
      tags:
      - 传输能力 | Capabilities
  /engines:
    get:
      parameters:
      - description: 引擎类型列表 | Engine types
        in: query
        name: engine_types
        type: string
      - description: 数据源类型列表 | Data source types
        in: query
        name: data_source_types
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取存储引擎列表 | List engines
      tags:
      - 数据源 | Data Sources
  /engines/{engine_id}/tree:
    get:
      parameters:
      - description: 引擎ID | Engine ID
        in: path
        name: engine_id
        required: true
        type: integer
      - default: 1
        description: 展开深度 | Expand depth
        in: query
        name: expand_depth
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取引擎元数据树 | Get engine metadata tree
      tags:
      - 数据源 | Data Sources
  /executions:
    get:
      parameters:
      - description: 任务ID | Task ID
        in: query
        name: task_id
        type: integer
      - description: 执行状态 | Status
        in: query
        name: status
        type: string
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行列表 | List executions
      tags:
      - 执行管理 | Execution Management
  /executions/{id}:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行详情 | Get execution detail
      tags:
      - 执行管理 | Execution Management
  /executions/{id}/cancel:
    post:
      parameters:
      - description: 执行ID | Execution ID
        in: path
