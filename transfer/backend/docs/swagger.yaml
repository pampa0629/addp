        confirmed=true 且 confirmation_text 与任务名称完全一致，并删除 ADDP-owned connector、provider
        专属捕获资源、内部 topic、group 和 ACL。| Business Kafka continuous stop keeps committed
        positions. Database CDC stop is irreversible and requires confirmed=true plus
        confirmation_text exactly matching the task name; ADDP-owned connector, provider-specific
        capture resources, internal topics, group, and ACLs are deleted.
