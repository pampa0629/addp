      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: CDC 不可逆停止确认；普通 Kafka continuous 可省略 | Irreversible CDC stop confirmation;
          optional for business Kafka continuous
        in: body
        name: request
        schema:
