            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行日志 | Get execution logs
      tags:
      - 执行管理 | Execution Management
  /executions/{id}/progress:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行进度 | Get execution progress
      tags:
      - 执行管理 | Execution Management
  /executions/{id}/retry:
    post:
      description: 为失败执行创建新的 retry 执行记录，并按 restartable 语义从头重新入队执行 | Create a new retry
        execution for a failed execution and enqueue it from the beginning with restartable
        semantics
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 重试执行 | Retry execution
      tags:
      - 执行管理 | Execution Management
  /executions/statistics:
    get:
      parameters:
      - description: 任务ID | Task ID
        in: query
        name: task_id
        type: integer
      - description: 开始时间 | Start time
        in: query
        name: start_time
        type: string
      - description: 结束时间 | End time
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
