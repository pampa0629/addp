host: localhost:8083
info:
  contact: {}
  title: ADDP Transfer API
  version: "1.0"
paths:
  /tasks:
    get:
      consumes:
      - application/json
      description: 分页获取任务列表，支持按类型、状态过滤 | Get paginated task list with type and status
        filtering
      parameters:
      - default: 1
        description: 页码 | Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页大小 | Page size
        in: query
        name: page_size
        type: integer
      - description: '任务类型: import, export, sync | Task type: import, export, sync'
        in: query
        name: type
        type: string
      - description: '任务状态: pending, running, completed, failed | Task status'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功 | Retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/api.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_addp_transfer_internal_models.TransferTask'
                  type: array
              type: object
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务列表 | List tasks
      tags:
      - 任务管理 | Task Management
    post:
      consumes:
      - application/json
      description: 创建一个新的数据导入/导出/同步任务 | Create a new data import/export/sync task
      parameters:
      - description: 任务创建请求 | Task creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_transfer_internal_models.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 任务创建成功 | Task created successfully
          schema:
            $ref: '#/definitions/github_com_addp_transfer_internal_models.TransferTask'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权 | Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建数据传输任务 | Create data transfer task
      tags:
      - 任务管理 | Task Management
  /tasks/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的任务及相关执行记录 | Delete a specific task and its execution records
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功 | Deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 参数错误 | Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除任务 | Delete task
      tags:
      - 任务管理 | Task Management
    get:
      consumes:
      - application/json
      description: 根据任务ID获取任务的详细信息 | Get detailed task information by task ID
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功 | Retrieved successfully
          schema:
            $ref: '#/definitions/github_com_addp_transfer_internal_models.TransferTask'
        "400":
          description: 参数错误 | Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 任务不存在 | Task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务详情 | Get task detail
      tags:
      - 任务管理 | Task Management
    put:
      consumes:
      - application/json
      description: 更新任务的配置信息 | Update task configuration
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: 任务更新请求 | Task update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_transfer_internal_models.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功 | Updated successfully
          schema:
            $ref: '#/definitions/github_com_addp_transfer_internal_models.TransferTask'
        "400":
          description: 参数错误 | Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新任务 | Update task
      tags:
      - 任务管理 | Task Management
  /tasks/{id}/start:
    post:
      consumes:
      - application/json
      description: 启动任务执行，创建新的执行记录 | Start task execution and create a new execution
        record
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 启动成功，返回执行记录 | Started successfully, returns execution record
          schema:
            $ref: '#/definitions/github_com_addp_transfer_internal_models.TaskExecution'
        "400":
          description: 参数错误或任务已在运行 | Bad request or task already running
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 启动任务 | Start task
      tags:
      - 任务管理 | Task Management
  /tasks/{id}/stop:
    post:
      consumes:
      - application/json
      description: 停止正在执行的任务 | Stop a running task
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 停止成功 | Stopped successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 参数错误 | Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 停止任务 | Stop task
      tags:
      - 任务管理 | Task Management
  /tasks/statistics:
    get:
      consumes:
      - application/json
      description: 获取当前租户的任务统计数据（各状态任务数量等）| Get task statistics for the current tenant
        (task counts by status, etc.)
      produces:
      - application/json
      responses:
        "200":
          description: 统计信息 | Statistics
          schema:
            $ref: '#/definitions/github_com_addp_transfer_internal_models.TaskStatistics'
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务统计信息 | Get task statistics
      tags:
      - 任务管理 | Task Management
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
