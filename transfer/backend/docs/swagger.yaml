host: localhost:8083
info:
  contact: {}
  title: ADDP Transfer API
  version: "1.0"
paths:
  /capabilities:
    get:
      description: 返回 Transfer 当前可用于表格传输的格式能力，来源于 common format descriptor 与已加载 plugin
        的接口实现状态 | Returns table transfer format capabilities backed by common format
        descriptors and loaded plugin implementations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.TransferCapabilitiesResponse'
      security:
      - BearerAuth: []
      summary: 获取传输能力 | Get transfer capabilities
      tags:
      - 传输能力 | Capabilities
  /executions:
    get:
      parameters:
      - description: 任务ID | Task ID
        in: query
        name: task_id
        type: integer
      - description: 执行状态 | Status
        in: query
        name: status
        type: string
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行列表 | List executions
      tags:
      - 执行管理 | Execution Management
  /executions/{execution_id}:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: execution_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行详情 | Get execution detail
      tags:
      - 执行管理 | Execution Management
  /executions/{execution_id}/logs:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: execution_id
        required: true
        type: string
      - description: 最多返回行数 | Line limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行日志 | Get execution logs
      tags:
      - 执行管理 | Execution Management
  /executions/{execution_id}/progress:
    get:
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: execution_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行进度 | Get execution progress
      tags:
      - 执行管理 | Execution Management
  /executions/{execution_id}/retry:
    post:
      description: 为失败执行创建新的 retry 执行记录，并按 restartable 语义从头重新入队执行 | Create a new retry
        execution for a failed execution and enqueue it from the beginning with restartable
        semantics
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: execution_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 重试执行 | Retry execution
      tags:
      - 执行管理 | Execution Management
  /executions/statistics:
    get:
      parameters:
      - description: 任务ID | Task ID
        in: query
        name: task_id
        type: integer
      - description: 开始时间 | Start time
        in: query
        name: start_time
        type: string
      - description: 结束时间 | End time
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行统计 | Get execution statistics
      tags:
      - 执行管理 | Execution Management
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ping
      tags:
      - Transfer
  /system-engines:
    get:
      description: 返回当前租户可见且启用的 System 引擎，用于 Transfer 任务选择 | Returns active System
        engines visible to the current tenant for Transfer task configuration
      parameters:
      - description: 引擎类型 | Engine type
        in: query
        name: engine_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_addp_transfer_internal_models.SystemEngineDoc'
            type: array
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 列出系统引擎 | List system engines
      tags:
      - 系统引擎 | System Engines
  /task-definitions:
    post:
      consumes:
      - application/json
      description: 创建 bounded Transfer 任务。配置必须使用 runtime.boundary、load.mode 和 target.policy.apply_mode；PostgreSQL
        watermark 增量需声明复合游标与目标 keys。旧 mode/write_mode 字段会被拒绝。| Create a bounded Transfer
        task using runtime.boundary, load.mode, and target.policy.apply_mode. PostgreSQL
        watermark incremental tasks must declare a composite cursor and target keys.
        Legacy mode/write_mode fields are rejected.
      parameters:
      - description: 任务创建请求 | Task creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_transfer_internal_models.CreateTaskRequestDoc'
      produces:
      - application/json
      responses:
        "201":
          description: 任务创建成功 | Task created successfully
          schema:
            $ref: '#/definitions/github_com_addp_transfer_internal_models.TransferTask'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 未授权 | Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建数据传输任务 | Create data transfer task
      tags:
      - 任务管理 | Task Management
  /task-definitions/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的任务及相关执行记录 | Delete a specific task and its execution records
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功 | Deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 参数错误 | Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除任务 | Delete task
      tags:
      - 任务管理 | Task Management
    get:
      consumes:
      - application/json
      description: 根据任务ID获取任务的详细信息 | Get detailed task information by task ID
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功 | Retrieved successfully
          schema:
            $ref: '#/definitions/github_com_addp_transfer_internal_models.TransferTask'
        "400":
          description: 参数错误 | Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 任务不存在 | Task not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务详情 | Get task detail
      tags:
      - 任务管理 | Task Management
    put:
      consumes:
      - application/json
      description: 更新任务的配置信息。source 指向已入库 Meta item 时使用 config.source.locator 的 item_id；target
        使用 parent_locator + name；不支持在任务配置中直接传递 endpoint attributes。| Update task configuration.
        Use config.source.locator item_id for persisted Meta items; target uses parent_locator
        + name; endpoint attributes are not accepted in task config.
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: 任务更新请求 | Task update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_transfer_internal_models.UpdateTaskRequestDoc'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功 | Updated successfully
          schema:
            $ref: '#/definitions/github_com_addp_transfer_internal_models.TransferTask'
        "400":
          description: 参数错误 | Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误 | Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新任务 | Update task
      tags:
      - 任务管理 | Task Management
  /task-definitions/{id}/executions:
    get:
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务执行列表 | List task executions
      tags:
      - 执行管理 | Execution Management
  /task-definitions/{id}/pause:
    post:
      description: 关闭任务自身定时调度，不中断当前 active execution | Disable the task-owned schedule
        without interrupting an active execution
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 暂停任务 | Pause task
      tags:
