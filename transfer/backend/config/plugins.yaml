# Transfer 插件配置文件
# 用于动态加载 Reader/Writer 插件

# 插件配置说明：
# - name: 插件显示名称
# - type: 连接器类型标识符（必须与代码中的类型匹配）
# - enabled: 是否启用该插件（默认 true）
# - plugin_path: 外部插件路径（可选，用于加载 .so 动态库）

plugins:
  # ============================================================
  # JDBC 系列（支持 PostgreSQL、MySQL 等关系型数据库）
  # ============================================================
  readers:
    # 通用 JDBC Reader（自动识别驱动类型）
    - name: jdbc
      type: jdbc
      enabled: true
      description: "通用 JDBC Reader，支持 PostgreSQL、MySQL、Oracle 等"

    # PostgreSQL Reader（别名）
    - name: postgresql
      type: postgresql
      enabled: true
      description: "PostgreSQL 数据库 Reader"

    # MySQL Reader（别名）
    - name: mysql
      type: mysql
      enabled: true
      description: "MySQL/MariaDB 数据库 Reader"

    # ============================================================
    # 空间数据格式 Readers
    # ============================================================
    # Shapefile Reader
    - name: shapefile
      type: shapefile
      enabled: true
      description: "ESRI Shapefile 空间数据 Reader"

    # GeoPackage Reader
    - name: geopackage
      type: geopackage
      enabled: true
      description: "OGC GeoPackage 空间数据 Reader"

    # GeoJSON Reader
    - name: geojson
      type: geojson
      enabled: true
      description: "GeoJSON 空间数据 Reader"

    # SpatiaLite Reader（只读）
    - name: spatialite
      type: spatialite
      enabled: true
      description: "SpatiaLite 空间数据库 Reader（输出 WKB 几何）"

    # SQLite Reader（别名，指向 SpatiaLite）
    - name: sqlite
      type: sqlite
      enabled: true
      description: "SQLite 数据库 Reader（需要空间扩展）"

    # SpatiaLite 并行 Reader（高性能版本）
    - name: spatialite_parallel
      type: spatialite_parallel
      enabled: true
      description: "SpatiaLite 并行 Reader（千万级数据优化）"

    # S3/MinIO Shapefile Reader（从对象存储下载后读取）
    - name: s3_shapefile
      type: s3_shapefile
      enabled: true
      description: "从 S3/MinIO 下载 Shapefile 并读取"

    # ============================================================
    # 表格数据格式 Readers
    # ============================================================
    # CSV Reader
    - name: csv
      type: csv
      enabled: true
      description: "CSV 表格数据 Reader"

  # ============================================================
  # Writers 配置
  # ============================================================
  writers:
    # JDBC Writer（通用）
    - name: jdbc
      type: jdbc
      enabled: true
      description: "通用 JDBC Writer，支持 PostgreSQL、MySQL、Oracle 等"

    # PostgreSQL Writer（别名）
    - name: postgresql
      type: postgresql
      enabled: true
      description: "PostgreSQL 数据库 Writer"

    # MySQL Writer（别名）
    - name: mysql
      type: mysql
      enabled: true
      description: "MySQL/MariaDB 数据库 Writer"

    # PostgreSQL COPY Writer（高性能批量导入）
    - name: postgres_copy
      type: postgres_copy
      enabled: true
      description: "PostgreSQL COPY Writer（批量导入优化）"

    # ============================================================
    # 空间数据格式 Writers
    # ============================================================
    # Shapefile Writer
    - name: shapefile
      type: shapefile
      enabled: true
      description: "ESRI Shapefile 空间数据 Writer"

    # GeoPackage Writer
    - name: geopackage
      type: geopackage
      enabled: true
      description: "OGC GeoPackage 空间数据 Writer"

    # GeoJSON Writer
    - name: geojson
      type: geojson
      enabled: true
      description: "GeoJSON 空间数据 Writer"

    # ============================================================
    # 表格数据格式 Writers
    # ============================================================
    # CSV Writer
    - name: csv
      type: csv
      enabled: true
      description: "CSV 表格数据 Writer"

    # ============================================================
    # 对象存储 Writers
    # ============================================================
    # S3 Writer
    - name: s3
      type: s3
      enabled: true
      description: "AWS S3 对象存储 Writer"

    # MinIO Writer（使用 S3 协议）
    - name: minio
      type: minio
      enabled: true
      description: "MinIO 对象存储 Writer（S3 兼容）"

# ============================================================
# 外部插件示例（暂未启用）
# ============================================================
# 如需加载外部插件（.so 动态库），请使用以下格式：
#
# readers:
#   - name: custom_oracle
#     type: oracle
#     enabled: false
#     plugin_path: "/opt/addp/plugins/oracle_reader.so"
#
# writers:
#   - name: custom_hive
#     type: hive
#     enabled: false
#     plugin_path: "/opt/addp/plugins/hive_writer.so"
