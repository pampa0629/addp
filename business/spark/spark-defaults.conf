# Spark + Sedona 默认配置
# 用于 ADDP 业务数据分析和空间计算

# 内存优化
spark.executor.memory=2g
spark.driver.memory=1g
spark.memory.fraction=0.8

# 并行度
spark.default.parallelism=4
spark.sql.shuffle.partitions=4

# Sedona 空间扩展配置
spark.sql.extensions=org.apache.sedona.sql.SedonaSqlExtensions
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.kryo.registrator=org.apache.sedona.core.serde.SedonaKryoRegistrator

# S3/MinIO 配置（用于读取 GeoParquet）
spark.hadoop.fs.s3a.endpoint=http://business-minio:9000
spark.hadoop.fs.s3a.access.key=minioadmin
spark.hadoop.fs.s3a.secret.key=minioadmin
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem

# JDBC 连接池配置
spark.sql.jdbc.fetchSize=1000
spark.sql.jdbc.sessionInit=SET SESSION TIMEZONE='UTC'
