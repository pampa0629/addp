# Business Database Services
# 业务库服务 - 存储用户业务数据
#
# 包含服务:
# - postgres: 业务数据库（PostGIS 支持空间数据）
# - oracle: Oracle Free 23ai 业务数据库（普通表与 Oracle Spatial 只读测试源）
# - supermap-postgresql: SuperMap SDX+ for PostgreSQL 专用数据库（不安装 PostGIS）
# - minio: 业务对象存储（用户文件）
# - doris-fe: Apache Doris Frontend（OLAP 分析引擎）
# - clickhouse: ClickHouse（高性能列式存储 OLAP）
# - mongodb: MongoDB（文档型 NoSQL 数据库）
# - oceanbase: OceanBase CE（MySQL 模式分布式关系数据库）
# - neo4j: Neo4j Community Edition（图数据库，知识图谱）
# - spark-master/workers: Apache Spark 分布式计算引擎
# - business-redpanda: 业务 Kafka API 消息流
#
# 使用方法:
#   docker-compose up -d    # 启动
#   docker-compose down     # 停止
#   docker-compose logs -f  # 查看日志

name: business

services:
  postgres:
    image: ${POSTGRES_IMAGE:-imresamu/postgis-arm64:15-3.4}
    container_name: business-postgres
    # 优化 PostgreSQL 内存配置，支持 MVT 瓦片生成
    # macOS 优化：增加 shm_size 到 2GB 避免共享内存段分配失败
    shm_size: 2g
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - timezone=Asia/Shanghai
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-business}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-business_password}
      POSTGRES_DB: ${POSTGRES_DB:-business}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro,cached
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro,cached
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,cached
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-business}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - business-network
    restart: unless-stopped

  # Oracle Free 23ai 常规镜像保留 Oracle Spatial 与 CDC 测试能力；ArcGIS SDE 不在当前业务容器中启用。
  oracle:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23}
    container_name: business-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-oracle_sys_password}
      APP_USER: ${ORACLE_APP_USER:-business}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-business_oracle_password}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ORACLE_PORT:-15210}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - business-network
    restart: unless-stopped

  # SuperMap SDX+ for PostgreSQL 必须与 SuperMap SDX+ for PostGIS 使用独立实例。
  # 此实例保持原生 PostgreSQL；SuperMap 系统表只能由 supermap_workflow 初始化。
  supermap-postgresql:
    image: ${SUPERMAP_POSTGRESQL_IMAGE:-postgres:15}
    container_name: business-supermap-postgresql
    shm_size: 2g
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - timezone=Asia/Shanghai
    environment:
      POSTGRES_USER: ${SUPERMAP_POSTGRESQL_USER:-supermap}
      POSTGRES_PASSWORD: ${SUPERMAP_POSTGRESQL_PASSWORD:-supermap_password}
      POSTGRES_DB: ${SUPERMAP_POSTGRESQL_DB:-supermap}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - supermap_postgresql_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro,cached
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,cached
    ports:
      - "${SUPERMAP_POSTGRESQL_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERMAP_POSTGRESQL_USER:-supermap} -d ${SUPERMAP_POSTGRESQL_DB:-supermap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - business-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: business-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - business-network
    restart: unless-stopped

  # Apache Doris FE (Frontend)
  doris-fe:
    image: apache/doris:doris-all-in-one-2.1.0
    container_name: business-doris-fe
    hostname: business-doris-fe
    environment:
      - BUILD_TYPE=production
      - RECOVERY=${DORIS_RECOVERY:-false}
    entrypoint:
      - /bin/bash
      - -c
      - |
        grep -q '^enable_fqdn_mode = true$' /opt/apache-doris/fe/conf/fe.conf ||
          echo 'enable_fqdn_mode = true' >> /opt/apache-doris/fe/conf/fe.conf
        grep -q '^force_olap_table_replication_num = 1$' /opt/apache-doris/fe/conf/fe.conf ||
          echo 'force_olap_table_replication_num = 1' >> /opt/apache-doris/fe/conf/fe.conf
        exec bash /usr/local/bin/entry_point.sh
    ports:
      - "${DORIS_FE_PORT:-9030}:9030"       # MySQL 协议
      - "${DORIS_FE_HTTP_PORT:-8030}:8030"  # HTTP API
      - "9050:9050"                          # BE heartbeat 端口
    volumes:
      - doris_fe_data:/opt/apache-doris/fe/doris-meta
      - doris_fe_log:/opt/apache-doris/fe/log
      - doris_be_data:/opt/apache-doris/be/storage
    networks:
      - business-network
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot --connect-timeout=5 -e 'SHOW FRONTENDS;' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # 注意: doris-all-in-one 镜像包含 FE+BE，无需单独的 BE 和 init 容器

  # ClickHouse (高性能列式存储 OLAP 引擎)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: business-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-business}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_PORT:-9000}:9000"       # Native 协议
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"  # HTTP 接口
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_log:/var/log/clickhouse-server
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - business-network
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # MongoDB (文档型 NoSQL 数据库)
  mongodb:
    image: mongo:7.0
    container_name: business-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-business}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - business-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: --wiredTigerCacheSizeGB 1

  # MySQL (关系型数据库)
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: business-mysql
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-business}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - business-network
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD:-password} --connect-timeout=5 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # OceanBase Community Edition（单机测试形态，MySQL 模式）
  oceanbase:
    image: ${OCEANBASE_IMAGE:-oceanbase/oceanbase-ce:4.4.2-lts}
    container_name: business-oceanbase
    environment:
      MODE: ${OCEANBASE_MODE:-mini}
      OB_TENANT_NAME: ${OCEANBASE_TENANT_NAME:-test}
      OB_TENANT_PASSWORD: ${OCEANBASE_PASSWORD:-business_oceanbase_password}
      OB_DATABASE: ${OCEANBASE_DATABASE:-business}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${OCEANBASE_PORT:-2881}:2881"
    volumes:
      - oceanbase_data:/root/ob
      - oceanbase_obd_data:/root/.obd/cluster
      - ./oceanbase/init.sql:/root/boot/init.d/01-addp-business.sql:ro
    networks:
      - business-network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          obclient -h127.0.0.1 -P2881
          -u"root@$${OB_TENANT_NAME}"
          --password="$${OB_TENANT_PASSWORD}"
          -D"$${OB_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  # Redpanda（独立业务 Kafka API 消息流，不承载 ADDP Infra Kafka）
  business-redpanda:
    image: ${BUSINESS_REDPANDA_IMAGE:-docker.redpanda.com/redpandadata/redpanda:v24.3.18}
    container_name: business-redpanda
    hostname: business-redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - ${BUSINESS_REDPANDA_MEMORY:-1G}
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://business-redpanda:29092,external://localhost:${BUSINESS_KAFKA_PORT:-29092}
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - business-redpanda:33145
      - --set
      - redpanda.enable_sasl=true
      - --set
      - redpanda.auto_create_topics_enabled=false
      - --set
      - redpanda.write_caching_default=false
      - --set
      - 'redpanda.superusers=["${BUSINESS_KAFKA_ADMIN_USERNAME:-admin}"]'
    environment:
      RP_BOOTSTRAP_USER: ${BUSINESS_KAFKA_ADMIN_USERNAME:-admin}:${BUSINESS_KAFKA_ADMIN_PASSWORD:-addp_business_kafka_admin}
      BUSINESS_KAFKA_ADMIN_PASSWORD: ${BUSINESS_KAFKA_ADMIN_PASSWORD:-addp_business_kafka_admin}
    ports:
      - "${BUSINESS_KAFKA_PORT:-29092}:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - business-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          rpk cluster health -X brokers=localhost:29092
          -X user=${BUSINESS_KAFKA_ADMIN_USERNAME:-admin}
          -X pass=$${BUSINESS_KAFKA_ADMIN_PASSWORD}
          -X sasl.mechanism=SCRAM-SHA-256 >/dev/null
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # Neo4j Community Edition (图数据库，支持知识图谱)
  neo4j:
    image: neo4j:5-community
    container_name: business-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j_password}
      # JVM 内存调优，将基础占用控制在 ~400MB
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-128m}
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*,spatial.*"
      # APOC: jar 已内置于镜像 labs 目录，无需联网
      # GDS:  jar 预下载到 ./neo4j/plugins/，直接挂载到 plugins 目录，无需联网
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt 协议（Go driver 使用）
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/plugins:/plugins
    networks:
      - business-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Apache Spark Master + Thrift Server
  spark-master:
    image: apache/spark:3.5.0-scala2.12-java11-python3-ubuntu
    container_name: business-spark-master
    user: root
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=0.0.0.0
      - SPARK_MASTER_PORT=7077
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"   # Spark 集群通信
      - "${SPARK_MASTER_UI:-18088}:8080"    # Spark Master Web UI
      - "${SPARK_THRIFT_PORT:-11000}:10000" # Thrift Server (SQL 接口)
    volumes:
      - ./spark:/opt/spark/conf
    command:
      - bash
      - -c
      - |
        set -e
        /opt/spark/sbin/start-master.sh
        /opt/spark/sbin/start-thriftserver.sh --master spark://spark-master:7077 --conf spark.cores.max=1 --conf spark.executor.cores=1 --conf spark.executor.memory=1g
        rm -f /tmp/addp-spark-sample-ready
        /opt/spark/conf/init-test-data.sh >/tmp/addp-spark-sample-init.log 2>&1 &
        exec tail -f /dev/null
    networks:
      - business-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Spark Worker 1
  spark-worker-1:
    image: apache/spark:3.5.0-scala2.12-java11-python3-ubuntu
    container_name: business-spark-worker-1
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    command: >
      bash -c "
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
        tail -f /dev/null
      "
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - business-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Spark Worker 2 (可选，通过 --profile full 启用)
  spark-worker-2:
    image: apache/spark:3.5.0-scala2.12-java11-python3-ubuntu
    container_name: business-spark-worker-2
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    command: >
      bash -c "
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
        tail -f /dev/null
      "
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - business-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles:
      - full  # 默认不启动，通过 docker-compose --profile full up 启用
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

volumes:
  postgres_data:
  oracle_data:
  supermap_postgresql_data:
  minio_data:
  mysql_data:
    driver: local
  oceanbase_data:
    driver: local
  oceanbase_obd_data:
    driver: local
  doris_fe_data:
    driver: local
  doris_fe_log:
    driver: local
  doris_be_data:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_log:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redpanda_data:
    driver: local
networks:
  business-network:
    driver: bridge
