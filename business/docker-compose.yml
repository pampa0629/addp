# Business Database Services
# 业务库服务 - 存储用户业务数据
#
# 包含服务:
# - postgres: 业务数据库（PostGIS 支持空间数据）
# - minio: 业务对象存储（用户文件）
#
# 使用方法:
#   docker-compose up -d    # 启动
#   docker-compose down     # 停止
#   docker-compose logs -f  # 查看日志

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgis/postgis:15-3.4}
    container_name: business-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-business}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-business_password}
      POSTGRES_DB: ${POSTGRES_DB:-business}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-business}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - business-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: business-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - business-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  business-network:
    driver: bridge
