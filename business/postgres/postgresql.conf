# ==================== PostgreSQL 性能优化配置 ====================
# 用于 ADDP 业务数据库（MVT 瓦片生成优化）
# 生成时间: 2026-01-25
# 目标: 提升空间查询性能，支持高并发瓦片生成

# ========== 内存配置 ==========
# shared_buffers: 共享内存缓冲区，存储表和索引数据
# 建议值: 系统内存的 25%（假设8GB内存）
shared_buffers = 2GB

# effective_cache_size: 告知查询优化器可用的缓存大小
# 建议值: 系统内存的 75%
effective_cache_size = 6GB

# work_mem: 单个查询操作（排序、哈希）的工作内存
# 对空间查询尤其重要，ST_AsMVTGeom、ST_Transform等操作需要大内存
# 建议值: 64MB（根据ADDP文档推荐的值）
# 注意：15个并发查询时，总体工作内存 = 64MB × 15 = 960MB
# 如果内存仍不足，可以降低PRE_CACHE_CONCURRENCY到8-10以减少并发数
work_mem = 64MB

# maintenance_work_mem: 维护操作（VACUUM、CREATE INDEX）的内存
maintenance_work_mem = 512MB

# ========== 并行查询优化 ==========
# 启用并行查询可以加速大表扫描和空间计算
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_worker_processes = 8

# ========== SSD 存储优化 ==========
# random_page_cost: 随机页访问代价
# HDD默认值4.0，SSD应设置1.0-1.1
random_page_cost = 1.1

# effective_io_concurrency: 同时发起的IO操作数
# SSD可设置高值（100-200）
effective_io_concurrency = 200

# ========== 查询规划器优化 ==========
# default_statistics_target: 统计信息采样精度
# 提高精度可以改善查询计划，但会增加ANALYZE时间
default_statistics_target = 100

# ========== 连接池配置 ==========
# max_connections: 最大并发连接数
# 容纳 Manager 预缓存的25个连接池 + 其他服务
max_connections = 200

# listen_addresses: 监听地址
# '*' 表示监听所有网络接口（允许 Docker 端口映射的外部连接）
listen_addresses = '*'

# ========== WAL 与 logical replication ==========
# 开发业务库作为 PostgreSQL CDC source；Infra PostgreSQL 不承担该角色。
wal_level = logical
max_wal_senders = 20
max_replication_slots = 20
logical_decoding_work_mem = 64MB

# 防止故障 slot 无限占满开发机磁盘。达到上限会使 slot 失效并要求重新 bootstrap，
# 因此它是明确的恢复边界，不是无损保护开关。
max_slot_wal_keep_size = 10GB
wal_sender_timeout = 60s

# ========== 日志配置 ==========
# 记录慢查询，便于性能分析
log_min_duration_statement = 5000  # 记录执行超过5秒的SQL
log_lock_waits = on                # 记录锁等待事件

# ========== 其他优化 ==========
# shared_preload_libraries: 预加载扩展库（如果需要）
# 注: PostGIS扩展通常无需预加载

# ========== 重要提示 ==========
# 1. 修改配置后必须重启PostgreSQL容器才能生效
# 2. 内存配置应根据实际系统内存调整
# 3. 并发连接数应与应用层连接池匹配
# 4. 定期运行ANALYZE更新统计信息，提升查询性能
