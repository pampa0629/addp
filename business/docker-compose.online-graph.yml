services:
  falkordb:
    profiles: [falkordb]
    extends:
      file: ../scripts/infra/falkordb.yml
      service: falkordb
    container_name: addp-graph-online-falkordb
    networks: [addp-network]
    tmpfs: [/data]
    restart: "no"
  neo4j:
    profiles: [neo4j]
    extends:
      file: ../scripts/test/docker-compose.neo4j-t2.yml
      service: neo4j
    container_name: addp-graph-online-neo4j
    ports: !reset []
    volumes: !reset []
    networks: [addp-network]
    tmpfs: [/data]
  neo4j-control:
    profiles: [neo4j]
    extends:
      service: neo4j
    container_name: addp-graph-online-neo4j-control

networks:
  addp-network:
    external: true
    name: addp-network
