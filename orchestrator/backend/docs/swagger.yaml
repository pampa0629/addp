basePath: /api/v1/orchestrator
host: localhost:8084
info:
  contact: {}
  title: ADDP Orchestrator API
  version: "1.0"
paths:
  /compute-engines:
    get:
      description: 从 System 任务提供者注册表获取可用计算引擎 | List compute engines from task provider
        registry
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出计算引擎 | List compute engines
      tags:
      - Orchestrator
  /executions:
    get:
      parameters:
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取所有执行列表 | List all executions
      tags:
      - Orchestrator
  /orch-executions/{id}:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行详情 | Get execution detail
      tags:
      - Orchestrator
  /orchestrations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取编排列表 | List orchestrations
      tags:
      - Orchestrator
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建编排 | Create orchestration
      tags:
      - Orchestrator
  /orchestrations/{id}:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除编排 | Delete orchestration
      tags:
      - Orchestrator
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取编排详情 | Get orchestration detail
      tags:
      - Orchestrator
    put:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新编排 | Update orchestration
      tags:
      - Orchestrator
  /orchestrations/{id}/execute:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 执行编排 | Execute orchestration
      tags:
      - Orchestrator
  /orchestrations/{id}/executions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行列表 | List executions
      tags:
      - Orchestrator
  /tasks/list:
    get:
      description: 动态调用目标模块任务列表接口并标准化返回格式 | Proxy and normalize module task list
      parameters:
      - description: 模块名 | Module name
        in: query
        name: module_name
        type: string
      - description: 模块名（兼容）| Module name for compatibility
        in: query
        name: module
        type: string
      - description: 任务提供者唯一标识 | Task provider identifier
        in: query
        name: unique_identifier
        type: string
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 100
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出模块任务 | List module tasks
      tags:
      - Orchestrator
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
