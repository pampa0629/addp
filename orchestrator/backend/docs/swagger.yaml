basePath: /api/v1/orchestrator
definitions:
  execution.TaskExecution:
    properties:
      actor_principal_id:
        description: |-
          User-derived execution authorization facts. The raw User/Service tokens
          and engine connection details are never persisted in task executions.
        type: integer
      actor_tenant_membership_id:
        type: integer
      attempt:
        type: integer
      authorization_effects:
        items:
          type: string
        type: array
      authorization_expires_at:
        type: string
      bytes_read:
        description: Transfer 读取字节数
        type: integer
      bytes_written:
        description: Transfer 写入字节数
        type: integer
      completed_at:
        type: string
      created_at:
        type: string
      current_step:
        description: 当前步骤（Orchestrator/Workflow）
        type: string
      error_details:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: 错误详情（仅失败时有值）
      execution_authorization_id:
        type: integer
      execution_config:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: JSONB 字段
      execution_id:
        description: 执行标识
        type: string
      execution_time_ms:
        description: 性能指标
        type: integer
      id:
        type: integer
      issued_authorization_version:
        type: integer
      max_attempts:
        type: integer
      metadata:
        allOf:
        - $ref: '#/definitions/models.JSONMap'
        description: 模块特有扩展数据（结果、断点、步骤结果等）
      module:
        description: 模块标识
        type: string
      parent_execution_id:
        description: 父执行（Orchestrator 子步骤追踪父编排）
        type: string
      progress:
        description: 0-100
        type: integer
      records_read:
        description: Transfer 读取记录数
        type: integer
      records_written:
        description: Transfer 写入记录数
        type: integer
      rows_affected:
        description: SQL 影响行数
        type: integer
      source:
        description: 触发来源模块
        type: string
      source_task_id:
        description: 关联原始任务
        type: string
      source_task_name:
        description: 任务名称（冗余，便于查询）
        type: string
      started_at:
        description: 时间戳
        type: string
      status:
        description: 执行状态
        type: string
      task_type:
        description: 稳定执行类型；可来自任务定义或 ad-hoc execution
        type: string
      tenant_id:
        type: integer
      trigger_type:
        description: 触发信息
        type: string
      triggered_by:
        description: 触发用户ID
        type: integer
      updated_at:
        type: string
    type: object
  github_com_addp_orchestrator_internal_models.ErrorResponse:
    properties:
      error:
        example: 请求参数错误
        type: string
    type: object
  github_com_addp_orchestrator_internal_models.OrchestrationDefinitionRequest:
    properties:
      description:
        type: string
      editor_layout:
        $ref: '#/definitions/models.JSONMap'
      enabled:
        type: boolean
      name:
        type: string
      schedule:
        type: string
      steps:
        items:
          $ref: '#/definitions/github_com_addp_orchestrator_internal_models.Step'
        type: array
    type: object
  github_com_addp_orchestrator_internal_models.ProviderOrchestrationTask:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      description:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      execution_contract:
        $ref: '#/definitions/taskprovider.ExecutionContract'
      id:
        type: integer
      last_execution_id:
        type: string
      last_execution_status:
        type: string
      last_run_at:
        type: string
      name:
        type: string
      next_run_at:
        type: string
      schedule:
        type: string
      steps:
        items:
          $ref: '#/definitions/github_com_addp_orchestrator_internal_models.Step'
        type: array
      task_type:
        type: string
      tenant_id:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_addp_orchestrator_internal_models.Step:
    properties:
      depends_on:
        description: 依赖步骤 ID 列表
        items:
          type: string
        type: array
      id:
        description: 唯一ID
        type: string
      name:
        description: 步骤名称
        type: string
      parameters:
        additionalProperties: true
        description: 请求参数
        type: object
      provider:
        description: 任务引用（引用已有的 TaskProvider 任务定义）
        type: string
      task_id:
        description: 具体任务定义 ID
        type: integer
      task_type:
        description: TaskProvider task type, e.g. "scan" | "workflow" | "orchestration"
        type: string
      timeout:
        description: 超时秒数
        type: integer
    type: object
  internal_api.orchestrationTaskProviderExecuteRequest:
    properties:
      parameters:
        additionalProperties: true
        type: object
      parent_execution_id:
        type: string
      source:
        type: string
      trigger_type:
        type: string
    type: object
  internal_api.orchestrationTaskProviderExecuteResponse:
    properties:
      execution_id:
        type: string
      status:
        type: string
    type: object
  models.JSONMap:
    additionalProperties: true
    type: object
  taskprovider.ExecutionContract:
    properties:
      input_defaults:
        additionalProperties: true
        type: object
      input_schema:
        additionalProperties: true
        type: object
      input_ui_schema:
        additionalProperties: true
        type: object
      output_schema:
        additionalProperties: true
        type: object
    type: object
host: localhost:8084
info:
  contact: {}
  title: ADDP Orchestrator API
  version: "1.0"
paths:
  /executions:
    get:
      parameters:
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取所有执行列表 | List all executions
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.read
  /executions/{execution_id}:
    get:
      description: 按 execution_id 查询 Orchestrator 编排统一执行记录。| Get an Orchestrator execution
        record by execution_id.
      parameters:
      - description: 执行 UUID | Execution UUID
        in: path
        name: execution_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/execution.TaskExecution'
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取 Orchestrator 编排执行状态 | Get Orchestrator execution status
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.read
  /orch-executions/{id}:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "404":
          description: 执行不存在 | Execution not found
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取执行详情 | Get execution detail
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.read
  /orchestrations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取编排列表 | List orchestrations
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.read
    post:
      consumes:
      - application/json
      description: 严格解析编排定义并拒绝未知字段，统一校验 Step、DAG、模板依赖、任务引用、递归引用和调度表达式 | Strictly parse
        the orchestration definition, reject unknown fields, and validate steps, DAG,
        template dependencies, task references, recursive references, and schedule
        expressions
      parameters:
      - description: 编排定义，steps 必须使用 provider/task_type/task_id 任务引用 | Orchestration
          definition, steps must use provider/task_type/task_id task references
        in: body
        name: orchestration
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_orchestrator_internal_models.OrchestrationDefinitionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 编排定义或执行参数无效 | Invalid orchestration definition or execution
            parameters
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建编排 | Create orchestration
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.create
  /orchestrations/{id}:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "404":
          description: 编排不存在 | Orchestration not found
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除编排 | Delete orchestration
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.delete
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "404":
          description: 编排不存在 | Orchestration not found
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取编排详情 | Get orchestration detail
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.read
    put:
      consumes:
      - application/json
      description: 严格解析编排定义并拒绝未知字段，统一校验 Step、DAG、模板依赖、任务引用、递归引用和调度表达式 | Strictly parse
        the orchestration definition, reject unknown fields, and validate steps, DAG,
        template dependencies, task references, recursive references, and schedule
        expressions
      parameters:
      - description: 编排 ID | Orchestration ID
        in: path
        name: id
        required: true
        type: integer
      - description: 编排定义，steps 必须使用 provider/task_type/task_id 任务引用 | Orchestration
          definition, steps must use provider/task_type/task_id task references
        in: body
        name: orchestration
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_orchestrator_internal_models.OrchestrationDefinitionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 编排定义或执行参数无效 | Invalid orchestration definition or execution
            parameters
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "404":
          description: 编排不存在 | Orchestration not found
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新编排 | Update orchestration
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.update
  /orchestrations/{id}/execute:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "404":
          description: 编排不存在 | Orchestration not found
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 执行编排 | Execute orchestration
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.execute
  /orchestrations/{id}/executions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "404":
          description: 编排不存在 | Orchestration not found
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取执行列表 | List executions
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.read
  /task-providers:
    get:
      description: 从 System 任务提供者注册表获取可编排任务提供者 | List task providers from System task
        provider registry
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出任务提供者 | List task providers
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.read
  /task-providers/{module_name}/tasks/{task_type}/{id}:
    get:
      parameters:
      - description: 任务提供者模块名 | Task provider module name
        in: path
        name: module_name
        required: true
        type: string
      - description: 任务类型 | Task type
        in: path
        name: task_type
        required: true
        type: string
      - description: 任务 ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 任务详情及 execution_contract | Task detail and execution_contract
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数无效 | Invalid parameters
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "502":
          description: 任务提供者不可用 | Task provider unavailable
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取具体 TaskProvider 任务详情 | Get concrete TaskProvider task detail
      tags:
      - TaskProvider
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.read
  /tasks:
    get:
      description: 动态调用目标模块任务列表接口并标准化返回格式；module_name=orchestrator 时返回本模块已保存的编排任务。|
        Proxy and normalize module task list; when module_name=orchestrator, return
        saved orchestration tasks.
      parameters:
      - description: 模块名；为空或 orchestrator 时返回编排任务 | Module name; empty or orchestrator
          returns orchestration tasks
        in: query
        name: module_name
        type: string
      - description: 任务类型；Orchestrator 固定为 orchestration | Task type; orchestration
          for Orchestrator
        in: query
        name: task_type
        type: string
      - default: 1
        description: 页码 | Page
        in: query
        name: page
        type: integer
      - default: 100
        description: 每页数量 | Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出模块任务 | List module tasks
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.read
  /tasks/{task_type}/{id}:
    get:
      description: 按标准 TaskProvider 路径获取 Orchestrator 编排任务详情；task_type 仅支持 orchestration。|
        Get Orchestrator task detail through the standard TaskProvider path; task_type
        only supports orchestration.
      parameters:
      - description: 任务类型，固定为 orchestration | Task type, fixed to orchestration
        in: path
        name: task_type
        required: true
        type: string
      - description: 编排 ID | Orchestration ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ProviderOrchestrationTask'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取 TaskProvider 编排任务详情 | Get TaskProvider orchestration task detail
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.read
  /tasks/{task_type}/{id}/execute:
    post:
      consumes:
      - application/json
      description: 按标准 TaskProvider 协议执行 Orchestrator 编排任务；task_type 仅支持 orchestration。|
        Execute an Orchestrator task through the standard TaskProvider protocol; task_type
        only supports orchestration.
      parameters:
      - description: 任务类型，固定为 orchestration | Task type, fixed to orchestration
        in: path
        name: task_type
        required: true
        type: string
      - description: 编排 ID | Orchestration ID
        in: path
        name: id
        required: true
        type: integer
      - description: TaskProvider 执行请求 | TaskProvider execution request
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_api.orchestrationTaskProviderExecuteRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_api.orchestrationTaskProviderExecuteResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 当前身份未绑定租户 | Current identity is not bound to a tenant
          schema:
            $ref: '#/definitions/github_com_addp_orchestrator_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 执行 TaskProvider 编排任务 | Execute TaskProvider orchestration task
      tags:
      - Orchestrator
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - orchestrator.workflow.execute
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
