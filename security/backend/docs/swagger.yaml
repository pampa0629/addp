host: localhost:8194
info:
  contact: {}
  title: ADDP Security API
  version: "1.0"
paths:
  /assessments:
    get:
      description: 分页返回当前租户的正式资源安全评估及当前修订 | Return formal resource security assessments
        and their current revisions
      parameters:
      - description: 页码 | Page number
        in: query
        name: page
        type: integer
      - description: 每页数量，最大 100 | Page size, maximum 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.ResourceSecurityAssessmentListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 正式安全评估列表 | List formal security assessments
      tags:
      - Security Assessment
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - security.assessment.read
  /assessments/{id}:
    get:
      description: 返回当前修订和不可变修订历史 | Return the current revision and immutable revision
        history
      parameters:
      - description: Assessment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.ResourceSecurityAssessmentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 正式安全评估详情 | Get formal security assessment
      tags:
      - Security Assessment
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - security.assessment.read
  /assessments/{id}/revisions:
    post:
      consumes:
      - application/json
      description: 使用资源版本并发控制，在同一 Assessment 聚合追加不可变正式修订并重新编译保护投影 | Append an immutable
        formal revision with resource-version concurrency control and recompile the
        protection projection
      parameters:
      - description: Assessment ID
        in: path
        name: id
        required: true
        type: string
      - description: 修订请求 | Revision request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.AssessmentRevisionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_api.ResourceSecurityAssessmentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 新增安全评估修订 | Create security assessment revision
      tags:
      - Security Assessment
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - security.assessment.update
  /classifications:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_addp_security_internal_models.SecurityClassification'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 安全分类列表 | List security classifications
      tags:
      - Security Classification
      x-addp-auth-mode: permission
