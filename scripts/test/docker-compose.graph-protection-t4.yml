# Loopback diagnostics for the existing Graph suite; product traffic uses Nginx.
services:
  system-backend:
    ports: ["127.0.0.1:8180:8180"]
  gateway:
    ports: ["127.0.0.1:8000:8000"]
  meta-backend:
    ports: ["127.0.0.1:8082:8082"]
  security-backend:
    ports: ["127.0.0.1:8194:8194"]
  manager-backend:
    ports: ["127.0.0.1:8081:8081"]
  develop-backend:
    ports: ["127.0.0.1:8185:8185"]
  graph-review-extractor:
    image: python:3.12-alpine
    container_name: addp-graph-online-review-extractor
    environment:
      ADDP_ONLINE_HOSTED: "1"
      GITHUB_ACTIONS: "true"
      ADDP_ONLINE_TEST_RUN_ID: ${ADDP_ONLINE_TEST_RUN_ID:-}
      ADDP_ONLINE_GRAPH_CASE: ${ADDP_ONLINE_GRAPH_CASE:-full}
    command: ["python", "/fixture/graph-review-extractor.py"]
    volumes:
      - ./scripts/test/graph-review-extractor.py:/fixture/graph-review-extractor.py:ro
    networks: [addp-network]
    read_only: true
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/health/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  graph-backend:
    environment:
      COPILOT_URL: http://graph-review-extractor:8087
      ADDP_ONLINE_HOSTED: ${ADDP_ONLINE_HOSTED:-}
      ADDP_ONLINE_TEST_RUN_ID: ${ADDP_ONLINE_TEST_RUN_ID:-}
      GRAPH_BUILD_LEASE_SECONDS: ${GRAPH_BUILD_LEASE_SECONDS:-120}
      GRAPH_BUILD_HEARTBEAT_SECONDS: ${GRAPH_BUILD_HEARTBEAT_SECONDS:-20}
    ports: ["127.0.0.1:8186:8186"]
  service-backend:
    environment:
      GATEWAY_URL: http://127.0.0.1:8000
    ports: ["127.0.0.1:8086:8086"]
  transfer-backend:
    ports: ["127.0.0.1:8083:8083"]
  graph-backend-peer:
    extends:
      file: docker-compose.yml
      service: graph-backend
    container_name: graph-backend-peer
    profiles: [execution-lifecycle]
    restart: "no"
    environment:
      SERVICE_HOST: graph-backend-peer
      COPILOT_URL: http://graph-review-extractor:8087
      ADDP_ONLINE_HOSTED: ${ADDP_ONLINE_HOSTED:-}
      ADDP_ONLINE_TEST_RUN_ID: ${ADDP_ONLINE_TEST_RUN_ID:-}
      GRAPH_BUILD_LEASE_SECONDS: "30"
      GRAPH_BUILD_HEARTBEAT_SECONDS: "5"
    ports: !override ["127.0.0.1:18186:8186"]
