services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    environment:
      POSTGRES_USER: python_deploy
      POSTGRES_PASSWORD: ${ADDP_DATABASE_DEPLOY_PASSWORD:?}
      POSTGRES_DB: addp_python_disposable
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h127.0.0.1 -w -U python_deploy -d addp_python_disposable -Atqc "SELECT 1"']
      interval: 2s
      timeout: 3s
      retries: 40
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ROOT_PASSWORD: ${PYTHON_GATE_MYSQL_ROOT_PASSWORD:?}
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h127.0.0.1 -uroot -NBe "SELECT 1"']
      interval: 2s
      timeout: 3s
      retries: 60
