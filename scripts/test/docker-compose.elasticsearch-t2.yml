services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4@sha256:82ac14f43fe701992e601f4cc81e1c0d7dbc5a2576d8cd736006452925df4026
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?T2 password required}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1::9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --user \"elastic:$${ELASTIC_PASSWORD}\" http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 50
    mem_limit: 2g
    restart: "no"
  meilisearch:
    image: getmeili/meilisearch:v1.54.3@sha256:e68913ab7d6f5b159529e472cfd362ce3c741fafd3c127961b2142abbe41b3c9
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_TEST_KEY:?T2 Meilisearch key required}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1::7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 2s
      timeout: 5s
      retries: 20
  spark-master:
    image: apache/spark:3.5.0-scala2.12-java11-python3-ubuntu@sha256:0ed5154e6b32ac3af1272d4d65e9f65b13afcfe80b41ad10bd059bcd6317863c
    user: root
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077"]
    volumes:
      - ../../engines/spark-workflow:/addp/spark-workflow:ro
      - ./elasticsearch-spark-contract.py:/addp/elasticsearch-spark-contract.py:ro
      - ${ELASTICSEARCH_T2_WORK_DIR:?T2 work directory required}:/gate:ro
    environment:
      ELASTICSEARCH_READER_USER: ${ELASTICSEARCH_READER_USER:?T2 user required}
      ELASTICSEARCH_READER_PASSWORD: ${ELASTICSEARCH_READER_PASSWORD:?T2 password required}
    mem_limit: 2g
  spark-worker:
    image: apache/spark:3.5.0-scala2.12-java11-python3-ubuntu@sha256:0ed5154e6b32ac3af1272d4d65e9f65b13afcfe80b41ad10bd059bcd6317863c
    user: root
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--host", "spark-worker", "--cores", "2", "--memory", "1g", "spark://spark-master:7077"]
    mem_limit: 2g
volumes:
  elasticsearch_data:
  meilisearch_data:
