services:
  neo4j:
    image: neo4j:5-community@sha256:b6515e08189121cc2cf1bbe1a5212556ae5245964c5f7e3510413dfc4ad83730
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_T2_PASSWORD:?T2 password required}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1::7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 10s
      retries: 60
    mem_limit: 1536m
    restart: "no"
volumes:
  neo4j_data:
