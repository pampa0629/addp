# Disposable native Cleanup case; all ten Owners, no browser or second Owner instance.
services:
  system-backend:
    environment:
      ADDP_ONLINE_HOSTED: "1"
      ADDP_ONLINE_TEST_RUN_ID: ${ADDP_ONLINE_TEST_RUN_ID:?required}
    restart: "no"
    ports: !override ["127.0.0.1:8180:8180"]
  gateway:
    environment:
      ADDP_ONLINE_HOSTED: "1"
      ADDP_ONLINE_TEST_RUN_ID: ${ADDP_ONLINE_TEST_RUN_ID:?required}
    restart: "no"
    ports: !override ["127.0.0.1:8000:8000"]
  meta-backend:
