services:
  falkordb:
    image: falkordb/falkordb:v4.20.6@sha256:217bc520be076ce9e85b0ba426b2379ccbaebd17f2fe6e174288bd1b36d486bb
    # Only the database process; no browser and no persistent volume.
    entrypoint: ["redis-server"]
    command:
      - --loadmodule
      - /var/lib/falkordb/bin/falkordb.so
      - TIMEOUT_MAX
      - "2000"
      - TIMEOUT_DEFAULT
      - "2000"
      - THREAD_COUNT
      - "2"
      - OMP_THREAD_COUNT
      - "1"
      - QUERY_MEM_CAPACITY
      - "67108864"
      - MAX_QUEUED_QUERIES
      - "16"
      - --requirepass
      - ${ONTOLOGY_FALKOR_TEST_PASSWORD:?owner gate must provide a disposable password}
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1::6379"
    mem_limit: 512m
    cpus: 2
    restart: "no"
