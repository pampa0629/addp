
# The HTTP case and default all opt into two bounded, disposable SDK producers.
x-python-http: &python-http
  profiles: [python-http]
  user: "${ADDP_POSTGRES_METRICS_USER:-65534:65534}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 0.5
  mem_limit: 512m
  tmpfs: ["/tmp:size=256m,mode=1777"]
  environment:
    PYTHONPATH: /tmp/deps:/app/common-python
    PYTHONDONTWRITEBYTECODE: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  command: [sh, -ec, "cp -R /app/common-python /tmp/common-python; python -m pip install --no-cache-dir --target /tmp/deps /tmp/common-python -r /source/python-requirements.txt >/tmp/install.log 2>&1 || { echo python_http_dependency_failed; exit 1; }; exec python /source/python-http-metrics-source.py"]
  volumes:
    - ${METRICS_T2_WORK}/source:/source
    - ${METRICS_T2_WORK}/source/python-common:/app/common-python:ro

services:
  postgres-metrics:
    extends:
      file: ../infra/postgres-metrics.yml
      service: postgres-metrics
    ports: ["127.0.0.1::9443"]
  postgres-metrics-web:
    extends:
      file: ../infra/postgres-metrics.yml
      service: postgres-metrics-web
  postgres:
    image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    environment:
      POSTGRES_DB: addp_test
      POSTGRES_USER: addp
      POSTGRES_PASSWORD_FILE: /run/secrets/metrics-postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, "hba_file=${METRICS_T2_HBA_FILE:-/var/lib/postgresql/data/pg_hba.conf}"]
    volumes:
      - ${METRICS_T2_WORK}/postgres-auth/runtime:/etc/addp-postgres-auth:ro
    secrets: [metrics-postgres-password]
    ports: ["127.0.0.1::5432"]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
    tmpfs: ["/var/lib/postgresql/data:size=256m"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U addp -d addp_test"]
      interval: 1s
      timeout: 3s
      retries: 45
  node-exporter:
    extends:
      file: ../infra/node-metrics.yml
      service: node-exporter
    ports:
      - target: 9100
        published: "${ADDP_NODE_METRICS_PUBLISH_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
  prometheus:
    extends:
      file: ../infra/metrics.yml
      service: prometheus
    ports: ["127.0.0.1::9090"]
    volumes:
      - prometheus_data:/prometheus
      - ${METRICS_T2_WORK}/query-tests:/query-tests:ro
  metrics-control:
    extends:
      file: ../infra/metrics-control.yml
      service: metrics-control
    ports: ["127.0.0.1::9444"]
  metrics-source:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "65534:65534"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cgroup: private
    cpus: 0.25
    mem_limit: 128m
    tmpfs: ["/tmp:size=16m,mode=1777"]
    ports: ["127.0.0.1::9443", "127.0.0.1::9444", "127.0.0.1::8080", "127.0.0.1::19441", "127.0.0.1::19442", "127.0.0.1::19443"]
    volumes:
      - ${METRICS_T2_WORK}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${METRICS_T2_WORK}/source:/source
      - ${ADDP_METRICS_TLS_DIR}:/tls:ro
  python-http-agent:
    <<: *python-http
    image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    environment:
      PYTHONPATH: /tmp/deps:/app/common-python
      PYTHONDONTWRITEBYTECODE: "1"
      HTTP_T2_INDEX: "1"
    ports: ["127.0.0.1::19444"]
  python-http-copilot:
    <<: *python-http
    image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    environment:
      PYTHONPATH: /tmp/deps:/app/common-python
      PYTHONDONTWRITEBYTECODE: "1"
      HTTP_T2_INDEX: "2"
    ports: ["127.0.0.1::19445"]

volumes:
  prometheus_data:
secrets:
  metrics-postgres-password:
    file: ${METRICS_T2_WORK}/postgres-password
