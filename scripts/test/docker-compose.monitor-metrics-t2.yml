
# The HTTP case and default all opt into two bounded, disposable SDK producers.
x-python-http: &python-http
  profiles: [python-http]
  user: "${ADDP_POSTGRES_METRICS_USER:-65534:65534}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 0.5
  mem_limit: 512m
  tmpfs: ["/tmp:exec,nosuid,nodev,size=256m,mode=1777"]
  environment:
    PYTHONPATH: /tmp/deps:/app/common-python
    PYTHONDONTWRITEBYTECODE: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  command: [python, /source/python-http-metrics-source.py]
  volumes:
    - ${METRICS_T2_WORK}/source:/source
    - ${METRICS_T2_WORK}/source/python-common:/app/common-python:ro

services:
  cdc-query-tool:
    profiles: [cdc-native]
    image: quay.io/prometheus/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    entrypoint: [/bin/promtool]
    command: [test, rules, /query-tests/cdc-rules.json]
    tmpfs: ["/tmp:nosuid,nodev,size=128m,mode=1777"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - ${METRICS_T2_WORK}/query-tests:/query-tests:ro
  cdc-broker:
    profiles: [cdc-native]
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18@sha256:5c6bdbaf30c97de1ebc2ad417b7d02e0bdb5bf88e243bd3079d74bfde9c7754f
    command: [redpanda, start, --mode, dev-container, --smp, "1", --memory, 512M, --reserve-memory, 0M, --check=false, --kafka-addr, "0.0.0.0:9092", --advertise-kafka-addr, "cdc-broker:9092"]
    cpus: 1
    mem_limit: 1g
    volumes:
      - cdc_broker_data:/var/lib/redpanda/data
    healthcheck:
      test: [CMD, rpk, cluster, info, -X, "brokers=127.0.0.1:9092"]
      interval: 2s
      timeout: 3s
      retries: 30
  cdc-connect:
    profiles: [cdc-native]
    image: quay.io/debezium/connect:3.6.0.Final@sha256:698f0559e667a242f962221079e75917b2b7a3ad4de62661e977628da0e33b45
    environment:
      BOOTSTRAP_SERVERS: cdc-broker:9092
      GROUP_ID: addp-cdc-metrics-fixture
      CONFIG_STORAGE_TOPIC: addp_cdc_config
      OFFSET_STORAGE_TOPIC: addp_cdc_offset
      STATUS_STORAGE_TOPIC: addp_cdc_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx512m
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 1000
      ENABLE_APICURIO_CONVERTERS: "false"
      ENABLE_OTEL: "false"
      ENABLE_JOLOKIA: "false"
      KAFKA_OPTS: -javaagent:/kafka/libs/jolokia-jvm-1.7.2.jar=port=8778,host=0.0.0.0,policyLocation=file:/etc/addp/jolokia-access.xml
    volumes:
      - ../infra/cdc-jolokia-access.xml:/etc/addp/jolokia-access.xml:ro
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8083/connectors"]
      interval: 2s
      timeout: 3s
      retries: 45
  postgres-metrics:
    extends:
      file: ../infra/postgres-metrics.yml
      service: postgres-metrics
    ports: ["127.0.0.1::9443"]
  postgres-metrics-web:
    extends:
      file: ../infra/postgres-metrics.yml
      service: postgres-metrics-web
  postgres:
    image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    environment:
      POSTGRES_DB: addp_test
      POSTGRES_USER: addp
      POSTGRES_PASSWORD_FILE: /run/secrets/metrics-postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, "hba_file=${METRICS_T2_HBA_FILE:-/var/lib/postgresql/data/pg_hba.conf}", -c, "wal_level=logical"]
    volumes:
      - ${METRICS_T2_WORK}/postgres-auth/runtime:/etc/addp-postgres-auth:ro
      - postgres_data:/var/lib/postgresql/data
    secrets: [metrics-postgres-password]
    ports: ["127.0.0.1::5432"]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      # Initialization uses a socket-only server; wait for the final TCP listener.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -p 5432 -U addp -d addp_test"]
      interval: 1s
      timeout: 3s
      retries: 45
  block-capacity:
    extends:
      file: ../infra/node-block-capacity.yml
      service: block-capacity
    profiles: [block-capacity]
  node-exporter:
    extends:
      file: ../infra/node-metrics.yml
      service: node-exporter
    volumes:
      - type: volume
        source: block-capacity
        target: /textfile
        read_only: true
        volume:
          nocopy: true
    ports:
      - target: 9100
        published: "${ADDP_NODE_METRICS_PUBLISH_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
  prometheus:
    extends:
      file: ../infra/metrics.yml
      service: prometheus
    ports: ["127.0.0.1::9090"]
    volumes:
      - prometheus_data:/prometheus
      - ${METRICS_T2_WORK}/query-tests:/query-tests:ro
  gateway-control:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "65534:65534"
    entrypoint: [/fixture/control.test, -test.run=^TestStandaloneControlFixture$, -test.timeout=0]
    environment:
      ADDP_GATEWAY_CONTROL_FIXTURE: "1"
      ADDP_GATEWAY_CONTROL_FIXTURE_UPSTREAM: http://metrics-source:8081
      GATEWAY_METRICS_CONTROL_LISTEN: 0.0.0.0:9444
      GATEWAY_METRICS_CONTROL_SERVER_NAME: gateway-control
      GATEWAY_METRICS_CONTROL_TLS_DIR: /control
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    volumes:
      - ${METRICS_T2_WORK}/control:/control:ro
      - ${METRICS_T2_WORK}/control.test:/fixture/control.test:ro
    ports: ["127.0.0.1::9444"]
  metrics-source:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "65534:65534"
    entrypoint: [sh, -ec, "umask 077; mkdir -m 700 /tmp/addp-source-tls; cp /source/server.crt /tmp/addp-source-tls/server.crt; exec nginx -g 'daemon off;'"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cgroup: private
    cpus: 0.25
    mem_limit: 128m
    tmpfs: ["/tmp:size=16m,mode=1777"]
    ports: ["127.0.0.1::9443", "127.0.0.1::9444", "127.0.0.1::8080", "127.0.0.1::19441", "127.0.0.1::19442", "127.0.0.1::19443"]
    volumes:
      - ${METRICS_T2_WORK}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${METRICS_T2_WORK}/source:/source
      - ${ADDP_METRICS_TLS_DIR}:/tls:ro
  python-http-agent:
    <<: *python-http
    image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    environment:
      PYTHONPATH: /tmp/deps:/app/common-python
      PYTHONDONTWRITEBYTECODE: "1"
      HTTP_T2_INDEX: "1"
    ports: ["127.0.0.1::19444"]
  python-http-copilot:
    <<: *python-http
    image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    environment:
      PYTHONPATH: /tmp/deps:/app/common-python
      PYTHONDONTWRITEBYTECODE: "1"
      HTTP_T2_INDEX: "2"
    ports: ["127.0.0.1::19445"]

# Both native-view and Desktop-view phases use this existing private network.
# The production overlay must not change its declaration while peers are attached.
networks:
  default:
    labels:
      io.addp.node-metrics.owner: ${ADDP_NODE_METRICS_OWNER:-t2}

volumes:
  cdc_broker_data:
  block-capacity:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=65534,gid=65534,mode=0700
    labels:
      io.addp.node-metrics.owner: ${ADDP_NODE_METRICS_OWNER:-t2}
  prometheus_data:
  postgres_data:
secrets:
  metrics-postgres-password:
    file: ${METRICS_T2_WORK}/postgres-password
