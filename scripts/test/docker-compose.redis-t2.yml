services:
  redis:
    image: public.ecr.aws/docker/library/redis:7.2.13@sha256:37aa82f9fdff30517603b2e2c5376b34b106d353c2b508262260d3bb0d2c21ba
    command: ["sh", "/addp/redis/start.sh"]
    environment:
      BUSINESS_REDIS_ADMIN_PASSWORD: ${BUSINESS_REDIS_ADMIN_PASSWORD:?T2 admin password required}
      BUSINESS_REDIS_READER_PASSWORD: ${BUSINESS_REDIS_READER_PASSWORD:?T2 reader password required}
    ports:
      - "127.0.0.1::6379"
    volumes:
      - redis_data:/data
      - ../../business/redis:/addp/redis:ro
      - ../infra/redis-authentication.sh:/addp/redis-authentication.sh:ro
    tmpfs:
      - /run/addp-redis:mode=0700
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$BUSINESS_REDIS_ADMIN_PASSWORD" redis-cli --user addp_business_admin -e ping | grep -qx PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: "no"
  redis-infra:
    profiles: [redis-observation]
    image: public.ecr.aws/docker/library/redis:7.2.13@sha256:37aa82f9fdff30517603b2e2c5376b34b106d353c2b508262260d3bb0d2c21ba
    command: ["sh", "/addp/redis-authentication.sh", "infra"]
    environment:
      REDIS_PASSWORD: ${BUSINESS_REDIS_ADMIN_PASSWORD:?T2 deployment password required}
    volumes:
      - redis_infra_data:/data
      - ../infra/redis-authentication.sh:/addp/redis-authentication.sh:ro
    tmpfs:
      - /run/addp-redis:mode=0700
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -e ping | grep -qx PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    restart: "no"
  promtool:
    profiles: [redis-observation]
    image: quay.io/prometheus/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    entrypoint: ["/bin/promtool"]
    tmpfs:
      - /tmp:size=128m,mode=1777
    user: "65534:65534"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    restart: "no"

volumes:
  redis_data:
  redis_infra_data:
