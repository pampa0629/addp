services:
  redis:
    image: public.ecr.aws/docker/library/redis:7.2.13@sha256:37aa82f9fdff30517603b2e2c5376b34b106d353c2b508262260d3bb0d2c21ba
    command: ["sh", "/addp/redis/start.sh"]
    environment:
      BUSINESS_REDIS_ADMIN_PASSWORD: ${BUSINESS_REDIS_ADMIN_PASSWORD:?T2 admin password required}
      BUSINESS_REDIS_READER_PASSWORD: ${BUSINESS_REDIS_READER_PASSWORD:?T2 reader password required}
    ports:
      - "127.0.0.1::6379"
    volumes:
      - redis_data:/data
      - ../../business/redis:/addp/redis:ro
      - ../infra/redis-authentication.sh:/addp/redis-authentication.sh:ro
    tmpfs:
      - /run/addp-redis:mode=0700
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$BUSINESS_REDIS_ADMIN_PASSWORD" redis-cli --user addp_business_admin -e ping | grep -qx PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: "no"
  redis-infra:
    profiles: [redis-observation]
    image: public.ecr.aws/docker/library/redis:7.2.13@sha256:37aa82f9fdff30517603b2e2c5376b34b106d353c2b508262260d3bb0d2c21ba
    command: ["sh", "/addp/redis-authentication.sh", "infra"]
    environment:
      REDIS_PASSWORD: ${BUSINESS_REDIS_ADMIN_PASSWORD:?T2 deployment password required}
    ports:
      - "127.0.0.1::6379"
    volumes:
      - redis_infra_data:/data
      - ../infra/redis-authentication.sh:/addp/redis-authentication.sh:ro
    tmpfs:
      - /run/addp-redis:mode=0700
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -e ping | grep -qx PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    restart: "no"
  valkey:
    profiles: [valkey-core]
    image: ghcr.io/valkey-io/valkey:8.1.9-alpine@sha256:4934d214fd7e091d4ee77b398945b3fd62c6dd0ac71d8b79e2e3cbad8364f3b1
    environment:
      REDISCLI_AUTH: ${BUSINESS_REDIS_ADMIN_PASSWORD:?T2 deployment password required}
    command:
      - sh
      - -ec
      - |
        printf 'requirepass %s\n' "$$REDISCLI_AUTH" | docker-entrypoint.sh valkey-server - --save "" --appendonly no
    ports:
      - "127.0.0.1::6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -e ping | grep -qx PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    restart: "no"
  redis-core-source:
    profiles: [redis-core-source]
    image: postgres:15@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    environment:
      POSTGRES_DB: redis_core_fixture
      POSTGRES_PASSWORD: ${BUSINESS_REDIS_ADMIN_PASSWORD:?T2 deployment password required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    configs:
      - source: redis_core_init_barrier
        target: /docker-entrypoint-initdb.d/99-cold-start.sh
    volumes:
      - redis_core_source_data:/var/lib/postgresql/data
    network_mode: none
    restart: "no"
  promtool:
    profiles: [redis-observation]
    image: quay.io/prometheus/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    entrypoint: ["/bin/promtool"]
    tmpfs:
      - /tmp:size=128m,mode=1777
    user: "65534:65534"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    restart: "no"

configs:
  redis_core_init_barrier:
    content: |
      #!/bin/sh
      timeout 90 sh -c 'until test -f /tmp/release-init; do sleep 0.1; done'

volumes:
  redis_core_source_data:
  redis_data:
  redis_infra_data:
