# Scoped release for an existing project network and its database and cache.
name: ${ADDP_DEPLOYMENT_PROJECT:?set the deployment project}
services:
  system-backend:
    extends: {file: ../../docker-compose.yml, service: system-backend}
    container_name: !reset null
    environment: &endpoints
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
  system-frontend:
    extends: {file: ../../docker-compose.yml, service: system-frontend}
    profiles: [module-system]
    container_name: !reset null
  meta-backend:
    extends: {file: ../../docker-compose.yml, service: meta-backend}
    container_name: !reset null
    environment: *endpoints
  meta-worker:
    extends: {file: ../../docker-compose.yml, service: meta-worker}
    environment: *endpoints
  gateway:
    extends: {file: ../../docker-compose.yml, service: gateway}
    container_name: !reset null
    environment: *endpoints
  console:
    extends: {file: ../../docker-compose.yml, service: console}
    container_name: !reset null
  meta-frontend:
    extends: {file: ../../docker-compose.yml, service: meta-frontend}
    container_name: !reset null
  inference-backend:
    extends: {file: ../../docker-compose.yml, service: inference-backend}
    profiles: [module-inference]
    container_name: !reset null
    environment: *endpoints
  inference-frontend:
    extends: {file: ../../docker-compose.yml, service: inference-frontend}
    profiles: [module-inference]
    container_name: !reset null
  orchestrator-backend:
    extends: {file: ../../docker-compose.yml, service: orchestrator-backend}
    profiles: [module-orchestrator]
    container_name: !reset null
    environment: *endpoints
  orchestrator-frontend:
    extends: {file: ../../docker-compose.yml, service: orchestrator-frontend}
    profiles: [module-orchestrator]
    container_name: !reset null
  monitor-backend:
    extends: {file: ../../docker-compose.yml, service: monitor-backend}
    profiles: [module-monitor]
    container_name: !reset null
    environment: *endpoints
  monitor-frontend:
    extends: {file: ../../docker-compose.yml, service: monitor-frontend}
    profiles: [module-monitor]
    container_name: !reset null
  standard-backend:
    extends: {file: ../../docker-compose.yml, service: standard-backend}
    profiles: [module-standard]
    container_name: !reset null
    environment: *endpoints
  standard-frontend:
    extends: {file: ../../docker-compose.yml, service: standard-frontend}
    profiles: [module-standard]
    container_name: !reset null
  model-backend:
    extends: {file: ../../docker-compose.yml, service: model-backend}
    profiles: [module-model]
    container_name: !reset null
    environment: *endpoints
  model-frontend:
    extends: {file: ../../docker-compose.yml, service: model-frontend}
    profiles: [module-model]
    container_name: !reset null
  service-backend:
    extends: {file: ../../docker-compose.yml, service: service-backend}
    profiles: [module-service]
    container_name: !reset null
    environment: *endpoints
  service-frontend:
    extends: {file: ../../docker-compose.yml, service: service-frontend}
    profiles: [module-service]
    container_name: !reset null
  asset-backend:
    extends: {file: ../../docker-compose.yml, service: asset-backend}
    profiles: [module-asset]
    container_name: !reset null
    environment: *endpoints
  asset-frontend:
    extends: {file: ../../docker-compose.yml, service: asset-frontend}
    profiles: [module-asset]
    container_name: !reset null
  workbench-backend:
    extends: {file: ../../docker-compose.yml, service: workbench-backend}
    profiles: [module-workbench]
    container_name: !reset null
    environment: *endpoints
  workbench-frontend:
    extends: {file: ../../docker-compose.yml, service: workbench-frontend}
    profiles: [module-workbench]
    container_name: !reset null
  manager-backend:
    extends: {file: ../../docker-compose.yml, service: manager-backend}
    profiles: [module-manager]
    container_name: !reset null
    environment: *endpoints
  manager-frontend:
    extends: {file: ../../docker-compose.yml, service: manager-frontend}
    profiles: [module-manager]
    container_name: !reset null
  security-backend:
    extends: {file: ../../docker-compose.yml, service: security-backend}
    profiles: [module-security]
    container_name: !reset null
    environment: *endpoints
  security-worker:
    extends: {file: ../../docker-compose.yml, service: security-worker}
    profiles: [module-security]
    environment: *endpoints
  security-frontend:
    extends: {file: ../../docker-compose.yml, service: security-frontend}
    profiles: [module-security]
    container_name: !reset null
  nginx:
    extends: {file: ../../docker-compose.yml, service: nginx}
    container_name: !reset null
    depends_on: !override [console, meta-frontend, gateway]
    ports: !override
      - "${NGINX_BIND_HOST:-127.0.0.1}:${NGINX_PORT:?set the public port}:80"
networks:
  addp-network:
    external: true
    name: ${ADDP_DEPLOYMENT_NETWORK:?set the project network}
