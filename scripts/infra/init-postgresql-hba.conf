# PostgreSQL Client Authentication Configuration File
# ===================================================
#
# 此配置文件控制哪些主机可以连接到 PostgreSQL 数据库
# 以及使用何种认证方式
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
#
# TYPE 可以是:
#   local      - Unix 域套接字连接
#   host       - TCP/IP 连接（包括 SSL 和非 SSL）
#   hostssl    - 仅 SSL TCP/IP 连接
#   hostnossl  - 仅非 SSL TCP/IP 连接
#
# METHOD 可以是:
#   trust      - 无需密码（不安全，仅用于开发）
#   md5        - MD5 哈希密码认证
#   scram-sha-256 - SCRAM-SHA-256 认证（推荐）
#   reject     - 拒绝连接

# ==================== 开发环境配置 ====================

# "local" is for Unix domain socket connections only
# 容器内部使用 Unix socket 连接（无需密码）
local   all             all                                     trust

# IPv4 local connections
# 允许所有 IPv4 地址连接（开发环境）
# 包括: localhost, Docker 网桥, 宿主机等
host    all             all             0.0.0.0/0               md5

# IPv6 local connections
# 允许 IPv6 本地回环地址
host    all             all             ::1/128                 trust

# ==================== 生产环境建议 ====================
#
# 生产环境应替换为更严格的规则:
#
# # 仅允许特定网段
# host    all             all             10.0.0.0/8              scram-sha-256
# host    all             all             172.16.0.0/12           scram-sha-256
# host    all             all             192.168.0.0/16          scram-sha-256
#
# # 或仅允许特定 IP
# host    all             all             192.168.1.100/32        scram-sha-256
#
# 并启用 SSL:
# hostssl all             all             0.0.0.0/0               scram-sha-256
