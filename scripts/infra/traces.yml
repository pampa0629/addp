services:
  tempo:
    image: grafana/tempo:2.9.0@sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4
    command: [-config.file=/etc/tempo/platform.yml, -config.expand-env=true, -target=all]
    user: "10001:10001"
    cpus: 2
    mem_limit: 2g
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      TEMPO_BUCKET: ${TEMPO_BUCKET:-addp-runtime-traces}
      TEMPO_S3_ACCESS_KEY: ${TEMPO_S3_ACCESS_KEY:-}
      TEMPO_S3_SECRET_KEY: ${TEMPO_S3_SECRET_KEY:-}
    volumes:
      - type: bind
        source: ${ADDP_TRACE_DEPLOYMENT_DIR:-/nonexistent/addp-trace-deployment}/tempo.yml
        target: /etc/tempo/platform.yml
        read_only: true
        bind: {create_host_path: false}
    restart: unless-stopped
  trace-query:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "${ADDP_RUNTIME_LOG_OWNER:-0:0}"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    cpus: 0.25
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - ./trace-query.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${ADDP_TRACE_DEPLOYMENT_DIR:-/nonexistent/addp-trace-deployment}
        target: /trace-deployment
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9080/ready]
      interval: 5s
      timeout: 3s
      retries: 36
    restart: unless-stopped
