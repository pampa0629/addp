worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8443 ssl;
    ssl_certificate /trace-deployment/server.crt;
    ssl_certificate_key /trace-deployment/server.key;
    ssl_client_certificate /trace-deployment/query-ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    location ~ "^/api/(search|traces/[0-9a-f]{32})$" {
      if ($request_method != GET) { return 405; }
      if ($content_length != "") { return 400; }
      proxy_set_header Authorization "";
      proxy_set_header X-Scope-OrgID "";
      proxy_pass http://tempo:3200;
    }
    location / { return 404; }
  }
  server {
    listen 127.0.0.1:9080;
    location = /ready { proxy_pass http://tempo:3200/ready; }
    location / { return 404; }
  }
}
