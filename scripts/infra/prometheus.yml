global:
  scrape_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  # Infrastructure self-observation uses only the center health identity.
  - job_name: prometheus
    scheme: https
    honor_labels: false
    sample_limit: 20000
    body_size_limit: 10MB
    label_limit: 20
    label_name_length_limit: 128
    label_value_length_limit: 512
    tls_config:
      ca_file: /etc/prometheus/tls/ca.crt
      cert_file: /etc/prometheus/tls/health.crt
      key_file: /etc/prometheus/tls/health.key
      min_version: TLS12
    static_configs:
      - targets: [localhost:9090]
  # Node and process sources share the sole Monitor HTTP SD job and its budget.
  - job_name: addp_nodes
    scheme: https
    metrics_path: /metrics
    honor_labels: false
    follow_redirects: false
    target_limit: 9
    sample_limit: 20000
    body_size_limit: 10MB
    label_limit: 20
    label_name_length_limit: 128
    label_value_length_limit: 512
    tls_config:
      ca_file: /etc/prometheus/deployment/source-ca.crt
      cert_file: /etc/prometheus/deployment/collector.crt
      key_file: /etc/prometheus/deployment/collector.key
      min_version: TLS12
    http_sd_configs:
      - url: @@MONITOR_URL@@
        refresh_interval: 30s
        follow_redirects: false
        tls_config:
          ca_file: /etc/prometheus/deployment/control-ca.crt
          min_version: TLS12
        oauth2:
          client_id: addp-prometheus
          client_secret_file: /etc/prometheus/deployment/prometheus-client-secret
          scopes: [addp.api]
          token_url: @@SYSTEM_URL@@
          endpoint_params:
            context_type: platform
            audience: addp.api
          tls_config:
            ca_file: /etc/prometheus/deployment/control-ca.crt
            min_version: TLS12
@@DESKTOP_LOOPBACK@@    metric_relabel_configs:
      # Remove exporter-owned temporary labels before saving controlled identities.
      - action: labeldrop
        regex: '__tmp_.*|__meta_.*'
      # Node ownership belongs to host/container targets; process-host relations
      # are read from System, never inferred from exporter labels.
      - source_labels: [addp_monitor_kind, addp_node_id]
        regex: '(host_resources|container_resources);(.+)'
        replacement: '$2'
        target_label: __tmp_addp_node_id
      - source_labels: [addp_monitor_kind]
        target_label: __tmp_addp_monitor_kind
      - source_labels: [addp_source]
        target_label: __tmp_addp_source
      - source_labels: [addp_monitor_kind, addp_module_name]
        regex: 'process_resources;(.+)'
        replacement: '$1'
        target_label: __tmp_addp_module_name
      - source_labels: [addp_monitor_kind, addp_instance_id]
        regex: 'process_resources;(.+)'
        replacement: '$1'
        target_label: __tmp_addp_instance_id
      - source_labels: [addp_monitor_kind, addp_runtime_role]
        regex: 'process_resources;(.+)'
        replacement: '$1'
        target_label: __tmp_addp_runtime_role
      - action: labeldrop
        regex: '(exported_)*addp_.*'
      - source_labels: [__tmp_addp_node_id]
        target_label: addp_node_id
      - source_labels: [__tmp_addp_monitor_kind]
        target_label: addp_monitor_kind
      - source_labels: [__tmp_addp_source]
        target_label: addp_source
      - source_labels: [__tmp_addp_module_name]
        target_label: addp_module_name
      - source_labels: [__tmp_addp_instance_id]
        target_label: addp_instance_id
      - source_labels: [__tmp_addp_runtime_role]
        target_label: addp_runtime_role
      - action: labeldrop
        regex: '__tmp_addp_.*'
