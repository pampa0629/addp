global:
  scrape_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  # Infrastructure self-observation only. Business discovery belongs to Monitor.
  - job_name: prometheus
    scheme: https
    honor_labels: false
    sample_limit: 20000
    body_size_limit: 10MB
    label_limit: 20
    label_name_length_limit: 128
    label_value_length_limit: 512
    tls_config:
      ca_file: /etc/prometheus/tls/ca.crt
      cert_file: /etc/prometheus/tls/health.crt
      key_file: /etc/prometheus/tls/health.key
      min_version: TLS12
    static_configs:
      - targets: [localhost:9090]
