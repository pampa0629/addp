services:
  loki:
    image: grafana/loki:3.6.0@sha256:6a705de65df88aa0d90a44779606b0042722c86637335a73858f65f9fe9f9557
    command: ["-config.file=/etc/loki/runtime.yml", "-config.expand-env=true"]
    environment:
      LOKI_S3_ENDPOINT: ${LOKI_S3_ENDPOINT:-http://minio:9000}
      LOKI_BUCKET: ${LOKI_BUCKET:-addp-runtime-logs}
      LOKI_S3_ACCESS_KEY: ${LOKI_S3_ACCESS_KEY:?runtime log account required}
      LOKI_S3_SECRET_KEY: ${LOKI_S3_SECRET_KEY:?runtime log secret required}
      LOKI_RETENTION_HOURS: ${LOKI_RETENTION_HOURS:-168}
    volumes:
      - ./loki.yml:/etc/loki/runtime.yml:ro
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.10.2@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy", "/etc/alloy/runtime.alloy"]
    environment:
      LOKI_WRITE_URL: http://runtime-log-api:3100/loki/api/v1/push
      LOKI_WRITE_TOKEN: ${LOKI_WRITE_TOKEN:?runtime log write token required}
    volumes:
      - ./runtime-logs.alloy:/etc/alloy/runtime.alloy:ro
    restart: unless-stopped
  runtime-log-api:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    environment:
      LOKI_READ_TOKEN: ${LOKI_READ_TOKEN:?runtime log read token required}
      LOKI_WRITE_TOKEN: ${LOKI_WRITE_TOKEN:?runtime log write token required}
      NGINX_ENVSUBST_FILTER: ^LOKI_(READ|WRITE)_TOKEN$$
    volumes:
      - ./runtime-log-api.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 36
    restart: unless-stopped
  runtime-log-pruner:
    user: "${ADDP_RUNTIME_LOG_OWNER:-0:0}"
    build:
      context: ../..
      dockerfile: scripts/infra/Dockerfile.runtime-log
    environment:
      ADDP_RUNTIME_LOG_ROOT: /var/log/addp
      ADDP_RUNTIME_LOG_SOURCE_HOURS: ${ADDP_RUNTIME_LOG_SOURCE_HOURS:-48}
      ADDP_RUNTIME_LOG_SEGMENT_BYTES: ${ADDP_RUNTIME_LOG_SEGMENT_BYTES:-52428800}
      ADDP_RUNTIME_LOG_INSTANCE_BYTES: ${ADDP_RUNTIME_LOG_INSTANCE_BYTES:-1073741824}
      ADDP_RUNTIME_LOG_NODE_BYTES: ${ADDP_RUNTIME_LOG_NODE_BYTES:-10737418240}
    restart: unless-stopped
  runtime-log-observer:
    user: "${ADDP_RUNTIME_LOG_OWNER:-0:0}"
    build:
      context: ../..
      dockerfile: scripts/infra/Dockerfile.runtime-log
    command: ["observe"]
    environment:
      ADDP_RUNTIME_LOG_ROOT: /var/log/addp
      ADDP_HOST_NODE_NAME: ${ADDP_HOST_NODE_NAME:-}
      ADDP_RUNTIME_LOG_NODE_BYTES: ${ADDP_RUNTIME_LOG_NODE_BYTES:-10737418240}
      LOG_OBSERVER_SERVICE_CLIENT_SECRET: ${LOG_OBSERVER_SERVICE_CLIENT_SECRET:-}
      SYSTEM_URL: ${LOG_OBSERVER_SYSTEM_URL:-http://host.docker.internal:8180}
      MONITOR_URL: ${LOG_OBSERVER_MONITOR_URL:-http://host.docker.internal:8100}
      ALLOY_URL: http://alloy:12345
      LOKI_URL: http://runtime-log-api:3100
      LOKI_READ_TOKEN: ${LOKI_READ_TOKEN:?runtime log read token required}
    restart: unless-stopped
