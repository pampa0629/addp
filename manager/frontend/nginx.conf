server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - all routes handled by Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 兼容生产构建 base=/manager/ 时的静态资源路径
    location ^~ /manager/assets/ {
        rewrite ^/manager/(.*)$ /$1 break;
        try_files $uri =404;
    }

    # 兼容生产构建 base=/manager/ 时的运行时预览插件路径
    location ^~ /manager/plugins/ {
        rewrite ^/manager/(.*)$ /$1 break;
        try_files $uri =404;
    }

    # API 代理到 Manager Backend
    location /api/ {
        proxy_pass http://manager-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
