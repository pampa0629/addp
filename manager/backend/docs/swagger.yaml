basePath: /api/v1/manager
definitions:
  github_com_addp_manager_internal_models.EmbeddingTask:
    properties:
      bucket:
        type: string
      created_at:
        description: 时间戳
        type: string
      created_by:
        type: integer
      description:
        type: string
      enabled:
        type: boolean
      engine_id:
        description: EmbeddingTask 特有字段
        type: integer
      file_types:
        description: 文件扩展名过滤（逗号分隔，如 "jpg,png,pdf"）
        type: string
      id:
        type: integer
      last_execution_id:
        description: 最近一次执行信息（回写）
        type: string
      last_execution_status:
        type: string
      last_run_at:
        type: string
      modality:
        description: 向量化配置
        type: string
      name:
        description: 任务基本信息
        type: string
      prefix:
        type: string
      recursive:
        type: boolean
      tenant_id:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_addp_manager_internal_models.MetaManualScanRequest:
    properties:
      namespaces:
        items:
          type: string
        type: array
      object_paths:
        items:
          type: string
        type: array
      scan_depth:
        type: string
      scan_type:
        type: string
    type: object
  github_com_addp_manager_internal_models.MetaScanTaskRequest:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      engine_id:
        type: integer
      name:
        type: string
      namespaces:
        items:
          type: string
        type: array
      object_paths:
        items:
          type: string
        type: array
      scan_depth:
        type: string
      schedule:
        type: string
      schedule_time:
        type: string
      schedule_type:
        type: string
      schedule_value:
        items:
          type: integer
        type: array
    required:
    - name
    - schedule_type
    type: object
  github_com_addp_manager_internal_models.MvtTask:
    properties:
      created_at:
        description: 时间戳
        type: string
      created_by:
        type: integer
      description:
        type: string
      enabled:
        type: boolean
      engine_id:
        description: MvtTask 特有字段
        type: integer
      id:
        type: integer
      last_execution_id:
        description: 最近一次执行信息（回写）
        type: string
      last_execution_status:
        type: string
      last_run_at:
        type: string
      max_zoom:
        type: integer
      min_zoom:
        type: integer
      name:
        description: 任务基本信息
        type: string
      optimization_config:
        description: 优化配置（JSONB）
        items:
          type: integer
        type: array
      schema_name:
        type: string
      table_name:
        type: string
      tenant_id:
        type: integer
      updated_at:
        type: string
    type: object
  internal_api.CreateEmbeddingRequest:
    properties:
      bucket:
        type: string
      engine_id:
        type: integer
      object_key:
        description: scope=object 时必填
        type: string
      prefix:
        description: scope=directory 时使用
        type: string
      recursive:
        description: 是否递归，默认 true
        type: boolean
      scope:
        description: object|directory|bucket，默认 object
        type: string
      task_name:
        description: 任务名称（可选）
        type: string
    required:
    - bucket
    - engine_id
    type: object
  internal_api.TaskExecuteRequest:
    properties:
      parent_execution_id:
        description: 父执行ID（Orchestrator 调用时传入）
        type: string
      trigger_type:
        description: manual|schedule|api|orchestrator，默认 manual
        type: string
    type: object
  internal_api.TileConfigResponse:
    properties:
      avg_records_per_tile:
        description: maxZoom 层级的平均记录数/瓦片
        type: number
      estimated_tiles:
        description: 预估瓦片总数（minZoom-maxZoom）
        type: integer
      extent:
        description: 地理范围（可选）
        items:
          type: number
        type: array
      max_zoom:
        description: 最大 zoom 层级
        type: integer
      min_zoom:
        description: 最小 zoom 层级
        type: integer
      record_count:
        description: 表记录数
        type: integer
      srid:
        description: 坐标系（可选）
        type: integer
    type: object
  internal_api.TriggerQuickViewRequest:
    properties:
      concurrency:
        description: 默认10
        type: integer
      max_zoom:
        description: 默认18
        type: integer
      min_zoom:
        description: 可选
        type: integer
      optimization_config:
        allOf:
        - $ref: '#/definitions/models.OptimizationConfig'
        description: v2.0 优化配置
      priority:
        description: '"critical", "default", "low"'
        type: string
    type: object
  internal_api.UpdatePreferredModeRequest:
    properties:
      preferred_mode:
        enum:
        - geojson
        - mvt
        type: string
    required:
    - preferred_mode
    type: object
  models.AttributePruningConfig:
    properties:
      enabled:
        description: 是否启用
        type: boolean
      zoom_threshold:
        description: zoom 分界线，<= threshold 只返回主键
        type: integer
    type: object
  models.ExtentOptimizationConfig:
    properties:
      base_extent:
        description: 其他层的基础 Extent（默认 512）
        type: integer
      max_zoom_extent:
        description: Max zoom 层的 Extent（默认 1024）
        type: integer
      min_extent:
        description: 动态减半的最小 Extent（固定 256）
        type: integer
    type: object
  models.OptimizationConfig:
    properties:
      attribute_pruning:
        allOf:
        - $ref: '#/definitions/models.AttributePruningConfig'
        description: 属性优化
      extent_optimization:
        allOf:
        - $ref: '#/definitions/models.ExtentOptimizationConfig'
        description: Extent 优化（分层策略 + 动态减半）
      tile_size_thresholds:
        allOf:
        - $ref: '#/definitions/models.TileSizeThresholdsConfig'
        description: 瓦片大小阈值
      version:
        description: 配置版本
        type: string
    type: object
  models.TileSizeThresholdsConfig:
    properties:
      max_size_mb:
        description: 瓦片大小限制（MB）- 用户可配置，默认 5MB
        type: number
    type: object
host: localhost:8081
info:
  contact: {}
  title: ADDP Manager API
  version: "1.0"
paths:
  /config/map:
    get:
      description: 返回地图服务相关的配置信息（高德地图Key、天地图Key等）| Return map service configuration
        (AMap key, TDT key, etc.)
      produces:
      - application/json
      responses:
        "200":
          description: 地图配置信息 | Map configuration
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取地图服务配置 | Get map service configuration
      tags:
      - Manager
  /embedding:
    post:
      consumes:
      - application/json
      description: 创建对象存储文件的向量化任务，支持单文件、目录和整个Bucket | Create vectorization task for
        object storage files, supports single file, directory, and entire bucket
      parameters:
      - description: 向量化任务配置 | Embedding task configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateEmbeddingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 任务已创建 | Task created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建向量化任务 | Create embedding task
      tags:
      - Manager
  /embedding/tasks/{task_id}:
    get:
      description: 查询向量化任务的实时状态（仅内存中的运行中任务）| Query real-time status of an embedding
        task (in-memory running tasks only)
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 任务状态信息 | Task status
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 任务不存在或已过期 | Task not found or expired
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取向量化任务状态 | Get embedding task status
      tags:
      - Manager
  /embedding_tasks:
    get:
      description: 列出Manager模块的任务（MVT生成任务和向量化任务）| List Manager module tasks (MVT generation
        and embedding tasks)
      parameters:
      - description: '任务类型过滤：mvt_generation|embedding | Task type filter: mvt_generation|embedding'
        in: query
        name: task_type
        type: string
      - description: 页码，默认1 | Page number, default 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20 | Page size, default 20
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 任务列表 | Task list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出任务 | List tasks
      tags:
      - Manager
    post:
      consumes:
      - application/json
      description: 创建新的向量化任务配置（定时或手动触发）| Create a new embedding task configuration
        (scheduled or manual)
      parameters:
      - description: 向量化任务配置 | Embedding task configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_manager_internal_models.EmbeddingTask'
      produces:
      - application/json
      responses:
        "201":
          description: 创建的任务配置 | Created task configuration
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建向量化任务配置 | Create embedding task configuration
      tags:
      - Manager
  /embedding_tasks/{id}:
    delete:
      description: 删除指定的向量化任务配置 | Delete a specific embedding task configuration
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功 | Deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除向量化任务配置 | Delete embedding task configuration
      tags:
      - Manager
    get:
      description: 获取指定类型和ID的任务详细信息 | Get detailed information of a task by type and
        ID
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 任务详情 | Task detail
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 任务不存在 | Task not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务详情 | Get task detail
      tags:
      - Manager
    put:
      consumes:
      - application/json
      description: 更新指定的向量化任务配置 | Update a specific embedding task configuration
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: 向量化任务配置 | Embedding task configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_manager_internal_models.EmbeddingTask'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的任务配置 | Updated task configuration
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 任务不存在 | Task not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新向量化任务配置 | Update embedding task configuration
      tags:
      - Manager
  /engines:
    get:
      description: 获取当前租户可用的存储引擎列表 | Get available storage engine list for the current
        tenant
      produces:
      - application/json
      responses:
        "200":
          description: 引擎列表 | Engine list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取引擎列表 | List engines
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/geojson:
    get:
      description: 获取空间数据项（关系表）的GeoJSON格式数据，支持分页 | Get spatial item data in GeoJSON
        format with pagination support
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: 命名空间 | Namespace
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      - description: 页码，默认1 | Page number, default 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认1000，最大5000 | Page size, default 1000, max 5000
        in: query
        name: page_size
        type: integer
      - description: 几何列名，默认geom | Geometry column, default geom
        in: query
        name: geom_column
        type: string
      produces:
      - application/geo+json
      responses:
        "200":
          description: GeoJSON FeatureCollection
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取GeoJSON数据 | Get GeoJSON data
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/geojson/metadata:
    get:
      description: 获取空间数据项（关系表）的元数据信息（记录数、地理范围、坐标系等）| Get spatial item metadata (record
        count, extent, SRID, etc.)
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: 命名空间 | Namespace
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      - description: 几何列名，默认geom | Geometry column, default geom
        in: query
        name: geom_column
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 元数据信息 | Metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取GeoJSON元数据 | Get GeoJSON metadata
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/quick-view:
    delete:
      description: 清除指定空间数据项（关系表）的快显缓存数据 | Clear quick view cache data for a spatial
        item (relational table)
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: 命名空间 | Namespace
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 清除成功 | Cleared successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 清除快显缓存 | Clear quick view cache
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/quick-view/cancel:
    post:
      description: 取消正在进行的快显缓存生成任务 | Cancel an ongoing quick view cache generation
        task
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: 命名空间 | Namespace
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 取消成功 | Cancelled successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 取消快显生成任务 | Cancel quick view generation task
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/quick-view/check-preparation:
    get:
      description: 检查空间数据项（关系表）的快显准备状态，通过则自动创建快显记录 | Check preparation status for
        quick view, auto-create record if passed
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: 命名空间 | Namespace
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 准备状态信息 | Preparation status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 检查快显准备状态 | Check quick view preparation status
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/quick-view/pre-cache:
    post:
      consumes:
      - application/json
      description: 触发指定空间数据项（关系表）的MVT瓦片快显缓存生成任务 | Trigger MVT tile quick view cache
        generation for a spatial item (relational table)
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: 命名空间 | Namespace
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      - description: 快显生成配置 | Quick view generation configuration
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_api.TriggerQuickViewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 任务已加入队列 | Task enqueued
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 触发快显缓存生成 | Trigger quick view cache generation
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/quick-view/preferred-mode:
    patch:
      consumes:
      - application/json
      description: 更新指定空间数据项（关系表）的用户偏好显示模式（geojson或mvt）| Update preferred display
        mode for a spatial item (geojson or mvt)
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: 命名空间 | Namespace
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      - description: 显示模式配置 | Display mode configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.UpdatePreferredModeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功 | Updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 记录不存在 | Record not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新显示模式偏好 | Update preferred display mode
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/quick-view/prepare:
    post:
      description: 启动空间数据项（关系表）的MVT瓦片生成准备工作（如创建空间索引等）| Start MVT tile generation preparation
        work (e.g. creating spatial indexes)
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: 命名空间 | Namespace
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 准备工作已启动 | Preparation started
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 启动MVT准备工作 | Start MVT preparation
