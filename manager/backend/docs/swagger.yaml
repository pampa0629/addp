            $ref: '#/definitions/github_com_addp_manager_internal_service.SearchResult'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 搜索服务不可用 | Search service unavailable
          schema:
            additionalProperties: true
            type: object
