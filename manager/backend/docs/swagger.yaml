    get:
      description: 增量加载指定节点的子节点，避免全量重载 | Incrementally load children of a specific
        node to avoid full reload
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: engine_id
        required: true
        type: integer
      - description: 资源定位符URI | Resource locator URI
        in: query
