        required: true
        type: string
      - description: 页码，默认1 | Page number, default 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10 | Page size, default 10
        in: query
        name: page_size
        type: integer
      - description: 超级管理员指定检索租户；普通用户忽略该参数 | Tenant filter for super admin; ignored
          for tenant users
