          description: 已提交的刷新运行 | Submitted refresh run
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权访问 | Access denied
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 刷新资源节点 | Refresh resource node
      tags:
      - Manager
  /tree/{engine_id}/search:
    get:
      description: 在资源树中搜索匹配关键词的节点 | Search for nodes matching a keyword in the resource
        tree
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: engine_id
        required: true
        type: integer
      - description: 搜索关键词（至少2个字符）| Search keyword (at least 2 characters)
