          description: 下载内容流 | Download content stream
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权访问 | Access denied
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 逻辑存储对象下载 | Logical storage object download
      tags:
      - Manager
  /storage-stream:
    get:
      description: 支持 Range 请求的单存储叶子内容流式传输，用于图片、PDF、视频等在线预览；原始下载请使用 storage-download。storage_ref
        在对象存储中为 bucket/path，在文件系统中为文件路径 | Storage leaf content streaming with Range
        request support for online previews such as images, PDF, and video; use storage-download
        for original downloads. storage_ref is bucket/path for object catalogs and
        file path for file catalogs
      parameters:
      - description: 存储引擎ID | Engine ID
        in: query
        name: engine_id
        required: true
        type: integer
      - description: 存储内容引用 | Storage content reference
        in: query
        name: storage_ref
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 存储内容流 | Storage content stream
        "206":
          description: 部分存储内容流 | Partial storage content stream
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权访问 | Access denied
          schema:
            additionalProperties: true
            type: object
        "416":
          description: Range 不可满足 | Range not satisfiable
          schema:
            additionalProperties: true
            type: object
