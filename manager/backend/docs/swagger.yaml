host: localhost:8081
info:
  contact: {}
  title: ADDP Manager API
  version: "1.0"
paths:
  /config/map:
    get:
      description: 返回地图服务相关的配置信息（高德地图Key、天地图Key等）| Return map service configuration
        (AMap key, TDT key, etc.)
      produces:
      - application/json
      responses:
        "200":
          description: 地图配置信息 | Map configuration
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取地图服务配置 | Get map service configuration
      tags:
      - Manager
  /embedding_executions:
    post:
      consumes:
      - application/json
      description: 从资源树 item 或 node 触发一次性向量化执行，返回统一 execution_id，不创建向量化任务定义。| Create
        an ad-hoc embedding execution from a resource tree item or node and return
        the unified execution_id.
      parameters:
      - description: 一次性向量化执行请求 | Ad-hoc embedding execution request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_manager_internal_service.EmbeddingExecutionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 执行已创建 | Execution created
          schema:
            $ref: '#/definitions/github_com_addp_manager_internal_service.EmbeddingExecutionResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 向量化服务不可用 | Embedding service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建一次性向量化执行 | Create ad-hoc embedding execution
      tags:
      - Manager
  /embedding_tasks:
    get:
      description: 列出 Manager 模块的向量化任务配置。该私有入口固定返回 task_type=embedding；编排模块应使用标准 /tasks
        入口。| List Manager embedding task configurations. This private endpoint always
        returns task_type=embedding; orchestrator should use the standard /tasks endpoint.
      parameters:
      - description: 页码，默认1 | Page number, default 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20 | Page size, default 20
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 任务列表 | Task list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出向量化任务配置 | List embedding task configurations
      tags:
      - Manager
    post:
      consumes:
      - application/json
      description: 创建新的向量化任务配置（定时或手动触发）| Create a new embedding task configuration
        (scheduled or manual)
      parameters:
      - description: 向量化任务配置 | Embedding task configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.EmbeddingTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建的任务配置 | Created task configuration
          schema:
            $ref: '#/definitions/internal_api.TileCacheTaskResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建向量化任务配置 | Create embedding task configuration
      tags:
      - Manager
  /embedding_tasks/{id}:
    delete:
      description: 删除指定的向量化任务配置 | Delete a specific embedding task configuration
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功 | Deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除向量化任务配置 | Delete embedding task configuration
      tags:
      - Manager
    get:
      description: 获取指定类型和ID的任务详细信息 | Get detailed information of a task by type and
        ID
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 任务详情 | Task detail
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 任务不存在 | Task not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务详情 | Get task detail
      tags:
      - Manager
    put:
      consumes:
      - application/json
      description: 更新指定的向量化任务配置 | Update a specific embedding task configuration
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: 向量化任务配置 | Embedding task configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.EmbeddingTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的任务配置 | Updated task configuration
          schema:
            $ref: '#/definitions/internal_api.TileCacheTaskResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 任务不存在 | Task not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新向量化任务配置 | Update embedding task configuration
      tags:
      - Manager
  /embeddings:
    get:
      description: 查询 Manager 向量化结果 artifact state。| List Manager embedding artifact
        states.
      parameters:
      - description: 页码，默认1 | Page number
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20 | Page size
        in: query
        name: page_size
        type: integer
      - description: 引擎ID | Engine ID
        in: query
        name: engine_id
        type: integer
      - description: 节点ID | Node ID
        in: query
        name: node_id
        type: integer
      - description: 数据项ID | Item ID
        in: query
        name: item_id
        type: integer
      - description: 结果状态 | Result status
        in: query
        name: status
        type: string
      - description: 关键词 | Query
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 向量化结果列表 | Embedding result list
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 向量化服务不可用 | Embedding service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询向量化结果 | List embedding results
      tags:
      - Manager
  /embeddings/{id}:
    delete:
      description: 删除 Manager 向量化结果，不删除源 data item。| Delete an embedding result without
        deleting the source data item.
      parameters:
      - description: 向量化结果ID | Embedding result ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功 | Deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 向量化服务不可用 | Embedding service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除向量化结果 | Delete embedding result
      tags:
      - Manager
  /engines:
    get:
      description: 获取当前租户可用的存储引擎列表 | Get available storage engine list for the current
        tenant
      produces:
      - application/json
