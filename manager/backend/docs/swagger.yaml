      responses:
        "200":
          description: 搜索结果 | Search results
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权访问 | Access denied
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 搜索资源节点 | Search resource nodes
      tags:
      - Manager
