basePath: /api/v1/manager
definitions:
  github_com_addp_common_models.JSONMap:
    additionalProperties: true
    type: object
  github_com_addp_manager_internal_models.MetaExtractionScanStats:
    properties:
      documents:
        type: integer
      extracted:
        type: integer
      failed:
        type: integer
      index_failed:
        type: integer
      indexed:
        type: integer
      unsupported:
        type: integer
    type: object
  github_com_addp_manager_internal_models.MetaManualScanRequest:
    properties:
      catalog_paths:
        items:
          type: string
        type: array
      engine_id:
        type: integer
      force:
        type: boolean
      item_id:
        type: integer
      node_id:
        type: integer
      scan_depth:
        type: string
      targets:
        items:
          type: string
        type: array
    type: object
  github_com_addp_manager_internal_models.MetaScanResponse:
    properties:
      catalog_nodes_scanned:
        type: integer
      duration_ms:
        type: integer
      extraction:
        $ref: '#/definitions/github_com_addp_manager_internal_models.MetaExtractionScanStats'
      fields_scanned:
        type: integer
      items_scanned:
        type: integer
      message:
        type: string
      started_at:
        type: string
      status:
        type: string
    type: object
  github_com_addp_manager_internal_models.MvtTask:
    properties:
      created_at:
        description: 时间戳
        type: string
      created_by:
        type: integer
      description:
        type: string
      enabled:
        type: boolean
      engine_id:
        description: MvtTask 特有字段
        type: integer
      id:
        type: integer
      last_execution_id:
        description: 最近一次执行信息（回写）
        type: string
      last_execution_status:
        type: string
      last_run_at:
        type: string
      max_zoom:
        type: integer
      min_zoom:
        type: integer
      name:
        description: 任务基本信息
        type: string
      optimization_config:
        description: 优化配置（JSONB）
        items:
          type: integer
        type: array
      schema_name:
        type: string
      table_name:
        type: string
      tenant_id:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_addp_manager_internal_service.EmbeddingExecutionRequest:
    properties:
      entry:
        type: string
      filters:
        additionalProperties: true
        type: object
      scope:
        $ref: '#/definitions/github_com_addp_manager_internal_service.EmbeddingExecutionScope'
      source:
        type: string
      target:
        $ref: '#/definitions/github_com_addp_manager_internal_service.EmbeddingExecutionTarget'
    type: object
  github_com_addp_manager_internal_service.EmbeddingExecutionResponse:
    properties:
      execution_id:
        type: string
      status:
        type: string
    type: object
  github_com_addp_manager_internal_service.EmbeddingExecutionScope:
    enum:
    - item
    - node
    type: string
    x-enum-varnames:
    - EmbeddingExecutionScopeItem
    - EmbeddingExecutionScopeNode
  github_com_addp_manager_internal_service.EmbeddingExecutionTarget:
    properties:
      engine_id:
        type: integer
      item_fingerprint:
        type: string
      item_id:
        type: integer
      locator:
        type: string
      node_id:
        type: integer
      recursive:
        type: boolean
    type: object
  github_com_addp_manager_internal_service.SearchDocument:
    properties:
      asset_id:
        type: string
      asset_type:
        type: string
      author:
        type: string
      bucket:
        type: string
      content_preview:
        type: string
      content_type:
        type: string
      created_date:
        type: string
      document_id:
        type: string
      document_type:
        type: string
      engine_id:
        type: integer
      engine_name:
        type: string
      engine_type:
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      full_name:
        type: string
      highlights:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      keywords:
        items:
          type: string
        type: array
      last_modified:
        type: string
      locator:
        type: string
      match_methods:
        description: '检索方式: ["keyword", "vector", "hybrid"]'
        items:
          type: string
        type: array
      metadata:
        additionalProperties: true
        type: object
      modified_date:
        type: string
      name:
        description: 文件名或表名
        type: string
      page_count:
        type: integer
      path:
        description: 目录路径（以 / 结尾）
        type: string
      schema:
        type: string
      score:
        type: number
      title:
        type: string
      vector_distance:
        description: 向量距离（如果有向量匹配）
        type: number
      word_count:
        type: integer
    type: object
  github_com_addp_manager_internal_service.SearchResult:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      results:
        items:
          $ref: '#/definitions/github_com_addp_manager_internal_service.SearchDocument'
        type: array
      total:
        type: integer
      vector_hits:
        items:
          $ref: '#/definitions/github_com_addp_manager_internal_service.VectorDocument'
        type: array
    type: object
  github_com_addp_manager_internal_service.VectorDocument:
    properties:
      asset_id:
        type: string
      bucket:
        type: string
      content_preview:
        type: string
      distance:
        type: number
      document_id:
        type: string
      engine_id:
        type: integer
      engine_name:
        type: string
      engine_type:
        type: string
      file_name:
        type: string
      locator:
        type: string
      metadata:
        additionalProperties: true
        type: object
      model:
        type: string
      name:
        description: 文件名
        type: string
      path:
        description: 目录路径（以 / 结尾）
        type: string
      score:
        type: number
      tenant_id:
        type: integer
      title:
        type: string
    type: object
  internal_api.EmbeddingTaskRequest:
    properties:
      config:
        $ref: '#/definitions/github_com_addp_common_models.JSONMap'
      description:
        type: string
      enabled:
        type: boolean
      name:
        type: string
      next_run_at:
        type: string
      schedule:
        type: string
    type: object
  internal_api.TaskExecuteRequest:
    properties:
      parameters:
        additionalProperties: true
        description: 执行参数覆盖；当前 Manager provider 不支持
        type: object
      parent_execution_id:
        description: 父执行ID（Orchestrator 调用时传入）
        type: string
      source:
        description: 触发来源模块
        type: string
      trigger_type:
        description: manual|scheduled，默认 manual
        type: string
    type: object
  internal_api.TileConfigResponse:
    properties:
      avg_records_per_tile:
        description: maxZoom 层级的平均记录数/瓦片
        type: number
      estimated_tiles:
        description: 预估瓦片总数（minZoom-maxZoom）
        type: integer
      extent:
        description: 地理范围（可选）
        items:
          type: number
        type: array
      max_zoom:
        description: 最大 zoom 层级
        type: integer
      min_zoom:
        description: 最小 zoom 层级
        type: integer
      record_count:
        description: 表记录数
        type: integer
      srid:
        description: 坐标系（可选）
        type: integer
    type: object
  internal_api.TriggerQuickViewRequest:
    properties:
      concurrency:
        description: 默认10
        type: integer
      max_zoom:
        description: 默认18
        type: integer
      min_zoom:
        description: 可选
        type: integer
      optimization_config:
        allOf:
        - $ref: '#/definitions/models.OptimizationConfig'
        description: v2.0 优化配置
      priority:
        description: '"critical", "default", "low"'
        type: string
    type: object
  internal_api.UpdatePreferredModeRequest:
    properties:
      preferred_mode:
        enum:
        - geojson
        - mvt
        type: string
    required:
    - preferred_mode
    type: object
  models.AttributePruningConfig:
    properties:
      enabled:
        description: 是否启用
        type: boolean
      zoom_threshold:
        description: zoom 分界线，<= threshold 只返回主键
        type: integer
    type: object
  models.ExtentOptimizationConfig:
    properties:
      base_extent:
        description: 其他层的基础 Extent（默认 512）
        type: integer
      max_zoom_extent:
        description: Max zoom 层的 Extent（默认 1024）
        type: integer
      min_extent:
        description: 动态减半的最小 Extent（固定 256）
        type: integer
    type: object
  models.OptimizationConfig:
    properties:
      attribute_pruning:
        allOf:
        - $ref: '#/definitions/models.AttributePruningConfig'
        description: 属性优化
      extent_optimization:
        allOf:
        - $ref: '#/definitions/models.ExtentOptimizationConfig'
        description: Extent 优化（分层策略 + 动态减半）
      tile_size_thresholds:
        allOf:
        - $ref: '#/definitions/models.TileSizeThresholdsConfig'
        description: 瓦片大小阈值
      version:
        description: 配置版本
        type: string
    type: object
  models.TileSizeThresholdsConfig:
    properties:
      max_size_mb:
        description: 瓦片大小限制（MB）- 用户可配置，默认 5MB
        type: number
    type: object
host: localhost:8081
info:
  contact: {}
  title: ADDP Manager API
  version: "1.0"
paths:
  /config/map:
    get:
      description: 返回地图服务相关的配置信息（高德地图Key、天地图Key等）| Return map service configuration
        (AMap key, TDT key, etc.)
      produces:
      - application/json
      responses:
        "200":
          description: 地图配置信息 | Map configuration
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取地图服务配置 | Get map service configuration
      tags:
      - Manager
  /embedding_executions:
    post:
      consumes:
      - application/json
      description: 从资源树 item 或 node 触发一次性向量化执行，返回统一 execution_id，不创建向量化任务定义。| Create
        an ad-hoc embedding execution from a resource tree item or node and return
        the unified execution_id.
      parameters:
      - description: 一次性向量化执行请求 | Ad-hoc embedding execution request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_manager_internal_service.EmbeddingExecutionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 执行已创建 | Execution created
          schema:
            $ref: '#/definitions/github_com_addp_manager_internal_service.EmbeddingExecutionResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 向量化服务不可用 | Embedding service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建一次性向量化执行 | Create ad-hoc embedding execution
      tags:
      - Manager
  /embedding_tasks:
    get:
      description: 列出 Manager 模块的向量化任务配置。该私有入口固定返回 task_type=embedding；编排模块应使用标准 /tasks
        入口。| List Manager embedding task configurations. This private endpoint always
        returns task_type=embedding; orchestrator should use the standard /tasks endpoint.
      parameters:
      - description: 页码，默认1 | Page number, default 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20 | Page size, default 20
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 任务列表 | Task list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出向量化任务配置 | List embedding task configurations
      tags:
      - Manager
    post:
      consumes:
      - application/json
      description: 创建新的向量化任务配置（定时或手动触发）| Create a new embedding task configuration
        (scheduled or manual)
      parameters:
      - description: 向量化任务配置 | Embedding task configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.EmbeddingTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建的任务配置 | Created task configuration
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建向量化任务配置 | Create embedding task configuration
      tags:
      - Manager
  /embedding_tasks/{id}:
    delete:
      description: 删除指定的向量化任务配置 | Delete a specific embedding task configuration
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功 | Deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除向量化任务配置 | Delete embedding task configuration
      tags:
      - Manager
    get:
      description: 获取指定类型和ID的任务详细信息 | Get detailed information of a task by type and
        ID
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 任务详情 | Task detail
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 任务不存在 | Task not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务详情 | Get task detail
      tags:
      - Manager
    put:
      consumes:
      - application/json
      description: 更新指定的向量化任务配置 | Update a specific embedding task configuration
      parameters:
      - description: 任务ID | Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: 向量化任务配置 | Embedding task configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.EmbeddingTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新后的任务配置 | Updated task configuration
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 任务不存在 | Task not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新向量化任务配置 | Update embedding task configuration
      tags:
      - Manager
  /embeddings:
    get:
      description: 查询 Manager 向量化结果 artifact state。| List Manager embedding artifact
        states.
      parameters:
      - description: 页码，默认1 | Page number
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20 | Page size
        in: query
        name: page_size
        type: integer
      - description: 引擎ID | Engine ID
        in: query
        name: engine_id
        type: integer
      - description: 节点ID | Node ID
        in: query
        name: node_id
        type: integer
      - description: 数据项ID | Item ID
        in: query
        name: item_id
        type: integer
      - description: 结果状态 | Result status
        in: query
        name: status
        type: string
      - description: 关键词 | Query
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 向量化结果列表 | Embedding result list
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 向量化服务不可用 | Embedding service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询向量化结果 | List embedding results
      tags:
      - Manager
  /embeddings/{id}:
    delete:
      description: 删除 Manager 向量化结果，不删除源 data item。| Delete an embedding result without
        deleting the source data item.
      parameters:
      - description: 向量化结果ID | Embedding result ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功 | Deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 向量化服务不可用 | Embedding service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除向量化结果 | Delete embedding result
      tags:
      - Manager
  /engines:
    get:
      description: 获取当前租户可用的存储引擎列表 | Get available storage engine list for the current
        tenant
      produces:
      - application/json
      responses:
        "200":
          description: 引擎列表 | Engine list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取引擎列表 | List engines
      tags:
      - Manager
  /engines/{id}/items/refresh:
    post:
      consumes:
      - application/json
      description: 强制触发一次 item 对应的元数据重扫，并等待扫描完成 | Force a deep metadata rescan for
        an item and wait until completion
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: 资源定位符 URI | Resource locator URI
        in: query
        name: locator
        type: string
      - description: 扫描定位（可选，仅支持 item_id）| Scan target (optional, item_id only)
        in: body
        name: body
        schema:
          $ref: '#/definitions/github_com_addp_manager_internal_models.MetaManualScanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 同步扫描结果 | Synchronous scan result
          schema:
            $ref: '#/definitions/github_com_addp_manager_internal_models.MetaScanResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 刷新数据项元数据 | Refresh item metadata
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/geojson:
    get:
      description: 获取空间数据项（关系表）的源坐标 GeoJSON 预览数据和 CRS 元数据，后端不做 CRS transform | Get
        source-CRS GeoJSON preview data and CRS metadata without backend CRS transform
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: Schema | Schema
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      - description: 页码，默认1 | Page number, default 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认1000，最大5000 | Page size, default 1000, max 5000
        in: query
        name: page_size
        type: integer
      - description: 几何列名，默认geom | Geometry column, default geom
        in: query
        name: geom_column
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: GeoJSON preview contract
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取GeoJSON数据 | Get GeoJSON data
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/geojson/metadata:
    get:
      description: 获取空间数据项（关系表）的源坐标元数据信息，后端不做 CRS transform | Get source-CRS spatial
        item metadata without backend CRS transform
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: Schema | Schema
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      - description: 几何列名，默认geom | Geometry column, default geom
        in: query
        name: geom_column
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 元数据信息 | Metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取GeoJSON元数据 | Get GeoJSON metadata
      tags:
      - Manager
  /engines/{id}/spatial/{schema}/{table}/quick-view:
    delete:
      description: 清除指定空间数据项（关系表）的快显缓存数据 | Clear quick view cache data for a spatial
        item (relational table)
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: id
        required: true
        type: integer
      - description: Schema | Schema
        in: path
        name: schema
        required: true
        type: string
      - description: 数据项名称 | Item name
        in: path
        name: table
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 清除成功 | Cleared successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 清除快显缓存 | Clear quick view cache
      tags:
      - Manager
