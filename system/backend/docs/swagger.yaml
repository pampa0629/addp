basePath: /api/v1/system
definitions:
  github_com_addp_common_models.ConnectionInfo:
    additionalProperties: true
    type: object
  github_com_addp_common_models.ScanConfig:
    properties:
      cron_expression:
        description: Cron 表达式（schedule_type=cron 时使用）
        type: string
      enabled:
        description: 是否启用扫描（总开关，兼容旧版）
        type: boolean
      immediate_depth:
        description: 立即扫描深度：basic（基础）或 deep（深度）
        type: string
      immediate_scan:
        description: 注册后立即扫描
        type: boolean
      preprocessing:
        allOf:
        - $ref: '#/definitions/models.PreprocessingConfig'
        description: 预处理配置（可选）
      scan_depth:
        description: 兼容旧版字段：shallow, deep
        type: string
      schedule_time:
        description: 执行时间 HH:mm（daily/weekly/monthly 时使用）
        type: string
      schedule_type:
        description: daily, weekly, monthly, cron（仅当scheduled_scan=true时有效）
        type: string
      schedule_value:
        description: 周几（0-6）或月几（1-31）
        items:
          type: integer
        type: array
      scheduled_scan:
        description: 启用定时扫描（深度固定为 deep）
        type: boolean
    type: object
  github_com_addp_common_models.UserType:
    enum:
    - super_admin
    - tenant_admin
    - user
    - super_admin
    - tenant_admin
    - user
    type: string
    x-enum-comments:
      UserTypeSuperAdmin: 超级管理员
      UserTypeTenantAdmin: 租户管理员
      UserTypeUser: 普通用户
    x-enum-descriptions:
    - 超级管理员
    - 租户管理员
    - 普通用户
    x-enum-varnames:
    - UserTypeSuperAdmin
    - UserTypeTenantAdmin
    - UserTypeUser
  github_com_addp_system_internal_models.AuditLog:
    properties:
      created_at:
        type: string
      duration_ms:
        description: 请求耗时(毫秒)
        type: integer
      entity_id:
        description: 资源ID
        type: string
      entity_type:
        description: 资源标识 (可选)
        type: string
      error_message:
        description: 错误信息
        type: string
      http_method:
        description: 操作信息 (必填)
        type: string
      http_status:
        description: HTTP状态码
        type: integer
      id:
        type: integer
      ip_address:
        description: 客户端IP(使用INET类型)
        type: string
      log_level:
        description: 错误和追踪
        type: string
      module_name:
        description: 来源模块（如：system, manager, meta）
        type: string
      query_params:
        description: URL查询参数
        type: string
      request_body:
        description: 请求详情
        type: string
      request_id:
        description: 请求追踪ID
        type: string
      resource_path:
        description: /api/users/123
        type: string
      tenant_id:
        description: 租户ID,SuperAdmin操作为null
        type: integer
      user_agent:
        description: 客户端User-Agent
        type: string
      user_id:
        description: 用户信息 (允许 NULL)
        type: integer
      username:
        type: string
    type: object
  github_com_addp_system_internal_models.CleanupTask:
    properties:
      action:
        description: scan/execute
        type: string
      based_on_scan:
        type: string
      completed_at:
        type: string
      delete_type:
        description: soft_delete/hard_delete
        type: string
      expected_modules:
        items:
          type: string
        type: array
      requested_by:
        type: integer
      started_at:
        type: string
      status:
        description: pending/running/completed/timeout/failed
        type: string
      task_id:
        type: string
      tenant_id:
        type: integer
      timeout_at:
        type: string
    type: object
  github_com_addp_system_internal_models.ConnectionInfo:
    additionalProperties: true
    type: object
  github_com_addp_system_internal_models.Engine:
    properties:
      capabilities:
        description: 能力声明（JSONB）
        type: string
      check_message:
        description: 检测结果消息（错误信息等）
        type: string
      connection_info:
        $ref: '#/definitions/github_com_addp_common_models.ConnectionInfo'
      connection_status:
        description: 连接状态缓存（优化扫描性能）
        type: string
      created_at:
        description: 时间戳字段
        type: string
      created_by:
        type: integer
      description:
        type: string
      engine_category:
        description: 引擎分类：standard（标准引擎）或 extension（扩展引擎）
        type: string
      engine_type:
        description: 引擎类型（postgresql, mysql, python_workflow等）
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_builtin:
        description: 扩展引擎字段
        type: boolean
      last_check_at:
        description: 上次检测时间
        type: string
      name:
        description: 显示名称（原 display_name）
        type: string
      scan_config:
        allOf:
        - $ref: '#/definitions/github_com_addp_common_models.ScanConfig'
        description: 元数据扫描配置（可选）
      tenant_id:
        description: 租户ID，SuperAdmin创建的引擎为null
        type: integer
      updated_at:
        type: string
    type: object
  github_com_addp_system_internal_models.EngineCreateRequest:
    properties:
      capabilities:
        description: 能力声明JSON
        type: string
      connection_info:
        $ref: '#/definitions/github_com_addp_system_internal_models.ConnectionInfo'
      description:
        type: string
      engine_category:
        description: 引擎分类：standard/extension
        type: string
      engine_type:
        type: string
      name:
        description: 显示名称（中文或英文）
        type: string
      scan_config:
        allOf:
        - $ref: '#/definitions/github_com_addp_system_internal_models.ScanConfig'
        description: 扫描配置（可选）
    required:
    - connection_info
    - engine_type
    - name
    type: object
  github_com_addp_system_internal_models.ErrorResponse:
    properties:
      error:
        example: invalid credentials
        type: string
    type: object
  github_com_addp_system_internal_models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  github_com_addp_system_internal_models.LoginResponse:
    properties:
      access_token:
        type: string
      token_type:
        type: string
    type: object
  github_com_addp_system_internal_models.ScanConfig:
    properties:
      cron_expression:
        description: Cron 表达式（schedule_type=cron 时使用）
        type: string
      enabled:
        description: 是否启用扫描（总开关，兼容旧版）
        type: boolean
      immediate_depth:
        description: 立即扫描深度：basic（基础）或 deep（深度）
        type: string
      immediate_scan:
        description: 注册后立即扫描
        type: boolean
      preprocessing:
        allOf:
        - $ref: '#/definitions/models.PreprocessingConfig'
        description: 预处理配置（可选）
      scan_depth:
        description: 兼容旧版字段：shallow, deep
        type: string
      schedule_time:
        description: 执行时间 HH:mm（daily/weekly/monthly 时使用）
        type: string
      schedule_type:
        description: daily, weekly, monthly, cron（仅当scheduled_scan=true时有效）
        type: string
      schedule_value:
        description: 周几（0-6）或月几（1-31）
        items:
          type: integer
        type: array
      scheduled_scan:
        description: 启用定时扫描（深度固定为 deep）
        type: boolean
    type: object
  github_com_addp_system_internal_models.TaskProgress:
    properties:
      completed:
        description: 已完成模块数
        type: integer
      modules:
        additionalProperties:
          type: string
        description: key=module, value=status
        type: object
      total:
        description: 期望模块数
        type: integer
    type: object
  github_com_addp_system_internal_models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_superuser:
        description: 保留以兼容旧代码
        type: boolean
      tenant_id:
        description: 租户ID (SuperAdmin没有租户)
        type: integer
      updated_at:
        type: string
      user_type:
        allOf:
        - $ref: '#/definitions/github_com_addp_common_models.UserType'
        description: 用户类型
      username:
        type: string
    type: object
  github_com_addp_system_internal_models.UserCreateRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      user_type:
        allOf:
        - $ref: '#/definitions/github_com_addp_system_internal_models.UserType'
        description: 用户类型
      username:
        type: string
    required:
    - password
    - username
    type: object
  github_com_addp_system_internal_models.UserType:
    enum:
    - super_admin
    - tenant_admin
    - user
    - super_admin
    - tenant_admin
    - user
    type: string
    x-enum-comments:
      UserTypeSuperAdmin: 超级管理员
      UserTypeTenantAdmin: 租户管理员
      UserTypeUser: 普通用户
    x-enum-descriptions:
    - 超级管理员
    - 租户管理员
    - 普通用户
    x-enum-varnames:
    - UserTypeSuperAdmin
    - UserTypeTenantAdmin
    - UserTypeUser
  internal_api.CreateExecuteTaskRequest:
    properties:
      based_on_scan:
        description: 基于哪次扫描
        type: string
      delete_type:
        description: soft_delete/hard_delete
        type: string
    required:
    - based_on_scan
    - delete_type
    type: object
  internal_api.CreateExecuteTaskResponse:
    properties:
      task_id:
        type: string
    type: object
  internal_api.CreateScanTaskRequest:
    properties:
      scope:
        description: 扫描范围：meta/manager/transfer 等，为空则扫描所有
        items:
          type: string
        type: array
    type: object
  internal_api.CreateScanTaskResponse:
    properties:
      task_id:
        type: string
    type: object
  internal_api.GetTaskHistoryResponse:
    properties:
      tasks:
        items:
          $ref: '#/definitions/github_com_addp_system_internal_models.CleanupTask'
        type: array
      total:
        type: integer
    type: object
  internal_api.GetTaskStatusResponse:
    properties:
      action:
        type: string
      progress:
        $ref: '#/definitions/github_com_addp_system_internal_models.TaskProgress'
      results:
        additionalProperties: true
        type: object
      status:
        type: string
      summary: {}
      task:
        $ref: '#/definitions/github_com_addp_system_internal_models.CleanupTask'
      task_id:
        type: string
    type: object
  models.MVTPreprocessConfig:
    properties:
      concurrency:
        description: 并发生成数 (1-20, 默认 10)
        type: integer
      max_zoom:
        description: 最大缩放级别 (0-18, 默认 18)
        type: integer
      stop_threshold_kb:
        description: 自适应停止阈值：平均瓦片大小（KB）< 该值则停止（默认 50.0）
        type: number
      stop_threshold_sec:
        description: 自适应停止阈值：平均生成时间（秒）< 该值则停止（默认 3.0）
        type: number
    type: object
  models.PreprocessingConfig:
    properties:
      auto_trigger:
        description: 扫描完成后自动触发预处理
        type: boolean
      enabled:
        description: 是否启用预处理
        type: boolean
      mvt_config:
        allOf:
        - $ref: '#/definitions/models.MVTPreprocessConfig'
        description: MVT 瓦片预处理配置
      types:
        description: 预处理类型列表 ["mvt_tiles", "vector_embedding"]
        items:
          type: string
        type: array
    type: object
host: localhost:8180
info:
  contact: {}
  title: ADDP System API
  version: "1.0"
paths:
  /admin/cleanup/execute:
    post:
      consumes:
      - application/json
      description: 基于扫描结果，执行垃圾数据清理（软删除或物理删除）
      parameters:
      - description: 执行请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateExecuteTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.CreateExecuteTaskResponse'
        "400":
          description: 错误信息
          schema:
            type: string
        "401":
          description: 错误信息
          schema:
            type: string
        "500":
          description: 错误信息
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 创建执行清理任务
      tags:
      - Cleanup
  /admin/cleanup/history:
    get:
      description: 获取当前租户的清理任务历史记录
      parameters:
      - default: 20
        description: 返回记录数
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.GetTaskHistoryResponse'
        "400":
          description: 错误信息
          schema:
            type: string
        "401":
          description: 错误信息
          schema:
            type: string
        "500":
          description: 错误信息
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 获取清理任务历史
      tags:
      - Cleanup
  /admin/cleanup/scan:
    post:
      consumes:
      - application/json
      description: 扫描当前租户的垃圾数据（无效引擎、孤儿数据、软删除数据等）
      parameters:
      - description: 扫描请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateScanTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.CreateScanTaskResponse'
        "400":
          description: 错误信息
          schema:
            type: string
        "401":
          description: 错误信息
          schema:
            type: string
        "500":
          description: 错误信息
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 创建垃圾数据扫描任务
      tags:
      - Cleanup
  /admin/cleanup/tasks/{task_id}:
    get:
      description: 查询指定任务的执行状态和结果
      parameters:
      - description: 任务ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.GetTaskStatusResponse'
        "400":
          description: 错误信息
          schema:
            type: string
        "401":
          description: 错误信息
          schema:
            type: string
        "404":
          description: 错误信息
          schema:
            type: string
        "500":
          description: 错误信息
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 查询清理任务状态
      tags:
      - Cleanup
  /engines:
    get:
      consumes:
      - application/json
      description: 分页获取引擎列表（支持按类型过滤）
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 引擎类型
        in: query
        name: engine_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/github_com_addp_system_internal_models.Engine'
                type: array
              page:
                type: integer
              page_size:
                type: integer
              total:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取引擎列表
      tags:
      - 引擎管理
    post:
      consumes:
      - application/json
      description: 创建新的存储引擎连接
      parameters:
      - description: 引擎信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_system_internal_models.EngineCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.Engine'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建引擎
      tags:
      - 引擎管理
  /engines/:id/schemas:
    get:
      parameters:
      - description: 资源ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 列出Schema列表
      tags:
      - Resources
  /engines/:id/tables:
    get:
      parameters:
      - description: 资源ID
        in: path
        name: id
        required: true
        type: integer
      - description: Schema名称(默认public)
        in: query
        name: schema
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 列出表列表
      tags:
      - Resources
  /login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录，返回 JWT token
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_system_internal_models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.ErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /logs:
    get:
      consumes:
      - application/json
      description: 分页获取审计日志（支持多条件过滤）
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 开始时间
        in: query
        name: start_time
        type: string
      - description: 结束时间
        in: query
        name: end_time
        type: string
      - description: HTTP方法
        in: query
        name: http_method
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/github_com_addp_system_internal_models.AuditLog'
                type: array
              page:
                type: integer
              page_size:
                type: integer
              total:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取日志列表
      tags:
      - 日志管理
  /refresh:
    post:
      consumes:
      - application/json
      description: 使用即将过期的 token 获取新的 token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 刷新 Token
      tags:
      - 认证
  /register:
    post:
      consumes:
      - application/json
      description: 注册新用户（需开启公开注册）
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_addp_system_internal_models.UserCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.ErrorResponse'
      summary: 用户注册
      tags:
      - 认证
  /users:
    get:
      consumes:
      - application/json
      description: 分页获取用户列表（自动过滤租户）
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/github_com_addp_system_internal_models.User'
                type: array
              page:
                type: integer
              page_size:
                type: integer
              total:
                type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_addp_system_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 用户管理
    post:
      consumes:
      - application/json
      description: 创建新用户（租户管理员权限）
      parameters:
      - description: 用户信息
        in: body
        name: request
        required: true
