host: localhost:8180
info:
  contact: {}
  title: ADDP System API
  version: "1.0"
paths:
  /admin/cleanup/execute:
    post:
      consumes:
      - application/json
      description: 基于扫描结果，执行垃圾数据清理（软删除或物理删除）| Execute garbage data cleanup based on
        scan results (soft delete or hard delete)
      parameters:
      - description: 执行请求 | Execute request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.CreateExecuteTaskRequest'
