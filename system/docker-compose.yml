version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: addp-system-backend
    ports:
      - "8180:8180"
    volumes:
      - ./data:/app/data
    environment:
      - ENV=production
      - SERVER_ADDR=:8180
      - DATABASE_URL=/app/data/system.db
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - OAUTH_CODE_EXPIRE_MINUTES=5
      - OAUTH_DEVICE_EXPIRE_MINUTES=10
      - OAUTH_DEVICE_INTERVAL_SECONDS=5
      - CONSOLE_URL=http://localhost:5170
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: addp-system-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
