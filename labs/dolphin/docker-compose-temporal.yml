version: '3.8'

services:
  # Temporal Server (包含所有组件的 standalone 版本)
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: temporal
    ports:
      - "7233:7233"   # gRPC API
      - "8233:8233"   # HTTP API (Temporal UI)
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - temporal-data:/etc/temporal
    networks:
      - temporal-network
    depends_on:
      - postgresql
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL (Temporal 元数据存储)
  postgresql:
    image: postgres:15-alpine
    container_name: temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5434:5432"  # 避免与主 PostgreSQL 冲突
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Temporal UI (Web 界面)
  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: temporal-ui
    ports:
      - "8080:8080"  # Temporal Web UI
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    networks:
      - temporal-network
    depends_on:
      - temporal

networks:
  temporal-network:
    driver: bridge

volumes:
  temporal-data:
  temporal-postgres-data:
