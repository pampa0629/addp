version: "3.8"

services:
  # DolphinScheduler Standalone 模式（一体化部署，适合学习）
  dolphinscheduler:
    image: apache/dolphinscheduler-standalone-server:3.2.1
    container_name: dolphin-standalone
    ports:
      - "12345:12345"  # API Server
      - "25333:25333"  # Python Gateway (可选)
    environment:
      # 数据库配置（使用内置 H2 数据库，学习环境推荐）
      DATABASE: h2
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver

      # 时区设置
      TZ: Asia/Shanghai

      # 资源存储（使用本地文件系统）
      RESOURCE_STORAGE_TYPE: HDFS
      RESOURCE_UPLOAD_PATH: /dolphinscheduler
      FS_DEFAULT_FS: file:///

      # JVM 内存配置（学习环境优化：降低到 1GB）
      JAVA_OPTS: "-server -Xms1g -Xmx1g -Xmn512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

    volumes:
      # 持久化日志和数据
      - dolphin-logs:/opt/dolphinscheduler/logs
      - dolphin-shared:/opt/dolphinscheduler/shared
      - dolphin-resource:/dolphinscheduler
      # 挂载宿主机代码到容器（用于执行脚本）
      - ./backend:/opt/dolphin-scripts/backend
      - ./output:/opt/dolphin-scripts/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12345/dolphinscheduler/ui"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  dolphin-logs:
  dolphin-shared:
  dolphin-resource:

networks:
  default:
    name: dolphin-network
