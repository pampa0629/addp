version: '3.8'

services:
  doris-fe:
    image: apache/doris:2.0.14-fe-x86_64
    container_name: doris-test-fe
    hostname: doris-fe
    environment:
      - FE_SERVERS=fe1:doris-fe:9010
      - FE_ID=1
    ports:
      - "19030:9030"  # MySQL 协议（避免与业务库冲突，使用 19030）
      - "18030:8030"  # HTTP API
    volumes:
      - doris_fe_data:/opt/apache-doris/fe/doris-meta
      - doris_fe_log:/opt/apache-doris/fe/log
    networks:
      - doris-test-network
    restart: unless-stopped

  doris-be:
    image: apache/doris:2.0.14-be-x86_64
    container_name: doris-test-be
    hostname: doris-be
    environment:
      - FE_SERVERS=fe1:doris-fe:9010
      - BE_ADDR=doris-be:9050
    ports:
      - "18040:8040"  # BE Webserver
      - "19060:9060"  # BE Heartbeat
    volumes:
      - doris_be_data:/opt/apache-doris/be/storage
      - doris_be_log:/opt/apache-doris/be/log
    networks:
      - doris-test-network
    depends_on:
      - doris-fe
    restart: unless-stopped

volumes:
  doris_fe_data:
    driver: local
  doris_fe_log:
    driver: local
  doris_be_data:
    driver: local
  doris_be_log:
    driver: local

networks:
  doris-test-network:
    driver: bridge
