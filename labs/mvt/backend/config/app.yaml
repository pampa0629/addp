# 应用配置（示例模板）
# 将本文件复制为 app.yaml 并根据你的实际环境填写

# 服务配置
port: 8090
frontend_url: http://localhost:5180
log_level: info

# PostgreSQL / PostGIS 配置
database:
  host: 127.0.0.1
  port: "5433"
  name: business
  user: business
  password: business_password
  max_open_conns: 50
  max_idle_conns: 10
  # 连接存活时间，支持 300s、5m 等标准时长写法
  conn_max_lifetime: 5m

# Redis 缓存配置（请按你的环境填写）
redis:
  host: 127.0.0.1
  port: "6379"
  password: ""
  # 缓存过期时间，例如 24h、12h、30m
  cache_ttl: 24h
  # 最大内存提示（服务端需要自行配置 maxmemory 策略）
  max_memory: 8gb

# 缓存策略：控制何时将瓦片持久化写入 Postgres
cache_policy:
  # 生成耗时超过该阈值时落库（如 3s、1500ms）
  persist_min_duration: 3s
  # 原始 MVT（压缩前）的大小超过该阈值（KB）时落库
  persist_min_raw_kb: 100

# 预热：启动后自动生成低缩放层级的瓦片并缓存
prewarm:
  enabled: true
  # 预热的最大缩放级别（不限制运行期缓存，仅限制启动预热范围）
  max_zoom: 8
  # 并发 worker 数
  concurrency: 10
  # 生成单瓦片的超时（例如 200s, 3m）
  generate_timeout: 20000s
  # 写入缓存（Redis/PG）的超时
  cache_timeout: 200s
