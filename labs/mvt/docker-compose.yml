version: '3.8'

services:
  

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: mvt-redis
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:

  redis_data:

networks:
  default:
    name: mvt-network
