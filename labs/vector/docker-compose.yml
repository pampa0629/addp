version: '3.8'

services:
  postgres:
    image: imresamu/postgis-arm64:15-3.4
    container_name: vector-lab-postgres
    environment:
      POSTGRES_DB: vector_db
      POSTGRES_USER: vector_user
      POSTGRES_PASSWORD: vector_pass_2025
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5436:5432"  # 独立端口，避免与 ADDP (15432) 和其他端口冲突
    volumes:
      - vector_lab_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector_user -d vector_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  vector_lab_pgdata:
    driver: local
    name: vector_lab_pgdata
