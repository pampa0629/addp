<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1-10 月产值折线图</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", sans-serif; margin: 0; padding: 24px; color: #222; background: #f7f9fc; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      #toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
      button { padding: 6px 10px; border: 1px solid #cfd6e4; border-radius: 6px; background: #fff; cursor: pointer; }
      button:hover { background: #f0f4ff; }
      #chart-wrap { overflow: auto; border: 1px solid #dfe6f3; padding: 12px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1px #f0f4ff; }
      canvas { display: block; max-width: 100%; }
      small { color: #666; }
    </style>
  </head>
  <body>
    <h1>1-10 月产值折线图</h1>
    <div id="toolbar">
      <button id="btnReload">重新加载数据</button>
      <button id="btnRegen">随机生成新数据</button>
      <small>数据来源：后端 CSV (/api/data)，Canvas 绘制折线图</small>
    </div>
    <div id="chart-wrap">
      <canvas id="chart" width="800" height="420"></canvas>
    </div>

    <script>
      async function fetchData() {
        const res = await fetch('api/data', { cache: 'no-store' });
        if (!res.ok) throw new Error('加载数据失败');
        const json = await res.json();
        return json.items.sort((a, b) => a.month - b.month);
      }

      function drawLineChart(canvas, data) {
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#111';
        ctx.font = '16px system-ui, -apple-system, Segoe UI, Roboto, Arial';
        ctx.fillText('1-10 月产值（折线图）', 24, 32);
        ctx.fillStyle = '#666';
        ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial';
        ctx.fillText('数值范围随机 1-10，点击按钮可重新生成并绘制', 24, 52);

        const padding = { top: 80, right: 40, bottom: 60, left: 70 };
        const chartW = W - padding.left - padding.right;
        const chartH = H - padding.top - padding.bottom;
        if (chartW <= 0 || chartH <= 0) return;

        const maxValue = data.reduce((max, d) => Math.max(max, d.value), 0);
        if (!maxValue) {
          ctx.fillStyle = '#c00';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = '14px system-ui, -apple-system, Segoe UI, Roboto, Arial';
          ctx.fillText('暂无可用数据', W / 2, H / 2);
          return;
        }

        const yStepBase = Math.max(1, Math.ceil(maxValue / 5));
        const axisMax = yStepBase * 5;
        const yStep = Math.max(1, Math.ceil(axisMax / 5));

        ctx.strokeStyle = '#dfe6f3';
        ctx.lineWidth = 1;
        ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial';
        ctx.fillStyle = '#778';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (let value = 0; value <= axisMax; value += yStep) {
          const ratio = value / axisMax;
          const y = padding.top + chartH - ratio * chartH;
          ctx.beginPath();
          ctx.moveTo(padding.left, y);
          ctx.lineTo(padding.left + chartW, y);
          ctx.stroke();
          ctx.fillText(value.toString(), padding.left - 10, y);
        }

        ctx.strokeStyle = '#7a8fb7';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(padding.left, padding.top - 5);
        ctx.lineTo(padding.left, padding.top + chartH);
        ctx.lineTo(padding.left + chartW + 5, padding.top + chartH);
        ctx.stroke();

        const pointCount = data.length;
        const xStep = pointCount > 1 ? chartW / (pointCount - 1) : 0;
        const points = data.map((d, idx) => {
          const ratio = d.value / axisMax;
          const x = pointCount === 1 ? padding.left + chartW / 2 : padding.left + xStep * idx;
          const y = padding.top + chartH - ratio * chartH;
          return { x, y, month: d.month, value: d.value };
        });

        ctx.strokeStyle = '#2e7dd7';
        ctx.lineWidth = 2;
        ctx.beginPath();
        points.forEach((pt, idx) => {
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();

        ctx.fillStyle = 'rgba(78, 148, 212, 0.18)';
        ctx.beginPath();
        points.forEach((pt, idx) => {
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        if (points.length) {
          const last = points[points.length - 1];
          const first = points[0];
          ctx.lineTo(last.x, padding.top + chartH);
          ctx.lineTo(first.x, padding.top + chartH);
          ctx.closePath();
          ctx.fill();
        }

        points.forEach((pt) => {
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#2e7dd7';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#1d4f91';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial';
          ctx.fillText(pt.value.toString(), pt.x, pt.y - 8);
        });

        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#333';
        ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial';
        points.forEach((pt) => {
          ctx.fillText(`${pt.month}月`, pt.x, padding.top + chartH + 12);
        });
      }

      async function loadAndRender() {
        const canvas = document.getElementById('chart');
        try {
          const data = await fetchData();
          drawLineChart(canvas, data);
        } catch (e) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#c00';
          ctx.font = '14px system-ui, -apple-system, Segoe UI, Roboto, Arial';
          ctx.fillText('加载失败：' + (e && e.message ? e.message : e), 10, 24);
        }
      }

      document.getElementById('btnReload').addEventListener('click', loadAndRender);
      document.getElementById('btnRegen').addEventListener('click', async () => {
        await fetch('api/regenerate', { method: 'GET', cache: 'no-store' });
        await loadAndRender();
      });

      loadAndRender();
    </script>
  </body>
</html>
