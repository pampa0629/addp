<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1-10 月产值折线图</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", sans-serif; margin: 0; padding: 24px; color: #222; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      #toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
      button { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
      button:hover { background: #f6f6f6; }
      #chart-wrap { overflow: auto; border: 1px solid #eee; padding: 12px; border-radius: 8px; }
      canvas { display: block; }
      small { color: #666; }
    </style>
  </head>
  <body>
    <h1>1-10 月产值折线图</h1>
    <div id="toolbar">
      <button id="btnReload">重新加载数据</button>
      <button id="btnRegen">随机生成新数据</button>
      <small>数据来源：后端 CSV (/api/data)</small>
    </div>
    <div id="chart-wrap">
      <canvas id="chart" width="800" height="420"></canvas>
    </div>

    <script>
      async function fetchData() {
        const res = await fetch('/api/data', { cache: 'no-store' });
        if (!res.ok) throw new Error('加载数据失败');
        const json = await res.json();
        // Expect: { items: [{month, value}, ...] }
        return json.items.sort((a,b) => a.month - b.month);
      }

      function drawLineChart(canvas, data) {
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        // Style & clear
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0,W,H);

        // Layout
        const margin = { top: 30, right: 20, bottom: 40, left: 50 };
        const cw = W - margin.left - margin.right;
        const ch = H - margin.top - margin.bottom;
        const ox = margin.left;
        const oy = H - margin.bottom;

        // Scales
        const months = data.map(d => d.month);
        const values = data.map(d => d.value);
        const minX = 1, maxX = 10;
        const minY = 0, maxY = Math.max(10, Math.max(...values));

        const x = m => ox + ( (m - minX) / (maxX - minX) ) * cw;
        const y = v => oy - ( (v - minY) / (maxY - minY) ) * ch;

        // Axes
        ctx.strokeStyle = '#bbb';
        ctx.lineWidth = 1;
        // X axis
        ctx.beginPath();
        ctx.moveTo(ox, oy); ctx.lineTo(ox + cw, oy); ctx.stroke();
        // Y axis
        ctx.beginPath();
        ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - ch); ctx.stroke();

        // Grid + ticks
        ctx.fillStyle = '#444';
        ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (let m = 1; m <= 10; m++) {
          const tx = x(m);
          ctx.strokeStyle = '#eee';
          ctx.beginPath(); ctx.moveTo(tx, oy); ctx.lineTo(tx, oy - ch); ctx.stroke();
          ctx.fillStyle = '#444';
          ctx.fillText(String(m) + '月', tx, oy + 6);
        }

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        const yTicks = Math.min(10, maxY);
        for (let i = 0; i <= yTicks; i++) {
          const val = (i / yTicks) * maxY;
          const ty = y(val);
          ctx.strokeStyle = '#f6f6f6';
          ctx.beginPath(); ctx.moveTo(ox, ty); ctx.lineTo(ox + cw, ty); ctx.stroke();
          ctx.fillStyle = '#666';
          ctx.fillText(val.toFixed(0), ox - 6, ty);
        }

        // Line
        ctx.strokeStyle = '#2e7dd7';
        ctx.lineWidth = 2;
        ctx.beginPath();
        data.forEach((d, i) => {
          const px = x(d.month);
          const py = y(d.value);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.stroke();

        // Points
        ctx.fillStyle = '#2e7dd7';
        data.forEach(d => {
          ctx.beginPath();
          ctx.arc(x(d.month), y(d.value), 3.5, 0, Math.PI * 2);
          ctx.fill();
        });

        // Title
        ctx.fillStyle = '#111';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.font = '14px system-ui, -apple-system, Segoe UI, Roboto, Arial';
        ctx.fillText('1-10 月产值（随机 1-10）', ox, margin.top - 10);
      }

      async function loadAndRender() {
        const canvas = document.getElementById('chart');
        try {
          const data = await fetchData();
          drawLineChart(canvas, data);
        } catch (e) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0,0,canvas.width, canvas.height);
          ctx.fillStyle = '#c00';
          ctx.font = '14px system-ui, -apple-system, Segoe UI, Roboto, Arial';
          ctx.fillText('加载失败：' + (e && e.message ? e.message : e), 10, 24);
        }
      }

      document.getElementById('btnReload').addEventListener('click', loadAndRender);
      document.getElementById('btnRegen').addEventListener('click', async () => {
        await fetch('/api/regenerate', { method: 'GET', cache: 'no-store' });
        await loadAndRender();
      });

      // Initial
      loadAndRender();
    </script>
  </body>
  </html>
