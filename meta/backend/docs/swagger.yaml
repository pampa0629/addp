host: localhost:8082
info:
  contact: {}
  title: ADDP Meta API
  version: "1.0"
paths:
  /assets/discoverable:
    get:
      description: 返回当前租户下已扫描完成的数据项，供 Asset 模块自动发现注册 | List scanned metadata items
        for Asset discovery
      produces:
      - application/json
      responses:
        "200":
          description: 可发现资产列表 | Discoverable assets
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出可发现资产 | List discoverable assets
      tags:
      - Meta
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - meta.catalog.read
  /engines:
    get:
      description: 获取当前租户 active 存储引擎选择项、连接状态及统计信息；非 online 项由前端展示并禁选 | Get active
        storage engine options with connection status and statistics for the current
        tenant; clients must show but disable non-online options
      produces:
      - application/json
      responses:
        "200":
          description: 引擎列表 | Engine list
          schema:
            items:
              $ref: '#/definitions/github_com_addp_meta_internal_models.ResourceWithStats'
            type: array
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取引擎列表 | Get engine list
      tags:
      - Meta
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - meta.catalog.read
  /engines/{engine_id}/items:
    get:
      description: 获取指定引擎下已扫描的数据项，可按 catalog 第一层业务分支过滤 | List scanned metadata items
        for an engine, optionally filtered by catalog first business branch
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: engine_id
        required: true
        type: integer
      - description: catalog 第一层业务分支名称 | Catalog first business branch name
        in: query
        name: branch
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 数据项列表 | Items
          schema:
            items:
              $ref: '#/definitions/github_com_addp_meta_internal_models.MetaItemLite'
            type: array
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出引擎数据项 | List engine items
      tags:
      - Meta Query
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - meta.catalog.read
  /engines/{engine_id}/tree:
    get:
      description: 获取指定引擎的完整元数据树 | Get metadata tree for an engine
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: engine_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 元数据树 | Metadata tree
          schema:
            $ref: '#/definitions/github_com_addp_meta_internal_models.MetadataTreeResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取元数据树 | Get metadata tree
      tags:
      - Meta Query
      x-addp-auth-mode: permission
      x-addp-required-permissions:
      - meta.catalog.read
  /executions/{execution_id}:
    get:
      description: 按标准 TaskProvider 路径获取执行详情 | Get execution by standard TaskProvider
        path
      parameters:
      - description: 执行ID | Execution ID
        in: path
        name: execution_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 执行详情 | Execution detail
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 执行不存在 | Execution not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 任务服务不可用 | Task service unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取执行详情 | Get execution
