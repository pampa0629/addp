basePath: /api/v1/meta
definitions:
  datatype.FieldInfo:
    properties:
      comment:
        type: string
      default_expression:
        type: string
      generated:
        type: boolean
      generation_expression:
        type: string
      name:
        type: string
      native_type:
        type: string
      nullable:
        type: boolean
      ordinal_position:
        type: integer
      precision:
        type: integer
      primary_key:
        type: boolean
      scale:
        type: integer
      size:
        type: integer
      type:
        $ref: '#/definitions/datatype.FieldType'
    type: object
  datatype.FieldType:
    enum:
    - unknown
    - string
    - bool
    - bytes
    - mixed
    - int
    - bigint
    - float
    - double
    - decimal
    - date
    - time
    - timestamp
    - json
    - array
    - uuid
    - geometry
    - point
    - linestring
    - polygon
    - multipoint
    type: string
    x-enum-varnames:
    - FieldTypeUnknown
    - FieldTypeString
    - FieldTypeBool
    - FieldTypeBytes
    - FieldTypeMixed
    - FieldTypeInt
    - FieldTypeBigInt
    - FieldTypeFloat
    - FieldTypeDouble
    - FieldTypeDecimal
    - FieldTypeDate
    - FieldTypeTime
    - FieldTypeTimestamp
    - FieldTypeJSON
    - FieldTypeArray
    - FieldTypeUUID
    - FieldTypeGeometry
    - FieldTypePoint
    - FieldTypeLineString
    - FieldTypePolygon
    - FieldTypeMultiPoint
  github_com_addp_meta_internal_models.EngineScanTaskPolicyRequest:
    properties:
      engine_name:
        type: string
      scan_config:
        $ref: '#/definitions/models.ScanConfig'
    type: object
  github_com_addp_meta_internal_models.ExtractionScanStats:
    properties:
      documents:
        type: integer
      extracted:
        type: integer
      failed:
        type: integer
      index_failed:
        type: integer
      indexed:
        type: integer
      unsupported:
        type: integer
    type: object
  github_com_addp_meta_internal_models.JSONMap:
    additionalProperties: true
    type: object
  github_com_addp_meta_internal_models.MetaItemLite:
    properties:
      attributes:
        additionalProperties: true
        type: object
      data_updated_at:
        type: string
      engine_id:
        type: integer
      full_name:
        type: string
      id:
        type: integer
      item_type:
        type: string
      name:
        type: string
      node_id:
        type: integer
      row_count:
        type: integer
      scanned_at:
        type: string
      scanned_depth:
        type: string
      size_bytes:
        type: integer
      tenant_id:
        type: integer
    type: object
  github_com_addp_meta_internal_models.MetaNodeLite:
    properties:
      attributes:
        additionalProperties: true
        type: object
      depth:
        type: integer
      engine_id:
        type: integer
      full_name:
        type: string
      id:
        type: integer
      item_count:
        type: integer
      name:
        type: string
      node_type:
        type: string
      parent_node_id:
        type: integer
      path:
        type: string
      scan_status:
        type: string
      scanned_at:
        type: string
      scanned_depth:
        type: string
      tenant_id:
        type: integer
      total_size_bytes:
        type: integer
    type: object
  github_com_addp_meta_internal_models.MetadataTreeResponse:
    properties:
      child_nodes:
        items:
          $ref: '#/definitions/github_com_addp_meta_internal_models.MetaNodeLite'
        type: array
      items:
        items:
          $ref: '#/definitions/github_com_addp_meta_internal_models.MetaItemLite'
        type: array
      top_nodes:
        items:
          $ref: '#/definitions/github_com_addp_meta_internal_models.MetaNodeLite'
        type: array
    type: object
  github_com_addp_meta_internal_models.ResourceWithStats:
    properties:
      catalog_leaf_i18n_key:
        type: string
      catalog_leaf_term:
        type: string
      catalog_root_term:
        type: string
      catalog_top_i18n_key:
        type: string
      catalog_top_term:
        type: string
      check_message:
        description: 状态详情
        type: string
      connection_status:
        description: 连接状态相关字段
        type: string
      engine_family:
        type: string
      id:
        description: 前端期待 id
        type: integer
      last_check_at:
        description: 最后检测时间
        type: string
      name:
        description: 前端期待 name
        type: string
      resource_type:
        type: string
      scanned_at:
        type: string
      scanned_catalog_nodes:
        type: integer
      total_catalog_nodes:
        type: integer
      unscanned_catalog_nodes:
        type: integer
    type: object
  github_com_addp_meta_internal_models.ScanRef:
    properties:
      path:
        type: string
      required:
        type: boolean
      role:
        type: string
    type: object
  github_com_addp_meta_internal_models.ScanRefGroup:
    properties:
      primary:
        type: string
      refs:
        items:
          $ref: '#/definitions/github_com_addp_meta_internal_models.ScanRef'
        type: array
    type: object
  github_com_addp_meta_internal_models.ScanRequest:
    properties:
      catalog_paths:
        description: 要扫描的 catalog 路径列表（空则全部）
        items:
          type: string
        type: array
      engine_id:
        description: 存储引擎 ID
        type: integer
      force:
        description: 是否强制重新扫描
        type: boolean
      item_id:
        description: 要扫描的数据项 ID
        type: integer
      node_id:
        description: 要扫描的节点 ID
        type: integer
      ref_groups:
        description: 内容引用组
        items:
          $ref: '#/definitions/github_com_addp_meta_internal_models.ScanRefGroup'
        type: array
      scan_depth:
        description: basic/deep
        type: string
      source:
        description: 扫描来源
        type: string
      targets:
        description: locator 目标列表
        items:
          type: string
        type: array
      trigger_type:
        description: manual/scheduled
        type: string
    type: object
  github_com_addp_meta_internal_models.ScanResponse:
    properties:
      catalog_nodes_scanned:
        type: integer
      duration_ms:
        type: integer
      extraction:
        $ref: '#/definitions/github_com_addp_meta_internal_models.ExtractionScanStats'
      fields_scanned:
        type: integer
      items_scanned:
        type: integer
      message:
        type: string
      started_at:
        type: string
      status:
        description: success/failed
        type: string
    type: object
  github_com_addp_meta_internal_models.ScanTask:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      enabled:
        type: boolean
      engine_id:
        type: integer
      id:
        type: integer
      last_execution_id:
        type: string
      last_execution_status:
        type: string
      last_run_at:
        type: string
      name:
        type: string
      next_run_at:
        type: string
      owner_module:
        description: 绑定对象所属模块
        type: string
      owner_ref:
        description: 绑定对象在模块内的稳定引用
        type: string
      parameters:
        allOf:
        - $ref: '#/definitions/github_com_addp_meta_internal_models.JSONMap'
        description: 扫描参数，不表达范围
      schedule:
        type: string
      scope:
        allOf:
        - $ref: '#/definitions/github_com_addp_meta_internal_models.JSONMap'
        description: 结构化扫描范围
      tenant_id:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: integer
    type: object
  github_com_addp_meta_internal_models.ScanTaskUpsertRequest:
    properties:
      catalog_paths:
        items:
          type: string
        type: array
      description:
        type: string
      enabled:
        type: boolean
      engine_id:
        type: integer
      force:
        type: boolean
      name:
        type: string
      scan_depth:
        type: string
      schedule:
        description: Cron 表达式，空字符串表示手动执行
        type: string
      scope:
        $ref: '#/definitions/github_com_addp_meta_internal_models.JSONMap'
    required:
    - engine_id
    - name
    type: object
  github_com_addp_meta_internal_models.SpatialMetadataResponse:
    properties:
      extent:
        description: '[minLng, minLat, maxLng, maxLat]'
        items:
          type: number
        type: array
      extent_srid:
        type: integer
      fields:
        items:
          $ref: '#/definitions/datatype.FieldInfo'
        type: array
      geometry_column:
        type: string
      geometry_types:
        description: 几何类型列表，如 ["ST_MultiPolygon"]
        items:
          type: string
        type: array
      primary_key:
        type: string
      row_count:
        description: 表记录数（从 meta_item.row_count 获取）
        type: integer
      srid:
        type: integer
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  models.MVTPreprocessConfig:
    properties:
      concurrency:
        description: 并发生成数 (1-20, 默认 10)
        type: integer
      max_zoom:
        description: 最大缩放级别 (0-18, 默认 18)
        type: integer
      stop_threshold_kb:
        description: 自适应停止阈值：平均瓦片大小（KB）< 该值则停止（默认 50.0）
        type: number
      stop_threshold_sec:
        description: 自适应停止阈值：平均生成时间（秒）< 该值则停止（默认 3.0）
        type: number
    type: object
  models.PreprocessingConfig:
    properties:
      auto_trigger:
        description: 扫描完成后自动触发预处理
        type: boolean
      enabled:
        description: 是否启用预处理
        type: boolean
      mvt_config:
        allOf:
        - $ref: '#/definitions/models.MVTPreprocessConfig'
        description: MVT 瓦片预处理配置
      types:
        description: 预处理类型列表 ["mvt_tiles", "vector_embedding"]
        items:
          type: string
        type: array
    type: object
  models.ScanConfig:
    properties:
      cron_expression:
        description: Cron 表达式（schedule_type=cron 时使用）
        type: string
      enabled:
        description: 是否启用扫描（总开关）
        type: boolean
      immediate_depth:
        description: 立即扫描深度：basic（基础）或 deep（深度）
        type: string
      immediate_scan:
        description: 注册后立即扫描
        type: boolean
      preprocessing:
        allOf:
        - $ref: '#/definitions/models.PreprocessingConfig'
        description: 预处理配置（可选）
      scan_depth:
        description: 默认扫描深度：basic 或 deep
        type: string
      schedule_time:
        description: 执行时间 HH:mm（daily/weekly/monthly 时使用）
        type: string
      schedule_type:
        description: daily, weekly, monthly, cron（仅当scheduled_scan=true时有效）
        type: string
      schedule_value:
        description: 周几（0-6）或月几（1-31）
        items:
          type: integer
        type: array
      scheduled_scan:
        description: 启用定时扫描
        type: boolean
    type: object
host: localhost:8082
info:
  contact: {}
  title: ADDP Meta API
  version: "1.0"
paths:
  /assets/discoverable:
    get:
      description: 返回当前租户下已扫描完成的数据项，供 Asset 模块自动发现注册 | List scanned metadata items
        for Asset discovery
      produces:
      - application/json
      responses:
        "200":
          description: 可发现资产列表 | Discoverable assets
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出可发现资产 | List discoverable assets
      tags:
      - Meta
  /cache/engines/{engine_id}:
    delete:
      description: 清除指定存储引擎缓存，engine_id 为 all 时清除全部缓存 | Clear storage engine cache
      parameters:
      - description: 存储引擎ID或all | Engine ID or all
        in: path
        name: engine_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 清除结果 | Clear result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 清除引擎缓存 | Clear engine cache
      tags:
      - Meta Cache
  /cache/refresh:
    post:
      description: 清除并重新预加载存储引擎缓存 | Clear and preload storage engine cache
      produces:
      - application/json
      responses:
        "200":
          description: 刷新结果 | Refresh result
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 刷新存储引擎缓存 | Refresh storage engine cache
      tags:
      - Meta Cache
  /engines:
    get:
      description: 获取当前租户的存储引擎列表及统计信息 | Get storage engine list with statistics for
        the current tenant
      produces:
      - application/json
      responses:
        "200":
          description: 引擎列表 | Engine list
          schema:
            items:
              $ref: '#/definitions/github_com_addp_meta_internal_models.ResourceWithStats'
            type: array
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取引擎列表 | Get engine list
      tags:
      - Meta
  /engines/{engine_id}/items:
    get:
      description: 获取指定引擎下已扫描的数据项，可按 catalog 第一层业务分支过滤 | List scanned metadata items
        for an engine, optionally filtered by catalog first business branch
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: engine_id
        required: true
        type: integer
      - description: catalog 第一层业务分支名称 | Catalog first business branch name
        in: query
        name: branch
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 数据项列表 | Items
          schema:
            items:
              $ref: '#/definitions/github_com_addp_meta_internal_models.MetaItemLite'
            type: array
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 列出引擎数据项 | List engine items
      tags:
      - Meta Query
  /engines/{engine_id}/tree:
    get:
      description: 获取指定引擎的完整元数据树 | Get metadata tree for an engine
      parameters:
      - description: 存储引擎ID | Engine ID
        in: path
        name: engine_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 元数据树 | Metadata tree
          schema:
            $ref: '#/definitions/github_com_addp_meta_internal_models.MetadataTreeResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取元数据树 | Get metadata tree
      tags:
      - Meta Query
  /items/{item_id}:
    get:
      description: 按数据项 ID 获取元数据项详情 | Get metadata item detail by ID
      parameters:
      - description: 数据项ID | Item ID
        in: path
        name: item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 数据项详情 | Item detail
          schema:
            $ref: '#/definitions/github_com_addp_meta_internal_models.MetaItemLite'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 数据项不存在 | Item not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取数据项详情 | Get item detail
      tags:
      - Meta Query
  /items/{item_id}/fields:
    get:
      description: 按数据项 ID 获取字段详情 | Get item field details by item ID
      parameters:
      - description: 数据项ID | Item ID
        in: path
        name: item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 字段详情 | Field details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 数据项不存在 | Item not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 按 ID 获取数据项字段 | Get item fields by ID
      tags:
      - Meta Query
  /items/{item_id}/refresh:
    post:
      consumes:
      - application/json
      description: 创建一次手动扫描执行并等待已落库 item 的元数据刷新完成 | Create a manual scan execution
        and wait until the known item metadata refresh completes
      parameters:
      - description: 数据项ID | Item ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: 刷新请求 | Refresh request
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_addp_meta_internal_models.ScanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新结果 | Refresh result
          schema:
            $ref: '#/definitions/github_com_addp_meta_internal_models.ScanResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 刷新已知数据项 | Refresh known item
      tags:
      - Meta Scan
  /items/{item_id}/spatial:
    get:
      description: 按数据项 ID 获取空间元数据 | Get spatial metadata by item ID
      parameters:
      - description: 数据项ID | Item ID
        in: path
        name: item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 空间元数据 | Spatial metadata
          schema:
            $ref: '#/definitions/github_com_addp_meta_internal_models.SpatialMetadataResponse'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 空间元数据不存在 | Spatial metadata not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 按 ID 获取空间元数据 | Get spatial metadata by ID
      tags:
      - Meta Query
  /items/by-catalog-path:
    get:
      description: 按引擎和 catalog path 查询数据项 | Query metadata item by engine and catalog
        path
      parameters:
      - description: 存储引擎ID | Engine ID
        in: query
        name: engine_id
        required: true
        type: integer
      - description: Catalog path
        in: query
        name: catalog_path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 数据项详情 | Item detail
          schema:
            $ref: '#/definitions/github_com_addp_meta_internal_models.MetaItemLite'
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 数据项不存在 | Item not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 按 catalog path 查询数据项 | Query item by catalog path
      tags:
      - Meta Query
  /metadata/access-index:
    post:
      consumes:
      - application/octet-stream
      description: 按需读取请求体内容并建立对象访问索引 | Build object access index from request body
      parameters:
      - description: 存储引擎ID | Engine ID
        in: query
        name: engine_id
        required: true
        type: integer
      - description: 对象路径 | Object key
        in: query
        name: object_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 对象 attributes | Object attributes
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 建立对象访问索引 | Build object access index
      tags:
      - Meta
  /metadata/extract:
    post:
      consumes:
      - application/octet-stream
      description: 按需读取请求体内容并提取对象深度元数据 | Extract object metadata from request body
      parameters:
      - description: 存储引擎ID | Engine ID
        in: query
        name: engine_id
        required: true
        type: integer
      - description: 对象路径 | Object key
        in: query
        name: object_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 对象元数据 | Object metadata
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 | Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未授权 | Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误 | Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 提取对象元数据 | Extract object metadata
      tags:
      - Meta
  /metadata/object:
    get:
      description: 获取指定对象存储文件的元数据信息 | Get metadata information for a specific object
        storage file
      parameters:
      - description: 存储引擎ID | Engine ID
        in: query
        name: engine_id
        required: true
        type: integer
      - description: 对象存储路径 | Object storage path
        in: query
        name: object_key
        required: true
        type: string
      produces:
      - application/json
